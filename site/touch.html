</script>

<script id="src-pot-look-nothing">
/* Pot look "nothing": Nothing's flat widget language, after the catalogue's dot-dial. A flat round tile, a 300° ring
   of 21 dots (one per tick) that fill up to the value, one red dot at the current position (the only accent, and only
   for the live state), a dot-matrix number that is always shown, with its unused leading digits left unlit, and the
   label in small Geist Mono. With detent="center" the 12 o'clock dot is printed a size larger. No dome, texture,
   shadow or glow. Dots and digits switch instantly. Light tone: a white tile with black dots. Dark tone: a black tile
   with white dots. --dial-accent is the position dot. */
DetentPot.look('nothing', {
  css: `
.t { --tile: #ecebe6; --edge: #00000014; --off: #d6d5cf; --on: #1b1b1b; --digits: #1b1b1b; --unlit: #d9d8d2; --label: #8a8a85 }
.t.dark { --tile: #0b0b0b; --edge: #ffffff14; --off: #262626; --on: #f2f2f2; --digits: #f2f2f2; --unlit: #2e2e2e; --label: #7c7c7c }
.tile { position: absolute; inset: 0; border-radius: 50%; background: var(--tile); box-shadow: inset 0 0 0 1px var(--edge) }
.dots i { position: absolute; width: 4%; min-width: 3px; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; background: var(--off) }
.dots i.mid { width: 6%; min-width: 4.5px }
.dots i.on { background: var(--on) }
.dots i.head { background: var(--dial-accent, #d71921) }
.read { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; pointer-events: none }
.n { font: 800 calc(var(--s) * .24)/1 "Doto", "Geist Mono", monospace; color: var(--digits); letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: pre }
.n b { color: var(--unlit); font-weight: inherit }
.lab { margin-top: 5px; font: 400 max(7px, calc(var(--s) * .07))/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .16em; color: var(--label); text-transform: uppercase }
:host(:focus-visible) .tile { outline: 2px solid var(--dial-accent, #d71921); outline-offset: 3px }
`,
  html(el) {
    const dots = Array.from({ length: 21 }, (_, i) => {
      const a = (-150 + i * 15 - 90) * Math.PI / 180;
      return `<i${el.center && i === 10 ? ' data-mid' : ''} style="left:${50 + 41 * Math.cos(a)}%;top:${50 + 41 * Math.sin(a)}%"></i>`;
    }).join('');
    return `<div class="k"><div class="tile" data-press></div><div class="dots">${dots}</div><div class="read"><div class="n"></div><div class="lab"></div></div></div>`;
  },
  setup(root, el) {
    el.ls.dots = [...root.querySelectorAll('.dots i')]; el.ls.n = root.querySelector('.n');
    root.querySelector('.lab').textContent = el.name;
  },
  paint(root, el, f) {
    const head = Math.round(f * 20);
    el.ls.dots.forEach((d, i) => { d.className = (i < head ? 'on' : i === head ? 'head' : '') + (d.hasAttribute('data-mid') ? ' mid' : ''); });
    const s = el.text, lead = (s.match(/^0*(?=\d)/) || [''])[0];
    el.ls.n.innerHTML = `<b>${lead}</b>${s.slice(lead.length)}`; // unused leading digits stay as unlit segments
  }
});
</script>

<script id="src-pot-look-aqua">
/* Pot look "aqua": a candy-glass knob, like early Mac OS X, over a printed 300° track that fills to the value.
   The glass blurs and tints what is under it. Its specular highlight and the caustic it throws on the panel come from
   the room light above, so neither turns; only the etched mark inside the glass turns. The label below reads the
   value on hover or turn (an instant swap). --dial-accent colors the printed value track. */
DetentPot.look('aqua', {
  css: `
.t { --track: #00000014; --fill: var(--dial-accent, #0a7cff); --tick: #00000059; --mark: #1d1d1fcc; --spec: #ffffffd9; --caustic: #ffffffb3; --ink: #3a3a3c;
  --glass: linear-gradient(170deg, #ffffff59, #ffffff0f 55%, #ffffff2e);
  --glass-sh: inset 0 1px 0 #ffffffe6, inset 0 -1.5px 1px #ffffff99, inset 0 0 0 .5px #ffffffb3, inset 0 -12px 20px -12px #ffffff80, 0 0 0 .5px #0000001a, 0 1px 2px #0000001f, 0 12px 24px -10px #00000040;
  --glass-dn: inset 0 1px 0 #ffffffe6, inset 0 -1.5px 1px #ffffff99, inset 0 0 0 .5px #ffffffb3, inset 0 -12px 20px -12px #ffffff80, 0 0 0 .5px #0000001a, 0 .5px 1px #00000029, 0 7px 16px -8px #00000040 }
.t.dark { --track: #ffffff14; --fill: var(--dial-accent, #0a84ff); --tick: #ffffff40; --mark: #f5f5f7; --spec: #ffffff52; --caustic: #ffffff2e; --ink: #d1d1d6;
  --glass: linear-gradient(170deg, #ffffff2e, #ffffff0a 55%, #ffffff17);
  --glass-sh: inset 0 1px 0 #ffffff8c, inset 0 -1.5px 1px #ffffff40, inset 0 0 0 .5px #ffffff38, inset 0 -12px 20px -12px #ffffff2e, 0 0 0 .5px #000, 0 1px 2px #000000a6, 0 12px 24px -10px #000000cc;
  --glass-dn: inset 0 1px 0 #ffffff8c, inset 0 -1.5px 1px #ffffff40, inset 0 0 0 .5px #ffffff38, inset 0 -12px 20px -12px #ffffff2e, 0 0 0 .5px #000, 0 .5px 1px #000000bf, 0 7px 16px -8px #000000cc }
svg { position: absolute; inset: 0; width: 100%; height: 100% }
circle { fill: none; stroke-linecap: round }
.track { stroke: var(--track); stroke-width: 10 }
.fill { stroke: var(--fill); stroke-width: 10 }
/* Turned back by hand on double-click: the printed fill follows the knob. */
.k.reset .fill { transition: stroke-dasharray .22s cubic-bezier(.4,0,.2,1) }
line { stroke: var(--tick); stroke-width: 2; stroke-linecap: round }
/* Light from above passes through the lens and lands as a soft bright crescent on the panel below it. */
.caustic { position: absolute; left: 28%; right: 28%; top: 80%; height: 10%; border-radius: 50%;
  background: radial-gradient(closest-side, var(--caustic), transparent); pointer-events: none }
.glass { position: absolute; inset: 15%; border-radius: 50%; background: var(--glass); box-shadow: var(--glass-sh);
  -webkit-backdrop-filter: blur(1.5px) saturate(1.8); backdrop-filter: blur(1.5px) saturate(1.8) }
.glass.down { box-shadow: var(--glass-dn) }
/* Glass doesn't sink: only its shadow tightens. */
.glass[data-press].down { translate: none; scale: none }
/* The specular: the room light reflected in the top of the dome. */
.glass::before { content: ""; position: absolute; inset: 3% 16% 60%; border-radius: 50%; background: linear-gradient(var(--spec), transparent); z-index: 1; pointer-events: none }
/* The mark: etched into the glass, so it turns. */
.mark { position: absolute; left: 50%; top: 8%; width: 3.6%; min-width: 2px; height: 14%; translate: -50% 0; border-radius: 9px; background: var(--mark) }
:host(:focus-visible) .glass { outline: 2px solid var(--fill); outline-offset: 4px }
.l { display: grid; font: 500 12px/1 "Geist", "Lucida Grande", system-ui, sans-serif; color: var(--ink); font-variant-numeric: tabular-nums }
.l span { grid-area: 1 / 1; text-align: center }
.val { visibility: hidden }
:host(:hover) .name, :host(:focus-visible) .name, .l.show .name { visibility: hidden }
:host(:hover) .val, :host(:focus-visible) .val, .l.show .val { visibility: visible }
@media (prefers-reduced-motion: reduce) { .k.reset .fill { transition: none } }
`,
  html() {
    // A printed tick every other twentieth: 11 over the sweep, 12 o'clock included.
    const ticks = Array.from({ length: 11 }, (_, i) =>
      `<line transform="rotate(${-150 + i * 30} 100 100)" x1="100" y1="38" x2="100" y2="46"/>`).join('');
    // A 300° arc from 7 to 5 o'clock. pathLength 360 makes the dash lengths read in degrees.
    return `<div class="k"><svg viewBox="0 0 200 200" aria-hidden="true"><g transform="rotate(120 100 100)">` +
      `<circle class="track" cx="100" cy="100" r="84" pathLength="360" stroke-dasharray="300 360"/>` +
      `<circle class="fill" cx="100" cy="100" r="84" pathLength="360" stroke-dasharray="0 360"/></g>${ticks}</svg>` +
      `<i class="caustic"></i><div class="glass" data-press><div class="rot"><i class="mark"></i></div></div></div>` +
      `<div class="l"><span class="name"></span><span class="val"></span></div>`;
  },
  setup(root, el) {
    el.ls.fill = root.querySelector('.fill'); el.ls.val = root.querySelector('.val'); el.ls.l = root.querySelector('.l');
    root.querySelector('.name').textContent = el.name;
  },
  hold(root, el, on) { el.ls.l.classList.toggle('show', on); },
  paint(root, el, f) {
    el.ls.fill.setAttribute('stroke-dasharray', `${f * 300} 360`);
    el.ls.val.textContent = el.v.toFixed(1);
  }
});
</script>

<script id="src-bezel">
/* <detent-bezel look="original" tone="auto" value="4" direction="both|one-way" mode="ratchet|weighted"> — a rotating
   bezel with a dB scale and a level scale, read against a fixed index line. It ratchets: the ring gives a little, then
   clicks into each of its 20 positions. It turns endlessly. direction="one-way" makes it a dive bezel: counterclockwise
   only, the ratchet blocks the other way. mode="weighted" makes the ring heavy: flick it and it carries on 2 to 4 clicks
   after you let go, slowing across them until it rests in the last notch; touch it to stop it. value is the position
   (0-19); .value reads back dB (-3 per click). Fires "input" and "change". Needs Feel and at least one look.
   tone: "light" or "dark" forces one; otherwise it follows the nearest [data-tone], the page's data-theme, then
   prefers-color-scheme. The look is a separate module: DetentBezel.look(name, { css, html, setup, hold, paint }).
   Look contract: html(el) must hold a .k (the square the finger turns) and inside it a .ring (the layer that rotates;
   the element sets --r on itself and adds .snap / .back for the ratchet's throw). Only printed, engraved or inlaid marks
   go inside .ring; highlights stay outside it. paint(root, el, r): r is the angle the ring shows right now in degrees
   (give and coast included); el.k is the committed position 0-19, el.dbText the readout (" 00" or "-12"), el.lvlText
   the level ("00"-"95"). DetentBezel.scale lists the 20 positions as { a (degrees), db ("0 dB", "−03"...), lvl }. */
(() => {
  const looks = {}, waiting = new Set(), autos = new Set();
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const retone = () => autos.forEach(el => el.tone());
  mq.addEventListener ? mq.addEventListener('change', retone) : mq.addListener(retone);
  new MutationObserver(retone).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'data-tone'] });

  // Shared by every look: the square the finger turns, the ring that rotates, and how the ratchet throws it.
  const BASE = `:host { --s: 300px; display: inline-flex; flex-direction: column; align-items: center; gap: 12px; vertical-align: top; outline: none;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent }
.t { display: contents }
.k { position: relative; width: var(--s); max-width: 100%; aspect-ratio: 1; touch-action: none; cursor: grab }
.k:active { cursor: grabbing }
.ring { position: absolute; inset: 0; rotate: var(--r) }
/* The ratchet spring throws the ring into each position: it accelerates and stops dead. */
.ring.snap { transition: rotate .06s cubic-bezier(.55,0,1,1) }
.ring.back { transition: rotate .08s cubic-bezier(.2,0,.3,1) }
@media (prefers-reduced-motion: reduce) { .ring.snap, .ring.back { transition: none } }
`;
  const pad = n => String(n).padStart(2, '0');

  class DetentBezel extends HTMLElement {
    static observedAttributes = ['look', 'tone', 'direction', 'mode'];
    static look(name, def) { looks[name] = def; [...waiting].forEach(el => el.render()); }
    // The 20 printed positions, clockwise from the top: the dB scale and the level scale under it.
    static scale = Array.from({ length: 20 }, (_, k) => ({ a: k * 18, db: k ? '−' + pad(k * 3) : '0 dB', lvl: pad((100 - k * 5) % 100) }));
    connectedCallback() {
      if (!this._wired) this.wire();
      if (!this.surf) this.render();
      this.tone();
    }
    disconnectedCallback() { autos.delete(this); }
    attributeChangedCallback(name, was, now) {
      if (!this._wired || was === now) return;
      if (name === 'tone') this.tone(); else this.render();
    }
    wire() {
      this._wired = true;
      this.attachShadow({ mode: 'open' });
      this.trail = [];
      this.k = ((Math.round(+(this.getAttribute('value') || 0)) % 20) + 20) % 20;
      this.rot = -18 * this.k;
      this.acc = 0; this.pushDir = 0;
      this.setAttribute('role', 'slider');
      if (!this.hasAttribute('aria-label')) this.setAttribute('aria-label', 'Level');
      if (!this.hasAttribute('tabindex')) this.tabIndex = 0;
      let wheel = 0;
      Feel.wheel(this, d => { wheel += d; if (Math.abs(wheel) > 10) { this.nudge(-Math.sign(wheel)); wheel = 0; } });
      Feel.keys(this, (dir, big) => { for (let i = 0; i < (big ? 5 : 1); i++) this.nudge(dir); });
    }
    // Builds the look. Runs again when look, direction or mode change; the position carries over.
    render() {
      const look = looks[this.getAttribute('look') || 'original'];
      if (!look) { waiting.add(this); return; }
      waiting.delete(this);
      this.look = look;
      this.oneWay = this.getAttribute('direction') === 'one-way';
      this.weighted = this.getAttribute('mode') === 'weighted';
      const root = this.shadowRoot;
      root.innerHTML = `<style>${BASE}${look.css}</style><div class="t">${look.html(this)}</div>`;
      this.t = root.querySelector('.t'); this.surf = root.querySelector('.k'); this.ring = root.querySelector('.ring');
      this.ls = {}; // the look's own state
      look.setup && look.setup(root, this);
      Feel.rotary(this.surf, {
        start: () => { this.acc = 0; this.trail = []; this.catch(); look.hold && look.hold(root, this, true); },
        turn: d => {
          const now = performance.now(), last = this.trail[this.trail.length - 1];
          this.trail.push([now, (last ? last[1] : 0) + d]);
          while (this.trail.length > 2 && now - this.trail[0][0] > 80) this.trail.shift();
          this.push(d);
        },
        end: () => {
          look.hold && look.hold(root, this, false);
          if (this.weighted && this.fling()) return;
          if (this.acc) { this.acc = 0; this.motion('back'); this.paint(); } // the ratchet pulls it back into the last click
          this.dispatchEvent(new Event('change', { bubbles: true }));
        }
      });
      this.tone();
      this.paint();
    }
    tone() {
      if (!this.t) return;
      const t = this.getAttribute('tone');
      let dark;
      if (t === 'light' || t === 'dark') { dark = t === 'dark'; autos.delete(this); }
      else {
        autos.add(this);
        const near = this.parentElement && this.parentElement.closest('[data-tone]'), page = document.documentElement.dataset.theme;
        dark = near ? near.dataset.tone === 'dark' : page ? page === 'dark' : mq.matches;
      }
      this.t.classList.toggle('dark', dark);
    }
    get value() { return -3 * (this.k ?? (+(this.getAttribute('value') || 0) % 20)); }
    get dbText() { return (this.k ? '-' : ' ') + pad(this.k * 3); }
    get lvlText() { return pad((100 - this.k * 5) % 100); }
    // d: degrees the finger moved the ring, clockwise positive. A one-way bezel only turns counterclockwise.
    push(d) {
      this.pushDir = Math.sign(d);
      this.acc += d;
      if (this.oneWay && this.acc > 0) this.acc = 0; // the ratchet blocks clockwise: no give at all
      while (Math.abs(this.acc) > 9) {
        const dir = Math.sign(this.acc);
        this.acc -= dir * 18;
        this.step(-dir);
      }
      this.paint();
    }
    // Weighted: release speed over the last 80ms, in degrees per millisecond. A slow or stopped release doesn't spin.
    fling() {
      const t = this.trail, now = performance.now();
      if (t.length < 2 || now - t[t.length - 1][0] > 60) return false;
      const v = (t[t.length - 1][1] - t[0][1]) / Math.max(1, t[t.length - 1][0] - t[0][0]);
      if (Math.abs(v) < .3 || (this.oneWay && v > 0) || Feel.reduced()) return false;
      this.coast(Math.max(-2.5, Math.min(2.5, v)));
      return true;
    }
    // The ring is heavy, so a flick carries it on after you let go: 2 more clicks for a gentle flick, up to 4 for a hard
    // one. It leaves your finger at the flick's speed, drag bleeds that down to a slow creep within a few degrees, and
    // friction then eases it to rest in the last notch over most of a second. So the clicks start quick and spread
    // out, the last gap the longest.
    // The whole coast is worked out at release, so every click sounds at its exact moment, not on the next screen frame.
    static spin(pos, v) {
      const dir = Math.sign(v), fast = Math.min(1, Math.max(0, (Math.abs(v) - .3) / 1.7));
      const n = 2 + Math.round(fast * 2);                       // 2, 3 or 4 clicks
      const home = -18 * Math.round(-pos / 18), rest = home + dir * 18 * n, dist = Math.abs(rest - pos);
      const creep = 2 * dist / (500 + 150 * n);                 // the slow pace it eases down to, degrees per ms
      // speed by distance travelled: the flick, bled off by drag, times the friction curve that stops it in the notch
      const speed = x => (creep + Math.max(0, Math.abs(v) - creep) * Math.exp(-x / 4)) * Math.sqrt(Math.max(0, 1 - x / dist));
      const start = pos, path = [pos], clicks = [];
      let click = Math.round(-pos / 18), x = 0, t = 0;
      while (dist - x > .02 && t < 4000) {
        const prev = pos;
        x = Math.min(dist, x + Math.max(speed(x), .004));
        pos = start + dir * x;
        t += 1;
        const k = Math.round(-pos / 18);
        if (k !== click) {
          const top = -18 * (Math.min(k, click) + .5);           // the hilltop between the two notches
          clicks.push([t - 1 + (top - prev) / (pos - prev), k]);
          click = k;
        }
        path.push(pos);
      }
      path[path.length - 1] = rest;
      return { path, clicks, end: t, rest };
    }
    coast(v) {
      const start = this.rot + (Math.sign(this.acc) === this.pushDir ? this.acc * .25 : 0);
      const { path, clicks, end, rest } = this.constructor.spin(start, v);
      const t0 = performance.now(), base = Feel.clock() + .03; // every click hangs off this one audio-clock moment
      let queued = 0, done = 0;
      this.acc = 0;
      this._cancels = [];
      this.ring.classList.remove('snap', 'back');
      const frame = now => {
        const t = now - t0;
        // queue the next clicks a little ahead, each at its own exact moment
        while (queued < clicks.length && clicks[queued][0] < t + 80) this._cancels.push(Feel.schedule('bezel', base + clicks[queued++][0] / 1000));
        while (done < clicks.length && clicks[done][0] <= t) {
          const k = clicks[done++][1];
          this.k = ((k % 20) + 20) % 20;
          this.rot = -18 * k;
          this.dispatchEvent(new Event('input', { bubbles: true }));
        }
        if (t < end) {
          const i = Math.min(path.length - 2, Math.floor(t)), f = t - i;
          this.paint(path[i] + (path[i + 1] - path[i]) * f);
          this._coast = requestAnimationFrame(frame);
          return;
        }
        this._coast = 0;
        this._cancels = [];
        this.rot = rest;
        this.paint();
        this.dispatchEvent(new Event('change', { bubbles: true }));
      };
      this._coast = requestAnimationFrame(frame);
    }
    // A finger on a spinning ring stops it: queued clicks are cancelled and it settles into the nearest notch.
    catch() {
      if (!this._coast) return;
      cancelAnimationFrame(this._coast);
      this._coast = 0;
      (this._cancels || []).forEach(c => c());
      this._cancels = [];
      const at = parseFloat(this.style.getPropertyValue('--r')) || this.rot, k = Math.round(-at / 18);
      this.k = ((k % 20) + 20) % 20;
      this.rot = -18 * k;
      this.motion('back');
      this.paint();
    }
    // n = +1 is one click counterclockwise, which brings the next mark under the index.
    nudge(n) { if (!this.ring) return; if (this.oneWay && n < 0) return; this.step(n); this.paint(); }
    step(n) {
      this.k = (((this.k + n) % 20) + 20) % 20;
      this.rot -= n * 18;
      this.motion('snap');
      Feel.fire('bezel');
      this.dispatchEvent(new Event('input', { bubbles: true }));
    }
    motion(kind) {
      this.ring.classList.remove('snap', 'back');
      this.ring.classList.add(kind);
      clearTimeout(this._mt);
      this._mt = setTimeout(() => this.ring.classList.remove(kind), 90);
    }
    paint(at) {
      // After a click the ring is ahead of the finger, so it only shows give while it's actually being pushed.
      const give = Math.sign(this.acc) === this.pushDir ? this.acc * .25 : 0, r = at ?? this.rot + give;
      this.style.setProperty('--r', r + 'deg');
      this.setAttribute('aria-valuenow', -3 * this.k);
      this.setAttribute('aria-valuetext', `${-3 * this.k} decibels`);
      this.look.paint && this.look.paint(this.shadowRoot, this, r);
    }
  }
  window.DetentBezel = DetentBezel;
  customElements.define('detent-bezel', DetentBezel);
})();
</script>

<script id="src-bezel-look-original">
/* Bezel look "original": the approved scale ring, unchanged. A flat ring with a serrated coin edge, a dB scale and a level
   scale, three red markers printed on the ring, a fixed index line outside and inside it, and an LED dot-matrix readout
   in the centre whose digits switch instantly. No tile: it sits straight on the panel. Light tone: the same ring printed
   in dark ink for a light panel. --dial-accent colors the markers. */
DetentBezel.look('original', (() => {
  let marks = '';
  for (const m of DetentBezel.scale) {
    marks += `<text transform="rotate(${m.a} 160 160)" x="160" y="54">${m.db}</text>`;
    marks += `<text class="in" transform="rotate(${m.a} 160 160)" x="160" y="82">${m.lvl}</text>`;
  }
  // The serrated outer edge: the coin-edge grip real bezels have.
  for (let i = 0; i < 120; i++) marks += `<line class="grip" transform="rotate(${i * 3} 160 160)" x1="160" y1="13" x2="160" y2="19"/>`;
  marks += [3, 7, 14].map(k => `<line class="red" transform="rotate(${k * 18 - 9} 160 160)" x1="160" y1="27" x2="160" y2="35"/>`).join('');
  return {
    css: `
.t { --ink: #2c2c2c; --ink-2: #6e6e6c; --edge: #c6c6c1; --grip: #cdcdc8; --idx: #161616; --led: #161616; --unit: #7a7a76; --focus: #6e6e6c }
.t.dark { --ink: #d6d6d6; --ink-2: #a9a9a9; --edge: #3a3a3a; --grip: #2e2e2e; --idx: #eaeaea; --led: #efefef; --unit: #8a8a8a; --focus: #8a8a8a }
svg { position: absolute; inset: 0; width: 100%; height: 100% }
text { fill: var(--ink); font: 400 12.5px "Geist Mono", ui-monospace, monospace; text-anchor: middle }
text.in { fill: var(--ink-2) }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.2 }
.grip { stroke: var(--grip); stroke-width: 1.4 }
.red { stroke: var(--dial-accent, #e5242a); stroke-width: 2.4; stroke-linecap: round }
.idx { stroke: var(--idx); stroke-width: 1.6 }
:host(:focus-visible) .edge { stroke: var(--focus) }
.read { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; pointer-events: none; color: var(--led) }
/* LED dot-matrix readout: digits switch on and off instantly, like the real display. */
.db { font: 800 calc(var(--s) * .17)/1 "Doto", "Geist Mono", monospace; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: pre }
.unit { margin-top: 6px; font: 400 11px/1 "Geist Mono", monospace; letter-spacing: .14em; color: var(--unit); text-transform: uppercase }
`,
    html: () => `<div class="k"><div class="ring"><svg viewBox="0 0 320 320" aria-hidden="true"><circle class="edge" cx="160" cy="160" r="141"/>${marks}</svg></div>` +
      `<svg viewBox="0 0 320 320" aria-hidden="true"><line class="idx" x1="160" y1="0" x2="160" y2="10"/><line class="idx" x1="160" y1="92" x2="160" y2="102"/></svg>` +
      `<div class="read"><div class="db"></div><div class="unit"></div></div></div>`,
    setup(root, el) { el.ls.db = root.querySelector('.db'); el.ls.unit = root.querySelector('.unit'); },
    paint(root, el) {

<script id="src-bezel-look-braun">
/* Bezel look "braun": a turned-aluminium ring with a knurled outer edge around a fixed, lathe-turned hub. The scales are
   engraved in the ring and turn with it; the knurl grooves turn too, but the metal's sheen belongs to the room, so it
   stays put. A lamp under the index backlights the engraving that sits over it, in --dial-accent. The two index marks
   are painted in the same orange. Dark tone: the same parts in black anodized aluminium on a black panel. */
DetentBezel.look('braun', (() => {
  let marks = '';
  for (let i = 0; i < 120; i++) marks += `<line class="knurl" transform="rotate(${i * 3 + 1.5} 160 160)" x1="160" y1="8" x2="160" y2="17"/>`;
  for (const m of DetentBezel.scale) {
    marks += `<text class="db" transform="rotate(${m.a} 160 160)" x="160" y="40">${m.db}</text>`;
    marks += `<text class="lv" transform="rotate(${m.a} 160 160)" x="160" y="60">${m.lvl}</text>`;
  }
  return {
    css: `
.t { --alu: radial-gradient(circle at 50% 30%, #f8f8f7, #e3e3e1 55%, #cfcfcd);
  --sheen: #ffffff80; --sheen-2: #ffffff59; --knurl: #0000003d; --engr: #6a6865; --engr-2: #8f8d8a;
  --body-in: inset 0 1px 0 #ffffffcc, inset 0 -1px 1px #0000002e;
  --body-sh: 0 0 0 .5px #00000040, 0 1px 1.5px #00000059, 0 3px 5px -1px #00000033, 0 10px 16px -6px #00000040;
  --face: radial-gradient(circle at 46% 32%, #fbfbfb, #ececeb 55%, #dededd); --lathe: #00000006;
  --step: inset 0 0 0 1px #00000024, inset 0 3px 5px -2px #00000059, inset 0 -1px 1px #ffffff80 }
.t.dark { --alu: radial-gradient(circle at 50% 30%, #4a4a4d, #2f2f31 55%, #222224);
  --sheen: #ffffff26; --sheen-2: #ffffff1a; --knurl: #000000b3; --engr: #7a7a7e; --engr-2: #58585c;
  --body-in: inset 0 1px 0 #ffffff3d, inset 0 -1px 1px #00000099;
  --body-sh: 0 0 0 .5px #000, 0 1px 1.5px #000000cc, 0 3px 5px -1px #00000099, 0 10px 16px -6px #000000b3;
  --face: radial-gradient(circle at 46% 32%, #3c3c3f, #2d2d30 55%, #242426); --lathe: #ffffff05;
  --step: inset 0 0 0 1px #000000b3, inset 0 3px 5px -2px #000000cc, inset 0 -1px 1px #ffffff1f }
svg { position: absolute; inset: 0; width: 100%; height: 100% }
/* The ring: turned aluminium, lit from above, sitting on the panel with a contact shadow. */
.body { position: absolute; inset: 2.5%; border-radius: 50%; background: var(--alu); box-shadow: var(--body-in), var(--body-sh) }
/* Knurl grooves and engraved scales are cut into the ring, so they turn with it. */
.knurl { stroke: var(--knurl); stroke-width: 1.3 }
text { font: 500 11.5px "Geist Mono", ui-monospace, monospace; text-anchor: middle; fill: var(--engr) }
text.lv { font-size: 10px; fill: var(--engr-2) }
/* Backlit: the lamp under the index shines through the engraving parked over it. */
text.lit { fill: var(--dial-accent, #f2641e) }
/* The sheen is the room light on brushed metal: it never turns. */
.sheen { position: absolute; inset: 2.5%; border-radius: 50%; pointer-events: none;
  background: conic-gradient(from 120deg, #fff0, var(--sheen) 7%, #fff0 18%, #fff0 50%, var(--sheen-2) 57%, #fff0 68%) }
/* The hub: fixed, a step below the ring, lathe-turned. */
.hub { position: absolute; inset: 22.5%; border-radius: 50%; overflow: hidden; background: var(--face); box-shadow: var(--step) }
.hub::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: repeating-radial-gradient(circle, #0000 0 1.1px, var(--lathe) 1.1px 2.2px);
  -webkit-mask: radial-gradient(circle, transparent 18%, #000 60%); mask: radial-gradient(circle, transparent 18%, #000 60%) }
.hub::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 120deg, #fff0, var(--sheen) 7%, #fff0 18%, #fff0 50%, var(--sheen-2) 57%, #fff0 68%) }
/* Painted index marks, flush with the panel and the hub. */
.idx { stroke: var(--dial-accent, #f2641e); stroke-width: 2.6; stroke-linecap: round }
:host(:focus-visible) .body { outline: 2px solid var(--dial-accent, #f2641e); outline-offset: 4px }
`,
    html: () => `<div class="k"><div class="body"></div><div class="ring"><svg viewBox="0 0 320 320" aria-hidden="true">${marks}</svg></div>` +
      `<div class="sheen"></div><div class="hub"></div>` +
      `<svg viewBox="0 0 320 320" aria-hidden="true"><line class="idx" x1="160" y1="1.5" x2="160" y2="6"/><line class="idx" x1="160" y1="75" x2="160" y2="84"/></svg></div>`,
    setup(root, el) { el.ls.db = [...root.querySelectorAll('text.db')]; el.ls.lv = [...root.querySelectorAll('text.lv')]; },
    paint(root, el) {
      el.ls.db.forEach((t, i) => t.classList.toggle('lit', i === el.k));
      el.ls.lv.forEach((t, i) => t.classList.toggle('lit', i === el.k));
    }
  };
})());
</script>

<script id="src-bezel-look-index">
/* Bezel look "index": a matte soft-touch black ring with the scales printed on it in grey and a thin inlaid stripe in
   --dial-accent at 0 dB, like the pip on a dive bezel. Printed grey dots on the panel mark the 20 positions; a printed
   bar at the top is the index. The Geist Mono label in the middle switches instantly. Dark tone: the same black ring on
   a black panel, told apart by the top light on its chamfer. */
DetentBezel.look('index', (() => {
  let marks = '<line class="pip" x1="160" y1="19" x2="160" y2="31"/>', dots = '';
  for (const m of DetentBezel.scale) {
    marks += `<text transform="rotate(${m.a} 160 160)" x="160" y="40">${m.db}</text>`;
    marks += `<text class="lv" transform="rotate(${m.a} 160 160)" x="160" y="60">${m.lvl}</text>`;
    if (!m.a) continue;
    const a = (m.a - 90) * Math.PI / 180;
    dots += `<i style="left:${50 + 48.6 * Math.cos(a)}%;top:${50 + 48.6 * Math.sin(a)}%"></i>`;
  }
  return {
    css: `
.t { --dot: #a9a9a5; --idx: #767672; --label: #8a8a86; --num: #8f8f8b; --num-2: #5f5f5c; --focus: #161616;
  --disc: radial-gradient(circle at 50% 28%, #242424, #161616 58%, #101010);
  --in: inset 0 1px 0 #ffffff1c, inset 0 -1px 1px #00000099;
  --out: 0 0 0 .5px #00000073, 0 1px 1.5px #00000059, 0 4px 8px -2px #00000040, 0 14px 22px -10px #00000059;
  --hole: inset 0 3px 5px -2px #00000059 }
.t.dark { --dot: #57575a; --idx: #8a8a88; --label: #7c7c7a; --focus: #d4df3a;
  --disc: radial-gradient(circle at 50% 28%, #2c2c2c, #1b1b1b 58%, #141414);
  --in: inset 0 1px 0 #ffffff33, inset 0 -1px 1px #000000b3;
  --out: 0 0 0 .5px #000, 0 1px 1.5px #000000b3, 0 4px 8px -2px #00000099, 0 14px 22px -10px #000000cc;
  --hole: inset 0 3px 5px -2px #000000cc }
svg { position: absolute; inset: 0; width: 100%; height: 100% }
/* Printed position marks: they belong to the panel, so they never change. */
.dots i { position: absolute; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: var(--dot) }
.idx { stroke: var(--idx); stroke-width: 2.4; stroke-linecap: round }
/* The ring's contact shadow on the panel, outside it only. */
.shadow { position: absolute; inset: 4.4%; border-radius: 50%; box-shadow: var(--out) }
/* Matte soft-touch black, lit from above. Its centre is open: the panel shows through. */
.disc { position: absolute; inset: 4.4%; border-radius: 50%; background: var(--disc); box-shadow: var(--in);
  -webkit-mask: radial-gradient(circle closest-side, #0000 60.3%, #000 calc(60.3% + .6px)); mask: radial-gradient(circle closest-side, #0000 60.3%, #000 calc(60.3% + .6px)) }
/* Where the ring's inner wall shades the panel just under it. */
.hole { position: absolute; inset: 22.5%; border-radius: 50%; box-shadow: var(--hole); pointer-events: none }
/* Printed in grey on the ring; the inlaid stripe marks 0 dB. All of it turns with the ring. */
text { font: 500 11.5px "Geist Mono", ui-monospace, monospace; text-anchor: middle; fill: var(--num) }
text.lv { font-size: 10px; fill: var(--num-2) }
.pip { stroke: var(--dial-accent, #d4df3a); stroke-width: 2.6; stroke-linecap: round }
.read { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 6px; pointer-events: none }
.lab { font: 500 calc(var(--s) * .05)/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .08em; color: var(--label); text-transform: uppercase; font-variant-numeric: tabular-nums; white-space: pre }
.lab.sm { font-size: calc(var(--s) * .037); color: var(--dot) }
:host(:focus-visible) .shadow { outline: 2px solid var(--focus); outline-offset: 5px }
`,
    html: () => `<div class="k"><div class="dots">${dots}</div><div class="shadow"></div><div class="disc"></div>` +
      `<div class="ring"><svg viewBox="0 0 320 320" aria-hidden="true">${marks}</svg></div><div class="hole"></div>` +
      `<svg viewBox="0 0 320 320" aria-hidden="true"><line class="idx" x1="160" y1="2" x2="160" y2="9"/><line class="idx" x1="160" y1="78" x2="160" y2="85"/></svg>` +
      `<div class="read"><span class="lab"></span><span class="lab sm"></span></div></div>`,
    setup(root, el) { [el.ls.db, el.ls.lv] = root.querySelectorAll('.lab'); },
    paint(root, el) {
      el.ls.db.textContent = `DB:${el.k ? '-' : ''}${el.k * 3}`;
      el.ls.lv.textContent = `LVL:${el.lvlText}`;
    }
  };
})());
</script>

<script id="src-bezel-look-pedal">
/* Bezel look "pedal": a matte grey plastic ring with its scales printed in white, sitting in a fixed recessed seat.
   The seat floor shows through the middle, with a printed readout that rolls like an odometer. Dark tone: the same
   ring on a black panel, with a deeper seat and light ink. --dial-accent colors the 0 dB tick. */
DetentBezel.look('pedal', (() => {
  let marks = '';
  for (const m of DetentBezel.scale) {
    marks += `<line class="${m.a ? 'tk' : 'tk zero'}" transform="rotate(${m.a} 160 160)" x1="160" y1="24" x2="160" y2="32"/>`;
    marks += `<text transform="rotate(${m.a} 160 160)" x="160" y="47">${m.db}</text>`;
    marks += `<text class="lv" transform="rotate(${m.a} 160 160)" x="160" y="63">${m.lvl}</text>`;
  }
  const H = 24; // one digit row, px
  // Each digit column holds 0-9 three times over, so it can roll past 9 or 0 either way, then quietly re-centers.
  function place(col, pos, animate) {
    col._pos = pos;
    col.style.transition = animate ? '' : 'none';
    col.style.transform = `translateY(${8 - pos * H}px)`;
    if (!animate) return;
    col.classList.add('moving');
    clearTimeout(col._t);
    col._t = setTimeout(() => {
      col.classList.remove('moving');
      if (col._pos >= 10 && col._pos < 20) return;
      place(col, 10 + ((col._pos % 10) + 10) % 10, false);
    }, 190);
  }
  // Digits roll up when the number rises and down when it falls. Leading zeros are there but hidden.
  function roll(ls, text, dir) {
    const el = ls.val, lead = text.search(/[1-9]|\d$/);
    if (ls.shape !== text.length) {
      ls.shape = text.length;
      el.innerHTML = [...text].map(() => `<b class="col"><i>${'0123456789'.repeat(3).split('').join('</i><i>')}</i></b>`).join('');
      [...el.children].forEach((col, i) => { col.classList.toggle('lead', i < lead); place(col, 10 + +text[i], false); });
      return;
    }
    [...el.children].forEach((col, i) => {
      col.classList.toggle('lead', i < lead);
      const cur = ((col._pos % 10) + 10) % 10;
      let step = ((+text[i] - cur) % 10 + 10) % 10; // forward distance on the wheel
      if (!step) return;
      if (dir < 0) step -= 10;
      place(col, col._pos + step, true);
    });
  }
  return {
    css: `
.t { --knob: #4a4a4a; --print: #f4f4f0; --print-2: #c4c4bf; --ink: #2b2b2b; --trail: #2b2b2b38; --seat: #0000000f; --seat-sh: inset 0 1px 2px #00000029, 0 1px 0 #ffffffb3;
  --in: inset 0 1px 0 #ffffff1f, inset 0 -1px 1px #00000066;
  --out: 0 0 0 .5px #0000004d, 0 1px 1.5px #00000047, 0 3px 6px -2px #00000033, 0 10px 16px -8px #00000047;
  --hole: inset 0 3px 4px -2px #00000040 }
.t.dark { --knob: #4e4e50; --print: #ededea; --print-2: #b4b4b0; --ink: #d4d4d0; --trail: #d4d4d038; --seat: #00000066; --seat-sh: inset 0 1px 2px #000000d9, 0 1px 0 #ffffff14;
  --in: inset 0 1px 0 #ffffff2b, inset 0 -1px 1px #00000099;
  --out: 0 0 0 .5px #000000b3, 0 1px 1.5px #000000a6, 0 3px 6px -2px #00000080, 0 10px 16px -8px #000000b3;
  --hole: inset 0 3px 4px -2px #000000b3 }
svg { position: absolute; inset: 0; width: 100%; height: 100% }
/* The seat: a shallow recess in the panel the ring sits in. It never moves. */
.seat { position: absolute; inset: 3%; border-radius: 50%; background: var(--seat); box-shadow: var(--seat-sh) }
.shadow { position: absolute; inset: 6%; border-radius: 50%; box-shadow: var(--out) }
/* Matte grey plastic, lit from above. Open in the middle, so the seat floor shows through. */
.disc { position: absolute; inset: 6%; border-radius: 50%; box-shadow: var(--in);
  background: radial-gradient(circle at 50% 28%, color-mix(in srgb, var(--knob), #fff 9%), var(--knob) 58%, color-mix(in srgb, var(--knob), #000 18%));
  -webkit-mask: radial-gradient(circle closest-side, #0000 62.5%, #000 calc(62.5% + .6px)); mask: radial-gradient(circle closest-side, #0000 62.5%, #000 calc(62.5% + .6px)) }
.hole { position: absolute; inset: 22.5%; border-radius: 50%; box-shadow: var(--hole); pointer-events: none }
/* Printed in white on the ring, so it turns with it. */
.tk { stroke: var(--print); stroke-width: 2; stroke-linecap: round }
.tk.zero { stroke: var(--dial-accent, var(--print)) }
text { font: 500 11px "Geist", system-ui, sans-serif; text-anchor: middle; fill: var(--print) }
text.lv { font-size: 9.5px; fill: var(--print-2) }
/* Printed index marks on the panel and the seat floor. */
.idx { stroke: var(--ink); stroke-width: 2; stroke-linecap: round }
:host(:focus-visible) .seat { outline: 2px solid var(--knob); outline-offset: 3px }
.read { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 2px; pointer-events: none; color: var(--ink) }
.l { position: relative; display: flex; align-items: center; height: ${H}px; font: 500 20px/${H}px "Geist", system-ui, sans-serif }
.sg { width: .6em; text-align: right }
.sg.off { visibility: hidden }
.val { position: relative; display: flex; overflow: hidden; height: ${H + 16}px; margin: -8px -6px; padding: 0 6px;
  /* Fully hides the neighbouring digits at rest, but lets the blur trail fade out instead of being cut. */
  -webkit-mask: linear-gradient(transparent 6px, #000 10px, #000 calc(100% - 10px), transparent calc(100% - 6px));
  mask: linear-gradient(transparent 6px, #000 10px, #000 calc(100% - 10px), transparent calc(100% - 6px));
  font-family: "Geist Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums }
/* Rolling digits: each digit is a column of 0-9 that slides to its value, blurred along the motion while it moves. */
.val b { display: block; font-weight: inherit }
.val .col { transition: transform .18s cubic-bezier(.2,.7,.3,1) }
.val .col i { display: block; height: ${H}px; font-style: normal }
.val .col.lead { opacity: 0; width: 0; transition: transform .18s cubic-bezier(.2,.7,.3,1), opacity .18s }
.val .col.moving i { filter: blur(.5px); text-shadow: 0 5px 2.5px var(--trail), 0 -5px 2.5px var(--trail) }
.u { font: 500 11px/1 "Geist", system-ui, sans-serif; opacity: .6 }
@media (prefers-reduced-motion: reduce) { .val .col { transition: none } .val .col.moving i { filter: none; text-shadow: none } }
`,
    html: el => `<div class="k"><div class="seat"></div><div class="shadow"></div><div class="disc"></div>` +
      `<div class="ring"><svg viewBox="0 0 320 320" aria-hidden="true">${marks}</svg></div><div class="hole"></div>` +
      `<svg viewBox="0 0 320 320" aria-hidden="true"><line class="idx" x1="160" y1="1" x2="160" y2="7"/><line class="idx" x1="160" y1="77" x2="160" y2="84"/></svg>` +
      `<div class="read"><div class="l"><span class="sg">−</span><span class="val"></span></div><span class="u">${el.getAttribute('label') || 'dB'}</span></div></div>`,
    setup(root, el) { el.ls.val = root.querySelector('.val'); el.ls.sg = root.querySelector('.sg'); },
    paint(root, el) {
      const n = el.k * 3;
      roll(el.ls, String(n).padStart(2, '0'), Math.sign(n - (el.ls.shown ?? n)));
      el.ls.shown = n;
      el.ls.sg.classList.toggle('off', !n);
    }
  };
})());
</script>

<script id="src-bezel-look-nothing">
/* Bezel look "nothing": Nothing's flat widget language, after the catalogue's dot-dial. A flat round tile; the ring is a
   circle of dots (one per position, three small ones between) with the scales printed small in Geist Mono, and it turns.
   The one red dot is the position sitting at the index: the only accent, and only for the live state. A fixed ink bar
   is the index. The Doto number leaves its unused sign and leading digit unlit. No shadow, dome, texture or glow; dots
   and digits switch instantly. Light tone: a white tile, black ink. Dark tone: a black tile, white ink.
   --dial-accent is the live dot. */
DetentBezel.look('nothing', (() => {
  let marks = '';
  for (let i = 0; i < 80; i++) {
    marks += i % 4 ? `<circle class="sm" transform="rotate(${i * 4.5} 160 160)" cx="160" cy="21" r="1.5"/>`
                   : `<circle class="p" transform="rotate(${i * 4.5} 160 160)" cx="160" cy="21" r="3.4"/>`;
  }
  for (const m of DetentBezel.scale) {
    marks += `<text transform="rotate(${m.a} 160 160)" x="160" y="44">${m.db.toUpperCase()}</text>`;
    marks += `<text class="lv" transform="rotate(${m.a} 160 160)" x="160" y="64">${m.lvl}</text>`;
  }
  return {
    css: `
.t { --tile: #ecebe6; --edge: #00000014; --off: #c4c3bd; --ink: #1b1b1b; --ink-2: #8a8a85; --unlit: #d9d8d2; --label: #8a8a85 }
.t.dark { --tile: #0b0b0b; --edge: #ffffff14; --off: #3c3c3c; --ink: #f2f2f2; --ink-2: #7c7c7c; --unlit: #2e2e2e; --label: #7c7c7c }
svg { position: absolute; inset: 0; width: 100%; height: 100% }
.tile { position: absolute; inset: 0; border-radius: 50%; background: var(--tile); box-shadow: inset 0 0 0 1px var(--edge) }
.p { fill: var(--ink) }
.p.head { fill: var(--dial-accent, #d71921) }
.sm { fill: var(--off) }
text { font: 400 10.5px "Geist Mono", ui-monospace, monospace; letter-spacing: .08em; text-anchor: middle; fill: var(--ink) }
text.lv { font-size: 9.5px; fill: var(--ink-2) }
.idx { stroke: var(--ink); stroke-width: 2.2 }
.read { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; pointer-events: none }
.n { font: 800 calc(var(--s) * .17)/1 "Doto", "Geist Mono", monospace; color: var(--ink); letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: pre }
.n b { color: var(--unlit); font-weight: inherit }
.lab { margin-top: 8px; font: 400 calc(var(--s) * .036)/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .16em; color: var(--label); text-transform: uppercase }
:host(:focus-visible) .tile { outline: 2px solid var(--ink); outline-offset: 3px }
`,

<script id="src-touch">
/* <detent-touch look="nothing" tone="auto" value="72" label="Level"> — a touch ring with no moving parts.
   0–100 over a 300° ring of 40 marks. It follows the finger exactly: no give, no detents to push past, no momentum.
   Each mark you pass makes one tiny electronic tick, like a touch wheel's clicker. The ends are virtual: one dull
   tick on arrival at 0 or 100, then silence however far you keep sliding. Fires "input" and "change".
   Needs Feel and at least one look. Nothing in any look turns: the value shows as marks that light up.
   tone: "light" or "dark" forces one; otherwise it follows the nearest [data-tone], the page's data-theme,
   then prefers-color-scheme. The look is a separate module: DetentTouch.look(name, { css, html, setup, hold, paint }).
   Look contract: html(el) must contain a square .k, the surface the finger slides on. el.N is the number of marks (40)
   and el.angle(i) gives mark i's angle in degrees, clockwise from 12 o'clock. hold(root, el, down) runs when a finger
   lands and lifts. paint(root, el, v, lit): v is the value, marks below lit are lit, mark lit is the current position. */
(() => {
  const looks = {}, waiting = new Set(), autos = new Set();
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const retone = () => autos.forEach(el => el.tone());
  mq.addEventListener ? mq.addEventListener('change', retone) : mq.addListener(retone);
  new MutationObserver(retone).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'data-tone'] });

  // Shared by every look: the square the finger slides on. Nothing here moves or sinks; a touch surface is solid.
  const BASE = `:host { --s: 240px; display: inline-flex; flex-direction: column; align-items: center; gap: 12px; vertical-align: top; flex: none; outline: none;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent }
.t { display: contents }
.k { position: relative; width: var(--s); max-width: 100%; aspect-ratio: 1; touch-action: none; cursor: pointer }

  class DetentTouch extends HTMLElement {
    static observedAttributes = ['look', 'tone', 'label'];
    static look(name, def) { looks[name] = def; [...waiting].forEach(el => el.render()); }
    connectedCallback() {
      if (!this._wired) this.wire();
      if (!this.k) this.render();
      this.tone();
    }
    disconnectedCallback() { autos.delete(this); }
    attributeChangedCallback(name, was, now) {
      if (!this._wired || was === now) return;
      if (name === 'tone') this.tone(); else this.render();

    wire() {
      this._wired = true;

      this.attachShadow({ mode: 'open' });

    }

    // Builds the look. Runs again when look or label change; the value carries over.
    render() {
      const look = looks[this.getAttribute('look') || 'nothing'];
      if (!look) { waiting.add(this); return; }
      waiting.delete(this);
      this.look = look;
      this.v = this.v ?? Math.min(100, Math.max(0, +(this.getAttribute('value') ?? 50)));
      this.lit = this.litFor(this.v);

      root.innerHTML = `<style>${BASE}${look.css}</style><div class="t">${look.html(this)}</div>`;
      this.t = root.querySelector('.t'); this.k = root.querySelector('.k');
      this.ls = {}; // the look's own state
      look.setup && look.setup(root, this);
      // A touch wheel follows the finger exactly: no give, no detents to push past, no momentum.
      Feel.rotary(this.k, {
        start: () => { look.hold && look.hold(root, this, true); },
        turn: d => this.set(this.v + d / 3),
        end: () => { look.hold && look.hold(root, this, false); this.dispatchEvent(new Event('change', { bubbles: true })); }
      });

      this.paint();

    tone() {
      if (!this.t) return;
      const t = this.getAttribute('tone');

      if (t === 'light' || t === 'dark') { dark = t === 'dark'; autos.delete(this); }

</script>

<script id="src-touch-look-braun">
/* Touch look "braun": a fixed, spun-aluminium touch plate set a hair below the panel in a brushed recess, with a turned
   centre point. Around it an engraved scale is backlit in --dial-accent up to the value. Nothing turns: the plate's
   sheen belongs to the room light. Dark tone: the same parts in black anodized aluminium on a black panel. */
DetentTouch.look('braun', {
  css: `
.t { --tick: #7f7d7a; --tick-long: #6a6865; --label: #8a8a85;

  --bowl-sh: inset 0 0 0 1px #00000024, inset 0 6px 10px -3px #00000059, inset 0 -1px 2px #ffffff4d;
  --face: radial-gradient(circle at 46% 32%, #fbfbfb, #ececeb 55%, #dededd);
  --lathe: #00000006; --sheen: #ffffff59; --sheen-2: #ffffff47;

  --lip: #ffffff99 }
.t.dark { --tick: #4c4c4f; --tick-long: #6e6e72; --label: #7c7c7a;
  --bowl: conic-gradient(from 210deg, #5c5c5f, #222224 12%, #4a4a4d 24%, #131315 40%, #3e3e41 55%, #636366 66%, #1e1e20 80%, #545457);
  --bowl-sh: inset 0 0 0 1px #000000b3, inset 0 6px 10px -3px #000000cc, inset 0 -1px 2px #ffffff1f;
  --face: radial-gradient(circle at 46% 32%, #3c3c3f, #2d2d30 55%, #242426);
  --lathe: #ffffff05; --sheen: #ffffff21; --sheen-2: #ffffff18;
  --plate-sh: 0 0 0 .5px #000, inset 0 2px 3px -1px #000000b3, inset 0 -1px 0 #ffffff1f;
  --lip: #ffffff2e }
svg { position: absolute; inset: 0; width: 100%; height: 100% }
/* Engraved scale, cut through the panel and backlit from behind, up to the current value. */

.well { position: absolute; inset: 11%; border-radius: 50%; background: var(--bowl); box-shadow: var(--bowl-sh) }

.plate::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 120deg, #fff0, var(--sheen) 7%, #fff0 18%, #fff0 50%, var(--sheen-2) 57%, #fff0 68%) }

  box-shadow: inset 0 .5px 1px #00000059, 0 .5px 0 var(--lip) }

:host(:focus-visible) .well { outline: 2px solid var(--dial-accent, #f2641e); outline-offset: 4px }
`,
  html(el) {
    // A long mark at both ends and every 13 marks between.
    const ticks = Array.from({ length: el.N }, (_, i) =>
      `<line transform="rotate(${el.angle(i)} 100 100)" x1="100" y1="${i % 13 ? 9 : 4}" x2="100" y2="16"${i % 13 ? '' : ' class="long"'}/>`).join('');

<script id="src-touch-look-index">

   translucent ink over its own LED, so up to the value they light in --dial-accent, with a hair of light bleeding
   through the ink. The printed label below switches instantly. Dark tone: the same black disc on a black panel,
   told apart by the top light on its chamfer. */

  css: `
.t { --off: #4a4a48; --label: #8a8a86; --focus: #161616;
  --disc: radial-gradient(circle at 50% 28%, #242424, #161616 58%, #101010);
  --disc-sh: inset 0 1px 0 #ffffff1c, inset 0 -1px 1px #00000099, 0 0 0 .5px #00000073, 0 1px 1.5px #00000059, 0 4px 8px -2px #00000040, 0 14px 22px -10px #00000059 }
.t.dark { --off: #444446; --label: #7c7c7a; --focus: #d4df3a;
  --disc: radial-gradient(circle at 50% 28%, #2c2c2c, #1b1b1b 58%, #141414);
  --disc-sh: inset 0 1px 0 #ffffff33, inset 0 -1px 1px #000000b3, 0 0 0 .5px #000, 0 1px 1.5px #000000b3, 0 4px 8px -2px #00000099, 0 14px 22px -10px #000000cc }

      const a = (el.angle(i) - 90) * Math.PI / 180;

<script id="src-touch-look-pedal">
/* Touch look "pedal": a fixed matte grey plastic touch pad in a recessed seat, with a scale printed on it in
   translucent white ink. A white LED behind each printed mark lights it up to the value. The printed readout below
   rolls like an odometer: it shows the label at rest and the value while touched or hovered. Dark tone: the same pad

      place(col, 10 + ((col._pos % 10) + 10) % 10, false);

  function roll(ls, text, dir) {
    const el = ls.val, lead = text.search(/[1-9]|\d$/);

      [...el.children].forEach((col, i) => { col.classList.toggle('lead', i < lead); place(col, 10 + +text[i], false); });
      return;

      let step = ((+text[i] - cur) % 10 + 10) % 10; // forward distance on the wheel
      if (!step) return;

    css: `

  --pad-sh: inset 0 1px 0 #ffffff1f, inset 0 -1px 1px #00000066, 0 0 0 .5px #0000004d, 0 1px 1.5px #00000047, 0 3px 6px -2px #00000033 }
.t.dark { --pad: #4e4e50; --ink: #d4d4d0; --trail: #d4d4d038; --seat: #00000066; --seat-sh: inset 0 1px 2px #000000d9, 0 1px 0 #ffffff14;
  --pad-sh: inset 0 1px 0 #ffffff2b, inset 0 -1px 1px #00000099, 0 0 0 .5px #000000b3, 0 1px 1.5px #000000a6, 0 3px 6px -2px #00000080 }
/* The seat: a shallow recess in the panel. The pad fills it and sits a little proud; neither ever moves. */

.pad { position: absolute; inset: 4.5%; border-radius: 50%;
  background: radial-gradient(circle at 50% 28%, color-mix(in srgb, var(--pad), #fff 9%), var(--pad) 58%, color-mix(in srgb, var(--pad), #000 18%));
  box-shadow: var(--pad-sh) }

/* A thin printed circle marks where the finger goes. */

:host(:focus-visible) .seat { outline: 2px solid var(--pad); outline-offset: 3px }
.l { position: relative; height: 16px; min-width: 8ch; font: 500 13px/16px "Geist", system-ui, sans-serif; color: var(--ink); text-align: center }

<script id="src-touch-look-nothing">
/* Touch look "nothing": the catalogue's dot-dial. A flat round tile, a 300° ring of 40 dots that fill up to the value,
   one red dot at the current position (the only accent, and only for the live state), a dot-matrix number with its
   unused leading digits left unlit, and a small Geist Mono label. No dome, texture, shadow or glow. Dots and digits
   switch instantly. Light tone: a white tile with black dots. Dark tone: a black tile with white dots.
   --dial-accent (or the dot-dial's own --head) is the position dot. */
DetentTouch.look('nothing', {
  css: `
.t { --panel: #ecebe6; --edge: #00000014; --off: #d6d5cf; --on: #1b1b1b; --digits: #1b1b1b; --unlit: #d9d8d2; --label: #8a8a85 }
.t.dark { --panel: #0b0b0b; --edge: #ffffff12; --off: #262626; --on: #f2f2f2; --digits: #f2f2f2; --unlit: #2e2e2e; --label: #7c7c7c }
.panel { position: absolute; inset: 0; border-radius: 50%; background: var(--panel); box-shadow: inset 0 0 0 1px var(--edge) }
.dots i { position: absolute; width: 3.6%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; background: var(--off) }
.dots i.lit { background: var(--on) }
.dots i.head { background: var(--dial-accent, var(--head, #d71921)) }
.read { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none }
.n { font: 800 calc(var(--s) * .24)/1 "Doto", "Geist Mono", monospace; color: var(--digits); font-variant-numeric: tabular-nums; letter-spacing: -.02em }
.n b { color: var(--unlit); font-weight: inherit }
.lab { margin-top: 8px; font: 400 11px/1 "Geist Mono", monospace; letter-spacing: .16em; color: var(--label); text-transform: uppercase }
:host(:focus-visible) .panel { outline: 2px solid var(--dial-accent, var(--head, #d71921)); outline-offset: 3px }
`,
  html(el) {
    const dots = Array.from({ length: el.N }, (_, i) => {
      const a = (el.angle(i) - 90) * Math.PI / 180;
      return `<i style="left:${50 + 41 * Math.cos(a)}%;top:${50 + 41 * Math.sin(a)}%"></i>`;
    }).join('');
    return `<div class="k"><div class="panel"></div><div class="dots">${dots}</div><div class="read"><div class="n"></div><div class="lab">${el.label}</div></div></div>`;
  },
  setup(root, el) { el.ls.dots = [...root.querySelectorAll('.dots i')]; el.ls.n = root.querySelector('.n'); },
  paint(root, el, v, lit) {

  }

</script>

<script id="src-touch-look-aqua">
/* Touch look "aqua": a candy-glass touch surface, like early Mac OS X, laid over a base with a ring of small LEDs.
   The LEDs sit underneath, so the frosted glass softens them; up to the value they light in --dial-accent.
   The glass's specular highlight and the caustic it throws on the panel come from the room light above.
   Nothing turns and the glass never sinks. Dark tone: tinted dark glass. */
DetentTouch.look('aqua', {
  css: `
.t { --fill: var(--dial-accent, #0a7cff); --off: #0000001f; --base: #0000000a; --base-sh: inset 0 1px 2px #0000001f; --spec: #ffffffd9; --caustic: #ffffffb3;
  --glass: linear-gradient(170deg, #ffffff59, #ffffff0f 55%, #ffffff2e);
  --glass-sh: inset 0 1px 0 #ffffffe6, inset 0 -1.5px 1px #ffffff99, inset 0 0 0 .5px #ffffffb3, inset 0 -12px 20px -12px #ffffff80, 0 0 0 .5px #0000001a, 0 1px 2px #0000001f, 0 12px 24px -10px #00000040 }
.t.dark { --fill: var(--dial-accent, #0a84ff); --off: #ffffff1c; --base: #ffffff08; --base-sh: inset 0 1px 2px #00000099; --spec: #ffffff52; --caustic: #ffffff2e;
  --glass: linear-gradient(170deg, #ffffff2e, #ffffff0a 55%, #ffffff17);
  --glass-sh: inset 0 1px 0 #ffffff8c, inset 0 -1.5px 1px #ffffff40, inset 0 0 0 .5px #ffffff38, inset 0 -12px 20px -12px #ffffff2e, 0 0 0 .5px #000, 0 1px 2px #000000a6, 0 12px 24px -10px #000000cc }

.leds i { position: absolute; width: 3%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; background: var(--off) }

  html(el) {

<script id="src-switch">
/* <detent-switch look="braun" tone="auto" checked name="power" value="on"> — a slide switch.
   Behaves like the hardware: the thumb holds against its detent, giving only a little, then snaps over center into a
   hard stop. Let go before it snaps and the detent pushes it back home. Tap, push the thumb, or press Space or Enter.
   Submits with forms like a checkbox (value defaults to "on") and fires "change". disabled stops it. Size it with --w.
   Needs Feel and at least one look. tone: "light" or "dark" forces one; otherwise it follows the nearest [data-tone],
   the page's data-theme, then prefers-color-scheme. The look is a separate module:
   DetentSwitch.look(name, { css, html, setup, hold, paint }).
   Look contract: html(el) goes inside the switch's own <label class="track"> (which holds the hidden native switch),
   and must contain a positioned .well with a .thumb inside it. The well carries --p (0 off, 1 on, in between while
   the thumb gives against its detent) and --slide (the timing to move with the thumb). The thumb's travel is the
   well's width minus the thumb's width minus twice its top inset. [data-press] (or the .thumb) gets .down under a
   finger. paint(root, el, on, p): on is the committed state, p where the thumb sits now (0..1, including give). */
(() => {
  const looks = {}, waiting = new Set(), autos = new Set();
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const retone = () => autos.forEach(el => el.tone());
  mq.addEventListener ? mq.addEventListener('change', retone) : mq.addListener(retone);
  new MutationObserver(retone).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'data-tone'] });

  // Shared by every look: the hidden native switch, the position the thumb follows, and how it moves and sinks.
  const BASE = `:host { --w: 150px; display: inline-block; vertical-align: middle; touch-action: none; cursor: pointer; outline: none;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent }
.t { display: contents }
.track { position: relative; display: block; box-sizing: border-box; cursor: inherit }
input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; pointer-events: none }
.well { --p: 0; --slide: var(--t, .11s) var(--ease, cubic-bezier(.55,0,1,1)); position: relative }
:host([checked]) .well { --p: 1 }
.well.hold { --t: .05s; --ease: linear }
.well.back { --t: .09s; --ease: cubic-bezier(.2,0,.3,1) }
.thumb { position: absolute; box-sizing: border-box; transition: left var(--slide), translate .06s, scale .06s, box-shadow .06s }
[data-press] { transition: translate .06s, scale .06s, box-shadow .06s }
.thumb.down, [data-press].down { translate: 0 .5px; scale: .994 }
:host([disabled]) { opacity: .5; pointer-events: none }
@media (prefers-reduced-motion: reduce) { .track *, .track *::before, .track *::after { transition-duration: 0s !important } }
`;

  class DetentSwitch extends HTMLElement {
    static formAssociated = true;
    static observedAttributes = ['checked', 'disabled', 'look', 'tone'];
    static look(name, def) { looks[name] = def; [...waiting].forEach(el => el.render()); }
    constructor() {
      super();
      this.internals = this.attachInternals ? this.attachInternals() : null;
      this.attachShadow({ mode: 'open' });
    }
    get checked() { return this.hasAttribute('checked'); }
    set checked(v) { this.toggleAttribute('checked', !!v); }
    get value() { return this.checked; }
    toggle(force) { this.flip(force ?? !this.checked); }
    attributeChangedCallback(name, was, now) {
      if (name === 'look') { if (this._wired && was !== now) this.render(); return; }
      if (name === 'tone') { this.tone(); return; }
      this.sync();
    }
    sync() {
      const on = this.checked, off = this.hasAttribute('disabled'), input = this.input;
      if (input) { input.checked = on; input.disabled = off; }
      this.setAttribute('aria-checked', String(on));
      this.setAttribute('aria-disabled', String(off));
      if (this.internals) this.internals.setFormValue(on ? (this.getAttribute('value') || 'on') : null);
      if (this.well) this.paint(+on);

    formResetCallback() { this.checked = this._default; }
    disconnectedCallback() { autos.delete(this); }
    connectedCallback() {
      this.setAttribute('role', 'switch');
      if (!this.hasAttribute('tabindex')) this.tabIndex = 0;
      this._default ??= this.checked;
      if (!this._wired) this.wire();
      if (!this.well) this.render();
      this.tone();
      this.sync();
    }
    // Builds the look. Runs again when look changes; the state carries over (it lives in the attributes).
    render() {
      const look = looks[this.getAttribute('look') || 'braun'];
      if (!look) { waiting.add(this); return; }
      waiting.delete(this);
      this.look = look;
      const root = this.shadowRoot;
      root.innerHTML = `<style>${BASE}${look.css}</style><div class="t"><label class="track" part="track">` +
        `<input type="checkbox" switch tabindex="-1" aria-hidden="true">${look.html(this)}</label></div>`;
      this.t = root.querySelector('.t');
      this.input = root.querySelector('input'); this.label = root.querySelector('label');
      this.well = root.querySelector('.well'); this.thumb = root.querySelector('.thumb');
      this.press = root.querySelector('[data-press]') || this.thumb;
      this.ls = {}; // the look's own state
      look.setup && look.setup(root, this);
      this._bind(this.input, this.label);
      this.tone();
      this.sync();
    }
    tone() {
      if (!this.t) return;
      const t = this.getAttribute('tone');
      let dark;
      if (t === 'light' || t === 'dark') { dark = t === 'dark'; autos.delete(this); }
      else {
        autos.add(this);
        const near = this.parentElement && this.parentElement.closest('[data-tone]'), page = document.documentElement.dataset.theme;
        dark = near ? near.dataset.tone === 'dark' : page ? page === 'dark' : mq.matches;
      }
      this.t.classList.toggle('dark', dark);
    }
    wire() {
      this._wired = true;
      let g = null, swallowClick = false;
      const HOLD = .3; // how far you push against the detent before it snaps over center

      this._bind = (input, label) => {
        // A plain tap goes through the hidden native <input switch>, so iPhone plays its own haptic.
        input.addEventListener('change', () => this.flip(input.checked, true));
        label.addEventListener('click', e => { if (swallowClick) e.preventDefault(); }, true);
      };

      this.addEventListener('pointerdown', e => {
        if (e.button > 0 || !this.well) return;
        e.preventDefault(); // keep focus on the switch itself, not the hidden input
        this.focus({ preventScroll: true });
        g = { x: e.clientX, id: e.pointerId, moved: false };
        this.press.classList.add('down');
        this.look.hold && this.look.hold(this.shadowRoot, this, true);
      });
      this.addEventListener('pointermove', e => {
        if (!g || e.pointerId !== g.id) return;
        const well = this.well, thumb = this.thumb, dx = e.clientX - g.x;
        if (!g.moved) {
          if (Math.abs(dx) < 3) return;
          g.moved = true;
          this.setPointerCapture(e.pointerId);
        }
        const span = well.clientWidth - thumb.offsetWidth - 2 * thumb.offsetTop;
        const from = +this.checked, push = (this.checked ? -dx : dx) / span; // >0 means toward the other end
        if (push >= HOLD) {
          // Over center: it goes all the way on its own. Re-anchor so you can push it back.
          well.classList.remove('hold');
          well.style.removeProperty('--p');
          g.x = e.clientX;
          this.flip(!this.checked);
          return;
        }
        // Against the detent the thumb only gives a little, and never past its end stop.
        const give = Math.max(0, push) * .22, p = from + (this.checked ? -give : give);
        well.classList.add('hold');
        well.style.setProperty('--p', p);
        this.paint(p);
      });
      const end = e => {
        if (!g || e.pointerId !== g.id) return;
        const was = g, well = this.well;
        g = null;
        this.press.classList.remove('down');
        this.look.hold && this.look.hold(this.shadowRoot, this, false);
        if (!was.moved) return; // a tap: the label click flips the native switch
        swallowClick = true;
        setTimeout(() => { swallowClick = false; });
        if (well.classList.contains('hold')) {
          // Let go before it snapped: the detent spring pushes it back home.
          well.classList.replace('hold', 'back');
          well.style.removeProperty('--p');
          setTimeout(() => well.classList.remove('back'), 120);
          this.paint(+this.checked);
        }
      };
      this.addEventListener('pointerup', end);
      this.addEventListener('pointercancel', end);
      this.addEventListener('keydown', e => {
        if (e.key !== ' ' && e.key !== 'Enter') return;
        e.preventDefault();
        if (!e.repeat && this.input) this.input.click();
      });
    }
    flip(v, native) {
      if (this.hasAttribute('disabled') || v === this.checked) return;
      this.checked = v;
      Feel.fire('switch', { pitch: v ? 1.04 : .96, native });
      this.dispatchEvent(new Event('change', { bubbles: true }));
    }
    // p: where the thumb sits right now, including the give against the detent. this.checked is the committed state.
    paint(p) {
      this.p = p;
      this.look.paint && this.look.paint(this.shadowRoot, this, this.checked, p);
    }
  }
  window.DetentSwitch = DetentSwitch;
  customElements.define('detent-switch', DetentSwitch);
})();
</script>

<script id="src-switch-look-braun">
/* Switch look "braun": the machined knurl switch. A light bezel around a dark recessed well; the fill slides in
   behind the thumb in --dial-accent, with a backlit "|" window that lights when on and a printed "O" ring at the off
   end. The thumb is turned aluminium with a diamond-knurled face. Dark tone: the same parts in black anodized
   aluminium on a black panel. */
DetentSwitch.look('braun', {
  css: `
.t { --bezel: linear-gradient(#b4afab, #ebe8e5 30%, #faf9f8 60%, #fff);
  --bezel-sh: inset 0 1px 0 #fff, inset 0 -1px 1px #0000001a, 0 18px 30px -18px #0008, 0 2px 4px -2px #0003;
  --well: linear-gradient(#5b5b5b, #757575); --well-sh: inset 0 0 0 1px #0000004d, inset 0 8px 12px -4px #000b, inset 0 -1px 2px #fff3;
  --ring: #4d4d4d; --ring-lip: #ffffff2e;
  --rim: conic-gradient(from 200deg, #fdfdfd, #cfccc9 18%, #f6f5f4 35%, #bdb9b5 55%, #fbfbfb 72%, #d5d2cf 88%, #fdfdfd);
  --rim-sh: 0 9px 14px -6px #000a, 0 2px 3px #0005, inset 0 1px 1px #fff, inset 0 -2px 3px #0003;
  --rim-dn: 0 6px 10px -6px #000a, 0 1px 2px #0005, inset 0 1px 1px #fff, inset 0 -2px 3px #0003;
  --knurl: conic-gradient(from 45deg, #fefefe 0 25%, #d0cbc6 0 50%, #b5b0ab 0 75%, #e8e5e2 0) 50% 50% / 6px 6px;
  --knurl-sh: inset 0 2px 4px #0005, inset 0 -1px 1px #fff; --knurl-sheen: #ffffff60 }
.t.dark { --bezel: linear-gradient(#050506, #18181a 30%, #232325 60%, #2c2c2e);
  --bezel-sh: inset 0 1px 0 #ffffff26, inset 0 -1px 1px #00000080, 0 18px 30px -18px #000, 0 2px 4px -2px #000000b3;
  --well: linear-gradient(#0c0c0d, #1b1b1d); --well-sh: inset 0 0 0 1px #000000b3, inset 0 8px 12px -4px #000, inset 0 -1px 2px #ffffff14;
  --ring: #333336; --ring-lip: #ffffff14;
  --rim: conic-gradient(from 200deg, #5d5d60, #2a2a2c 18%, #4e4e51 35%, #1f1f21 55%, #5a5a5d 72%, #313133 88%, #5d5d60);
  --rim-sh: 0 9px 14px -6px #000, 0 2px 3px #000000b3, inset 0 1px 1px #ffffff4d, inset 0 -2px 3px #00000080;
  --rim-dn: 0 6px 10px -6px #000, 0 1px 2px #000000b3, inset 0 1px 1px #ffffff4d, inset 0 -2px 3px #00000080;
  --knurl: conic-gradient(from 45deg, #4f4f52 0 25%, #2c2c2e 0 50%, #1c1c1e 0 75%, #3d3d40 0) 50% 50% / 6px 6px;
  --knurl-sh: inset 0 2px 4px #000000b3, inset 0 -1px 1px #ffffff26; --knurl-sheen: #ffffff1f }
.t { --fill: var(--dial-accent, #f57c00) }
/* The bezel: a raised lip around the recess, lit from above. */
.track { --h: calc(var(--w) * .47); --i: calc(var(--h) * .04); --d: calc(var(--h) * .92); width: var(--w); padding: calc(var(--w) * .035);
  border-radius: 999px; background: var(--bezel); box-shadow: var(--bezel-sh) }
/* The well: a deep recess the thumb slides in. Its top wall sits in shadow. */
.well { height: var(--h); border-radius: 999px; overflow: hidden; background: var(--well); box-shadow: var(--well-sh) }
/* Printed "O" at the off end. */
.ring { position: absolute; right: 12%; top: 50%; width: 17%; aspect-ratio: 1; translate: 0 -50%; border-radius: 50%; border: 2px solid var(--ring); box-sizing: border-box;
  box-shadow: inset 0 1px 2px #000a, 0 1px 0 var(--ring-lip) }
/* The colored fill comes in behind the thumb as it travels. */
.fill { position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(var(--fill), color-mix(in srgb, var(--fill), #fff 14%));
  box-shadow: inset 0 0 0 1px #0000002e, inset 0 8px 12px -4px color-mix(in srgb, var(--fill), #000 55%);
  clip-path: inset(0 calc((1 - var(--p)) * (100% - var(--i) - var(--d) / 2)) 0 0 round 999px); transition: clip-path var(--slide) }
/* The "|" is a frosted window with a lamp behind it: it lights when the switch is on. */
.bar { position: absolute; left: 13%; top: 38%; width: 3.5%; height: 24%; border-radius: 9px; background: color-mix(in srgb, var(--fill), #fff 45%);
  box-shadow: inset 0 1px 1px #fffa, 0 1px 1px color-mix(in srgb, var(--fill), #000 40%); transition: box-shadow .4s }
:host([checked]) .bar { box-shadow: inset 0 1px 1px #fffa, 0 1px 1px color-mix(in srgb, var(--fill), #000 40%), 0 0 9px #fffc }

<script id="src-selector">
/* <detent-selector look="index" tone="auto" steps="5" value="4" label="PWR"> — a rotary selector switch with
   `steps` positions (at least 2) spread over a 270° sweep; value is the position, 1 to steps.
   Each position has a spring detent: the knob gives a little under the finger, snaps over center into the next
   position with a click (it accelerates and stops dead), and stops hard at both ends. Let go short of center and the
   detent pulls it back. Arrow keys and the wheel (once focused) step one position; Home/End jump to the ends.
   Fires "input" on every new position and "change" on release. Needs Feel and at least one look.
   tone: "light" or "dark" forces one; otherwise it follows the nearest [data-tone], the page's data-theme,
   then prefers-color-scheme. The look is a separate module: DetentSelector.look(name, { css, html, setup, hold, paint }).
   Look contract: html(el) must contain a .k (the square the finger turns). Anything inside a .rot turns to the
   knob's angle (--a); put only printed or inlaid marks there, never highlights. Mark the part that sinks under the
   finger with data-press. paint(root, el, shown): el.v is the position (1..el.steps), el.name the label,
   el.angleOf(i) the angle of position i in degrees (0 = up), and shown the angle the knob points to right now,
   including the give. el.ls is the look's own state. */
(() => {
  const looks = {}, waiting = new Set(), autos = new Set();
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const retone = () => autos.forEach(el => el.tone());
  mq.addEventListener ? mq.addEventListener('change', retone) : mq.addListener(retone);
  new MutationObserver(retone).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'data-tone'] });

  // Shared by every look: the square the finger turns, the layer that rotates, and how a part sinks and settles.
  const BASE = `:host { --s: 170px; display: inline-flex; flex-direction: column; align-items: center; gap: 14px; vertical-align: top; outline: none;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent }
.t { display: contents }
.k { position: relative; width: var(--s); max-width: 100%; aspect-ratio: 1; touch-action: none; cursor: grab }
.k:active { cursor: grabbing }
.rot { position: absolute; inset: 0; rotate: var(--a) }
/* Over center, the detent spring throws the knob into the next position: it accelerates and stops dead. */
.k.snap .rot { transition: rotate .07s cubic-bezier(.55,0,1,1) }
/* Let go short of center and the detent pulls it back into place. */
.k.back .rot { transition: rotate .08s cubic-bezier(.2,0,.3,1) }
[data-press] { transition: translate .05s, scale .05s, box-shadow .05s }
[data-press].down { translate: 0 .5px; scale: .994 }
@media (prefers-reduced-motion: reduce) { .k.snap .rot, .k.back .rot, [data-press] { transition: none } }
`;

  class DetentSelector extends HTMLElement {
    static observedAttributes = ['look', 'tone', 'steps', 'label'];
    static look(name, def) { looks[name] = def; [...waiting].forEach(el => el.render()); }
    connectedCallback() {
      if (!this._wired) this.wire();
      if (!this.k) this.render();
      this.tone();
    }
    disconnectedCallback() { autos.delete(this); }
    attributeChangedCallback(name, was, now) {
      if (!this._wired || was === now) return;
      if (name === 'tone') this.tone(); else this.render();
    }
    wire() {
      this._wired = true;
      this.attachShadow({ mode: 'open' });
      this.setAttribute('role', 'slider');
      if (!this.hasAttribute('tabindex')) this.tabIndex = 0;
      this.acc = 0; this.pushDir = 0;
      let wheel = 0;
      Feel.wheel(this, d => { wheel += d; if (Math.abs(wheel) > 12) { this.nudge(Math.sign(wheel)); wheel = 0; } });
      Feel.keys(this, dir => this.nudge(dir), dir => this.set(dir < 0 ? 1 : this.steps));
    }
    // Builds the look. Runs again when look, steps or label change; the position carries over.
    render() {
      const look = looks[this.getAttribute('look') || 'index'];
      if (!look) { waiting.add(this); return; }
      waiting.delete(this);
      this.look = look;
      this.steps = Math.max(2, Math.round(+(this.getAttribute('steps') || 5)));
      this.gap = 270 / (this.steps - 1);
      this.name = this.getAttribute('label') || 'PWR';
      this.v = Math.min(this.steps, Math.max(1, Math.round(this.v ?? +(this.getAttribute('value') || 1))));
      this.acc = 0; this.pushDir = 0;
      const root = this.shadowRoot;
      root.innerHTML = `<style>${BASE}${look.css}</style><div class="t">${look.html(this)}</div>`;
      this.t = root.querySelector('.t'); this.k = root.querySelector('.k');
      const press = root.querySelector('[data-press]') || this.k;
      this.ls = {}; // the look's own state
      look.setup && look.setup(root, this);
      this.setAttribute('aria-valuemin', 1); this.setAttribute('aria-valuemax', this.steps);
      this.setAttribute('aria-label', this.name);
      Feel.rotary(this.k, {
        start: () => { press.classList.add('down'); this.acc = 0; look.hold && look.hold(root, this, true); },
        turn: d => this.push(d),
        end: () => {
          press.classList.remove('down');
          if (this.acc) { this.acc = 0; this.motion('back'); this.paint(); } // the detent pulls it back into place
          look.hold && look.hold(root, this, false);
          this.dispatchEvent(new Event('change', { bubbles: true }));
        }
      });
      this.tone();
      this.paint();
    }
    tone() {
      if (!this.t) return;
      const t = this.getAttribute('tone');
      let dark;
      if (t === 'light' || t === 'dark') { dark = t === 'dark'; autos.delete(this); }
      else {
        autos.add(this);
        const near = this.parentElement && this.parentElement.closest('[data-tone]'), page = document.documentElement.dataset.theme;
        dark = near ? near.dataset.tone === 'dark' : page ? page === 'dark' : mq.matches;
      }
      this.t.classList.toggle('dark', dark);
    }
    angleOf(i) { return -135 + (i - 1) * this.gap; }
    get value() { return this.v ?? +(this.getAttribute('value') || 1); }
    set value(n) { if (this.k) this.set(+n, true); else this.setAttribute('value', n); }
    // A finger pushes the knob by d degrees. It only gives a little until it passes the halfway point
    // between positions, then the detent throws it into the next one.
    push(d) {
      this.pushDir = Math.sign(d);
      this.acc += d;
      while (Math.abs(this.acc) > this.gap / 2) {
        const dir = Math.sign(this.acc), n = this.v + dir;
        if (n < 1 || n > this.steps) { // hard end stop: no give at all
          this.acc = 0;
          Feel.stop(this, n, 1, this.steps);
          break;
        }
        this.acc -= dir * this.gap;
        this.set(n);
      }
      this.paint();
    }
    nudge(dir) {
      if (!this.k) return;
      const n = this.v + dir;
      if (n < 1 || n > this.steps) return Feel.stop(this, n, 1, this.steps);
      this.set(n);
    }
    set(n, quiet) {
      if (!this.k) return;
      n = Math.min(this.steps, Math.max(1, Math.round(n)));
      if (n === this.v) return;
      this.v = n;
      this.motion('snap');
      if (!quiet) {
        Feel.fire('selector');
        Feel.stop(this, n, 1, this.steps);
        this.dispatchEvent(new Event('input', { bubbles: true }));
      }
      this.paint();
    }
    motion(kind) {
      const k = this.k;
      k.classList.remove('snap', 'back');
      k.classList.add(kind);
      clearTimeout(this._mt);
      this._mt = setTimeout(() => k.classList.remove(kind), 90);
    }
    paint() {
      // After a snap the knob is ahead of the finger, so it only shows give while it's actually being pushed.
      const give = Math.sign(this.acc) === this.pushDir ? this.acc * .25 : 0;
      const shown = this.angleOf(this.v) + give;
      this.style.setProperty('--a', shown + 'deg');
      this.setAttribute('aria-valuenow', this.v);
      this.look.paint && this.look.paint(this.shadowRoot, this, shown);
    }
  }
  window.DetentSelector = DetentSelector;
  customElements.define('detent-selector', DetentSelector);
})();
</script>

   label below names the switch and its position. Dark tone: the same parts in black anodized aluminum on a black panel. */
DetentSelector.look('braun', {
  css: `
.t { --tick: #7f7d7a; --ink: #6a6865;

  --bowl-sh: inset 0 0 0 1px #00000024, inset 0 6px 10px -3px #00000059, inset 0 -1px 2px #ffffff4d;

  --cap-dn: 0 0 0 .5px #000, 0 .5px 1px #000000d9, 0 2px 3px -1px #00000099, 0 6px 10px -6px #000000b3;

svg { position: absolute; inset: 0; width: 100%; height: 100% }
/* Engraved position marks. Only the current one is backlit, so the light has a source: the lamp behind the panel. */

  background: repeating-radial-gradient(circle, #0000 0 1.1px, var(--lathe) 1.1px 2.2px);

`,
  html(el) {

<script id="src-selector-look-index">
/* Selector look "index" (native, from the catalogue's index-knob): a matte soft-touch black disc with a thin inlaid
   pointer stripe in --dial-accent and a finger cup opposite it, over a printed dot at each position. The printed
   label (e.g. PWR:4) switches instantly. Dark tone: the same black disc on a black panel, told apart by the top
   light on its chamfer. */
DetentSelector.look('index', {
  css: `
.t { --dot: #a9a9a5; --label: #9a9a96; --focus: #161616;
  --disc: radial-gradient(circle at 50% 28%, #242424, #161616 58%, #101010);
  --disc-sh: inset 0 1px 0 #ffffff1c, inset 0 -1px 1px #00000099, 0 0 0 .5px #00000073, 0 1px 1.5px #00000059, 0 4px 8px -2px #00000040, 0 14px 22px -10px #00000059;
  --disc-dn: inset 0 1px 0 #ffffff1c, inset 0 -1px 1px #00000099, 0 0 0 .5px #00000073, 0 .5px 1px #00000066, 0 2px 5px -2px #00000040, 0 8px 14px -8px #00000059 }
.t.dark { --dot: #57575a; --label: #7c7c7a; --focus: #d4df3a;
  --disc: radial-gradient(circle at 50% 28%, #2c2c2c, #1b1b1b 58%, #141414);
  --disc-sh: inset 0 1px 0 #ffffff33, inset 0 -1px 1px #000000b3, 0 0 0 .5px #000, 0 1px 1.5px #000000b3, 0 4px 8px -2px #00000099, 0 14px 22px -10px #000000cc;
  --disc-dn: inset 0 1px 0 #ffffff33, inset 0 -1px 1px #000000b3, 0 0 0 .5px #000, 0 .5px 1px #000000cc, 0 2px 5px -2px #00000099, 0 8px 14px -8px #000000cc }
/* Printed position marks: they belong to the panel, so they never change. */
.marks i { position: absolute; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: var(--dot) }

.disc.down { box-shadow: var(--disc-dn) }
/* The pointer: a thin inlaid stripe. The finger cup: a dimple pressed into the same black, on the opposite side.
   It shows only by its shaded upper wall and the light catching its lower edge. Both are part of the knob. */
