    static let light = ScrubberPalette(panel: Color(red: 0.937, green: 0.933, blue: 0.949), ink: Color(red: 0.404, green: 0.4, blue: 0.435),
                                       ink2: Color(red: 0.69, green: 0.686, blue: 0.722), label: Color(red: 0.43, green: 0.427, blue: 0.467),
                                       edge: .black.opacity(0.11), rim: .black.opacity(0.16), drop: .black.opacity(0.25), highlight: .white.opacity(0.9),
                                       side: .black.opacity(0.1), caustic: .white.opacity(0.55),
                                       chip: Color(red: 0.984, green: 0.984, blue: 0.988), chipInk: Color(red: 0.17, green: 0.165, blue: 0.19), isDark: false)
    static let dark = ScrubberPalette(panel: Color(red: 0.067, green: 0.067, blue: 0.082), ink: Color(red: 0.62, green: 0.616, blue: 0.66),
                                      ink2: Color(red: 0.286, green: 0.282, blue: 0.322), label: Color(red: 0.557, green: 0.553, blue: 0.596),
                                      edge: .white.opacity(0.09), rim: .white.opacity(0.18), drop: .black.opacity(0.7), highlight: .white.opacity(0.32),
                                      side: .white.opacity(0.07), caustic: .white.opacity(0.09),
                                      chip: Color(red: 0.12, green: 0.12, blue: 0.145), chipInk: Color(red: 0.925, green: 0.92, blue: 0.94), isDark: true)
}

/// The printed scale: a mark every quarter hour, longer on the half hour and the hour.
/// Numbered every three hours, the six-hour marks bolder. Drawn on a 60pt-high strip whose marks sit on the line y = 26. The numbers sit below the lens's travel, so the glass never
/// cuts through them; the magnified copy inside the lens draws the marks only.
private func drawScrubberScale(_ ctx: GraphicsContext, width w: CGFloat, maxMinutes: Int, palette p: ScrubberPalette, lensAt: CGFloat? = nil) {
    // Through the lens: positions and lengths magnified 1.8× around the hairline, drawn with the same fine line so the lens doesn't shout.
    let z: CGFloat = lensAt == nil ? 1 : 1.8
    func X(_ x: CGFloat) -> CGFloat { lensAt.map { 15 + (x - $0) * z } ?? x }
    func Y(_ y: CGFloat) -> CGFloat { lensAt == nil ? y : 19 + (y - 26) * z }
    for m in stride(from: 0, through: maxMinutes, by: 15) {
        let x = X(CGFloat(m) / CGFloat(maxMinutes) * w)
        if lensAt != nil && (x < -2 || x > 32) { continue }
        let h: CGFloat = m % 60 == 0 ? 8 : m % 30 == 0 ? 5 : 3
        var path = Path()
        path.move(to: CGPoint(x: x, y: Y(26 - h)))
        path.addLine(to: CGPoint(x: x, y: Y(26 + h)))
        ctx.stroke(path, with: .color(m % 60 == 0 ? p.ink : p.ink2), lineWidth: m % 60 == 0 ? 1.4 : 1)
        if lensAt == nil && m % 180 == 0 {
            let big = m % 360 == 0
            ctx.draw(Text(String(format: "%02d", m / 60)).font(.system(size: 10, weight: big ? .semibold : .medium, design: .monospaced))
                        .foregroundStyle(big ? p.ink : p.ink2),
                     at: CGPoint(x: x, y: 51))
        }
    }
}

private struct ScrubberScale: View {
    let width: CGFloat, maxMinutes: Int, palette: ScrubberPalette
    var body: some View {
        Canvas { ctx, _ in drawScrubberScale(ctx, width: width, maxMinutes: maxMinutes, palette: palette) }
            .allowsHitTesting(false)
    }
}

/// The lens. Clear glass over the printed scale, so what you see through it is the scale itself, magnified 1.8×.
/// The room light is overhead: a soft highlight across the top of the glass, its edges bend light away and read darker,
/// it focuses a little brightness onto the panel under it, and it casts a short shadow straight down.
private struct ScrubberLens: View {
    let x: CGFloat, width: CGFloat, maxMinutes: Int, palette: ScrubberPalette, line: Color, pressed: Bool
    var body: some View {
        let p = palette
        ZStack {
            p.panel
            RadialGradient(colors: [p.caustic, .clear], center: UnitPoint(x: 0.5, y: 0.66), startRadius: 0, endRadius: 12)
            Canvas { ctx, _ in
                drawScrubberScale(ctx, width: width, maxMinutes: maxMinutes, palette: p, lensAt: x)   // the lens center sits over x
            }
            Rectangle().fill(line.opacity(0.9)).frame(width: 1).padding(.vertical, 4)  // the hairline engraved in the glass
            LinearGradient(stops: [.init(color: p.side, location: 0), .init(color: .clear, location: 0.24),
                                   .init(color: .clear, location: 0.76), .init(color: p.side, location: 1)], startPoint: .leading, endPoint: .trailing)
            EllipticalGradient(colors: [p.highlight, .clear], center: UnitPoint(x: 0.5, y: 0.08), startRadiusFraction: 0, endRadiusFraction: 0.32)
        }
        .frame(width: 30, height: 38)
        .clipShape(Capsule())
        .overlay(Capsule().strokeBorder(p.rim, lineWidth: 0.5))
        .shadow(color: p.drop, radius: pressed ? 0.5 : 0.8, y: pressed ? 0.5 : 1)
        .shadow(color: p.drop.opacity(0.6), radius: pressed ? 3 : 4.5, y: pressed ? 2 : 4)
        // Nothing moves on hover; a finger sinks the lens a hair.
        .scaleEffect(pressed ? 0.994 : 1)
        .offset(y: pressed ? 0.5 : 0)
        .animation(.linear(duration: 0.05), value: pressed)
        .allowsHitTesting(false)
    }
}

/// The sky. The sun and the moon ride opposite ends of one arc: the sun rises on the left at 06:00, is highest at noon and sets on
/// the right at 18:00; the moon does the same through the night. The sky's color comes from the sun's height alone, so there is
/// no light before it nears the horizon. Each star fades over its own stretch of twilight, faintest first. It is the only light
/// that changes; the panel is lit by the room. Animatable, so a change of time glides through every moment in between.
private struct ScrubberSky: View, Animatable {
    var minutes: Double
    let width: CGFloat
    nonisolated var animatableData: Double {
        get { minutes }
        set { minutes = newValue }
    }

    typealias RGB = (Double, Double, Double)
    // [x %, y %, brightness]. Brighter stars come out first at dusk and are the last to go at dawn.
    private static let stars: [(CGFloat, CGFloat, Double)] = [(5, 14, 1), (11, 40, 0.5), (16, 24, 0.75), (21, 60, 0.4), (27, 9, 0.6),
        (32, 36, 0.9), (37, 64, 0.45), (42, 20, 0.55), (47, 46, 0.7), (53, 10, 0.95), (57, 58, 0.4), (62, 30, 0.65), (67, 72, 0.5),
        (72, 16, 0.85), (77, 44, 0.45), (82, 26, 0.6), (86, 60, 0.8), (91, 12, 0.5), (95, 38, 0.7), (8, 76, 0.45), (30, 80, 0.5),
        (50, 82, 0.4), (70, 84, 0.55), (89, 80, 0.4)]
    // The sky by the sun's height (sine of its elevation): [height, zenith, middle, horizon]. Deep night until about an hour
    // before sunrise, then the dawn comes up from the horizon; the same in reverse at dusk.
    private static let table: [(Double, RGB, RGB, RGB)] = [
        (-1, (6, 9, 24), (11, 18, 42), (20, 28, 56)),
        (-0.28, (6, 9, 24), (11, 18, 42), (20, 28, 56)),
        (-0.14, (11, 17, 42), (26, 34, 76), (56, 56, 104)),
        (-0.04, (28, 42, 88), (88, 80, 130), (208, 126, 104)),
        (0.03, (50, 80, 138), (146, 128, 158), (250, 168, 108)),
        (0.15, (70, 116, 176), (150, 180, 212), (246, 206, 160)),
        (0.4, (63, 120, 191), (121, 172, 220), (188, 220, 242)),
        (1, (58, 114, 186), (114, 166, 218), (184, 218, 242)),
    ]

    var body: some View {
        let h: CGFloat = 160, a = (minutes / 60 - 6) / 12 * .pi, e = sin(a)
        let rx = width / 2, ry: CGFloat = 112   // the sun rises from the very left edge and sets at the right
        let sun = CGPoint(x: width / 2 - rx * cos(a), y: h - ry * e), moon = CGPoint(x: width - sun.x, y: h + ry * e)
        var i = 0
        while i < Self.table.count - 2 && e > Self.table[i + 1].0 { i += 1 }
        let lo = Self.table[i], hi = Self.table[i + 1], k = min(1, max(0, (e - lo.0) / (hi.0 - lo.0)))
        let low = 1 - Self.ramp(0, 0.3, e)
        return ZStack(alignment: .topLeading) {
            LinearGradient(stops: [.init(color: Self.color(Self.blend(lo.1, hi.1, k)), location: 0),
                                   .init(color: Self.color(Self.blend(lo.2, hi.2, k)), location: 0.62),
                                   .init(color: Self.color(Self.blend(lo.3, hi.3, k)), location: 1)], startPoint: .top, endPoint: .bottom)
            Canvas { ctx, size in
                for (sx, sy, b) in Self.stars {
                    let th = -0.24 + b * 0.2                                  // where this star goes out
                    let o = (0.5 + 0.5 * b) * (1 - Self.ramp(th - 0.06, th + 0.06, e))
                    guard o > 0.01 else { continue }
                    let r = (1.4 + b * 1.6) / 2, c = CGPoint(x: sx / 100 * size.width, y: sy / 100 * size.height)
                    ctx.fill(Path(ellipseIn: CGRect(x: c.x - r * 2.5, y: c.y - r * 2.5, width: r * 5, height: r * 5)),
                             with: .radialGradient(Gradient(colors: [Color(red: 0.87, green: 0.9, blue: 1).opacity(o * 0.35), .clear]),
                                                   center: c, startRadius: 0, endRadius: r * 2.5))
                    ctx.fill(Path(ellipseIn: CGRect(x: c.x - r, y: c.y - r, width: 2 * r, height: 2 * r)), with: .color(.white.opacity(o)))
                }
            }
            // the warm band of sunrise and sunset gathers around the sun at the horizon
            Ellipse()
                .fill(RadialGradient(colors: [Color(red: 1, green: 0.6, blue: 0.32).opacity(0.7), Color(red: 1, green: 0.6, blue: 0.32).opacity(0.25), .clear],
                                     center: .center, startRadius: 0, endRadius: 170))
                .frame(width: 340, height: 150)
                .position(x: sun.x, y: h)
                .opacity(exp(-pow((e - 0.02) / 0.11, 2)))
            // A crescent: only the side facing the sun is lit.
            Crescent()
                .fill(Color(red: 0.95, green: 0.93, blue: 0.886))
                .frame(width: 18, height: 18)
                .rotationEffect(.radians(atan2(sun.y - moon.y, sun.x - moon.x)))
                .shadow(color: Color(red: 0.91, green: 0.9, blue: 1).opacity(0.35), radius: 5)
                .position(moon)
                .opacity(Self.ramp(-0.04, 0.12, -e))
            // a low sun shines through more air: warmer
            Circle()
                .fill(Color(red: 1, green: (246 - 82 * low) / 255, blue: (224 - 132 * low) / 255))
                .frame(width: 22, height: 22)
                .shadow(color: Color(red: 1, green: (216 - 76 * low) / 255, blue: (138 - 80 * low) / 255).opacity(0.6), radius: 8)
                .shadow(color: Color(red: 1, green: 0.75, blue: 0.42).opacity(0.18), radius: 28)
                .position(sun)
        }
        .frame(width: width, height: h)
        .clipped()
        .allowsHitTesting(false)
    }

    static func ramp(_ lo: Double, _ hi: Double, _ v: Double) -> Double { let k = min(1, max(0, (v - lo) / (hi - lo))); return k * k * (3 - 2 * k) }
    static func blend(_ a: RGB, _ b: RGB, _ t: Double) -> RGB { (a.0 + (b.0 - a.0) * t, a.1 + (b.1 - a.1) * t, a.2 + (b.2 - a.2) * t) }
    static func color(_ c: RGB) -> Color { Color(red: c.0 / 255, green: c.1 / 255, blue: c.2 / 255) }
}

/// A crescent moon, lit on its right side: the disc minus the same disc shifted left.
private struct Crescent: Shape {
    func path(in r: CGRect) -> Path {
        Path(ellipseIn: r).subtracting(Path(ellipseIn: r.offsetBy(dx: -r.width * 0.28, dy: 0)))
    }
}

/// A light, crisp haptic per quarter, a firmer one on the hour, a dull one at the stops.
@MainActor private final class ScrubberFeedback {
    static let shared = ScrubberFeedback()
    private let rigid = UIImpactFeedbackGenerator(style: .rigid)
    private let soft = UIImpactFeedbackGenerator(style: .soft)
    private let synth = ScrubberSynth()

    func prepare() { rigid.prepare(); soft.prepare() }
    func tap(hour: Bool) {
        rigid.impactOccurred(intensity: hour ? 0.8 : 0.45)
        rigid.prepare()
    }
    func quarter(sound: Bool) { tap(hour: false); if sound { synth.play([(0, false)]) } }
    func hour(sound: Bool) { tap(hour: true); if sound { synth.play([(0, true)]) } }
    func stop(sound: Bool) {
        soft.impactOccurred(intensity: 0.9)
        soft.prepare()
        if sound { synth.playStop() }
    }
    func track(_ clicks: [(Double, Bool)], sound: Bool) { if sound, !clicks.isEmpty { synth.play(clicks) } }
    func cancelTrack() { synth.stop() }
}

/// Small hard plastic parts ringing for a millisecond or two at a few high body modes: a tiny bright tick for the quarters,
/// a louder, lower one for the hours, a duller one for the end stops.
private final class ScrubberSynth {
    private let engine = AVAudioEngine()
    private let player = AVAudioPlayerNode()
    private let stopPlayer = AVAudioPlayerNode()
    private var format: AVAudioFormat?
    private var quarter: [Float] = [], hour: [Float] = [], stopTick: [Float] = []
    private var ready = false

    init() {
        guard let format = AVAudioFormat(standardFormatWithSampleRate: 44_100, channels: 1) else { return }
        self.format = format
        for p in [player, stopPlayer] {
            engine.attach(p)
            engine.connect(p, to: engine.mainMixerNode, format: format)
        }
        let rate = Float(format.sampleRate)
        quarter = Self.renderTick(rate: rate, level: 0.05, tune: 1.35)
        hour = Self.renderTick(rate: rate, level: 0.07, tune: 1.6 * 0.62)
        stopTick = Self.renderTick(rate: rate, level: 0.09, tune: 0.85)
        // Ambient: respects the silent switch and mixes with the user's music.
        try? AVAudioSession.sharedInstance().setCategory(.ambient, options: [.mixWithOthers])
        ready = (try? engine.start()) != nil
    }

    /// Mixes one click at each time (ms from now) into a single buffer, so their spacing is exact to the sample.
    func play(_ clicks: [(Double, Bool)]) {
        guard ready, let format, let lastMs = clicks.map(\.0).max() else { return }
        render(clicks.map { ($0.0, $0.1 ? hour : quarter) }, lastMs: lastMs, format: format, on: player)
    }

    func playStop() {
        guard ready, let format else { return }
        render([(0, stopTick)], lastMs: 0, format: format, on: stopPlayer)
    }

    func stop() { player.stop() }

    private func render(_ clicks: [(Double, [Float])], lastMs: Double, format: AVAudioFormat, on node: AVAudioPlayerNode) {
        let rate = format.sampleRate
        let frames = AVAudioFrameCount(rate * (lastMs / 1000 + 0.03))
        guard let buffer = AVAudioPCMBuffer(pcmFormat: format, frameCapacity: frames),
              let out = buffer.floatChannelData?[0] else { return }
        buffer.frameLength = frames
        for i in 0..<Int(frames) { out[i] = 0 }
        for (ms, tick) in clicks {
            let start = Int(ms / 1000 * rate)
            for j in 0..<tick.count where start + j < Int(frames) { out[start + j] += tick[j] }
        }
        node.stop()
        node.scheduleBuffer(buffer, at: nil, options: .interrupts)
        node.play()
    }

    private static let modes: [(Float, Float, Float)] = [(1900, 0.0024, 1), (3400, 0.0015, 0.55), (6100, 0.0008, 0.3)]

    private static func renderTick(rate: Float, level: Float, tune: Float) -> [Float] {
        (0..<Int(rate * 0.02)).map { i in
            let t = Float(i) / rate
            var tick: Float = 0
            for (hz, decay, gain) in modes { tick += gain * sinf(2 * .pi * hz * tune * t) * expf(-t / decay) }
            tick += Float.random(in: -1...1) * 0.5 * expf(-t / 0.0003)
            return tick * level * 2.2
        }
    }
}

// ClockDial.swift — Detent
// A frosted clock tile you set like a real clock. Drag around the face and the minute hand turns through the setting
// train: it gives a little, then a jumper spring drops it into the next minute with a tiny click, a firmer one every
// five minutes. The hour hand follows through the 12:1 gearing. The display window at 6 o'clock is digital: its digits
// switch instantly, and its orange lamp lights for PM. The A/P pusher in the case corner turns the 24-hour wheel half
// a turn. Hour indices and the minute hand carry luminous paint, which glows in dark mode. iOS / iPadOS 17+.
//
// Usage:
//   @State private var time = 4 * 60 + 45      // minutes since midnight, 0..<1440
//   ClockDial(time: $time)
//   ClockDial(time: $time, size: 200, tone: .dark)

import SwiftUI
import UIKit
import AVFoundation

public struct ClockDial: View {
    @Binding private var time: Int
    private let size: CGFloat
    private let lume: Color
    private let tone: ColorScheme?
    private let sound: Bool

    public init(time: Binding<Int>,
                size: CGFloat = 240,
                lume: Color = Color(red: 0.56, green: 0.85, blue: 0.36),
                tone: ColorScheme? = nil,
                sound: Bool = true) {
        _time = time
        self.size = size
        self.lume = lume
        self.tone = tone
        self.sound = sound
    }

    @State private var hand: Int?               // where the minute hand points, in whole minutes; never wraps
    @State private var raw: Double?             // the finger's position while it turns the train
    @State private var lastAngle: Double?
    @State private var keyDown = false
    @FocusState private var focused: Bool
    @Environment(\.colorScheme) private var scheme
    @Environment(\.accessibilityReduceMotion) private var reduceMotion

    private var p: Palette { Palette(dark: (tone ?? scheme) == .dark) }
    private var minuteHand: Int { hand ?? mod(time, 720) }
    // Between minutes the jumper spring holds the train, so the hand only gives a little until it drops into the next.
    private var shown: Double {
        guard let raw else { return Double(minuteHand) }
        return Double(minuteHand) + (raw - Double(minuteHand)) * 0.3
    }
    private var u: CGFloat { size / 200 }
    private var pm: Bool { time >= 720 }

    public var body: some View {
        ZStack {
            tile
            Face(u: u, lume: lume, p: p)
            readout.offset(y: size * 0.185)
            // The hour hand is geared to the minute hand, 12:1. Shadows are added after the rotation,
            // so they always fall straight down while the hands turn.
            Hand(u: u, from: 108, to: 60, edge: 6.5, fill: 5, lume: nil, p: p)
                .rotationEffect(.degrees(shown / 2))
                .shadow(color: .black.opacity(p.drop), radius: 1.1 * u, y: 1.6 * u)
            Hand(u: u, from: 110, to: 38, edge: 7, fill: 5.5, lume: lume, p: p)
                .rotationEffect(.degrees(shown * 6))
                .shadow(color: .black.opacity(p.drop), radius: 1.1 * u, y: 1.6 * u)
            Circle().fill(p.hand).overlay(Circle().strokeBorder(p.capEdge, lineWidth: u))
                .frame(width: 12 * u, height: 12 * u)
        }
        .frame(width: size, height: size)
        .contentShape(RoundedRectangle(cornerRadius: size * 0.26, style: .continuous))
        .gesture(turnGesture)
        .overlay(alignment: .bottomTrailing) { apKey.padding(.trailing, size * 0.07).padding(.bottom, size * 0.07) }
        .focusable()
        .focused($focused)
        .onKeyPress(keys: [.upArrow, .rightArrow, .downArrow, .leftArrow]) { press in
            nudge(press.key == .upArrow || press.key == .rightArrow ? 1 : -1)
            return .handled
        }
        .onKeyPress(characters: CharacterSet(charactersIn: "apAP")) { press in
            if (press.characters.lowercased() == "a") == pm { flip() }
            return .handled
        }
        .onChange(of: time) { _, t in
            // Set from outside: move the hands to the nearest matching position.
            let h = minuteHand, r = mod(t, 720)
            if mod(h, 720) != r { hand = r + Int((Double(h - r) / 720).rounded()) * 720 }
        }
        .accessibilityElement()
        .accessibilityLabel("Time")
        .accessibilityValue(spoken)
        .accessibilityAdjustableAction { direction in
            switch direction {
            case .increment: nudge(1)
            case .decrement: nudge(-1)
            @unknown default: break
            }
        }
    }

    // Frosted acrylic, lit from above: a bright top rim, a soft sheen at the top, a contact shadow and a cast shadow.
    // It never lifts.
    private var tile: some View {
        let shape = RoundedRectangle(cornerRadius: size * 0.26, style: .continuous)
        return shape
            .fill(LinearGradient(colors: [p.tileTop, p.tileBottom], startPoint: .top, endPoint: .bottom))
            .overlay(shape.fill(RadialGradient(colors: [p.sheen, .clear], center: UnitPoint(x: 0.5, y: -0.08),
                                               startRadius: 0, endRadius: size * 0.75)))
            .overlay(shape.strokeBorder(LinearGradient(colors: [p.rim, .clear], startPoint: .top, endPoint: .center), lineWidth: 1))
            .shadow(color: p.contact, radius: 1, y: 1)
            .shadow(color: p.cast, radius: 18, y: 16)
    }

    // A digital display window set into the dial at 6 o'clock, under the hands, like an ana-digi watch.
    // Its digits and the PM lamp switch instantly, with no animation.
    private var readout: some View {
        HStack(spacing: size * 0.024) {
            Text(String(format: "%02d", mod(time / 60, 12) == 0 ? 12 : mod(time / 60, 12))).foregroundStyle(p.dim)
            Text(String(format: "%02d", time % 60)).fontWeight(.semibold).foregroundStyle(p.ink)
            Circle()
                .fill(pm ? Color(red: 1, green: 0.58, blue: 0) : p.ledOff)
                .shadow(color: pm ? Color(red: 1, green: 0.58, blue: 0).opacity(0.6) : .clear, radius: size * 0.01)
                .frame(width: size * 0.02, height: size * 0.02)
                .padding(.leading, size * 0.014)
        }
        .font(.system(size: size * 0.068, design: .monospaced).monospacedDigit())
        .padding(.horizontal, size * 0.045)
        .frame(height: size * 0.11)
        .background(Capsule().fill(p.chip.shadow(.inner(color: .black.opacity(p.chipShadow * 1.5), radius: 1.5, y: 1))))
        .transaction { $0.animation = nil }
        .allowsHitTesting(false)
    }

    // A two-position pusher set into the case corner, clear of the dial. It latches at the bottom of its travel,
    // so it switches on the press.
    // A press sinks it a hair with a tighter shadow; nothing happens on hover.
    private var apKey: some View {
        Text(pm ? "P" : "A")
            .font(.system(size: size * 0.06, design: .monospaced))
            .foregroundStyle(p.ink)
            .frame(width: size * 0.11, height: size * 0.11)
            .background(chip.shadow(color: .black.opacity(keyDown ? 0.06 : 0), radius: 1, y: 0.5))
            .scaleEffect(keyDown ? 0.994 : 1)
            .offset(y: keyDown ? 0.5 : 0)
            .transaction { $0.animation = nil }
            .contentShape(Circle())
            .gesture(DragGesture(minimumDistance: 0)
                .onChanged { _ in
                    guard !keyDown else { return }
                    keyDown = true
                    flip()
                }
                .onEnded { _ in keyDown = false })
            .accessibilityElement()
            .accessibilityLabel(pm ? "PM" : "AM")
            .accessibilityHint("Switches between AM and PM")
            .accessibilityAddTraits(.isButton)
            .accessibilityAction { flip() }
    }

    private var chip: some View {
        Capsule().fill(.ultraThinMaterial)
            .overlay(Capsule().fill(p.chip))
            .overlay(Capsule().strokeBorder(LinearGradient(colors: [p.rim, .clear], startPoint: .top, endPoint: .center), lineWidth: 1))
            .shadow(color: .black.opacity(keyDown ? 0 : p.chipShadow), radius: 4, y: 2)
            .environment(\.colorScheme, p.dark ? .dark : .light)
    }

    private var turnGesture: some Gesture {
        DragGesture(minimumDistance: 0)
            .onChanged { g in
                let dx = g.location.x - size / 2, dy = g.location.y - size / 2
                guard hypot(dx, dy) > 8 else { return }          // too close to the arbor to read an angle
                let a = atan2(dy, dx) * 180 / .pi
                if raw == nil { raw = Double(minuteHand); Feedback.shared.prepare() }
                if let last = lastAngle {
                    var d = a - last
                    if d > 180 { d -= 360 } else if d < -180 { d += 360 }
                    let r = (raw ?? Double(minuteHand)) + d / 6
                    raw = r
                    step(to: Int(r.rounded()))
                }
                lastAngle = a
            }
            .onEnded { _ in
                lastAngle = nil
                // Let go between minutes and the jumper pulls the hand back into the one it's in. Nothing coasts.
                withAnimation(reduceMotion ? nil : .timingCurve(0.2, 0, 0.3, 1, duration: 0.08)) { raw = nil }
            }
    }

    // A step from the keys: the jumper throws the train into the next minute, accelerating, then it stops dead.
    private func nudge(_ dir: Int) {
        withAnimation(reduceMotion ? nil : .timingCurve(0.55, 0, 1, 1, duration: 0.06)) { step(to: minuteHand + dir) }
    }

    private func step(to n: Int) {
        let from = minuteHand
        guard n != from else { return }
        let dir = n > from ? 1 : -1, before = time
        var five = false, k = from + dir
        while k != n + dir { if mod(k, 5) == 0 { five = true }; k += dir }
        let next = mod(time + n - from, 1440)
        hand = n
        time = next
        // Passing midnight or noon also turns the 24-hour wheel, so its flag drops with a firmer clack.
        if (before < 720) != (next < 720) { Feedback.shared.play(.flag, sound: sound) }
        else { Feedback.shared.play(five ? .five : .minute, sound: sound) }
    }

    private func flip() {
        time = mod(time + 720, 1440)
        Feedback.shared.play(.latch, sound: sound)
    }

    private var spoken: String {
        let h = mod(time / 60, 12) == 0 ? 12 : mod(time / 60, 12)
        return String(format: "%d:%02d %@", h, time % 60, pm ? "PM" : "AM")
    }
}

private func mod(_ n: Int, _ m: Int) -> Int { ((n % m) + m) % m }

/// The look, as tokens. Light from above; every highlight belongs to the room, never to a moving part.
private struct Palette {
    let dark: Bool
    private func w(_ v: Double, _ a: Double = 1) -> Color { Color(white: v, opacity: a) }
    var tileTop: Color { dark ? w(0.18) : w(0.99) }
    var tileBottom: Color { dark ? w(0.1) : w(0.89) }
    var sheen: Color { dark ? w(1, 0.04) : w(1, 0.55) }
    var rim: Color { dark ? w(1, 0.12) : w(1) }
    var contact: Color { .black.opacity(dark ? 0.6 : 0.15) }
    var cast: Color { .black.opacity(dark ? 0.6 : 0.22) }
    var ray: Color { dark ? w(1, 0.045) : w(0, 0.05) }
    var minute: Color { dark ? w(0.37) : w(0.65) }
    var index: Color { dark ? w(0.28) : w(0.79) }
    var number: Color { dark ? w(0.44) : w(0.6) }
    var hand: Color { dark ? w(0.24) : w(1) }
    var handEdge: Color { dark ? w(0.08) : w(0.76) }
    var capEdge: Color { dark ? w(0.35) : w(0.81) }
    var drop: Double { dark ? 0.55 : 0.22 }
    var glow: Double { dark ? 0.5 : 0 }     // luminous paint only shows its glow once the room is dark
    var chip: Color { dark ? Color(red: 0.23, green: 0.23, blue: 0.25).opacity(0.6) : w(1, 0.65) }
    var chipShadow: Double { dark ? 0.4 : 0.1 }
    var dim: Color { dark ? w(0.53) : w(0.56) }

    var ledOff: Color { dark ? w(1, 0.08) : w(0, 0.1) }
}

/// The printed face: faint rays, minute marks, numerals, and the hour indices: an applied frame filled with luminous paint.
private struct Face: View {
    let u: CGFloat
    let lume: Color
    let p: Palette
    var body: some View {
        ZStack {
            Canvas { ctx, size in
                ctx.translateBy(x: size.width / 2, y: size.height / 2)
                for i in stride(from: 0, to: 60, by: 5) {
                    var c = ctx
                    c.rotate(by: .degrees(Double(i) * 6))
                    c.stroke(line(-78.5, -67.5), with: .color(lume), style: StrokeStyle(lineWidth: 4 * u, lineCap: .round))
                }
            }
            .blur(radius: 1.6 * u)
            .opacity(p.glow)
            Canvas { ctx, size in
                ctx.translateBy(x: size.width / 2, y: size.height / 2)
                for h in 0..<12 {
                    var c = ctx
                    c.rotate(by: .degrees(Double(h) * 30))
                    c.stroke(line(0, -66), with: .color(p.ray), lineWidth: 0.6 * u)
                }
                for i in 0..<60 {
                    var c = ctx
                    c.rotate(by: .degrees(Double(i) * 6))
                    if i % 5 != 0 {
                        c.stroke(line(-78, -71), with: .color(p.minute), style: StrokeStyle(lineWidth: 1.5 * u, lineCap: .round))
                    } else {
                        c.stroke(line(-80, -66), with: .color(p.index), style: StrokeStyle(lineWidth: 5 * u, lineCap: .round))
                        c.stroke(line(-78.5, -67.5), with: .color(lume), style: StrokeStyle(lineWidth: 2 * u, lineCap: .round))
                    }
                }
                for h in 1...12 {
                    var c = ctx
                    c.rotate(by: .degrees(Double(h) * 30))
                    c.draw(Text("\(h)").font(.system(size: 10 * u, design: .monospaced)).foregroundStyle(p.number),
                           at: CGPoint(x: 0, y: -89.5 * u))
                }
            }
        }
    }
    private func line(_ y1: CGFloat, _ y2: CGFloat) -> Path {
        var path = Path()
        path.move(to: CGPoint(x: 0, y: y1 * u))
        path.addLine(to: CGPoint(x: 0, y: y2 * u))
        return path
    }
}

/// A hand pointing at 12, drawn in the 200-unit face space: a pale body with a darker edge, and an optional lume strip.
private struct Hand: View {
    let u: CGFloat
    let from: CGFloat, to: CGFloat, edge: CGFloat, fill: CGFloat
    let lume: Color?
    let p: Palette
    var body: some View {
        ZStack {
            Canvas { ctx, size in
                let x = size.width / 2
                func seg(_ a: CGFloat, _ b: CGFloat) -> Path {
                    var path = Path()
                    path.move(to: CGPoint(x: x, y: a * u)); path.addLine(to: CGPoint(x: x, y: b * u))
                    return path
                }
                ctx.stroke(seg(from, to), with: .color(p.handEdge), style: StrokeStyle(lineWidth: edge * u, lineCap: .round))
                ctx.stroke(seg(from, to), with: .color(p.hand), style: StrokeStyle(lineWidth: fill * u, lineCap: .round))
                if let lume {
                    ctx.drawLayer { glow in
                        glow.opacity = p.glow
                        glow.addFilter(.blur(radius: 1.6 * u))
                        glow.stroke(seg(72, 48), with: .color(lume), style: StrokeStyle(lineWidth: 4 * u, lineCap: .round))
                    }
                    ctx.stroke(seg(72, 48), with: .color(lume), style: StrokeStyle(lineWidth: 2 * u, lineCap: .round))
                }
            }
        }
    }
}

/// Haptics paired with each sound: a light tick per minute, firmer every five, a firm clack when the day half turns.
@MainActor private final class Feedback {
    static let shared = Feedback()
    private let rigid = UIImpactFeedbackGenerator(style: .rigid)
    private let synth = ClickSynth()

    func prepare() { rigid.prepare() }
    func play(_ voice: ClickSynth.Voice, sound: Bool) {
        let strength: [ClickSynth.Voice: CGFloat] = [.minute: 0.4, .five: 0.65, .flag: 0.9, .latch: 0.8]
        rigid.impactOccurred(intensity: strength[voice] ?? 0.5)
        rigid.prepare()
        if sound { synth.play(voice) }
    }
}

/// Small hard parts can't make a pitched thump: they ring for a millisecond or two at a few high body modes.
private final class ClickSynth {
    enum Voice: CaseIterable { case minute, five, flag, latch }
    private let engine = AVAudioEngine()
    private let player = AVAudioPlayerNode()
    private var buffers: [Voice: AVAudioPCMBuffer] = [:]
    private var ready = false

    init() {
        guard let format = AVAudioFormat(standardFormatWithSampleRate: 44_100, channels: 1) else { return }
        engine.attach(player)
        engine.connect(player, to: engine.mainMixerNode, format: format)
        for voice in Voice.allCases { buffers[voice] = Self.render(voice, format: format) }
        // Ambient: respects the silent switch and mixes with the user's music.
        try? AVAudioSession.sharedInstance().setCategory(.ambient, options: [.mixWithOthers])
        ready = (try? engine.start()) != nil
    }

    func play(_ voice: Voice) {
        guard ready, let buffer = buffers[voice] else { return }
        player.scheduleBuffer(buffer, at: nil, options: .interrupts)
        if !player.isPlaying { player.play() }
    }

    private static let modes: [(Float, Float, Float)] = [(1900, 0.0024, 1), (3400, 0.0015, 0.55), (6100, 0.0008, 0.3)]

    private static func render(_ voice: Voice, format: AVAudioFormat) -> AVAudioPCMBuffer? {
        // (start time, level, tuning) for each tick
        let ticks: [(Float, Float, Float)]
        switch voice {
        case .minute: ticks = [(0, 0.05, 1.35)]                          // the jumper dropping into a minute
        case .five: ticks = [(0, 0.07, 1.2)]                             // a deeper notch every five minutes
        case .flag: ticks = [(0, 0.12, 0.95), (0.006, 0.035, 1.25)]      // the 24-hour wheel's flag drops, then settles
        case .latch: ticks = [(0, 0.07, 1.08), (0.009, 0.16, 1)]         // the push button's latch lets go, then lands
        }
        let rate = Float(format.sampleRate)
        let frames = AVAudioFrameCount(rate * 0.03)
        guard let buffer = AVAudioPCMBuffer(pcmFormat: format, frameCapacity: frames),
              let out = buffer.floatChannelData?[0] else { return nil }
        buffer.frameLength = frames
        for i in 0..<Int(frames) {
            let t = Float(i) / rate
            var sample: Float = 0
            for (start, level, tune) in ticks where t >= start {
                let local = t - start
                var tick: Float = 0
                for (hz, decay, gain) in modes { tick += gain * sinf(2 * .pi * hz * tune * local) * expf(-local / decay) }
                tick += Float.random(in: -1...1) * 0.5 * expf(-local / 0.0003)   // the contact itself
                sample += tick * level
            }
            out[i] = sample * 2.2
        }
        return buffer
    }
}

    const want = location.hash || (firstRoute ? document.querySelector('meta[name="detent-route"]')?.content || '' : '');
    firstRoute = false;
    const p = PARTS.find(x => '#' + x.tag === want);
    if (p) {
      if (!home.hidden) homeScroll = scrollY;
      home.hidden = true; detail.hidden = false; document.body.classList.add('ondetail'); renderDetail(p);
      document.title = `${p.name}: a tactile ${p.kind.toLowerCase()} for the web and SwiftUI · Detent`; scrollTo(0, 0);
      detail.querySelector('h1').focus({ preventScroll: true });
    } else {
      detailHook = null; detail.hidden = true; detail.innerHTML = ''; home.hidden = false; document.body.classList.remove('ondetail'); document.title = 'Detent: tactile dials, knobs and switches for the web and SwiftUI';
      if (location.hash === '#install') document.getElementById('install').scrollIntoView(); else scrollTo(0, homeScroll);
    }
  };
  addEventListener('hashchange', route);
  route();

  // One switch for the whole page: it starts from the system setting, then flips between light and dark. The controls follow the page.
  {
    const btn = document.getElementById('thm'), mq = matchMedia('(prefers-color-scheme: dark)');
    let mode = null;
    try { const v = localStorage.getItem('detent-theme'); if (v === 'light' || v === 'dark') mode = v; } catch {}
    const current = () => mode || (mq.matches ? 'dark' : 'light');
    const paint = () => {
      if (mode) document.documentElement.setAttribute('data-theme', mode); else document.documentElement.removeAttribute('data-theme');
      btn.dataset.mode = current();
      btn.setAttribute('aria-label', current() === 'dark' ? 'Switch to light' : 'Switch to dark');
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', current() === 'dark' ? '#0b0b0c' : '#f6f6f5');
    };
    btn.addEventListener('click', () => { mode = current() === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('detent-theme', mode); } catch {} paint(); });
    mq.addEventListener('change', paint);
    paint();
  }

  const bindToggle = (id, key) => {
    const b = document.getElementById(id);
    try { const v = localStorage.getItem('detent-porcelain-' + key); if (v !== null) Feel.state[key] = v === '1'; } catch {}
    const paint = () => b.setAttribute('aria-pressed', Feel.state[key]);
    b.addEventListener('click', () => { Feel.state[key] = !Feel.state[key]; paint(); try { localStorage.setItem('detent-porcelain-' + key, Feel.state[key] ? '1' : '0'); } catch {} if (Feel.state[key]) Feel.fire('encoder'); });
    paint();
  };
  bindToggle('snd', 'sound'); bindToggle('hap', 'haptics');
})();
</script>
