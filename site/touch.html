  box-shadow: inset 0 .5px 0 #0006 }
.cup { position: absolute; left: 50%; bottom: 12%; width: 10.5%; aspect-ratio: 1; translate: -50% 0; border-radius: 50%;

  html(el) {

      const a = (el.angleOf(i + 1) - 90) * Math.PI / 180;

    }).join('');

<script id="src-selector-look-pedal">
/* Selector look "pedal": a matte grey plastic cap with a printed pointer line, sitting in a fixed recessed seat,
   with the position numbers printed on the panel around it. Below, the printed name; hover or turn to read the
   position, which rolls like an odometer. Dark tone: the same cap on a black panel, with a deeper seat and light
   ink. --dial-accent colors the pointer line. */
DetentSelector.look('pedal', (() => {
  // Each digit column holds 0-9 three times over, so it can roll past 9 or 0 either way, then quietly re-centers.
  function place(col, pos, animate) {
    col._pos = pos;
    col.style.transition = animate ? '' : 'none';
    col.style.transform = `translateY(${8 - pos * 16}px)`;
    if (!animate) return;
    col.classList.add('moving');
    clearTimeout(col._t);
    col._t = setTimeout(() => {
      col.classList.remove('moving');
      if (col._pos >= 10 && col._pos < 20) return;
      place(col, 10 + ((col._pos % 10) + 10) % 10, false);
    }, 190);
  }
  // Digits roll up when the value rises and down when it falls. Leading zeros are there but hidden.
  function roll(ls, text, dir) {
    const el = ls.val, lead = text.search(/[1-9]|\d$/);
    if (ls.shape !== text.length) {
      ls.shape = text.length;
      el.innerHTML = [...text].map(() => `<b class="col"><i>${'0123456789'.repeat(3).split('').join('</i><i>')}</i></b>`).join('');
      [...el.children].forEach((col, i) => { col.classList.toggle('lead', i < lead); place(col, 10 + +text[i], false); });
      return;
    }
    [...el.children].forEach((col, i) => {
      col.classList.toggle('lead', i < lead);
      const cur = ((col._pos % 10) + 10) % 10;
      let step = ((+text[i] - cur) % 10 + 10) % 10; // forward distance on the wheel
      if (!step) return;
      if (dir < 0) step -= 10;
      place(col, col._pos + step, true);
    });
  }
  return {
    css: `
.t { --knob: #4a4a4a; --ink: #2b2b2b; --print: #5a5a58; --trail: #2b2b2b38; --seat: #0000000f; --seat-sh: inset 0 1px 2px #00000029, 0 1px 0 #ffffffb3;
  --cap-sh: inset 0 1px 0 #ffffff1f, inset 0 -1px 1px #00000066, 0 0 0 .5px #0000004d, 0 1px 1.5px #00000047, 0 3px 6px -2px #00000033, 0 10px 16px -8px #00000047;
  --cap-dn: inset 0 1px 0 #ffffff1f, inset 0 -1px 1px #00000066, 0 0 0 .5px #0000004d, 0 .5px 1px #00000052, 0 2px 4px -2px #00000033, 0 6px 10px -6px #00000047 }
.t.dark { --knob: #4e4e50; --ink: #d4d4d0; --print: #a6a6a2; --trail: #d4d4d038; --seat: #00000066; --seat-sh: inset 0 1px 2px #000000d9, 0 1px 0 #ffffff14;
  --cap-sh: inset 0 1px 0 #ffffff2b, inset 0 -1px 1px #00000099, 0 0 0 .5px #000000b3, 0 1px 1.5px #000000a6, 0 3px 6px -2px #00000080, 0 10px 16px -8px #000000b3;
  --cap-dn: inset 0 1px 0 #ffffff2b, inset 0 -1px 1px #00000099, 0 0 0 .5px #000000b3, 0 .5px 1px #000000bf, 0 2px 4px -2px #00000080, 0 6px 10px -6px #000000b3 }
/* Position numbers printed on the panel. Print never changes; the pointer line says which one is selected. */
.nums i { position: absolute; translate: -50% -50%; font: 500 calc(var(--s) * .068)/1 "Geist", system-ui, sans-serif; font-style: normal;
  color: var(--print); font-variant-numeric: tabular-nums }
/* The seat: a shallow recess in the panel the knob sits in. Always there; the knob sinks into it, the seat never moves. */
.seat { position: absolute; inset: 17%; border-radius: 50%; background: var(--seat); box-shadow: var(--seat-sh) }
/* Matte plastic cap, lit from above, sitting in the seat with a contact shadow. */
.cap { position: absolute; inset: 4.5%; border-radius: 50%;
  background: radial-gradient(circle at 50% 28%, color-mix(in srgb, var(--knob), #fff 9%), var(--knob) 58%, color-mix(in srgb, var(--knob), #000 18%));
  box-shadow: var(--cap-sh) }
.cap.down { box-shadow: var(--cap-dn) }
/* A printed pointer line on the top face. */
.rot::after { content: ""; position: absolute; left: 50%; top: 7%; width: 2.2%; min-width: 2px; height: 22%; translate: -50% 0; border-radius: 2px; background: var(--dial-accent, #fff) }
:host(:focus-visible) .seat { outline: 2px solid var(--knob); outline-offset: 3px }
.l { position: relative; height: 16px; min-width: 8ch; font: 500 13px/16px "Geist", system-ui, sans-serif; color: var(--ink); text-align: center }
.l span { position: absolute; inset: 0; transition: opacity .15s }
.val { opacity: 0; display: flex; justify-content: center; overflow: hidden; inset: -8px -6px !important; padding: 0 6px;
  /* Fully hides the neighbouring digits at rest, but lets the blur trail fade out instead of being cut. */
  -webkit-mask: linear-gradient(transparent 6px, #000 10px, #000 calc(100% - 10px), transparent calc(100% - 6px));
  mask: linear-gradient(transparent 6px, #000 10px, #000 calc(100% - 10px), transparent calc(100% - 6px));
  font-family: "Geist Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums }
/* Rolling digits: each digit is a column of 0-9 that slides to its value, blurred along the motion while it moves. */
.val b { display: block; font-weight: inherit }
.val .col { transition: transform .18s cubic-bezier(.2,.7,.3,1) }
.val .col i { display: block; height: 16px; font-style: normal }
.val .col.lead { opacity: 0; width: 0; transition: transform .18s cubic-bezier(.2,.7,.3,1), opacity .18s }
.val .col.moving i { filter: blur(.5px); text-shadow: 0 5px 2.5px var(--trail), 0 -5px 2.5px var(--trail) }
:host(:hover) .name, :host(:focus-visible) .name, .l.show .name { opacity: 0 }
:host(:hover) .val, :host(:focus-visible) .val, .l.show .val { opacity: 1 }
@media (prefers-reduced-motion: reduce) { .l span, .val .col { transition: none } .val .col.moving i { filter: none; text-shadow: none } }
`,
    html(el) {
      const nums = Array.from({ length: el.steps }, (_, i) => {
        const a = (el.angleOf(i + 1) - 90) * Math.PI / 180;
        return `<i style="left:${50 + 43 * Math.cos(a)}%;top:${50 + 43 * Math.sin(a)}%">${i + 1}</i>`;
      }).join('');
      return `<div class="k"><div class="nums" aria-hidden="true">${nums}</div><div class="seat"><div class="cap" data-press><div class="rot"></div></div></div></div><div class="l"><span class="name">${el.name}</span><span class="val"></span></div>`;
    },
    setup(root, el) { el.ls.val = root.querySelector('.val'); el.ls.l = root.querySelector('.l'); },
    hold(root, el, on) { el.ls.l.classList.toggle('show', on); },
    paint(root, el) {
      const n = el.v;
      roll(el.ls, String(n).padStart(String(el.steps).length, '0'), Math.sign(n - (el.ls.shown ?? n)));
      el.ls.shown = n;
    }
  };
})());
</script>

<script id="src-selector-look-nothing">
/* Selector look "nothing": Nothing's flat widget language. A flat round tile with a dot printed at each position;
   the dot at the current position is red (the only accent, and only for the live state). In the middle, the
   position number in dot-matrix with its unused leading digit left unlit, and the name in small Geist Mono.
   No dome, texture, shadow or pointer; nothing turns or glows. Dots and digits switch instantly. Light tone: a
   white tile with black dots. Dark tone: a black tile with white dots. --dial-accent is the position dot. */
DetentSelector.look('nothing', {
  css: `
.t { --tile: #ecebe6; --edge: #00000014; --on: #1b1b1b; --digits: #1b1b1b; --unlit: #d9d8d2; --label: #8a8a85 }
.t.dark { --tile: #0b0b0b; --edge: #ffffff14; --on: #f2f2f2; --digits: #f2f2f2; --unlit: #2e2e2e; --label: #7c7c7c }
.tile { position: absolute; inset: 0; border-radius: 50%; background: var(--tile); box-shadow: inset 0 0 0 1px var(--edge) }
.dots i { position: absolute; width: 4.4%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; background: var(--on) }
.dots i.head { background: var(--dial-accent, #d71921) }
.read { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; pointer-events: none }
.n { font: 800 calc(var(--s) * .3)/1 "Doto", "Geist Mono", monospace; color: var(--digits); letter-spacing: -.02em; font-variant-numeric: tabular-nums }
.n b { color: var(--unlit); font-weight: inherit }
.lab { margin-top: 8px; font: 400 calc(var(--s) * .055)/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .16em; color: var(--label); text-transform: uppercase }
:host(:focus-visible) .tile { outline: 2px solid var(--dial-accent, #d71921); outline-offset: 3px }
`,
  html(el) {
    const dots = Array.from({ length: el.steps }, (_, i) => {
      const a = (el.angleOf(i + 1) - 90) * Math.PI / 180;
      return `<i style="left:${50 + 41 * Math.cos(a)}%;top:${50 + 41 * Math.sin(a)}%"></i>`;
    }).join('');
    return `<div class="k"><div class="tile" data-press></div><div class="dots">${dots}</div><div class="read"><div class="n"></div><div class="lab">${el.name}</div></div></div>`;
  },
  setup(root, el) { el.ls.dots = [...root.querySelectorAll('.dots i')]; el.ls.n = root.querySelector('.n'); },
  paint(root, el) {
    el.ls.dots.forEach((d, i) => { d.className = i === el.v - 1 ? 'head' : ''; });
    const s = String(el.v).padStart(Math.max(2, String(el.steps).length), '0'), lead = s.match(/^0*(?=\d)/)[0];

<script id="src-selector-look-aqua">
/* Selector look "aqua": a candy-glass knob, like early Mac OS X, over a printed pip at each position. The pip at
   the current position is lit blue from behind the panel. The glass blurs and tints what is under it. Its specular
   highlight and the caustic it throws on the panel come from the room light above, so neither turns; only the
   etched mark inside the glass turns. A small Geist label below names the switch and its position.
   --dial-accent colors the current pip. */
DetentSelector.look('aqua', {
  css: `
.t { --pip: #00000017; --fill: var(--dial-accent, #0a7cff); --mark: #1d1d1fcc; --spec: #ffffffd9; --caustic: #ffffffb3; --ink: #6e6e73;
  --glass: linear-gradient(170deg, #ffffff59, #ffffff0f 55%, #ffffff2e);
  --glass-sh: inset 0 1px 0 #ffffffe6, inset 0 -1.5px 1px #ffffff99, inset 0 0 0 .5px #ffffffb3, inset 0 -12px 20px -12px #ffffff80, 0 0 0 .5px #0000001a, 0 1px 2px #0000001f, 0 12px 24px -10px #00000040;
  --glass-dn: inset 0 1px 0 #ffffffe6, inset 0 -1.5px 1px #ffffff99, inset 0 0 0 .5px #ffffffb3, inset 0 -12px 20px -12px #ffffff80, 0 0 0 .5px #0000001a, 0 .5px 1px #00000029, 0 7px 16px -8px #00000040 }
.t.dark { --pip: #ffffff17; --fill: var(--dial-accent, #0a84ff); --mark: #f5f5f7; --spec: #ffffff52; --caustic: #ffffff2e; --ink: #98989d;
  --glass: linear-gradient(170deg, #ffffff2e, #ffffff0a 55%, #ffffff17);
  --glass-sh: inset 0 1px 0 #ffffff8c, inset 0 -1.5px 1px #ffffff40, inset 0 0 0 .5px #ffffff38, inset 0 -12px 20px -12px #ffffff2e, 0 0 0 .5px #000, 0 1px 2px #000000a6, 0 12px 24px -10px #000000cc;
  --glass-dn: inset 0 1px 0 #ffffff8c, inset 0 -1.5px 1px #ffffff40, inset 0 0 0 .5px #ffffff38, inset 0 -12px 20px -12px #ffffff2e, 0 0 0 .5px #000, 0 .5px 1px #000000bf, 0 7px 16px -8px #000000cc }
svg { position: absolute; inset: 0; width: 100%; height: 100% }
/* A pip at each position, printed into the panel; the current one is lit blue from behind. */
line { stroke: var(--pip); stroke-width: 8; stroke-linecap: round }
line.on { stroke: var(--fill) }
/* Light from above passes through the lens and lands as a soft bright crescent on the panel below it. */
.caustic { position: absolute; left: 28%; right: 28%; top: 80%; height: 10%; border-radius: 50%;
  background: radial-gradient(closest-side, var(--caustic), transparent); pointer-events: none }
.glass { position: absolute; inset: 15%; border-radius: 50%; background: var(--glass); box-shadow: var(--glass-sh);
  -webkit-backdrop-filter: blur(1.5px) saturate(1.8); backdrop-filter: blur(1.5px) saturate(1.8) }
.glass.down { box-shadow: var(--glass-dn) }
/* Glass doesn't sink under the finger; only its shadow tightens. */
.glass[data-press].down { translate: none; scale: none }
/* The specular: the room light reflected in the top of the dome. */
.glass::before { content: ""; position: absolute; inset: 3% 16% 60%; border-radius: 50%; background: linear-gradient(var(--spec), transparent); z-index: 1; pointer-events: none }
/* The mark: etched into the glass, so it turns. */
.mark { position: absolute; left: 50%; top: 8%; width: 3.2%; height: 14%; translate: -50% 0; border-radius: 9px; background: var(--mark) }
.lab { font: 500 12px/1 "Geist", system-ui, sans-serif; letter-spacing: .02em; color: var(--ink); font-variant-numeric: tabular-nums }
:host(:focus-visible) .glass { outline: 2px solid var(--fill); outline-offset: 4px }
`,
  html(el) {
    const pips = Array.from({ length: el.steps }, (_, i) =>
      `<line transform="rotate(${el.angleOf(i + 1)} 100 100)" x1="100" y1="10" x2="100" y2="18"/>`).join('');
    return `<div class="k"><svg viewBox="0 0 200 200" aria-hidden="true">${pips}</svg>` +
      `<i class="caustic"></i><div class="glass" data-press><div class="rot"><i class="mark"></i></div></div></div><span class="lab"></span>`;
  },
  setup(root, el) { el.ls.pips = [...root.querySelectorAll('line')]; el.ls.lab = root.querySelector('.lab'); },
  paint(root, el) {
    el.ls.pips.forEach((p, i) => p.classList.toggle('on', i === el.v - 1));
    el.ls.lab.textContent = `${el.name} ${el.v}`;
  }
});
</script>

<script id="src-slot">
/* <detent-slot look="original" tone="auto" label="mode" options="opt a,opt b,opt c,opt d" value="1"> — a vertical slide
   selector switch. A cap rides over a slot with a spring detent at each position: push and it gives a little, then
   snaps over center into the next one with a click, and stops hard at both ends. Options run from the bottom up.
   Drag the cap, press beside it in the slot, tap a label, or use the arrow keys (Home/End run to the ends; once it
   has focus the wheel moves it too). .value is the selected option, .index its position (0 = bottom); value="1"
   takes an index or an option name. Fires "input" on every position, "change" when you let go. disabled dims it.
   --row sets the spacing. Needs Feel and at least one look.
   tone: "light" or "dark" forces one; otherwise it follows the nearest [data-tone], the page's data-theme,
   then prefers-color-scheme. The look is a separate module: DetentSlot.look(name, { css, html, setup, hold, paint }).
   Look contract:
   - html(el) must contain a .track (the pointer surface, exactly el.n rows of --row tall: no vertical padding or
     border; row 0 is at the bottom) holding a .cap (the part that slides). BASE positions the cap's center on its
     row and runs its snap; the cap gets .snap / .back while it's thrown or pulled back, and .down while pressed
     (or [data-press] gets .down instead, if the look has one).
   - Optional .opts holding button[data-i] labels: tapping one runs the cap there.
   - Every element with data-i gets .on when it is the selected position. It switches instantly.
   - On the host: --n (positions), --i (selected index), --give (px the cap is pushed against its detent), --row.
   - el.opts (the option names), el.n, el.name (the label), DetentSlot.esc(text) for markup.
   - paint(root, el, i, give) runs on every change; hold(root, el, down) when a finger lands and lifts. */
(() => {
  const looks = {}, waiting = new Set(), autos = new Set();
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const retone = () => autos.forEach(el => el.tone());
  mq.addEventListener ? mq.addEventListener('change', retone) : mq.addListener(retone);
  new MutationObserver(retone).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'data-tone'] });

.track { position: relative; height: calc(var(--n) * var(--row)); touch-action: none }
/* The cap rides on its row. Over center, the detent spring throws it into the next position: it accelerates and stops dead. */
.cap { position: absolute; top: calc((var(--n) - var(--i, 0) - .5) * var(--row) - var(--give, 0px)); cursor: grab;
  transition: translate .05s, scale .05s, box-shadow .05s }
.cap.snap { transition: top .07s cubic-bezier(.55,0,1,1), translate .05s, scale .05s, box-shadow .05s }
.cap.back { transition: top .08s cubic-bezier(.2,0,.3,1), translate .05s, scale .05s, box-shadow .05s }
[data-press]:not(.cap) { transition: translate .05s, scale .05s, box-shadow .05s }
.cap.down, [data-press].down { translate: 0 .5px; scale: .994 }
.cap.down { cursor: grabbing }
.opts { display: flex; flex-direction: column-reverse }
button { all: unset; height: var(--row); display: flex; align-items: center; cursor: pointer; white-space: nowrap }
/* Focus ring for the keyboard only: a finger already knows where it is. */

:host([disabled]) { opacity: .5; pointer-events: none }
@media (prefers-reduced-motion: reduce) { .cap, .cap.snap, .cap.back, [data-press] { transition: none } }
`;

  class DetentSlot extends HTMLElement {
    static observedAttributes = ['value', 'look', 'tone', 'options', 'label'];
    static look(name, def) { looks[name] = def; [...waiting].forEach(el => el.render()); }
    static esc(s) { return String(s).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`); }
    connectedCallback() {
      if (!this._wired) this.wire();
      if (!this.cap) this.render();
      this.tone();
    }
    disconnectedCallback() { autos.delete(this); }
    attributeChangedCallback(name, was, now) {
      if (!this._wired || was === now) return;
      if (name === 'tone') this.tone();
      else if (name === 'value') { if (this.cap) this.set(this.parse(now), true); }
      else this.render();
    }
    wire() {
      this._wired = true;
      this.attachShadow({ mode: 'open' });

      this.addEventListener('keydown', () => this.track && this.track.classList.remove('touched'));
      this.addEventListener('blur', () => this.track && this.track.classList.remove('touched'));

      Feel.wheel(this, d => { wheel += d; if (Math.abs(wheel) > 12) { this.nudge(Math.sign(wheel)); wheel = 0; } });
      Feel.keys(this, dir => this.nudge(dir), dir => this.travel(dir < 0 ? 0 : this.n - 1));
    }
    // Builds the look. Runs again when look, options or label change; the position carries over.
    render() {
      const look = looks[this.getAttribute('look') || 'original'];
      if (!look) { waiting.add(this); return; }
      waiting.delete(this);
      this.look = look;
      // A finger mid-drag on the old markup lets go.
      if (this._g) { this._g = null; this.acc = 0; this.commit(); }
      this.opts = (this.getAttribute('options') || 'opt a,opt b,opt c,opt d').split(',').map(s => s.trim()).filter(Boolean);
      if (this.opts.length < 2) this.opts = ['off', 'on'];
      this.n = this.opts.length;
      const first = this.i == null;
      this.i = first ? this.parse(this.getAttribute('value')) : this.clamp(this.i);
      this._committed = first ? this.i : this.clamp(this._committed);

      this.ls = {}; // the look's own state
      look.setup && look.setup(root, this);

      this.track.addEventListener('pointerdown', e => {
        if (e.button > 0) return;
        e.preventDefault();
        this.focus({ preventScroll: true });
        Feel.audio();
        const r = this.track.getBoundingClientRect(), c = this.cap.getBoundingClientRect();
        this.gap = r.height / this.n;
        this._g = { y: e.clientY, id: e.pointerId };
        try { this.track.setPointerCapture(e.pointerId); } catch {}
        press.classList.add('down');
        look.hold && look.hold(root, this, true);
        this.acc = 0;
        // Pressed in the slot beside the cap: it's pushed along to that position, detent by detent.
        if (e.clientY < c.top - 2 || e.clientY > c.bottom + 2) this.travel(this.clamp(Math.floor((r.bottom - e.clientY) / this.gap)));
      });
      this.track.addEventListener('pointermove', e => {
        const g = this._g;
        if (!g || e.pointerId !== g.id) return;
        const d = g.y - e.clientY; // up is +
        g.y = e.clientY;
        if (d && !this._tt) this.push(d);
      });
      const end = e => {
        if (!this._g || e.pointerId !== this._g.id) return;
        this._g = null;
        press.classList.remove('down');
        look.hold && look.hold(root, this, false);
        if (this.acc) { this.acc = 0; this.motion('back'); this.paint(); } // the detent pulls it back into place
        if (!this._tt) this.commit();
      };
      this.track.addEventListener('pointerup', end);
      this.track.addEventListener('pointercancel', end);
      const opts = $('.opts');
      if (opts) {
        opts.addEventListener('pointerdown', e => { e.preventDefault(); this.focus({ preventScroll: true }); Feel.audio(); });
        opts.addEventListener('click', e => { const b = e.target.closest('button'); if (b) this.travel(+b.dataset.i); });
      }
      this.tone();
      this.paint();
    }
    tone() {
      if (!this.t) return;
      const t = this.getAttribute('tone');
      let dark;
      if (t === 'light' || t === 'dark') { dark = t === 'dark'; autos.delete(this); }
      else {
        autos.add(this);
        const near = this.parentElement && this.parentElement.closest('[data-tone]'), page = document.documentElement.dataset.theme;
        dark = near ? near.dataset.tone === 'dark' : page ? page === 'dark' : mq.matches;
      }

    }
    parse(v) {
      const k = this.opts ? this.opts.indexOf(String(v)) : -1;
      return this.clamp(k >= 0 ? k : Math.round(+v || 0));
    }
    clamp(n) { return Math.min((this.n || 1) - 1, Math.max(0, n)); }
    get value() { return this.opts ? this.opts[this.i] : this.getAttribute('value'); }
    set value(v) { if (this.cap) this.set(this.parse(v), true); else this.setAttribute('value', v); }
    get index() { return this.i ?? +(this.getAttribute('value') || 0); }
    set index(n) { this.value = +n; }
    // A finger pushes the cap by d px. It only gives a little until it passes halfway to the next position,
    // then the detent throws it over. At either end it sits on its stop and gives nothing at all.
    push(d) {
      this.pushDir = Math.sign(d);
      this.acc += d;
      if ((this.i === 0 && this.acc < 0) || (this.i === this.n - 1 && this.acc > 0)) {
        this.acc = 0;
        Feel.stop(this, this.i + this.pushDir, 0, this.n - 1);
        return this.paint();
      }
      // Strictly past halfway: exactly halfway would leave it halfway behind the new position and throw it straight back.
      while (Math.abs(this.acc) > this.gap / 2) {
        const dir = Math.sign(this.acc), n = this.i + dir;
        if (n < 0 || n >= this.n) { this.acc = 0; break; }
        this.acc -= dir * this.gap;
        this.set(n);
      }
      this.paint();
    }
    nudge(dir) {
      if (!this.cap) return;
      const n = this.i + dir;
      if (n < 0 || n >= this.n) return Feel.stop(this, n, 0, this.n - 1);
      this.set(n);
      this.commit();
    }
    // Moved from a distance (a tapped label, a press in the slot, Home/End), the cap crosses each detent in turn.
    travel(t) {
      if (!this.cap) return;
      clearTimeout(this._tt);
      this._tt = 0;
      const step = () => {
        if (this.i === t) { this._tt = 0; if (!this._g) this.commit(); return; }
        this.set(this.i + Math.sign(t - this.i));
        this._tt = setTimeout(step, 70);
      };
      step();
    }
    set(n, quiet) {
      n = this.clamp(n);
      if (n === this.i) return;
      const dir = Math.sign(n - this.i);
      this.i = n;
      this.motion('snap');
      if (quiet) this._committed = n;
      else {
        Feel.fire('selector', { pitch: dir > 0 ? 1.03 : .97 });
        // Arriving at an end, the cap lands on its stop. The first call re-arms the far stop when coming straight from it.
        Feel.stop(this, n, 0, this.n - 1); Feel.stop(this, n, 0, this.n - 1);
        this.dispatchEvent(new Event('input', { bubbles: true }));
      }
      this.paint();
    }
    commit() {
      if (this.i === this._committed) return;
      this._committed = this.i;
      this.dispatchEvent(new Event('change', { bubbles: true }));
    }
    motion(kind) {
      this.cap.classList.remove('snap', 'back');
      this.cap.classList.add(kind);
      clearTimeout(this._mt);
      this._mt = setTimeout(() => this.cap.classList.remove(kind), 90);
    }
    paint() {
      if (!this.cap) return;
      // After a snap the cap is ahead of the finger, so it only shows give while it's actually being pushed.
      const give = Math.sign(this.acc) === this.pushDir ? this.acc * .25 : 0;
      this.style.setProperty('--i', this.i);
      this.style.setProperty('--give', give + 'px');
      // Position marks (an LED, a lit engraving, a dot) switch the instant the contact makes. They don't fade.
      this.marks.forEach(m => m.classList.toggle('on', +m.dataset.i === this.i));
      this.look.paint && this.look.paint(this.shadowRoot, this, this.i, give);
      this.setAttribute('aria-valuenow', this.i);
      this.setAttribute('aria-valuetext', this.opts[this.i]);
    }
  }
  window.DetentSlot = DetentSlot;
  customElements.define('detent-slot', DetentSlot);
})();
</script>

<script id="src-slot-look-original">

   molded cap with a groove across it over a black cut. --led colors the LEDs, --line the cap's line. */
DetentSlot.look('original', {
  css: `

  --cap-hi: #2c2c2b; --cap-lo: #151515; --cap-edge: #ffffff1f; --ln: var(--line, #f2f2ee); --groove: transparent; --shade: #00000059;
  --lc: var(--led, #ff3b2f); --led-off: color-mix(in srgb, var(--lc), #5a5650 70%); --halo: 30%; --focus: var(--ink);
  font: 400 17px/1 "Geist", system-ui, sans-serif; color: var(--ink) }
/* A dark panel: the cap is pale molded plastic with a groove across it, the slot is a black cut. */
.t.dark { --ink: #6e6e6e; --head: #e6e6e6; --slot: #020202; --wall: #000; --lip: #ffffff17;
  --cap-hi: #f1f1ee; --cap-lo: #d5d5d1; --cap-edge: #fff; --ln: var(--line, #1d1d1d); --groove: #ffffffb3; --shade: #000000b3;
  --led-off: color-mix(in srgb, var(--lc), #140f0e 78%); --halo: 55% }
:host { grid-template-columns: 52px auto; gap: 12px 12px }
/* Printed on the panel, so they never change. */
.dash { width: 28px; height: 1.5px; background: var(--ink); justify-self: center; align-self: center }
.head { color: var(--head); padding-left: 18px }
.track { width: 52px; border-radius: 10px }
/* The slot: shaded under its upper wall, light catching its lower lip. */
.slot { position: absolute; left: 50%; width: 8px; margin-left: -4px; top: calc(var(--row) / 2 - 7px); bottom: calc(var(--row) / 2 - 7px);
  border-radius: 4px; background: var(--slot); box-shadow: inset 0 2px 3px var(--wall), 0 1px 0 var(--lip) }
/* The cap rides on the panel over the slot, lit from above, with a contact shadow below. It never lifts. */
.cap { left: 50%; width: 40px; height: 22px; margin: -11px 0 0 -20px; border-radius: 6px;
  background: linear-gradient(var(--cap-hi), var(--cap-lo));
  box-shadow: inset 0 1px 0 var(--cap-edge), inset 0 -1px 0 #0000002e, 0 0 0 .5px #00000059, 0 1px 1.5px var(--shade), 0 4px 7px -3px var(--shade) }
.cap.down { box-shadow: inset 0 1px 0 var(--cap-edge), inset 0 -1px 0 #0000002e, 0 0 0 .5px #00000059, 0 .5px 1px var(--shade), 0 2px 4px -2px var(--shade) }
.line { position: absolute; left: 22%; right: 22%; top: 50%; height: 2px; margin-top: -1px; border-radius: 1px; background: var(--ln);
  box-shadow: 0 .5px 0 var(--groove) }
button { gap: 12px }
/* An LED is its own light source: when lit it tints the panel around it a touch. Unlit, it's a dark lens with the room's highlight on it. */
.led { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--led-off); box-shadow: inset 0 .5px 0 #ffffff2e, 0 0 0 .5px #00000040 }
button.on .led { background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--lc), #fff 35%), var(--lc) 45%);
  box-shadow: 0 0 0 .5px color-mix(in srgb, var(--lc), #000 35%), 0 0 6px 1px color-mix(in srgb, var(--lc) var(--halo), transparent) }
`,
  html(el) {
    const esc = DetentSlot.esc;
    return `<i class="dash"></i><span class="head">${esc(el.name)} [${el.n}]</span>` +
      `<div class="track" part="track"><i class="slot"></i><div class="cap" part="cap"><i class="line"></i></div></div>` +
      `<div class="opts">${el.opts.map((o, i) => `<button type="button" tabindex="-1" data-i="${i}"><i class="led"></i>${esc(o)}</button>`).join('')}</div>`;

:host { grid-template-columns: 52px auto; gap: 10px 8px }
.head { grid-column: 1 / -1; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; text-shadow: 0 .5px 0 var(--lip) }

  background: linear-gradient(var(--sheen), #fff0 45%), repeating-linear-gradient(0deg, #0000 0 1px, var(--lathe) 1px 2px), var(--face) }

  box-shadow: inset 0 1px 1px #00000040, 0 .5px 0 var(--lip) }

button.on { color: var(--lit); text-shadow: none }
button.on .tick { background: var(--lit); box-shadow: none }
`,
  html(el) {
    const esc = DetentSlot.esc;

});

<script id="src-slot-look-pedal">
/* Slot look "pedal": a matte grey plastic slide with a printed pointer line, riding in a fixed recessed seat with a slit
   down its middle. The option names are printed beside it. Hover or push to read the position: the printed readout
   is a drum of option names that rolls like an odometer. Dark tone: the same slide, a deeper seat, light ink.
   --dial-accent colors the pointer line. */
DetentSlot.look('pedal', {
  css: `
.t { --knob: #4a4a4a; --ink: #2b2b2b; --trail: #2b2b2b38; --seat: #0000000f; --seat-sh: inset 0 1px 2px #00000029, 0 1px 0 #ffffffb3; --slit: #0000004d;
  --cap-sh: inset 0 1px 0 #ffffff1f, inset 0 -1px 1px #00000066, 0 0 0 .5px #0000004d, 0 1px 1.5px #00000047, 0 3px 6px -2px #00000033, 0 8px 12px -6px #00000047;
  --cap-dn: inset 0 1px 0 #ffffff1f, inset 0 -1px 1px #00000066, 0 0 0 .5px #0000004d, 0 .5px 1px #00000052, 0 2px 4px -2px #00000033, 0 5px 8px -5px #00000047;
  --focus: var(--knob); font: 400 13px/1 "Geist", system-ui, sans-serif; color: var(--ink) }
.t.dark { --knob: #4e4e50; --ink: #d4d4d0; --trail: #d4d4d038; --seat: #00000066; --seat-sh: inset 0 1px 2px #000000d9, 0 1px 0 #ffffff14; --slit: #000000b3;
  --cap-sh: inset 0 1px 0 #ffffff2b, inset 0 -1px 1px #00000099, 0 0 0 .5px #000000b3, 0 1px 1.5px #000000a6, 0 3px 6px -2px #00000080, 0 8px 12px -6px #000000b3;
  --cap-dn: inset 0 1px 0 #ffffff2b, inset 0 -1px 1px #00000099, 0 0 0 .5px #000000b3, 0 .5px 1px #000000bf, 0 2px 4px -2px #00000080, 0 5px 8px -5px #000000b3 }
:host { grid-template-columns: 50px auto; gap: 12px 10px }
.track { width: 50px }
/* The seat: a shallow recess in the panel the slide runs in. Always there; the slide sinks into it, the seat never moves. */
.seat { position: absolute; left: 50%; width: 20px; margin-left: -10px; top: calc(var(--row) / 2 - 15px); bottom: calc(var(--row) / 2 - 15px);
  border-radius: 10px; background: var(--seat); box-shadow: var(--seat-sh) }
.seat::after { content: ""; position: absolute; left: 50%; width: 4px; margin-left: -2px; top: 9px; bottom: 9px; border-radius: 2px; background: var(--slit) }
/* Matte plastic, lit from above, sitting in the seat with a contact shadow. */
.cap { left: 50%; width: 34px; height: 24px; margin: -12px 0 0 -17px; border-radius: 6px;
  background: linear-gradient(color-mix(in srgb, var(--knob), #fff 9%), var(--knob) 58%, color-mix(in srgb, var(--knob), #000 18%));
  box-shadow: var(--cap-sh) }
.cap.down { box-shadow: var(--cap-dn) }
/* A printed pointer line across the top face. */
.cap::after { content: ""; position: absolute; left: 22%; right: 22%; top: 50%; height: 2px; margin-top: -1px; border-radius: 1px; background: var(--dial-accent, #fff) }

.tick { flex: none; width: 8px; height: 1.5px; background: var(--ink); opacity: .55 }
.l { grid-column: 1 / -1; position: relative; height: 16px; font: 500 13px/16px "Geist", system-ui, sans-serif; color: var(--ink) }
.l span { position: absolute; inset: 0; transition: opacity .15s }
.val { opacity: 0; overflow: hidden; inset: -8px -6px !important; padding: 0 6px;
  /* Fully hides the neighbouring names at rest, but lets the blur trail fade out instead of being cut. */
  -webkit-mask: linear-gradient(transparent 6px, #000 10px, #000 calc(100% - 10px), transparent calc(100% - 6px));
  mask: linear-gradient(transparent 6px, #000 10px, #000 calc(100% - 10px), transparent calc(100% - 6px));
  font-family: "Geist Mono", ui-monospace, monospace }

.drum { display: block; margin-top: 8px; font-weight: inherit; transition: transform .18s cubic-bezier(.2,.7,.3,1) }
.drum i { display: block; height: 16px; font-style: normal; white-space: nowrap }

`,
  html(el) {

      `<div class="opts">${el.opts.map((o, i) => `<button type="button" tabindex="-1" data-i="${i}"><i class="tick"></i>${esc(o)}</button>`).join('')}</div>` +
      `<div class="l" style="min-width:${wide}ch"><span class="name">${esc(el.name)}</span><span class="val"><b class="drum">${el.opts.map(o => `<i>${esc(o)}</i>`).join('')}</b></span></div>`;

<script id="src-slot-look-nothing">
/* Slot look "nothing": Nothing's flat widget language. A flat tile; the slot is a column of dots with a bigger dot at
   each position, the selected one red (the only accent, and only for the live state); the cap is a flat ring that
   rides the column. A dot-matrix position number with its unused leading digit left unlit, and small uppercase
   Geist Mono names; the selected name turns to full ink. No shadow, texture, dome or glow; dots switch instantly.
   Light tone: a white tile with black dots. Dark tone: a black tile with white dots. --dial-accent is the live dot. */
DetentSlot.look('nothing', {
  css: `
.t { --tile: #ecebe6; --edge: #00000014; --off: #c9c8c2; --on: #1b1b1b; --digits: #1b1b1b; --unlit: #d9d8d2; --label: #8a8a85; --focus: var(--on) }
.t.dark { --tile: #0b0b0b; --edge: #ffffff14; --off: #333333; --on: #f2f2f2; --digits: #f2f2f2; --unlit: #2e2e2e; --label: #7c7c7c }
:host { --row: 34px; display: inline-block }
.tile { display: grid; grid-template-columns: 28px auto; gap: 10px 12px; align-items: start; padding: 16px 20px 14px 14px; border-radius: 22px;
  background: var(--tile); box-shadow: inset 0 0 0 1px var(--edge);
  font: 400 11px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--label) }
.top { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-left: 4px }
.n { font: 800 32px/1 "Doto", "Geist Mono", monospace; letter-spacing: -.02em; color: var(--digits); font-variant-numeric: tabular-nums }
.n b { color: var(--unlit); font-weight: inherit }
.track { width: 28px }
/* The column: fine dots between positions, a full dot at each one. */
.rail { position: absolute; left: 50%; width: 6px; margin-left: -3px; top: calc(var(--row) / 2); bottom: calc(var(--row) / 2);
  background: radial-gradient(circle, var(--off) 1px, transparent 1.4px) center calc(var(--row) / -12) / 6px calc(var(--row) / 6) repeat-y }
.pos { position: absolute; left: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--on) }
.pos.on { background: var(--dial-accent, #d71921) }
/* The cap: a flat ring around the selected dot. */
.cap { left: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--on) }
button.on { color: var(--on) }
`,
  html(el) {
    const esc = DetentSlot.esc;
    const pos = el.opts.map((_, i) => `<i class="pos" data-i="${i}" style="top:calc((var(--n) - ${i} - .5) * var(--row))"></i>`).join('');
    return `<div class="tile"><div class="top"><span class="n"></span><span>${esc(el.name)}</span></div>` +
      `<div class="track" part="track"><i class="rail"></i>${pos}<div class="cap" part="cap"></div></div>` +
      `<div class="opts">${el.opts.map((o, i) => `<button type="button" tabindex="-1" data-i="${i}">${esc(o)}</button>`).join('')}</div></div>`;
  },
  setup(root, el) { el.ls.n = root.querySelector('.n'); },
  paint(root, el, i) {
    const s = String(i + 1).padStart(Math.max(2, String(el.n).length), '0'), lead = s.match(/^0*(?=\d)/)[0];
    el.ls.n.innerHTML = `<b>${lead}</b>${s.slice(lead.length)}`; // unused leading digits stay as unlit segments
  }

<script id="src-slot-look-aqua">
/* Slot look "aqua": a candy-glass bead, like early Mac OS X, riding in a printed groove. The glass blurs and tints what
   is under it. The groove fills in --dial-accent from the bottom stop up to the bead. Its specular highlight comes from
   the room light above and sits at the top of the glass; the caustic it focuses onto the panel lies just under it.
   Glass doesn't sink: a press only tightens its shadow. Dark tone: tinted dark glass. */
DetentSlot.look('aqua', {
  css: `
.t { --track: #00000014; --track-sh: inset 0 1px 2px #00000026; --fill: var(--dial-accent, #0a7cff); --tick: #00000059; --label: #1d1d1fcc;
  --spec: #ffffffd9; --caustic: #ffffffb3; --mark: #1d1d1f99; --focus: var(--fill);

  --glass-sh: inset 0 1px 0 #ffffffe6, inset 0 -1.5px 1px #ffffff99, inset 0 0 0 .5px #ffffffb3, inset 0 -8px 12px -8px #ffffff80, 0 0 0 .5px #0000001a, 0 1px 2px #0000001f, 0 8px 14px -6px #00000040;
  --glass-dn: inset 0 1px 0 #ffffffe6, inset 0 -1.5px 1px #ffffff99, inset 0 0 0 .5px #ffffffb3, inset 0 -8px 12px -8px #ffffff80, 0 0 0 .5px #0000001a, 0 .5px 1px #00000029, 0 5px 10px -6px #00000040;
  font: 400 13px/1 "Geist", system-ui, sans-serif; color: var(--label) }
.t.dark { --track: #ffffff14; --track-sh: inset 0 1px 2px #00000080; --fill: var(--dial-accent, #0a84ff); --tick: #ffffff40; --label: #f5f5f7cc;
  --spec: #ffffff52; --caustic: #ffffff2e; --mark: #f5f5f7b3;
  --glass: linear-gradient(170deg, #ffffff2e, #ffffff0a 55%, #ffffff17);
  --glass-sh: inset 0 1px 0 #ffffff8c, inset 0 -1.5px 1px #ffffff40, inset 0 0 0 .5px #ffffff38, inset 0 -8px 12px -8px #ffffff2e, 0 0 0 .5px #000, 0 1px 2px #000000a6, 0 8px 14px -6px #000000cc;
  --glass-dn: inset 0 1px 0 #ffffff8c, inset 0 -1.5px 1px #ffffff40, inset 0 0 0 .5px #ffffff38, inset 0 -8px 12px -8px #ffffff2e, 0 0 0 .5px #000, 0 .5px 1px #000000bf, 0 5px 10px -6px #000000cc }
:host { grid-template-columns: 44px auto; gap: 12px 8px }
.track { width: 44px }
/* The groove, printed and slightly sunk, with the value filled in from the bottom stop up to the bead's center.
   The fill moves in step with the bead's snap, so its bottom end never shifts. */
.groove, .fill { position: absolute; left: 50%; width: 8px; margin-left: -4px; border-radius: 4px }
.groove { top: calc(var(--row) / 2 - 4px); bottom: calc(var(--row) / 2 - 4px); background: var(--track); box-shadow: var(--track-sh) }
.fill { bottom: calc(var(--row) / 2 - 4px); height: calc(var(--i, 0) * var(--row) + var(--give, 0px) + 4px); background: var(--fill); box-shadow: var(--track-sh) }

.track:has(.cap.back) .fill { transition: height .08s cubic-bezier(.2,0,.3,1) }

  -webkit-backdrop-filter: blur(1.5px) saturate(1.8); backdrop-filter: blur(1.5px) saturate(1.8) }
.cap.down { translate: none; scale: none; box-shadow: var(--glass-dn) }
/* The specular: the room light reflected in the top of the bead. */
.cap::before { content: ""; position: absolute; inset: 4% 18% 56%; border-radius: 50%; background: linear-gradient(var(--spec), transparent) }

.cap::after { content: ""; position: absolute; left: 24%; right: 24%; top: 70%; height: 18%; border-radius: 50%;
  background: radial-gradient(closest-side, var(--caustic), transparent) }

.mark { position: absolute; left: 30%; right: 30%; top: 50%; height: 1.5px; margin-top: -.75px; border-radius: 1px; background: var(--mark) }

.tick { flex: none; width: 6px; height: 1.2px; border-radius: 1px; background: var(--tick) }

  html(el) {
    const esc = DetentSlot.esc;
    return `<div class="track" part="track"><i class="groove"></i><i class="fill"></i><div class="cap" part="cap"><i class="mark"></i></div></div>` +
      `<div class="opts">${el.opts.map((o, i) => `<button type="button" tabindex="-1" data-i="${i}"><i class="tick"></i>${esc(o)}</button>`).join('')}</div>`;
  }
});
</script>

<script id="src-scrubber">
/* <detent-scrubber look="original" tone="auto" value="07:00" step="15" mode="detent" label="Local time"> — a 24-hour time scale.
   Value is "HH:MM", from 00:00 to the last notch (23:45 at step 15). It clicks into a detent every step (step="5|15|30|60"),
   clicks firmer on each hour, and stops hard at 00:00 and at the last notch. Your finger moves the moving part exactly as far
   as it goes, and between notches it only leans a little toward the finger. Flick it and it carries on 2 to 4 notches, easing
   to rest, every click on its exact moment; mode="detent" turns that off. A finger on a coasting scale catches it. Keys,
   wheel and Home/End as usual. Fires "input" on every notch and "change" when it settles. Needs Feel and at least one look.
   tone: "light" or "dark" forces one; otherwise it follows the nearest [data-tone], the page's data-theme,
   then prefers-color-scheme. The look is a separate module: DetentScrubber.look(name, { css, html, setup, hold, paint, dir }).
   Look contract: html(el) must contain .k (the drag surface) and may contain .run (the element whose width is the whole
   00:00-to-last-notch run of the scale; without it, .k is the run) and [data-press] (gets .down while a finger is on it).
   el.step, el.max (last notch, in minutes) and el.value are ready when html runs. The element sets on .t: --x (px along
   .run to the shown position), --w (the run's width in px), and .snap / .back while a detent throws it, so elements with
   class .f glide into the notch and stop dead. paint(root, el, shown): shown is where the scale is drawn, in minutes,
   including the lean and the coast; el.v is the committed notch in minutes and el.value its "HH:MM". dir: 1 when the finger
   pushes a carriage along a fixed scale (drag right = later), -1 when it pulls a tape under a fixed cursor (drag left = later). */
(() => {
  const looks = {}, waiting = new Set(), autos = new Set();
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const retone = () => autos.forEach(el => el.tone());
  mq.addEventListener ? mq.addEventListener('change', retone) : mq.addListener(retone);
  new MutationObserver(retone).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'data-tone'] });

  // Shared by every look: the drag surface, the parts that ride with the scale, and how a part sinks and settles.
  const BASE = `:host { display: block; width: 100%; max-width: 400px; outline: none;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent }
.t { display: contents }
.k { position: relative; touch-action: none; cursor: grab }
.k:active { cursor: grabbing }
/* Everything that rides with the scale moves together. The detent throws it into each notch: it accelerates and stops dead. */
.f { transition: translate var(--t, 0s) var(--e, linear), transform var(--t, 0s) var(--e, linear) }
.t.snap { --t: .06s; --e: cubic-bezier(.55,0,1,1) }
.t.back { --t: .08s; --e: cubic-bezier(.2,0,.3,1) }
[data-press] { transition: translate .05s, scale .05s, box-shadow .05s }
[data-press].down { translate: 0 .5px; scale: .994 }
@media (prefers-reduced-motion: reduce) { .t { --t: 0s !important } [data-press] { transition: none } }
`;

  class DetentScrubber extends HTMLElement {
    static observedAttributes = ['look', 'tone', 'step', 'mode', 'value', 'label'];
    static look(name, def) { looks[name] = def; [...waiting].forEach(el => el.render()); }
    connectedCallback() {
      if (!this._wired) this.wire();
      if (!this.k) this.render();
      this.tone();
    }
    disconnectedCallback() { autos.delete(this); }
    attributeChangedCallback(name, was, now) {
      if (!this._wired) return;
      if (name === 'value') { this.catch(); this.v = this.raw = this.parse(now); this.paint(); return; }
      if (was === now) return;
      if (name === 'tone') this.tone(); else this.render();
    }
    wire() {
      this._wired = true;
      this.attachShadow({ mode: 'open' });
      this.setAttribute('role', 'slider');
      if (!this.hasAttribute('aria-label')) this.setAttribute('aria-label', 'Time');
      this.setAttribute('aria-valuemin', 0);
      if (!this.hasAttribute('tabindex')) this.tabIndex = 0;
      let wheel = 0;
      Feel.wheel(this, d => {
        wheel += d;
        if (Math.abs(wheel) > 10) { this.nudge(Math.sign(wheel), true); wheel = 0; }
        clearTimeout(this._wt); this._wt = setTimeout(() => this.dispatchEvent(new Event('change', { bubbles: true })), 200);
      });
      Feel.keys(this, (dir, big) => this.nudge(dir * (big ? Math.max(1, 60 / this.step) : 1)), dir => this.nudge(dir * 1440));
    }
    // Builds the look. Runs again when look, step, mode or label change; the time carries over.
    render() {
      const look = looks[this.getAttribute('look') || 'original'];
      if (!look) { waiting.add(this); return; }
      waiting.delete(this);
      this.catch();
      this.look = look;
      const step = +this.getAttribute('step');
      this.step = [5, 15, 30, 60].includes(step) ? step : 15;
      this.max = 1440 - this.step;
      this.weighted = this.getAttribute('mode') !== 'detent';
      this.dir = look.dir || 1;
      this.v = this.raw = this.v == null ? this.parse(this.getAttribute('value')) : this.clamp(Math.round(this.v / this.step) * this.step);
      this.held = false;
      const root = this.shadowRoot;
      root.innerHTML = `<style>${BASE}${look.css}</style><div class="t">${look.html(this)}</div>`;
      this.t = root.querySelector('.t'); this.k = root.querySelector('.k'); this.run = root.querySelector('.run') || this.k;
      const k = this.k, press = root.querySelector('[data-press]') || k;
      this.ls = {}; // the look's own state
      look.setup && look.setup(root, this);
      this.setAttribute('aria-valuemax', this.max);
      let drag = null;
      k.addEventListener('pointerdown', e => {
        if (e.button > 0) return;
        Feel.audio();
        this.catch();
        drag = { x: e.clientX, from: this.v, id: e.pointerId };
        this.raw = this.v; this.held = true;
        this.trail = [[performance.now(), this.v]];
        try { k.setPointerCapture(e.pointerId); } catch {}
        press.classList.add('down');
        look.hold && look.hold(root, this, true);
      });
      k.addEventListener('pointermove', e => {
        if (!drag || e.pointerId !== drag.id) return;
        // You push the scale: it moves exactly as far as your finger, wherever you grabbed it.
        const raw = this.clamp(drag.from + this.dir * (e.clientX - drag.x) / this.run.clientWidth * this.max), now = performance.now();
        this.trail.push([now, raw]);
        while (this.trail.length > 2 && now - this.trail[0][0] > 80) this.trail.shift();
        this.push(raw);
      });
      const end = e => {
        if (!drag || e.pointerId !== drag.id) return;
        drag = null; this.held = false;
        press.classList.remove('down');
        look.hold && look.hold(root, this, false);
        if (this.weighted && e.type === 'pointerup' && this.fling()) return;
        if (this.raw !== this.v) this.motion('back'); // the detent pulls it back into the notch it's in
        this.raw = this.v;
        this.paint();
        this.dispatchEvent(new Event('change', { bubbles: true }));
      };
      k.addEventListener('pointerup', end);
      k.addEventListener('pointercancel', end);
      this._ro && this._ro.disconnect();
      this._ro = new ResizeObserver(() => this.paint());
      this._ro.observe(this.run);
      this.tone();
      this.paint();
    }
    tone() {
      if (!this.t) return;
      const t = this.getAttribute('tone');
      let dark;
      if (t === 'light' || t === 'dark') { dark = t === 'dark'; autos.delete(this); }
      else {
        autos.add(this);
        const near = this.parentElement && this.parentElement.closest('[data-tone]'), page = document.documentElement.dataset.theme;
        dark = near ? near.dataset.tone === 'dark' : page ? page === 'dark' : mq.matches;
      }
      this.t.classList.toggle('dark', dark);

    get value() { return this.fmt(this.v != null ? this.v : this.parse(this.getAttribute('value'))); }
    set value(t) { this.setAttribute('value', t); }
    parse(t) {
      const [h, m] = String(t || '07:00').split(':').map(Number), step = this.step || 15;

    clamp(v) { return Math.min(this.max ?? 1425, Math.max(0, v)); }

    push(raw) {
      this.raw = raw;
      const v = Math.round(raw / this.step) * this.step;
      if (v !== this.v) { this.motion('snap'); this.commit(v, true); }

    commit(v, sound) {
      const was = this.v;

      Feel.stop(this, v, 0, this.max);
      if (sound && v > 0 && v < this.max) {

    hourIn(a, b) {

      if (v === this.v) return;

    fling() {
      const t = this.trail || [], now = performance.now();
      if (t.length < 2 || now - t[t.length - 1][0] > 60 || Feel.reduced()) return false;
      const v = (t[t.length - 1][1] - t[0][1]) / Math.max(1, t[t.length - 1][0] - t[0][0]); // minutes per ms
      const px = Math.abs(v / this.max * this.run.clientWidth);
      if (px < .35) return false;
      return this.coast(v / this.step, Math.min(1, (px - .35) / 2.2));
    }
    // The scale has some weight, so a flick carries it on after you let go: 2 more notches for a gentle flick, up to 4 for a
    // hard one. It leaves your finger at the flick's speed, drag bleeds that down to a slow creep within a fraction of a notch, and
    // friction then eases it to rest in the last notch over most of a second. So the clicks start quick and spread out, the last gap
    // the longest. If the end stop comes first, it hits it and stops dead. Positions are in notches; v is notches per ms.
    // The whole coast is worked out at release, so every click sounds at its exact moment, not on the next screen frame.
    static spin(pos, v, n, lo, hi) {
      const dir = Math.sign(v), home = Math.round(pos), rest = home + dir * n, dist = Math.abs(rest - pos);
      if (Math.min(hi, Math.max(lo, rest)) === home) return null;  // already against the stop it was flicked toward
      const creep = 2 * dist / (500 + 150 * n);
      const speed = x => (creep + Math.max(0, Math.abs(v) - creep) * Math.exp(-x / .22)) * Math.sqrt(Math.max(0, 1 - x / dist));
      const start = pos, path = [pos], clicks = [];
      let click = home, x = 0, t = 0;
      while (dist - x > .001 && t < 4000) {
        const prev = pos;
        x = Math.min(dist, x + Math.max(speed(x), .0002));
        pos = start + dir * x;
        t += 1;
        if (pos <= lo || pos >= hi) {                                     // the end stop: it arrives and stops dead
          const stop = pos <= lo ? lo : hi;
          path.push(stop);
          clicks.push([t - 1 + (stop - prev) / (pos - prev), stop, true]);
          return { path, clicks, end: t };
        }
        const k = Math.round(pos);
        if (k !== click) {
          // the click is the hilltop between notches; the last notch before a stop is the stop itself, which ticks on arrival
          if (k > lo && k < hi) clicks.push([t - 1 + (Math.min(k, click) + .5 - prev) / (pos - prev), k, false]);
          click = k;
        }
        path.push(pos);
      }
      path[path.length - 1] = rest;
      return { path, clicks, end: t };
    }
    coast(v, fast) {
      const n = 2 + Math.round(fast * 2), lead = this.raw - this.v;
      const s = this.constructor.spin((this.v + lead * .25) / this.step, Math.max(-.2, Math.min(.2, v)), n, 0, this.max / this.step);
      if (!s) return false;
      const t0 = performance.now(), base = Feel.clock() + .03; // every click hangs off this one audio-clock moment
      let queued = 0, done = 0;
      this.raw = this.v;
      this._cancels = [];
      this.t.classList.remove('snap', 'back');
      const frame = now => {
        const t = now - t0;
        // queue the next clicks a little ahead, each at its own exact moment
        while (queued < s.clicks.length && s.clicks[queued][0] < t + 80) {
          const [ms, k, stop] = s.clicks[queued++];
          if (!stop) this._cancels.push(k * this.step % 60 ? Feel.schedule('encoder', base + ms / 1000) : Feel.schedule('bezel', base + ms / 1000, { pitch: .62 }));
        }
        while (done < s.clicks.length && s.clicks[done][0] <= t) {
          const [, k] = s.clicks[done++];
          this.commit(k * this.step, false);  // the end stop's tick comes from Feel.stop as it arrives
          this.raw = this.v;
        }
        if (t < s.end) {
          const i = Math.min(s.path.length - 2, Math.floor(t)), f = t - i;
          this.paint((s.path[i] + (s.path[i + 1] - s.path[i]) * f) * this.step);
          this._coast = requestAnimationFrame(frame);
          return;
        }
        this._coast = 0;
        this._cancels = [];
        this.paint();
        this.dispatchEvent(new Event('change', { bubbles: true }));
      };
      this._coast = requestAnimationFrame(frame);
      return true;
    }
    // A finger on a coasting scale stops it: queued clicks are cancelled and it settles into the nearest notch.
    catch() {
      if (!this._coast) return;
      cancelAnimationFrame(this._coast);
      this._coast = 0;
      (this._cancels || []).forEach(c => c());
      this._cancels = [];
      this.raw = this.v;
      this.motion('back');
      this.paint();
    }
    motion(kind) {
      if (!this.t) return;
      const t = this.t;
      t.classList.remove('snap', 'back');
      t.classList.add(kind);
      clearTimeout(this._mt);
      this._mt = setTimeout(() => t.classList.remove(kind), 90);
    }
    // at: where the scale is drawn, in minutes. Readouts always show the notch it is in (el.v).
    paint(at) {
      if (!this.k) return;
      const shown = at ?? (this.held ? this.v + (this.raw - this.v) * .25 : this.v), W = this.run.clientWidth, r = this.t.style;
      r.setProperty('--x', (shown / this.max * W).toFixed(2) + 'px');
      r.setProperty('--w', W + 'px');
      this.look.paint && this.look.paint(this.shadowRoot, this, shown);
      this.setAttribute('aria-valuenow', this.v);
      this.setAttribute('aria-valuetext', this.value);
    }
  }
  window.DetentScrubber = DetentScrubber;
  customElements.define('detent-scrubber', DetentScrubber);
})();
</script>

<script id="src-scrubber-look-original">
/* Scrubber look "original": the approved glass scrubber. A glass lens on a carriage slides along a printed 24-hour scale;
   the lens really magnifies the scale under it, and the hairline in it (--dial-accent) reads the time. The digital readout
   rides on the carriage and switches instantly. The sky above follows the time on its own: the sun and the moon ride one arc,
   the sky brightens only as the sun clears the horizon, and the stars fade out one by one, faintest first. The sky glides to
   the time rather than clicking with the carriage. Light: a pale satin panel. Dark: a black anodized panel. */
DetentScrubber.look('original', (() => {
  // The sky by the sun's height (sine of its elevation): [height, zenith, middle, horizon]. Deep night until about an hour
  // before sunrise, then the dawn comes up from the horizon; the same in reverse at dusk.
  const SKY = [
    [-1, [6, 9, 24], [11, 18, 42], [20, 28, 56]],
    [-.28, [6, 9, 24], [11, 18, 42], [20, 28, 56]],
    [-.14, [11, 17, 42], [26, 34, 76], [56, 56, 104]],
    [-.04, [28, 42, 88], [88, 80, 130], [208, 126, 104]],
    [.03, [50, 80, 138], [146, 128, 158], [250, 168, 108]],
    [.15, [70, 116, 176], [150, 180, 212], [246, 206, 160]],
    [.4, [63, 120, 191], [121, 172, 220], [188, 220, 242]],
    [1, [58, 114, 186], [114, 166, 218], [184, 218, 242]],
  ];
  // The sun and the moon ride opposite ends of one arc: the sun rises on the left at 06:00, is highest at noon and sets on the
  // right at 18:00; the moon does the same through the night. The sky's color comes from the sun's height alone, so there is
  // no light before it nears the horizon. Each star fades over its own stretch of twilight, faintest first.
  function sky(ls, t) {
    const W = ls.sky.clientWidth, H = 160, a = (t / 60 - 6) / 12 * Math.PI, e = Math.sin(a);
    const rx = W / 2, ry = 112, sx = W / 2 - rx * Math.cos(a), sy = H - ry * e, mx = W - sx, my = H + ry * e;
    const ramp = (lo, hi, v) => { const k = Math.min(1, Math.max(0, (v - lo) / (hi - lo))); return k * k * (3 - 2 * k); };
    let i = 0;
    while (i < SKY.length - 2 && e > SKY[i + 1][0]) i++;
    const k = Math.min(1, Math.max(0, (e - SKY[i][0]) / (SKY[i + 1][0] - SKY[i][0])));
    const col = n => `rgb(${SKY[i][n].map((c, j) => Math.round(c + (SKY[i + 1][n][j] - c) * k)).join(' ')})`;
    const r = ls.sky.style, low = 1 - ramp(0, .3, e);
    r.setProperty('--top', col(1)); r.setProperty('--mid', col(2)); r.setProperty('--bot', col(3));
    r.setProperty('--sun', `rgb(255 ${Math.round(246 - 82 * low)} ${Math.round(224 - 132 * low)})`);   // a low sun shines through more air: warmer
    r.setProperty('--halo', `rgb(255 ${Math.round(216 - 76 * low)} ${Math.round(138 - 80 * low)} / .6)`);
    ls.sun.style.translate = `${(sx - 11).toFixed(1)}px ${(sy - 11).toFixed(1)}px`;
    ls.glow.style.translate = `${(sx - 170).toFixed(1)}px ${H - 75}px`;
    ls.glow.style.opacity = (Math.exp(-(((e - .02) / .11) ** 2))).toFixed(3);
    ls.moon.style.translate = `${(mx - 9).toFixed(1)}px ${(my - 9).toFixed(1)}px`;
    ls.moon.style.rotate = Math.atan2(sy - my, sx - mx).toFixed(3) + 'rad';                      // its lit side faces the sun
    ls.moon.style.opacity = ramp(-.04, .12, -e).toFixed(3);
    for (const [el, b] of ls.stars) {
      const th = -.24 + b * .2;                                                                      // where this star goes out
      el.style.opacity = ((.5 + .5 * b) * (1 - ramp(th - .06, th + .06, e))).toFixed(3);
    }
  }
  return {
    css: `
/* light: a pale satin panel with the scale printed in ink */
.t { --panel: #efeef2; --ink: #67666f; --ink2: #b0afb8; --label: #6e6d77; --edge: #0000001c; --rim: #00000029; --drop: #00000040;
  --hi: #ffffffe6; --side: #0000001a; --focus: #2b2a30; --caustic: #ffffff8c; --chip: #fbfbfc; --chip-ink: #2b2a30;
  --card-sh: inset 0 0 0 1px var(--edge), 0 1px 2px #0000000f, 0 12px 28px -18px #00000059 }
/* dark: a black anodized panel with the scale printed in pale grey */
.t.dark { --panel: #111115; --ink: #9e9da8; --ink2: #494852; --label: #8e8d98; --edge: #ffffff17; --rim: #ffffff2e; --drop: #000000b3;
  --hi: #ffffff52; --side: #ffffff12; --focus: #dcdbe3; --caustic: #ffffff17; --chip: #1f1f25; --chip-ink: #ecebf0;
  --card-sh: inset 0 0 0 1px var(--edge) }
.s { border-radius: 24px; overflow: hidden; font: 500 13px/1 "Geist", system-ui, sans-serif; background: var(--panel); box-shadow: var(--card-sh) }
:host(:focus-visible) .s { outline: 2px solid var(--focus); outline-offset: 3px }
/* The sky: a window onto the time of day, not a part of the mechanism. It glides to the time you set, so the sun and moon move
   smoothly while the carriage clicks. It is the only light that changes; the panel is lit by the room. */
.sky { position: relative; height: 160px; overflow: hidden; border-bottom: 1px solid var(--edge);
  background: linear-gradient(var(--top, #070b1c), var(--mid, #0d1530) 62%, var(--bot, #18213f)) }
.star { position: absolute; width: var(--r); height: var(--r); margin: calc(var(--r) / -2); border-radius: 50%; background: #fff; opacity: 0;
  box-shadow: 0 0 calc(var(--r) * 1.5) #dfe6ff80 }
/* the warm band of sunrise and sunset gathers around the sun at the horizon */
.glow { position: absolute; left: 0; top: 0; width: 340px; height: 150px; border-radius: 50%; opacity: 0;
  background: radial-gradient(closest-side, #ff9a52b3, #ff9a5240 55%, #ff9a5200) }
.sun { position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--sun, #fff6e0);
  box-shadow: 0 0 12px 4px var(--halo, #ffd88a99), 0 0 48px 18px #ffc06a2e }
/* A crescent: only the side facing the sun is lit. */
.moon { position: absolute; left: 0; top: 0; width: 18px; height: 18px; border-radius: 50%; opacity: 0;
  box-shadow: inset -5px 0 0 0 #f2eee2; filter: drop-shadow(0 0 5px #e9e6ff59) }
.body { padding: 12px 40px 18px }
/* The digital readout rides on the carriage, right above the lens. */
.read { position: relative; height: 32px }
.lcd { position: absolute; left: 0; top: 0; translate: calc(var(--x) - 50%) 0; padding: 6px 9px; border-radius: 7px; background: var(--chip); color: var(--chip-ink);
  font: 600 14px/1 "Geist Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: .02em; white-space: nowrap;
  box-shadow: 0 0 0 .5px var(--rim), 0 1px 2px var(--drop) }
.track { height: 60px; cursor: grab }
.scale { position: absolute; left: 0; top: 0; width: 100%; height: 60px; overflow: visible; pointer-events: none }
.h { stroke: var(--ink); stroke-width: 1.4 }
.q { stroke: var(--ink2); stroke-width: 1 }
text { fill: var(--ink2); font: 500 10px "Geist Mono", ui-monospace, monospace; text-anchor: middle; font-variant-numeric: tabular-nums }
text.big { fill: var(--ink); font-weight: 600 }
/* The lens. Clear glass over the printed scale, so what you see through it is the scale itself, magnified 1.8×.
   The room light is overhead: a soft highlight across the top of the glass, its edges bend light away and read darker,
   it focuses a little brightness onto the panel under it, and it casts a short shadow straight down. */
.lens { position: absolute; left: 0; top: 7px; width: 30px; height: 38px; border-radius: 15px; overflow: hidden; translate: calc(var(--x) - 15px) 0;
  background: radial-gradient(42% 26% at 50% 66%, var(--caustic), #fff0), var(--panel);
  box-shadow: 0 0 0 .5px var(--rim), 0 1px 1.5px var(--drop), 0 5px 9px -5px var(--drop);
  transition: translate var(--t, 0s) var(--e, linear), top .05s, scale .05s, box-shadow .05s }
.lens.down { top: 7.5px; translate: calc(var(--x) - 15px) 0; scale: .994; box-shadow: 0 0 0 .5px var(--rim), 0 .5px 1px var(--drop), 0 3px 6px -4px var(--drop) }
.mag line { vector-effect: non-scaling-stroke }   /* magnified, but drawn with the same fine line, so the lens doesn't shout */
.mag { left: 15px; top: -7px; width: var(--w); transform-origin: 0 26px; transform: scale(1.8) translateX(calc(var(--x) * -1)) }
.lens::before { content: ""; position: absolute; z-index: 1; left: 14.5px; top: 4px; bottom: 4px; width: 1px; background: var(--dial-accent, #e5242a); opacity: .9 }
.lens::after { content: ""; position: absolute; z-index: 2; inset: 0; border-radius: inherit;
  background: radial-gradient(64% 20% at 50% 8%, var(--hi), #fff0), linear-gradient(90deg, var(--side), #0000 24%, #0000 76%, var(--side));
  box-shadow: inset 0 1px 0 var(--hi), inset 0 -1px 1px var(--rim) }
.zone { margin-top: 12px; text-align: center; font: 500 11px/1 "Geist", system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--label) }
`,
    html(el) {
      // The printed scale: a mark every quarter hour, longer on the half hour and the hour. Numbered every three hours, the
      // six-hour marks bolder. They sit just under the lens's travel, so the glass never cuts through them.
      let ticks = '', nums = '';
      for (let m = 0; m <= el.max; m += 15) {
        const x = (m / el.max * 100).toFixed(3) + '%', h = m % 60 ? m % 30 ? 3 : 5 : 8;
        ticks += `<line class="${m % 60 ? 'q' : 'h'}" x1="${x}" x2="${x}" y1="${26 - h}" y2="${26 + h}"/>`;
        if (m % 180 === 0) nums += `<text${m % 360 ? '' : ' class="big"'} x="${x}" y="55">${String(m / 60).padStart(2, '0')}</text>`;
      }
      // [x %, y %, brightness]. Brighter stars come out first at dusk and are the last to go at dawn.
      const stars = [[5, 14, 1], [11, 40, .5], [16, 24, .75], [21, 60, .4], [27, 9, .6], [32, 36, .9], [37, 64, .45], [42, 20, .55],
        [47, 46, .7], [53, 10, .95], [57, 58, .4], [62, 30, .65], [67, 72, .5], [72, 16, .85], [77, 44, .45], [82, 26, .6],
        [86, 60, .8], [91, 12, .5], [95, 38, .7], [8, 76, .45], [30, 80, .5], [50, 82, .4], [70, 84, .55], [89, 80, .4]]
        .map(([x, y, b]) => `<i class="star" data-b="${b}" style="left:${x}%;top:${y}%;--r:${(1.4 + b * 1.6).toFixed(2)}px"></i>`).join('');
      return `<div class="s"><div class="sky">${stars}<i class="glow"></i><i class="moon"></i><i class="sun"></i></div>
<div class="body"><div class="read"><output class="lcd f"></output></div>
<div class="track k"><svg class="scale" aria-hidden="true">${ticks}${nums}</svg><div class="lens f" data-press><svg class="scale mag f" aria-hidden="true">${ticks}</svg></div></div>
<div class="zone"></div></div></div>`;
    },
    setup(root, el) {
      const $ = s => root.querySelector(s), ls = el.ls;
      ls.sky = $('.sky'); ls.sun = $('.sun'); ls.moon = $('.moon'); ls.glow = $('.glow'); ls.lcd = $('.lcd');
      ls.stars = [...root.querySelectorAll('.star')].map(s => [s, +s.dataset.b]);
      $('.zone').textContent = el.getAttribute('label') || 'Local time';
    },
    paint(root, el, shown) {
      const ls = el.ls;
      // The sky glides to the time rather than clicking with the carriage: it closes most of the gap every tenth of a second,
      // so it eases in and never overshoots.
      ls.skyTo = shown;
      if (ls.skyAt == null || Feel.reduced()) { ls.skyAt = shown; sky(ls, shown); }
      else if (!ls.skyRaf) {
        let last = performance.now();
        const glide = now => {
          ls.skyAt += (ls.skyTo - ls.skyAt) * (1 - Math.exp(-(now - last) / 110));
          last = now;
          if (Math.abs(ls.skyTo - ls.skyAt) < .2) ls.skyAt = ls.skyTo;
          sky(ls, ls.skyAt);
          ls.skyRaf = ls.skyAt === ls.skyTo ? 0 : requestAnimationFrame(glide);
        };
        ls.skyRaf = requestAnimationFrame(glide);
      }
      ls.lcd.textContent = el.value;
    }
  };
})());
</script>

<script id="src-scrubber-look-braun">
/* Scrubber look "braun": an engraved aluminium tape slides behind a machined window in a turned-aluminium bezel. An orange
   hairline (--dial-accent) painted on the window's glass reads the time. A lamp behind the left half of the window backlights
   the engravings that have passed the hairline, so the scale is lit up to the value; the lamp stays put and the marks slide
   through it. The time and the label are small engraved Geist Mono. Dark tone: black anodized aluminium. */
DetentScrubber.look('braun', {
  dir: -1,
  css: `
.t { --tick: #7f7d7a; --tick-long: #6a6865; --num: #6a6865; --label: #8a8886;
  --rim: linear-gradient(#fbfbfb, #d9d9d8 55%, #b9b9b8);
  --tape: linear-gradient(#f7f7f6, #e9e9e8 50%, #d8d8d7); --lathe: #00000008; --well: #b4b4b2;
  --win-sh: inset 0 0 0 1px #00000024, inset 0 6px 10px -3px #00000059, inset 0 -1px 2px #ffffff4d;
  --bez-sh: 0 0 0 .5px #00000040, 0 1px 1.5px #00000059, 0 3px 5px -1px #00000033, 0 10px 16px -6px #00000040;
  --glass: linear-gradient(#ffffff4d, #fff0 38%); --lip: #ffffff99 }
.t.dark { --tick: #4c4c4f; --tick-long: #6e6e72; --num: #8a8a8e; --label: #7c7c7a;
  --rim: linear-gradient(#6c6c6f, #2d2d2f 55%, #1a1a1c);
  --tape: linear-gradient(#3c3c3f, #2d2d30 50%, #222224); --lathe: #ffffff05; --well: #0c0c0d;
  --win-sh: inset 0 0 0 1px #000000b3, inset 0 6px 10px -3px #000000cc, inset 0 -1px 2px #ffffff1f;
  --bez-sh: 0 0 0 .5px #000, 0 1px 1.5px #000000cc, 0 3px 5px -1px #00000099, 0 10px 16px -6px #000000b3;
  --glass: linear-gradient(#ffffff1c, #fff0 38%); --lip: #ffffff2e }
.top { display: flex; justify-content: space-between; margin: 0 6px 10px; font: 500 11px/1 "Geist Mono", ui-monospace, monospace;
  letter-spacing: .1em; text-transform: uppercase; color: var(--label); font-variant-numeric: tabular-nums }
.top b { font-weight: 500; color: var(--num) }
/* The bezel: a turned-aluminium frame with a chamfer that catches the top light. */
.bezel { padding: 5px; border-radius: 13px; background: var(--rim); box-shadow: var(--bez-sh) }
/* The window: a slot cut through the bezel. Past the ends of the tape you see the dark well behind it. */
.k { height: 64px; border-radius: 8px; overflow: hidden; background: var(--well) }
.run { position: absolute; top: 0; bottom: 0; left: 50%; width: 400%; translate: calc(var(--x) * -1) 0 }

<script id="src-scrubber-look-pedal">
/* Scrubber look "pedal": a matte grey plastic tape with printed white marks, running in a fixed recessed seat. The pointer is
   printed on the panel above and below the seat. Hover or drag to read the time; the printed readout rolls like an odometer.
   Dark tone: the same tape on a black panel, with a deeper seat. --dial-accent colors the pointer. */
DetentScrubber.look('pedal', (() => {
  // Each digit column holds 0-9 three times over, so it can roll past 9 or 0 either way, then quietly re-centers.
  function place(col, pos, animate) {
    col._pos = pos;
    col.style.transition = animate ? '' : 'none';
    col.style.transform = `translateY(${8 - pos * 16}px)`;
    if (!animate) return;
    col.classList.add('moving');
    clearTimeout(col._t);
    col._t = setTimeout(() => {
      col.classList.remove('moving');
      if (col._pos >= 10 && col._pos < 20) return;
      place(col, 10 + ((col._pos % 10) + 10) % 10, false);
    }, 190);
  }
  // Digits roll up when the time goes later and down when it goes earlier. text is the four digits, HHMM.
  function roll(ls, text, dir) {
    if (!ls.cols) {
      ls.val.innerHTML = [...text].map((_, i) => (i === 2 ? '<b class="sep">:</b>' : '') +
        `<b class="col"><i>${'0123456789'.repeat(3).split('').join('</i><i>')}</i></b>`).join('');
      ls.cols = [...ls.val.querySelectorAll('.col')];
      ls.cols.forEach((col, i) => place(col, 10 + +text[i], false));
      return;
    }
    ls.cols.forEach((col, i) => {
      const cur = ((col._pos % 10) + 10) % 10;
      let step = ((+text[i] - cur) % 10 + 10) % 10; // forward distance on the wheel
      if (!step) return;
      if (dir < 0) step -= 10;
      place(col, col._pos + step, true);
    });
  }
  return {
    dir: -1,
    css: `
.t { --knob: #4a4a4a; --ink: #2b2b2b; --trail: #2b2b2b38; --print: #f4f4f1; --print2: #f4f4f18c; --seat: #0000000f; --seat-sh: inset 0 1px 2px #00000029, 0 1px 0 #ffffffb3;
  --tape-sh: inset 0 1px 0 #ffffff1f, inset 0 -1px 1px #00000066, inset 0 0 0 .5px #0000004d }
.t.dark { --knob: #4e4e50; --ink: #d4d4d0; --trail: #d4d4d038; --print: #f4f4f1; --print2: #f4f4f180; --seat: #00000066; --seat-sh: inset 0 1px 2px #000000d9, 0 1px 0 #ffffff14;
  --tape-sh: inset 0 1px 0 #ffffff2b, inset 0 -1px 1px #00000099, inset 0 0 0 .5px #000000b3 }
/* The seat: a shallow recess in the panel the tape runs in. Always there; the tape sinks into it, the seat never moves. */
.seat { position: relative; margin: 12px 0 0; padding: 5px; border-radius: 14px; background: var(--seat); box-shadow: var(--seat-sh) }
.k { height: 52px; border-radius: 9px; overflow: hidden }
/* The light on the tape's rounded top and bottom edges belongs to the room, so it stays put while the print slides under it. */
.k::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: var(--tape-sh); pointer-events: none }
.belt { position: absolute; inset: 0 }
.run { position: absolute; top: 0; bottom: 0; left: 50%; width: 400%; translate: calc(var(--x) * -1) 0 }
/* Matte grey plastic, lit from above. */
.tape { position: absolute; inset: 0 -14px; border-radius: 9px;
  background: linear-gradient(color-mix(in srgb, var(--knob), #fff 9%), var(--knob) 58%, color-mix(in srgb, var(--knob), #000 18%)) }
svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none }
line { stroke: var(--print2); stroke-width: 1.1; stroke-linecap: round }
line.h { stroke: var(--print); stroke-width: 1.6 }
text { fill: var(--print); font: 500 10px "Geist", system-ui, sans-serif; text-anchor: middle; font-variant-numeric: tabular-nums }
/* The pointer: printed on the panel, just above and below the seat. */
.ptr { position: absolute; left: calc(50% - 1px); width: 2px; height: 7px; border-radius: 1px; background: var(--dial-accent, var(--ink)) }
.ptr.a { top: -11px } .ptr.b { bottom: -11px }
:host(:focus-visible) .seat { outline: 2px solid var(--knob); outline-offset: 3px }
.l { position: relative; height: 16px; margin: 20px auto 0; min-width: 8ch; font: 500 13px/16px "Geist", system-ui, sans-serif; color: var(--ink); text-align: center }
.l span { position: absolute; inset: 0; transition: opacity .15s }

  /* Fully hides the neighbouring digits at rest, but lets the blur trail fade out instead of being cut. */
  -webkit-mask: linear-gradient(transparent 6px, #000 10px, #000 calc(100% - 10px), transparent calc(100% - 6px));
  mask: linear-gradient(transparent 6px, #000 10px, #000 calc(100% - 10px), transparent calc(100% - 6px));
  font-family: "Geist Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums }

:host(:hover) .name, :host(:focus-visible) .name, .l.show .name { opacity: 0 }
:host(:hover) .val, :host(:focus-visible) .val, .l.show .val { opacity: 1 }
@media (prefers-reduced-motion: reduce) { .l span, .val .col { transition: none } .val .col.moving i { filter: none; text-shadow: none } }
`,
    html(el) {
      let ticks = '', nums = '';
      for (let m = 0; m <= el.max; m += 15) {
        const x = (m / el.max * 100).toFixed(3) + '%', h = m % 60 ? m % 30 ? 5 : 8 : 13;
        ticks += `<line${m % 60 ? '' : ' class="h"'} x1="${x}" x2="${x}" y1="8" y2="${8 + h}"/>`;
        if (m % 60 === 0) nums += `<text x="${x}" y="41">${String(m / 60).padStart(2, '0')}</text>`;
      }
      return `<div class="seat"><div class="k"><div class="belt" data-press><div class="run f"><i class="tape"></i><svg aria-hidden="true">${ticks}${nums}</svg></div></div></div>` +
        `<i class="ptr a"></i><i class="ptr b"></i></div>` +
        `<div class="l"><span class="name">${el.getAttribute('label') || 'Local time'}</span><span class="val"></span></div>`;
    },
    setup(root, el) { el.ls.val = root.querySelector('.val'); el.ls.l = root.querySelector('.l'); },
    hold(root, el, on) { el.ls.l.classList.toggle('show', on); },
    paint(root, el) {
      roll(el.ls, el.value.replace(':', ''), Math.sign(el.v - (el.ls.shown ?? el.v)));
      el.ls.shown = el.v;
    }
  };
})());

<script id="src-scrubber-look-nothing">
/* Scrubber look "nothing": Nothing's flat widget language. A flat tile with a dot-matrix time, its unused leading digit left
   unlit, and a dot scale: a dot every quarter hour, a column of three on each hour, black up to the time and grey after it.
   It is a display, so the scale steps one notch at a time and switches instantly. One red dot (--dial-accent) under the
   scale marks the current position: the only accent. No shadow, texture, dome or glow. Light: a white tile with black dots.
   Dark: a black tile with white dots. */
DetentScrubber.look('nothing', {
  dir: -1,
  css: `
.t { --tile: #ecebe6; --edge: #00000014; --off: #d0cfc9; --on: #1b1b1b; --digits: #1b1b1b; --unlit: #d9d8d2; --label: #8a8a85 }
.t.dark { --tile: #0b0b0b; --edge: #ffffff14; --off: #2c2c2c; --on: #f2f2f2; --digits: #f2f2f2; --unlit: #2e2e2e; --label: #7c7c7c }
.tile { position: relative; padding: 20px 0 18px; border-radius: 24px; background: var(--tile); box-shadow: inset 0 0 0 1px var(--edge) }

.k { height: 56px; margin: 16px 20px 0; overflow: hidden }
.run { position: absolute; top: 0; bottom: 0; left: 50%; width: 400% }
svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none }
circle { fill: var(--off) }
.on circle { fill: var(--on) }
text { fill: var(--label); font: 400 9px "Geist Mono", ui-monospace, monospace; letter-spacing: .1em; text-anchor: middle; font-variant-numeric: tabular-nums }
.head { position: absolute; left: 50%; top: 33px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--dial-accent, #d71921) }
.lab { margin-top: 12px; text-align: center; font: 400 10px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .16em; color: var(--label); text-transform: uppercase }
:host(:focus-visible) .tile { outline: 2px solid var(--dial-accent, #d71921); outline-offset: 3px }
`,
  html(el) {
    let marks = '';
    for (let m = 0; m <= el.max; m += 15) {
      const x = (m / el.max * 100).toFixed(3) + '%', dots = m % 60 ? [24] : [8, 16, 24];
      marks += `<g data-m="${m}">${dots.map(y => `<circle cx="${x}" cy="${y}" r="2"/>`).join('')}</g>`;
      if (m % 180 === 0) marks += `<text x="${x}" y="52">${String(m / 60).padStart(2, '0')}</text>`;
    }
    return `<div class="tile" data-press><div class="n"></div><div class="k"><div class="run"><svg aria-hidden="true">${marks}</svg></div><i class="head"></i></div>` +
      `<div class="lab">${el.getAttribute('label') || 'Local time'}</div></div>`;
  },
  setup(root, el) {
    el.ls.run = root.querySelector('.run'); el.ls.n = root.querySelector('.n');
    el.ls.cols = [...root.querySelectorAll('g')].map(g => [g, +g.dataset.m]);
  },
  // Drawn at the committed notch, not the lean or the coast: a display shows the value it has, and steps with each click.
  paint(root, el) {
    const ls = el.ls;
    ls.run.style.translate = `${(-el.v / el.max * ls.run.clientWidth).toFixed(2)}px 0`;
    if (ls.v === el.v) return;
    ls.v = el.v;
    ls.cols.forEach(([g, m]) => g.classList.toggle('on', m <= el.v));
    const s = el.value, lead = s[0] === '0' ? 1 : 0;

  }
});
</script>

<script id="src-scrubber-look-aqua">
/* Scrubber look "aqua": a printed tape slides under a fixed candy-glass magnifier, like early Mac OS X. The glass really

   (--dial-accent) up to the hairline. The specular highlight and the caustic the glass throws on the tape come from the room
   light above, so neither moves; only the print slides. Glass doesn't sink: a finger only tightens its shadow.
   Dark tone: tinted dark glass over a dark tape. */
DetentScrubber.look('aqua', (() => {
  // One copy of the tape's print. fill: only the blue track, for the copy that is clipped at the hairline.
  const print = (el, fill) => {
    if (fill) return `<i class="band fill"></i>`;
    let ticks = '', nums = '';
    for (let m = 0; m <= el.max; m += 15) {
