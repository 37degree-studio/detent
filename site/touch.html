<script type="text/plain" id="swift-pointer-knob">
// PointerKnob.swift — Detent
// A guitar-pedal potentiometer knob. It turns smoothly with your finger, with a fine tick every
// twentieth of its sweep, and stops hard at both ends. centerDetent adds the bump at 12 o'clock that pedal EQ knobs have. The value readout rolls
// like an odometer while you turn; double-tap turns it back to where it started. iOS / iPadOS 17+.
//
// Usage:
//   @State private var gain = 5.0
//   PointerKnob(value: $gain, label: "Gain")
//   PointerKnob(value: $bass, in: -12...12, label: "Bass", centerDetent: true)

import SwiftUI
import UIKit
import AVFoundation

public struct PointerKnob: View {
    @Binding private var value: Double
    private let range: ClosedRange<Double>
    private let label: String
    private let size: CGFloat
    private let knob: Color
    private let tick: Color
    private let centerDetent: Bool
    private let sound: Bool
    private let initial: Double

    public init(value: Binding<Double>,
                in range: ClosedRange<Double> = 0...10,
                label: String = "Value",
                size: CGFloat = 110,
                knob: Color = Color(white: 0.29),
                tick: Color = .white,
                centerDetent: Bool = false,
                sound: Bool = true) {
        _value = value
        self.range = range
        self.label = label
        self.size = size
        self.knob = knob
        self.tick = tick
        self.centerDetent = centerDetent
        self.sound = sound
        self.initial = value.wrappedValue
    }

    @State private var raw: Double?
    @State private var lastAngle: Double?
    @State private var pressed = false
    @State private var held = false
    @State private var atEdge = 0
    @State private var notch = 0
    @State private var hovering = false
    @FocusState private var focused: Bool
    @Environment(\.accessibilityReduceMotion) private var reduceMotion

    private var span: Double { range.upperBound - range.lowerBound }
    private var mid: Double { (range.lowerBound + range.upperBound) / 2 }
    private var angle: Angle { .degrees(-150 + (value - range.lowerBound) / span * 300) }
    private var showValue: Bool { pressed || hovering || focused }

    public var body: some View {
        VStack(spacing: 12) {
            ZStack {
                seat
                cap
            }
            .frame(width: size + 12, height: size + 12)
            .gesture(turnGesture)
                .onTapGesture(count: 2) { reset() }
            ZStack {
                Text(label)
                    .opacity(showValue ? 0 : 1)
                // The readout rolls like an odometer, blurred along the motion while it moves.
                Text(value, format: .number.precision(.fractionLength(1)))
                    .font(.system(size: 13, weight: .medium, design: .monospaced))
                    .contentTransition(.numericText(value: value))
                    .animation(reduceMotion ? nil : .snappy(duration: 0.18), value: value)
                    .opacity(showValue ? 1 : 0)
            }
            .font(.system(size: 13, weight: .medium))
            .foregroundStyle(Color(white: 0.17))
            .animation(.easeOut(duration: 0.15), value: showValue)
        }
        .onHover { hovering = $0 }
        .focusable()
        .focused($focused)
        .onKeyPress(keys: [.upArrow, .rightArrow, .downArrow, .leftArrow]) { press in
            nudge(press.key == .upArrow || press.key == .rightArrow ? span * 0.01 : -span * 0.01)
            return .handled
        }
        .accessibilityElement()
        .accessibilityLabel(label)
        .accessibilityValue(value.formatted(.number.precision(.fractionLength(1))))
        .accessibilityAdjustableAction { direction in
            switch direction {
            case .increment: nudge(span * 0.05)
            case .decrement: nudge(-span * 0.05)
            @unknown default: break
            }
        }
    }

    // Matte plastic cap, lit from above, sitting on the panel with a contact shadow. A printed pointer line.
    // The seat: a shallow recess in the panel the knob sits in. Always there; the knob sinks into it, the seat never moves.
    private var seat: some View {
        Circle()
            .fill(.black.opacity(0.06))
            .overlay(Circle().strokeBorder(.black.opacity(0.16), lineWidth: 2).blur(radius: 1).offset(y: 1).mask(Circle()))
            .overlay(Circle().strokeBorder(.white.opacity(0.7), lineWidth: 1).offset(y: 1)
                .mask(LinearGradient(colors: [.clear, .white], startPoint: .center, endPoint: .bottom)))
            .frame(width: size + 12, height: size + 12)
    }

    private var cap: some View {
        let light = RadialGradient(colors: [.white.opacity(0.09), .clear, .black.opacity(0.18)],
                                   center: UnitPoint(x: 0.5, y: 0.28), startRadius: 0, endRadius: size * 0.6)
        return ZStack {
            Circle().fill(knob)
            Circle().fill(light)
            Circle().strokeBorder(.white.opacity(0.12), lineWidth: 1)
                .mask(LinearGradient(colors: [.white, .clear], startPoint: .top, endPoint: .center))
            Capsule()
                .fill(tick)
                .frame(width: 2, height: size * 0.16)
                .offset(y: -size * 0.34)
                .rotationEffect(angle)
        }
        .frame(width: size, height: size)
        .contentShape(Circle())
        .shadow(color: .black.opacity(0.3), radius: pressed ? 0.6 : 0.9, y: pressed ? 0.5 : 1)
        .shadow(color: .black.opacity(0.2), radius: pressed ? 2 : 3, y: pressed ? 2 : 3)
        .shadow(color: .black.opacity(0.28), radius: pressed ? 5 : 8, y: pressed ? 5 : 8)
        .scaleEffect(pressed ? 0.994 : 1)                // a finger presses it in a hair; it never lifts
        .offset(y: pressed ? 0.5 : 0)
    }

    private var turnGesture: some Gesture {
        DragGesture(minimumDistance: 0)
            .onChanged { g in
                let c = (size + 12) / 2                           // the gesture lives on the seat, 6pt larger all round
                let dx = g.location.x - c, dy = g.location.y - c
                guard hypot(dx, dy) > 8 else { return }
                let a = atan2(dy, dx) * 180 / .pi
                if raw == nil {
                    raw = value
                    withAnimation(.easeOut(duration: 0.05)) { pressed = true }
                    Feedback.shared.prepare()
                }
                if let last = lastAngle {
                    var d = a - last
                    if d > 180 { d -= 360 } else if d < -180 { d += 360 }
                    turn(by: d / 300 * span)
                }
                lastAngle = a
            }
            .onEnded { _ in
                lastAngle = nil
                raw = nil
                withAnimation(.easeOut(duration: 0.05)) { pressed = false }
            }
    }

    private func turn(by dv: Double) {
        // Hard end stops: past them the knob simply doesn't turn.
        let r = min(range.upperBound, max(range.lowerBound, (raw ?? value) + dv))
        raw = r
        var v = r
        if centerDetent {
            // The center detent holds the knob at 12 o'clock until you push a little past it.
            let inside = abs(r - mid) < span * 0.03
            if inside { v = mid }
            if inside && !held { Feedback.shared.detent(sound: sound) }
            held = inside
        }
        commit(v)
    }

    private func nudge(_ dv: Double) {
        raw = value
        turn(by: dv)
        raw = nil
    }

    // Double-tap: someone turns it back by hand. Quick, no bounce.
    private func reset() {
        withAnimation(reduceMotion ? nil : .timingCurve(0.4, 0, 0.2, 1, duration: 0.22)) { value = initial }
    }

    // A fine tick every twentieth of the sweep, a dull one at the end stops.
    private func commit(_ v: Double) {
        guard v != value else { return }
        value = v
        let n = Int(((v - range.lowerBound) / span * 20).rounded())
        if v > range.lowerBound, v < range.upperBound, n != notch, !(centerDetent && v == mid) { Feedback.shared.tick(sound: sound) }
        notch = n
        let edge = v <= range.lowerBound ? -1 : v >= range.upperBound ? 1 : 0
        if edge != 0 && atEdge != edge { Feedback.shared.stop(sound: sound) }
        if edge != 0 { atEdge = edge }
        else if (atEdge < 0 && v > range.lowerBound + span * 0.03) || (atEdge > 0 && v < range.upperBound - span * 0.03) { atEdge = 0 }
    }
}

/// A light tap per notch, a firmer one at the center detent and the end stops.
@MainActor private final class Feedback {
    static let shared = Feedback()
    private let rigid = UIImpactFeedbackGenerator(style: .rigid)
    private let synth = ClickSynth()

    private let soft = UIImpactFeedbackGenerator(style: .soft)

    func prepare() { rigid.prepare(); soft.prepare() }
    func tick(sound: Bool) {
        soft.impactOccurred(intensity: 0.4)
        soft.prepare()
        if sound { synth.play(.tick) }
    }
    func detent(sound: Bool) {
        rigid.impactOccurred(intensity: 0.5)
        rigid.prepare()
        if sound { synth.play(.detent) }
    }
    func stop(sound: Bool) {
        rigid.impactOccurred(intensity: 0.6)
        if sound { synth.play(.stop) }
    }
}

/// Small hard parts can't make a pitched thump: they ring for a millisecond or two at a few high body modes.
private final class ClickSynth {
    enum Voice: CaseIterable { case tick, detent, stop }
    private let engine = AVAudioEngine()
    private let player = AVAudioPlayerNode()
    private var buffers: [Voice: AVAudioPCMBuffer] = [:]
    private var ready = false

    init() {
        guard let format = AVAudioFormat(standardFormatWithSampleRate: 44_100, channels: 1) else { return }
        engine.attach(player)
        engine.connect(player, to: engine.mainMixerNode, format: format)
        for voice in Voice.allCases { buffers[voice] = Self.render(voice, format: format) }
        // Ambient: respects the silent switch and mixes with the user's music.
        try? AVAudioSession.sharedInstance().setCategory(.ambient, options: [.mixWithOthers])
        ready = (try? engine.start()) != nil
    }

    func play(_ voice: Voice) {
        guard ready, let buffer = buffers[voice] else { return }
        player.scheduleBuffer(buffer, at: nil, options: .interrupts)
        if !player.isPlaying { player.play() }
    }

    private static let modes: [(Float, Float, Float)] = [(1900, 0.0024, 1), (3400, 0.0015, 0.55), (6100, 0.0008, 0.3)]

    private static func render(_ voice: Voice, format: AVAudioFormat) -> AVAudioPCMBuffer? {
        let rate = Float(format.sampleRate)
        let frames = AVAudioFrameCount(rate * 0.02)
        guard let buffer = AVAudioPCMBuffer(pcmFormat: format, frameCapacity: frames),
              let out = buffer.floatChannelData?[0] else { return nil }
        buffer.frameLength = frames
        if voice == .tick {
            // The fine tick: a few milliseconds of bright, high-passed noise.
            var smooth: Float = 0
            for i in 0..<Int(frames) {
                let t = Float(i) / rate
                let white = Float.random(in: -1...1)
                smooth += (white - smooth) * 0.12
                out[i] = (white - smooth) * expf(-t / 0.0025) * 0.2
            }
            return buffer
        }
        let (level, tune): (Float, Float) = voice == .detent ? (0.05, 1.2) : (0.09, 0.85)
        for i in 0..<Int(frames) {
            let t = Float(i) / rate
            var tick: Float = 0
            for (hz, decay, gain) in modes { tick += gain * sinf(2 * .pi * hz * tune * t) * expf(-t / decay) }
            tick += Float.random(in: -1...1) * 0.5 * expf(-t / 0.0003)
            out[i] = tick * level * 2.2
        }
        return buffer
    }
}

        @State private var bass = 0.0
        var body: some View {
            HStack(spacing: 28) {
                PointerKnob(value: $gain, label: "Gain")
                PointerKnob(value: $level, label: "Level")

            }
            .padding(40)
            .frame(maxWidth: .infinity, maxHeight: .infinity)
            .background(Color(red: 0.94, green: 0.94, blue: 0.93))
        }
    }
    return Demo()
}

// ScaleRing.swift — Detent
// A rotating bezel with a dB scale and a level scale, read against a fixed index line. It ratchets: the
// ring gives a little, then clicks into each of its 20 positions, and turns endlessly. oneWay makes it a
// dive bezel: counterclockwise only, the ratchet blocks the other way. weighted makes the ring heavy: flick it and
// it carries on 2 to 4 clicks after you let go, easing down over most of a second until it rests in the last notch. The readout is an LED display: digits switch instantly. iOS / iPadOS 17+.
// The readout uses a monospaced system font; add the Doto font to your app and pass readoutFont for the dot-matrix look.
//
// Usage:
//   @State private var step = 4          // 0...19; the dB value is -3 × step
//   ScaleRing(step: $step)
//   ScaleRing(step: $step, size: 260, oneWay: true)
//   ScaleRing(step: $step, weighted: true)

import SwiftUI
import UIKit
import AVFoundation

public struct ScaleRing: View {
    @Binding private var step: Int
    private let size: CGFloat
    private let marker: Color
    private let oneWay: Bool
    private let weighted: Bool
    private let sound: Bool
    private let readoutFont: Font?

    public init(step: Binding<Int>,
                size: CGFloat = 300,
                marker: Color = Color(red: 0.9, green: 0.14, blue: 0.16),
                oneWay: Bool = false,
                weighted: Bool = false,
                sound: Bool = true,
                readoutFont: Font? = nil) {
        _step = step
        self.size = size
        self.marker = marker
        self.oneWay = oneWay
        self.weighted = weighted
        self.sound = sound
        self.readoutFont = readoutFont
    }

    @State private var turns: Int = 0           // total clicks since appearing, so the ring never spins back the long way
    @State private var acc: Double = 0          // degrees pushed past the current click
    @State private var pushDir: Double = 0
    @State private var lastAngle: Double?
    @State private var trail: [(Double, Double)] = []     // (ms, cumulative degrees) over the last 80ms, for fling speed
    @State private var coastAngle: Double?                // the ring's free angle while it spins on its own
    @State private var coastTask: Task<Void, Never>?
    @FocusState private var focused: Bool
    @Environment(\.accessibilityReduceMotion) private var reduceMotion

    private var give: Double { pushDir != 0 && acc.sign == pushDir.sign ? acc * 0.25 : 0 }
    private var ringAngle: Double { coastAngle ?? -18 * Double(turns) + give }
    private var dB: Int { -3 * step }
    // The ratchet spring throws the ring into each position: it accelerates and stops dead.
    private var snap: Animation? { reduceMotion ? nil : .timingCurve(0.55, 0, 1, 1, duration: 0.06) }

    public var body: some View {
        ZStack {
            RingFace(marker: marker)
                .rotationEffect(.degrees(ringAngle))
            Index()
            VStack(spacing: size * 0.01) {
                Text(step == 0 ? "0" : "\(dB)")
                    .font(readoutFont ?? .system(size: size * 0.15, weight: .heavy, design: .monospaced))
                    .contentTransition(.identity)          // an LED display: digits switch, they don't roll
                    .foregroundStyle(Color(white: 0.94))
                Text("dB · lvl \(String(format: "%02d", (100 - step * 5) % 100))")
                    .font(.system(size: 11, design: .monospaced))
                    .tracking(1.5)
                    .textCase(.uppercase)
                    .foregroundStyle(Color(white: 0.54))
            }
        }
        .frame(width: size, height: size)
        .contentShape(Circle())
        .gesture(turnGesture)
        .onAppear { turns = step }
        .focusable()
        .focused($focused)
        .onKeyPress(keys: [.upArrow, .rightArrow, .downArrow, .leftArrow]) { press in
            nudge(press.key == .upArrow || press.key == .rightArrow ? 1 : -1)
            return .handled
        }
        .accessibilityElement()
        .accessibilityLabel("Level")
        .accessibilityValue("\(dB) decibels")
        .accessibilityAdjustableAction { direction in
            switch direction {
            case .increment: nudge(1)
            case .decrement: nudge(-1)
            @unknown default: break
            }
        }
    }

    private var turnGesture: some Gesture {
        DragGesture(minimumDistance: 0)
            .onChanged { g in
                let dx = g.location.x - size / 2, dy = g.location.y - size / 2
                guard hypot(dx, dy) > 8 else { return }
                let a = atan2(dy, dx) * 180 / .pi
                if lastAngle == nil { catchRing(); acc = 0; trail = []; Feedback.shared.prepare() }
                if let last = lastAngle {
                    var d = a - last
                    if d > 180 { d -= 360 } else if d < -180 { d += 360 }
                    let now = Date.timeIntervalSinceReferenceDate * 1000
                    trail.append((now, (trail.last?.1 ?? 0) + d))
                    while trail.count > 2, let first = trail.first, now - first.0 > 80 { trail.removeFirst() }
                    push(d)
                }
                lastAngle = a
            }
            .onEnded { _ in
                lastAngle = nil
                if weighted, !reduceMotion, fling() { return }
                // The ratchet pulls the ring back into its last click.
                withAnimation(reduceMotion ? nil : .timingCurve(0.2, 0, 0.3, 1, duration: 0.08)) { acc = 0; pushDir = 0 }
            }
    }

    // d: degrees the finger moved the ring, clockwise positive.
    private func push(_ d: Double) {
        pushDir = d < 0 ? -1 : 1
        acc += d
        if oneWay && acc > 0 { acc = 0 }           // the ratchet blocks clockwise: no give at all
        while abs(acc) > 9 {
            let dir = acc < 0 ? -1.0 : 1.0
            acc -= dir * 18
            click(dir < 0 ? 1 : -1)
        }
    }

    // Weighted: release speed over the last 80ms, in degrees per millisecond. A slow or stopped release doesn't spin.
    private func fling() -> Bool {
        let now = Date.timeIntervalSinceReferenceDate * 1000
        guard trail.count >= 2, let first = trail.first, let last = trail.last, now - last.0 < 60 else { return false }
        let v = (last.1 - first.1) / max(1, last.0 - first.0)
        guard abs(v) >= 0.3, !(oneWay && v > 0) else { return false }
        coast(from: ringAngle, speed: max(-2.5, min(2.5, v)))
        return true
    }

    // The ring is heavy, so a flick carries it on after you let go: 2 more clicks for a gentle flick, up to 4 for a
    // hard one. It leaves your finger at the flick's speed, drag bleeds that down to a slow creep within a few degrees,
    // and friction then eases it to rest in the last notch over most of a second. So the clicks start quick and spread
    // out, the last gap the longest.
    // The whole coast is worked out at release, and its clicks are rendered as one sample-accurate audio track.
    static func spin(from start: Double, speed v: Double) -> (path: [Double], clicks: [(ms: Double, turns: Int)], end: Double) {
        let dir: Double = v < 0 ? -1 : 1
        let fast = min(1, max(0, (abs(v) - 0.3) / 1.7))
        let n = 2 + Int((fast * 2).rounded())                       // 2, 3 or 4 clicks
        let home = -18 * (-start / 18).rounded(), rest = home + dir * 18 * Double(n), dist = abs(rest - start)
        let creep = 2 * dist / (500 + 150 * Double(n))              // the slow pace it eases down to, degrees per ms
        // speed by distance travelled: the flick, bled off by drag, times the friction curve that stops it in the notch
        func speed(_ x: Double) -> Double {
            (creep + max(0, abs(v) - creep) * exp(-x / 4)) * max(0, 1 - x / dist).squareRoot()
        }
        var pos = start, x = 0.0, t = 0.0
        var click = Int((-pos / 18).rounded())
        var path = [pos], clicks: [(ms: Double, turns: Int)] = []
        while dist - x > 0.02 && t < 4000 {
            let prev = pos
            x = min(dist, x + max(speed(x), 0.004))
            pos = start + dir * x
            t += 1
            let k = Int((-pos / 18).rounded())
            if k != click {
                let top = -18 * (Double(min(k, click)) + 0.5)          // the hilltop between the two notches
                clicks.append((ms: t - 1 + (top - prev) / (pos - prev), turns: k))
                click = k
            }
            path.append(pos)
        }
        path[path.count - 1] = rest
        return (path, clicks, t)
    }

    private func coast(from start: Double, speed: Double) {
        acc = 0
        pushDir = 0
        coastAngle = start
        coastTask?.cancel()
        let spin = Self.spin(from: start, speed: speed)
        Feedback.shared.spin(at: spin.clicks.map(\.ms), sound: sound)
        coastTask = Task { @MainActor in
            let t0 = Date.timeIntervalSinceReferenceDate
            var done = 0
            while !Task.isCancelled {
                let t = (Date.timeIntervalSinceReferenceDate - t0) * 1000
                while done < spin.clicks.count, spin.clicks[done].ms <= t {
                    let k = spin.clicks[done].turns
                    turns = k
                    step = ((k % 20) + 20) % 20
                    Feedback.shared.tap()
                    done += 1
                }
                if t >= spin.end { break }
                let i = min(spin.path.count - 2, Int(t)), f = t - Double(i)
                coastAngle = spin.path[i] + (spin.path[i + 1] - spin.path[i]) * f
                try? await Task.sleep(for: .milliseconds(4))
            }
            guard !Task.isCancelled else { return }
            coastAngle = nil
            coastTask = nil
        }
    }

    // A finger on a spinning ring stops it: its click track is cut off and it settles into the nearest notch.
    private func catchRing() {
        guard coastTask != nil else { return }
        coastTask?.cancel()
        coastTask = nil
        Feedback.shared.cancelSpin()
        if let at = coastAngle { turns = Int((-at / 18).rounded()); step = ((turns % 20) + 20) % 20 }
        withAnimation(.timingCurve(0.2, 0, 0.3, 1, duration: 0.08)) { coastAngle = nil }
    }

    // n = +1 is one click counterclockwise, which brings the next mark under the index.
    private func nudge(_ n: Int) {
        if oneWay && n < 0 { return }
        click(n)
    }

    private func click(_ n: Int) {
        withAnimation(snap) {
            turns += n
            step = ((step + n) % 20 + 20) % 20
        }
        Feedback.shared.click(sound: sound)
    }
}

/// The ring itself: serrated grip, printed dB and level scales, and the marker ticks. It all turns together.
private struct RingFace: View {
    let marker: Color
    var body: some View {
        Canvas { ctx, size in
            let s = min(size.width, size.height) / 320       // drawn on a 320-unit grid
            let c = CGPoint(x: size.width / 2, y: size.height / 2)
            func radial(_ angle: Double, _ r1: CGFloat, _ r2: CGFloat) -> Path {
                let a = (angle - 90) * .pi / 180
                var p = Path()
                p.move(to: CGPoint(x: c.x + cos(a) * r1 * s, y: c.y + sin(a) * r1 * s))
                p.addLine(to: CGPoint(x: c.x + cos(a) * r2 * s, y: c.y + sin(a) * r2 * s))
                return p
            }
            ctx.stroke(Path(ellipseIn: CGRect(x: c.x - 141 * s, y: c.y - 141 * s, width: 282 * s, height: 282 * s)),
                       with: .color(Color(white: 0.23)), lineWidth: 1.2 * s)
            // The serrated outer edge: the coin-edge grip real bezels have.
            for i in 0..<120 { ctx.stroke(radial(Double(i) * 3, 141, 147), with: .color(Color(white: 0.18)), lineWidth: 1.4 * s) }
            for k in [3, 7, 14] {
                ctx.stroke(radial(Double(k) * 18 - 9, 125, 133), with: .color(marker), style: StrokeStyle(lineWidth: 2.4 * s, lineCap: .round))
            }
            for k in 0..<20 {
                let outer = k == 0 ? "0 dB" : "−" + String(format: "%02d", k * 3)
                let inner = String(format: "%02d", (100 - k * 5) % 100)
                for (label, r, shade) in [(outer, 110.0, 0.84), (inner, 82.0, 0.66)] {
                    var t = ctx
                    t.translateBy(x: c.x, y: c.y)
                    t.rotate(by: .degrees(Double(k) * 18))
                    t.draw(Text(label).font(.system(size: 12.5 * s, design: .monospaced)).foregroundStyle(Color(white: shade)),
                           at: CGPoint(x: 0, y: -r * s))
                }
            }
        }
    }
}

/// The fixed index lines: one above the ring, one inside it.
private struct Index: View {
    var body: some View {
        Canvas { ctx, size in
            let s = min(size.width, size.height) / 320
            let x = size.width / 2
            for (y1, y2) in [(0.0, 10.0), (92.0, 102.0)] {
                var p = Path()
                p.move(to: CGPoint(x: x, y: y1 * s))
                p.addLine(to: CGPoint(x: x, y: y2 * s))
                ctx.stroke(p, with: .color(Color(white: 0.92)), lineWidth: 1.6 * s)
            }
        }
        .allowsHitTesting(false)
    }
}

/// One light, crisp haptic per click.
@MainActor private final class Feedback {
    static let shared = Feedback()
    private let rigid = UIImpactFeedbackGenerator(style: .rigid)
    private let synth = ClickSynth()

    func prepare() { rigid.prepare() }
    func tap() {
        rigid.impactOccurred(intensity: 0.55)
        rigid.prepare()
    }
    func click(sound: Bool) {
        tap()
        if sound { synth.play() }
    }
    func spin(at ms: [Double], sound: Bool) { if sound { synth.playTrack(at: ms) } }
    func cancelSpin() { synth.stop() }
}

/// A bezel ratchet click: small metal parts ringing for a millisecond or two at a few high body modes.
private final class ClickSynth {
    private let engine = AVAudioEngine()
    private let player = AVAudioPlayerNode()
    private var format: AVAudioFormat?
    private var tick: [Float] = []
    private var ready = false

    init() {
        guard let format = AVAudioFormat(standardFormatWithSampleRate: 44_100, channels: 1) else { return }
        self.format = format
        engine.attach(player)
        engine.connect(player, to: engine.mainMixerNode, format: format)
        tick = Self.renderTick(rate: Float(format.sampleRate))
        // Ambient: respects the silent switch and mixes with the user's music.
        try? AVAudioSession.sharedInstance().setCategory(.ambient, options: [.mixWithOthers])
        ready = (try? engine.start()) != nil
    }

    func play() { playTrack(at: [0]) }

    /// Mixes one click at each time (ms from now) into a single buffer, so their spacing is exact to the sample.
    func playTrack(at ms: [Double]) {
        guard ready, let format, let lastMs = ms.max() else { return }
        let rate = format.sampleRate
        let frames = AVAudioFrameCount(rate * (lastMs / 1000 + 0.03))
        guard let buffer = AVAudioPCMBuffer(pcmFormat: format, frameCapacity: frames),
              let out = buffer.floatChannelData?[0] else { return }
        buffer.frameLength = frames
        for i in 0..<Int(frames) { out[i] = 0 }
        for m in ms {
            let start = Int(m / 1000 * rate)
            for j in 0..<tick.count where start + j < Int(frames) { out[start + j] += tick[j] }
        }
        player.stop()
        player.scheduleBuffer(buffer, at: nil, options: .interrupts)
        player.play()
    }

    func stop() { player.stop() }

    private static let modes: [(Float, Float, Float)] = [(1900, 0.0024, 1), (3400, 0.0015, 0.55), (6100, 0.0008, 0.3)]

    private static func renderTick(rate: Float) -> [Float] {
        let (level, tune): (Float, Float) = (0.07, 1.6)
        return (0..<Int(rate * 0.02)).map { i in
            let t = Float(i) / rate
            var tick: Float = 0
            for (hz, decay, gain) in modes { tick += gain * sinf(2 * .pi * hz * tune * t) * expf(-t / decay) }
            tick += Float.random(in: -1...1) * 0.5 * expf(-t / 0.0003)
            return tick * level * 2.2
        }
    }
}

    struct Demo: View {
        @State private var step = 4
        var body: some View {
            ScaleRing(step: $step, weighted: true)
                .padding(40)
                .frame(maxWidth: .infinity, maxHeight: .infinity)
                .background(Color(white: 0.04))
        }
    }
    return Demo()
}

// DotDial.swift — Detent
// A touch wheel with a ring of dots and a dot-matrix readout, drawn the way Nothing draws: flat, monochrome, one
// red dot for the current position, dot-matrix type only for the number. There are no moving parts: you slide a
// finger around the ring, and each step makes the tiny electronic tick of a touch wheel's clicker. Dots switch
// instantly. iOS / iPadOS 17+. The readout uses a monospaced system font; pass readoutFont for a dot-matrix face.
//
// Usage:
//   @State private var level = 72.0
//   DotDial(value: $level, label: "Level")
//   DotDial(value: $level, size: 200, head: .orange, tone: .light)

import SwiftUI
import UIKit
import AVFoundation

public struct DotDial: View {
    public enum Tone { case auto, light, dark }

    @Binding private var value: Double          // 0...100
    private let label: String
    private let size: CGFloat
    private let head: Color
    private let tone: Tone
    private let sound: Bool
    private let readoutFont: Font?

    public init(value: Binding<Double>,
                label: String = "Level",
                size: CGFloat = 240,
                head: Color = Color(red: 0.9, green: 0.14, blue: 0.16),
                tone: Tone = .auto,
                sound: Bool = true,
                readoutFont: Font? = nil) {
        _value = value
        self.label = label
        self.size = size
        self.head = head
        self.tone = tone
        self.sound = sound
        self.readoutFont = readoutFont
    }

    @State private var lastAngle: Double?
    @State private var atEdge = 0
    @FocusState private var focused: Bool
    @Environment(\.colorScheme) private var scheme

    private let count = 40
    private var dark: Bool { tone == .dark || (tone == .auto && scheme == .dark) }
    private var lit: Int { Int((value / 100 * Double(count - 1)).rounded()) }

    public var body: some View {
        ZStack {
            Circle()
                .fill(dark ? Color(white: 0.043) : Color(red: 0.925, green: 0.922, blue: 0.902))
                .overlay(Circle().strokeBorder(dark ? Color.white.opacity(0.07) : Color.black.opacity(0.08), lineWidth: 1))
            ring
            VStack(spacing: 8) {
                readout
                Text(label)
                    .font(.system(size: 11, design: .monospaced))
                    .tracking(1.8)
                    .textCase(.uppercase)
                    .foregroundStyle(Color(white: dark ? 0.49 : 0.54))
            }
        }
        .frame(width: size, height: size)
        .contentShape(Circle())
        .gesture(turnGesture)
        .focusable()
        .focused($focused)
        .onKeyPress(keys: [.upArrow, .rightArrow, .downArrow, .leftArrow]) { press in
            set(value + (press.key == .upArrow || press.key == .rightArrow ? 1 : -1))
            return .handled
        }
        .accessibilityElement()
        .accessibilityLabel(label)
        .accessibilityValue("\(Int(value.rounded()))")
        .accessibilityAdjustableAction { direction in
            switch direction {
            case .increment: set(value + 5)
            case .decrement: set(value - 5)
            @unknown default: break
            }
        }
    }

    // Dots switch instantly: no fades, so no animation here.
    private var ring: some View {
        ZStack {
            ForEach(0..<count, id: \.self) { i in
                let on = i < lit, isHead = i == lit
                Circle()
                    .fill(isHead ? head : on ? (dark ? Color(white: 0.95) : Color(white: 0.106)) : (dark ? Color(white: 0.15) : Color(red: 0.84, green: 0.835, blue: 0.81)))
                    .frame(width: size * 0.036, height: size * 0.036)
                    .offset(y: -size * 0.41)
                    .rotationEffect(.degrees(-150 + Double(i) * 300 / Double(count - 1)))
            }
        }
        .transaction { $0.animation = nil }
    }

    // Unused leading digits stay as unlit segments.
    private var readout: some View {
        let digits = String(format: "%03d", Int(value.rounded()))
        let leading = digits.prefix { $0 == "0" }.count
        let lead = String(digits.prefix(min(leading, 2)))
        let rest = String(digits.dropFirst(min(leading, 2)))
        let litColor = dark ? Color(white: 0.95) : Color(white: 0.106)
        let unlit = dark ? Color(white: 0.18) : Color(red: 0.85, green: 0.847, blue: 0.82)
        return (Text(lead).foregroundStyle(unlit) + Text(rest).foregroundStyle(litColor))
            .font(readoutFont ?? .system(size: size * 0.2, weight: .heavy, design: .monospaced))
            .contentTransition(.identity)
    }

    // A touch wheel follows the finger exactly: no give, no detents to push past, no momentum.
    private var turnGesture: some Gesture {
        DragGesture(minimumDistance: 0)
            .onChanged { g in
                let dx = g.location.x - size / 2, dy = g.location.y - size / 2
                guard hypot(dx, dy) > 8 else { return }
                let a = atan2(dy, dx) * 180 / .pi
                if lastAngle == nil { Feedback.shared.prepare() }
                if let last = lastAngle {
                    var d = a - last
                    if d > 180 { d -= 360 } else if d < -180 { d += 360 }
                    set(value + d / 3)
                }
                lastAngle = a
            }
            .onEnded { _ in lastAngle = nil }
    }

    private func set(_ v: Double) {
        let next = min(100, max(0, v))
        guard next != value else { return }
        let before = lit
        value = next
        // The clicker ticks once per dot. The ends are virtual: one dull tick, then nothing.
        if lit != before && next > 0 && next < 100 { Feedback.shared.tick(sound: sound) }
        let edge = next <= 0 ? -1 : next >= 100 ? 1 : 0
        if edge != 0 && atEdge != edge { Feedback.shared.stop(sound: sound) }
        if edge != 0 { atEdge = edge } else if (atEdge < 0 && next > 3) || (atEdge > 0 && next < 97) { atEdge = 0 }
    }
}

/// A light, crisp tap per dot, like a touch wheel's clicker, and a firmer one at the ends.
@MainActor private final class Feedback {
    static let shared = Feedback()
    private let rigid = UIImpactFeedbackGenerator(style: .rigid)
    private let synth = ClickSynth()

    func prepare() { rigid.prepare() }
    func tick(sound: Bool) {
        rigid.impactOccurred(intensity: 0.4)
        rigid.prepare()
        if sound { synth.play(.tick) }
    }
    func stop(sound: Bool) {
        rigid.impactOccurred(intensity: 0.6)
        if sound { synth.play(.stop) }
    }
}

/// A clicker's tick: a tiny part ringing for a millisecond or two at a few high body modes.
private final class ClickSynth {
    enum Voice: CaseIterable { case tick, stop }
    private let engine = AVAudioEngine()
    private let player = AVAudioPlayerNode()
    private var buffers: [Voice: AVAudioPCMBuffer] = [:]
    private var ready = false

    init() {
        guard let format = AVAudioFormat(standardFormatWithSampleRate: 44_100, channels: 1) else { return }
        engine.attach(player)
        engine.connect(player, to: engine.mainMixerNode, format: format)
        for voice in Voice.allCases { buffers[voice] = Self.render(voice, format: format) }
        // Ambient: respects the silent switch and mixes with the user's music.
        try? AVAudioSession.sharedInstance().setCategory(.ambient, options: [.mixWithOthers])
        ready = (try? engine.start()) != nil
    }

    func play(_ voice: Voice) {
        guard ready, let buffer = buffers[voice] else { return }
        player.scheduleBuffer(buffer, at: nil, options: .interrupts)
        if !player.isPlaying { player.play() }
    }

    private static let modes: [(Float, Float, Float)] = [(1900, 0.0024, 1), (3400, 0.0015, 0.55), (6100, 0.0008, 0.3)]

    private static func render(_ voice: Voice, format: AVAudioFormat) -> AVAudioPCMBuffer? {
        let (level, tune): (Float, Float) = voice == .tick ? (0.05, 1.55) : (0.09, 0.85)
        let rate = Float(format.sampleRate)
        let frames = AVAudioFrameCount(rate * 0.02)
        guard let buffer = AVAudioPCMBuffer(pcmFormat: format, frameCapacity: frames),
              let out = buffer.floatChannelData?[0] else { return nil }
        buffer.frameLength = frames
        for i in 0..<Int(frames) {
            let t = Float(i) / rate
            var tick: Float = 0
            for (hz, decay, gain) in modes { tick += gain * sinf(2 * .pi * hz * tune * t) * expf(-t / decay) }
            tick += Float.random(in: -1...1) * 0.5 * expf(-t / 0.0003)
            out[i] = tick * level * 2.2
        }
        return buffer
    }
}

#Preview {
    struct Demo: View {
        @State private var a = 72.0
        @State private var b = 30.0
        var body: some View {
            HStack(spacing: 24) {
                DotDial(value: $a, size: 200, tone: .light)
                DotDial(value: $b, size: 200, tone: .dark)
            }
            .padding(32)
            .frame(maxWidth: .infinity, maxHeight: .infinity)
            .background(Color(white: 0.5))
        }
    }
    return Demo()
}

// SlotSelector.swift — Detent
// A vertical slide selector switch. A plastic cap rides over a slot with a spring detent at each position:
// push and it gives a little, then snaps over center into the next one with a click, and stops hard at both
// ends. The labels are printed on the panel; a small LED beside each one shows the selected position.
// Options run from the bottom up. Follows the color scheme. Haptics and sound are built in. iOS / iPadOS 17+.
//
// Usage:
//   @State private var mode = 1
//   SlotSelector(selection: $mode, options: ["opt a", "opt b", "opt c", "opt d"], label: "mode")
//   SlotSelector(selection: $gain, options: ["low", "high"], label: "gain", led: .orange)
//       .environment(\.colorScheme, .dark)   // force a tone

import SwiftUI
import UIKit
import AVFoundation

public struct SlotSelector: View {
    @Binding private var selection: Int         // 0 = bottom
    private let options: [String]
    private let label: String
    private let row: CGFloat
    private let led: Color
    private let sound: Bool

    public init(selection: Binding<Int>,
                options: [String] = ["opt a", "opt b", "opt c", "opt d"],
                label: String = "mode",
                row: CGFloat = 38,
                led: Color = Color(red: 1, green: 0.23, blue: 0.18),
                sound: Bool = true) {
        _selection = selection
        self.options = options.count < 2 ? ["off", "on"] : options
        self.label = label
        self.row = row
        self.led = led
        self.sound = sound
    }

    @State private var acc: CGFloat = 0         // points pushed past the current position (up is +)
    @State private var pushDir: CGFloat = 0
    @State private var lastY: CGFloat?
    @State private var pressed = false
    @State private var atEdge = 0
    @State private var travel: Task<Void, Never>?
    @FocusState private var focused: Bool
    @Environment(\.colorScheme) private var scheme
    @Environment(\.accessibilityReduceMotion) private var reduceMotion

    private var n: Int { options.count }
    private var index: Int { min(n - 1, max(0, selection)) }
    private var dark: Bool { scheme == .dark }
    // After a snap the cap is ahead of the finger, so it only shows give while it's actually being pushed.
    private var give: CGFloat { acc.sign == pushDir.sign && pushDir != 0 ? acc * 0.25 : 0 }
    private func centerY(_ i: Int) -> CGFloat { (CGFloat(n - i) - 0.5) * row }
    // Over center, the detent spring throws the cap: it accelerates and stops dead. No overshoot.
    private var snap: Animation? { reduceMotion ? nil : .timingCurve(0.55, 0, 1, 1, duration: 0.07) }

    // Printed ink, and the parts' own colors. A dark panel gets a pale cap with a groove; a light one a black cap.
    private var ink: Color { dark ? Color(white: 0.43) : Color(red: 0.47, green: 0.47, blue: 0.44) }
    private var head: Color { dark ? Color(white: 0.9) : Color(white: 0.11) }

    public var body: some View {
        Grid(alignment: .leading, horizontalSpacing: 12, verticalSpacing: 12) {
            GridRow {
                Rectangle().fill(ink).frame(width: 28, height: 1.5).frame(width: 52)
                Text("\(label) [\(n)]").foregroundStyle(head).padding(.leading, 18)
            }
            GridRow(alignment: .top) {
                track
                VStack(alignment: .leading, spacing: 0) {
                    ForEach((0..<n).reversed(), id: \.self) { i in
                        HStack(spacing: 12) {
                            lamp(on: i == index)
                            Text(options[i]).foregroundStyle(ink)
                        }
                        .frame(height: row)
                        .contentShape(Rectangle())
                        .onTapGesture { move(to: i) }
                    }
                }
            }
        }
        .font(.system(size: 17))
        .focusable()
        .focused($focused)
        .onKeyPress(keys: [.upArrow, .rightArrow, .downArrow, .leftArrow]) { press in
            nudge(press.key == .upArrow || press.key == .rightArrow ? 1 : -1)
            return .handled
        }
        .accessibilityElement()
        .accessibilityLabel(label)
        .accessibilityValue(options[index])
        .accessibilityAdjustableAction { direction in
            switch direction {
            case .increment: nudge(1)
            case .decrement: nudge(-1)
            @unknown default: break
            }
        }
    }

    private var track: some View {
        ZStack(alignment: .top) {
            // The slot: shaded under its upper wall, light catching its lower lip.
            RoundedRectangle(cornerRadius: 4)
                .fill(dark ? Color(white: 0.01) : Color(red: 0.2, green: 0.2, blue: 0.18))
                .overlay(RoundedRectangle(cornerRadius: 4).strokeBorder(.black.opacity(dark ? 1 : 0.7), lineWidth: 2)
                    .blur(radius: 1.2).offset(y: 1.5).clipShape(RoundedRectangle(cornerRadius: 4)))
                .background(RoundedRectangle(cornerRadius: 4).fill(.white.opacity(dark ? 0.09 : 0.9)).offset(y: 1))
                .frame(width: 8, height: CGFloat(n - 1) * row + 14)
                .offset(y: row / 2 - 7)
            cap
                .offset(y: centerY(index) - give - 11)
        }
        .frame(width: 52, height: CGFloat(n) * row, alignment: .top)
        .contentShape(Rectangle())
        .gesture(dragGesture)
    }

    // The cap rides on the panel over the slot, lit from above, with a contact shadow below. It never lifts.
    private var cap: some View {
        RoundedRectangle(cornerRadius: 6)
            .fill(LinearGradient(colors: dark ? [Color(white: 0.945), Color(white: 0.835)] : [Color(white: 0.172), Color(white: 0.083)],
                                 startPoint: .top, endPoint: .bottom))
            .overlay(RoundedRectangle(cornerRadius: 6).strokeBorder(.white.opacity(dark ? 1 : 0.12), lineWidth: 1)
                .mask(LinearGradient(colors: [.white, .clear], startPoint: .top, endPoint: UnitPoint(x: 0.5, y: 0.15))))
            .overlay(
                // Dark: a molded groove, its lower wall catching the light. Light: a painted line.
                Capsule().fill(dark ? Color(white: 0.11) : Color(white: 0.95))
                    .frame(width: 40 * 0.56, height: 2)
                    .background(Capsule().fill(.white.opacity(dark ? 0.7 : 0)).offset(y: 0.5))
            )
            .frame(width: 40, height: 22)
            .shadow(color: .black.opacity(0.35), radius: 0.3)
            .shadow(color: .black.opacity(dark ? 0.7 : 0.35), radius: pressed ? 0.5 : 0.75, y: pressed ? 0.5 : 1)
            .shadow(color: .black.opacity(dark ? 0.7 : 0.35), radius: pressed ? 1.5 : 2.5, y: pressed ? 1 : 2.5)
            .scaleEffect(pressed ? 0.994 : 1)        // a finger presses it in a hair; it never lifts
            .offset(y: pressed ? 0.5 : 0)
    }

    // An LED is its own light source: lit, it tints the panel around it a touch. Unlit, it's a dark lens.
    private func lamp(on: Bool) -> some View {
        ZStack {
            Circle().fill(on ? led : (dark ? Color(red: 0.08, green: 0.06, blue: 0.05) : Color(red: 0.35, green: 0.34, blue: 0.31)))
            Circle().fill(on ? AnyShapeStyle(RadialGradient(colors: [.white.opacity(0.55), .clear], center: UnitPoint(x: 0.5, y: 0.4),
                                                            startRadius: 0, endRadius: 2.5))
                             : AnyShapeStyle(led.opacity(dark ? 0.22 : 0.3)))
        }
            .overlay(Circle().strokeBorder(.white.opacity(on ? 0 : 0.18), lineWidth: 0.5)
                .mask(LinearGradient(colors: [.white, .clear], startPoint: .top, endPoint: .center)))
            .frame(width: 6, height: 6)
            .shadow(color: on ? led.opacity(dark ? 0.55 : 0.3) : .clear, radius: 3.5)
            // The LED switches the instant the contact makes. It doesn't fade.
            .transaction { $0.animation = nil }
    }

    private var dragGesture: some Gesture {
        DragGesture(minimumDistance: 0)
            .onChanged { g in
                if lastY == nil {
                    withAnimation(.easeOut(duration: 0.05)) { pressed = true }
                    acc = 0
                    Feedback.shared.prepare()
                    // Pressed in the slot beside the cap: it's pushed along to that position, detent by detent.
                    if abs(g.startLocation.y - centerY(index)) > 13 {
                        move(to: min(n - 1, max(0, n - 1 - Int(g.startLocation.y / row))))
                    }
                    lastY = g.location.y
                    return
                }
                let d = (lastY ?? g.location.y) - g.location.y   // up is +
                lastY = g.location.y
                if d != 0 && travel == nil { push(d) }
            }
            .onEnded { _ in
                lastY = nil
                // Let go between positions and the detent pulls the cap back into place.
                withAnimation(reduceMotion ? nil : .timingCurve(0.2, 0, 0.3, 1, duration: 0.08)) { pressed = false; acc = 0; pushDir = 0 }
            }
    }

    // It only gives a little until it passes halfway to the next position, then the detent throws it over.
    // At either end it sits on its stop and gives nothing at all.
    private func push(_ d: CGFloat) {
        pushDir = d < 0 ? -1 : 1
        acc += d
        if (index == 0 && acc < 0) || (index == n - 1 && acc > 0) {
            acc = 0
            hitStop(index + Int(pushDir))
            return
        }
        // Strictly past halfway: exactly halfway would leave it halfway behind the new position and throw it straight back.
        while abs(acc) > row / 2 {
            let dir = acc < 0 ? -1 : 1
            let next = index + dir
            if next < 0 || next >= n { acc = 0; break }
            acc -= CGFloat(dir) * row
            set(next)
        }
    }

    private func nudge(_ dir: Int) {
        let next = index + dir
        if next < 0 || next >= n { hitStop(next); return }
        set(next)
    }

    // Moved from a distance (a tapped label, a press in the slot), the cap crosses each detent in turn.
    private func move(to target: Int) {
        travel?.cancel()
        travel = Task { @MainActor in
            while index != target && !Task.isCancelled {
                set(index + (target > index ? 1 : -1))
                try? await Task.sleep(for: .milliseconds(70))
            }
            travel = nil
        }
    }

    private func set(_ next: Int) {
        guard next != index, next >= 0, next < n else { return }
        withAnimation(snap) { selection = next }
        Feedback.shared.click(sound: sound)
        if (atEdge < 0 && next > 0) || (atEdge > 0 && next < n - 1) { atEdge = 0 }
        // Arriving at an end, the cap lands on its stop.
        if next == 0 || next == n - 1 { hitStop(next == 0 ? -1 : n) }
    }

    // End stops sound once on arrival and stay silent while you keep pushing.
    private func hitStop(_ next: Int) {
        let side = next < 0 ? -1 : 1
        guard atEdge != side else { return }
        atEdge = side
        Feedback.shared.stop(sound: sound)
    }
}

/// A firm haptic per position, like the detent spring snapping over. Nothing on touch-down.
@MainActor private final class Feedback {
    static let shared = Feedback()
    private let rigid = UIImpactFeedbackGenerator(style: .rigid)
    private let synth = ClickSynth()

    func prepare() { rigid.prepare() }
    func click(sound: Bool) {
        rigid.impactOccurred(intensity: 0.85)
        rigid.prepare()
        if sound { synth.play(.click) }
    }
    func stop(sound: Bool) {
        rigid.impactOccurred(intensity: 0.6)
        if sound { synth.play(.stop) }
    }
}

/// Small hard parts can't make a pitched thump: they ring for a millisecond or two at a few high body modes.
/// A selector makes two: the detent dropping into place, then the contact settling.
private final class ClickSynth {
    enum Voice: CaseIterable { case click, stop }
    private let engine = AVAudioEngine()
    private let player = AVAudioPlayerNode()
    private var buffers: [Voice: AVAudioPCMBuffer] = [:]
    private var ready = false

    init() {
        guard let format = AVAudioFormat(standardFormatWithSampleRate: 44_100, channels: 1) else { return }
        engine.attach(player)
        engine.connect(player, to: engine.mainMixerNode, format: format)
        for voice in Voice.allCases { buffers[voice] = Self.render(voice, format: format) }
        // Ambient: respects the silent switch and mixes with the user's music.
        try? AVAudioSession.sharedInstance().setCategory(.ambient, options: [.mixWithOthers])
        ready = (try? engine.start()) != nil
    }

    func play(_ voice: Voice) {
        guard ready, let buffer = buffers[voice] else { return }
        player.scheduleBuffer(buffer, at: nil, options: .interrupts)
        if !player.isPlaying { player.play() }
    }

    private static let modes: [(Float, Float, Float)] = [(1900, 0.0024, 1), (3400, 0.0015, 0.55), (6100, 0.0008, 0.3)]

    private static func render(_ voice: Voice, format: AVAudioFormat) -> AVAudioPCMBuffer? {
        // (start time, level, tuning) for each tick
        let ticks: [(Float, Float, Float)] = voice == .click
            ? [(0, 0.12, 0.95), (0.006, 0.035, 1.25)]
            : [(0, 0.09, 0.85)]
        let rate = Float(format.sampleRate)
        let frames = AVAudioFrameCount(rate * 0.03)
        guard let buffer = AVAudioPCMBuffer(pcmFormat: format, frameCapacity: frames),
              let out = buffer.floatChannelData?[0] else { return nil }
        buffer.frameLength = frames
        for i in 0..<Int(frames) {
            let t = Float(i) / rate
            var sample: Float = 0
            for (start, level, tune) in ticks where t >= start {
                let local = t - start
                var tick: Float = 0
                for (hz, decay, gain) in modes { tick += gain * sinf(2 * .pi * hz * tune * local) * expf(-local / decay) }
                tick += Float.random(in: -1...1) * 0.5 * expf(-local / 0.0003)
                sample += tick * level
            }
            out[i] = sample * 2.2
        }
        return buffer
    }
}

#Preview {
    struct Demo: View {
        @State private var mode = 1
        @State private var gain = 1
        var body: some View {
            VStack(spacing: 0) {
                SlotSelector(selection: $mode, options: ["opt a", "opt b", "opt c", "opt d"], label: "mode")
                    .padding(40).frame(maxWidth: .infinity)
                    .background(Color(red: 0.94, green: 0.94, blue: 0.93))
                    .environment(\.colorScheme, .light)
                SlotSelector(selection: $gain, options: ["low", "high"], label: "gain")
                    .padding(40).frame(maxWidth: .infinity, maxHeight: .infinity)
                    .background(Color(white: 0.04))
                    .environment(\.colorScheme, .dark)
            }
        }
    }
    return Demo()
}

<script type="text/plain" id="swift-glass-scrubber">
// GlassScrubber.swift — Detent
// A glass lens on a carriage that slides along a printed 24-hour scale. The lens really magnifies the scale under it, and the
// hairline engraved in it reads the time. The carriage clicks into a detent every 15 minutes (step: 5, 15, 30 or 60), clicks
// firmer on each hour, and stops hard at 00:00 and at the last detent. weighted (the default) lets a flick carry it on 2 to 4
// clicks, easing to rest over most of a second. The readout on the carriage is digital: digits switch instantly. The sky above
// follows the time on its own: the sun and the moon ride one arc, the sky brightens only as the sun clears the
// horizon, and the stars fade out one by one, faintest first. Light or dark follows the color scheme, or pass tone. iOS / iPadOS 17+.
//
// Usage:
//   @State private var minutes = 420          // 07:00, minutes since midnight
//   GlassScrubber(minutes: $minutes, label: "Eastern Time")
//   GlassScrubber(minutes: $minutes, step: 5, weighted: false, tone: .dark)

import SwiftUI
import UIKit
import AVFoundation

public struct GlassScrubber: View {
    @Binding private var minutes: Int
    private let label: String
    private let step: Int
    private let weighted: Bool
    private let tone: ColorScheme?
    private let line: Color
    private let sound: Bool

    public init(minutes: Binding<Int>,
                label: String = "Local time",
                step: Int = 15,
                weighted: Bool = true,
                tone: ColorScheme? = nil,
                line: Color = Color(red: 0.9, green: 0.14, blue: 0.16),
                sound: Bool = true) {
        _minutes = minutes
        self.label = label
        self.step = [5, 15, 30, 60].contains(step) ? step : 15
        self.weighted = weighted
        self.tone = tone
        self.line = line
        self.sound = sound
    }

    @State private var raw: Double?                        // where the finger has pushed the carriage, in minutes
    @State private var dragFrom: Int?
    @State private var trail: [(Double, Double)] = []      // (ms, raw minutes) over the last 80ms, for fling speed
    @State private var coastAt: Double?                    // the carriage's free position while it coasts, in minutes
    @State private var coastTask: Task<Void, Never>?
    @State private var atEdge = 0
    @FocusState private var focused: Bool
    @Environment(\.colorScheme) private var scheme
    @Environment(\.accessibilityReduceMotion) private var reduceMotion

    private var maxMinutes: Int { 1440 - step }
    private var value: Int { min(maxMinutes, max(0, minutes / step * step)) }
    // The carriage sits in its notch and leans a little toward the finger.
    private var shown: Double { coastAt ?? Double(value) + ((raw ?? Double(value)) - Double(value)) * 0.25 }
    private var palette: ScrubberPalette { (tone ?? scheme) == .dark ? .dark : .light }
    // The detent throws the carriage into each notch: it accelerates and stops dead.
    private var snap: Animation? { reduceMotion ? nil : .timingCurve(0.55, 0, 1, 1, duration: 0.06) }
    private var back: Animation? { reduceMotion ? nil : .timingCurve(0.2, 0, 0.3, 1, duration: 0.08) }

    public var body: some View {
        VStack(spacing: 0) {
            GeometryReader { geo in
                // The sky is a window onto the time of day, not part of the mechanism: it glides to the time you set,
                // easing in without overshoot, so the sun and moon move smoothly while the carriage clicks.
                ScrubberSky(minutes: shown, width: geo.size.width)
                    .animation(reduceMotion ? nil : .spring(duration: 0.35, bounce: 0), value: shown)
            }
            .frame(height: 160)
            .overlay(alignment: .bottom) { Rectangle().fill(palette.edge).frame(height: 1) }
            GeometryReader { geo in
                let w = geo.size.width, x = carriageX(w)
                ZStack(alignment: .topLeading) {
                    // The digital readout rides on the carriage, right above the lens.
                    Text(Self.format(value))
                        .font(.system(size: 14, weight: .semibold, design: .monospaced))
                        .monospacedDigit()
                        .contentTransition(.identity)
                        .foregroundStyle(palette.chipInk)
                        .padding(.horizontal, 9).padding(.vertical, 6)
                        .background(RoundedRectangle(cornerRadius: 7).fill(palette.chip)
                            .shadow(color: palette.drop, radius: 1, y: 1)
                            .overlay(RoundedRectangle(cornerRadius: 7).strokeBorder(palette.rim, lineWidth: 0.5)))
                        .fixedSize()
                        .position(x: x, y: 13)
                    ScrubberScale(width: w, maxMinutes: maxMinutes, palette: palette)
                        .frame(width: w, height: 60)
                        .offset(y: 32)
                    ScrubberLens(x: x, width: w, maxMinutes: maxMinutes, palette: palette, line: line, pressed: dragFrom != nil)
                        .offset(x: x - 15, y: 39)
                }
                .contentShape(Rectangle())
                .gesture(dragGesture(width: w))
            }
            .frame(height: 92)
            .padding(.horizontal, 40)
            .padding(.top, 12)
            Text(label.uppercased())
                .font(.system(size: 11, weight: .medium))
                .tracking(1.5)
                .foregroundStyle(palette.label)
                .padding(.top, 12)
                .padding(.bottom, 18)
        }
        .frame(maxWidth: 400)
        .background(palette.panel)
        .clipShape(RoundedRectangle(cornerRadius: 24, style: .continuous))
        .overlay(RoundedRectangle(cornerRadius: 24, style: .continuous).strokeBorder(palette.edge, lineWidth: 1))
        .shadow(color: .black.opacity(palette.isDark ? 0 : 0.12), radius: 14, y: 8)
        .focusable()
        .focused($focused)
        .onKeyPress(keys: [.upArrow, .rightArrow, .downArrow, .leftArrow]) { press in
            nudge(press.key == .upArrow || press.key == .rightArrow ? 1 : -1)
            return .handled
        }
        .accessibilityElement()
        .accessibilityLabel("Time")
        .accessibilityValue(Self.format(value))
        .accessibilityAdjustableAction { direction in
            switch direction {
            case .increment: nudge(1)
            case .decrement: nudge(-1)
            @unknown default: break
            }
        }
    }

    private func carriageX(_ w: CGFloat) -> CGFloat { CGFloat(shown / Double(maxMinutes)) * w }

    static func format(_ m: Int) -> String { String(format: "%02d:%02d", m / 60, m % 60) }

    private func dragGesture(width w: CGFloat) -> some Gesture {
        DragGesture(minimumDistance: 0)
            .onChanged { g in
                if dragFrom == nil {
                    catchCarriage()
                    dragFrom = value
                    trail = []
                    ScrubberFeedback.shared.prepare()
                }
                // You push the carriage: it moves exactly as far as your finger, wherever you grabbed the track.
                let r = min(Double(maxMinutes), max(0, Double(dragFrom ?? value) + Double(g.translation.width / max(1, w)) * Double(maxMinutes)))
                let now = Date.timeIntervalSinceReferenceDate * 1000
                trail.append((now, r))
                while trail.count > 2, let first = trail.first, now - first.0 > 80 { trail.removeFirst() }
                raw = r
                let v = Int((r / Double(step)).rounded()) * step
                if v != value { withAnimation(snap) { commit(v, sound: true) } }
            }
            .onEnded { _ in
                dragFrom = nil
                if weighted, !reduceMotion, fling(width: w) { return }
                // The detent pulls it back into the notch it's in.
                withAnimation(back) { raw = nil }
            }
    }

    // A quarter-hour notch is one tiny dry tick; any move that lands on or passes an hour is a firmer one. The stops tick once, duller.
    private func commit(_ v: Int, sound detent: Bool) {
        let was = value
        minutes = v
        let edge = v <= 0 ? -1 : v >= maxMinutes ? 1 : 0
        if edge != 0 && atEdge != edge { ScrubberFeedback.shared.stop(sound: sound) }
        if edge != 0 { atEdge = edge }
        else if (atEdge < 0 && Double(v) > Double(maxMinutes) * 0.03) || (atEdge > 0 && Double(v) < Double(maxMinutes) * 0.97) { atEdge = 0 }
        if detent && edge == 0 {
            if Self.hour(from: was, to: v) { ScrubberFeedback.shared.hour(sound: sound) } else { ScrubberFeedback.shared.quarter(sound: sound) }
        }
    }

    static func hour(from a: Int, to b: Int) -> Bool {
        var h = Int((Double(min(a, b)) / 60).rounded(.up)) * 60
        while h <= max(a, b) { if h != a { return true }; h += 60 }
        return false
    }

    // Keys and VoiceOver: one notch. Pushing past an end stop does nothing at all.
    private func nudge(_ n: Int) {
        catchCarriage()
        let v = min(maxMinutes, max(0, value + n * step))
        guard v != value else { return }
        raw = nil
        withAnimation(snap) { commit(v, sound: true) }
    }

    // Weighted: release speed over the last 80ms. A slow or stopped release doesn't coast.
    private func fling(width w: CGFloat) -> Bool {
        let now = Date.timeIntervalSinceReferenceDate * 1000
        guard trail.count >= 2, let first = trail.first, let last = trail.last, now - last.0 < 60 else { return false }
        let v = (last.1 - first.1) / max(1, last.0 - first.0)                 // minutes per ms
        let px = abs(v / Double(maxMinutes) * Double(w))
        guard px >= 0.35 else { return false }
        let n = 2 + Int((min(1, (px - 0.35) / 2.2) * 2).rounded())
        let notches = Double(maxMinutes / step)
        guard let spin = Self.spin(from: shown / Double(step), speed: max(-0.2, min(0.2, v / Double(step))), clicks: n, lo: 0, hi: notches) else { return false }
        coast(spin)
        return true
    }

    // The carriage has some weight, so a flick carries it on after you let go: 2 more notches for a gentle flick, up to 4 for a
    // hard one. It leaves your finger at the flick's speed, drag bleeds that down to a slow creep within a fraction of a notch,
    // and friction then eases it to rest in the last notch over most of a second. So the clicks start quick and spread out, the
    // last gap the longest. If the end stop comes first, it hits it and stops dead. Positions are in notches; speed in notches per ms.
    // The whole coast is worked out at release, and its clicks are rendered as one sample-accurate audio track.
    struct Spin { var path: [Double]; var clicks: [(ms: Double, notch: Int, stop: Bool)]; var end: Double }

    static func spin(from start: Double, speed v: Double, clicks n: Int, lo: Double, hi: Double) -> Spin? {
        let dir: Double = v < 0 ? -1 : 1
        let home = start.rounded(), rest = home + dir * Double(n), dist = abs(rest - start)
        if min(hi, max(lo, rest)) == home { return nil }                 // already against the stop it was flicked toward
        let creep = 2 * dist / (500 + 150 * Double(n))
        func speed(_ x: Double) -> Double {
            (creep + max(0, abs(v) - creep) * exp(-x / 0.22)) * max(0, 1 - x / dist).squareRoot()
        }
        var pos = start, x = 0.0, t = 0.0, click = Int(home)
        var out = Spin(path: [start], clicks: [], end: 0)
        while dist - x > 0.001 && t < 4000 {
            let prev = pos
            x = min(dist, x + max(speed(x), 0.0002))
            pos = start + dir * x
            t += 1
            if pos <= lo || pos >= hi {                                       // the end stop: it arrives and stops dead
                let stop = pos <= lo ? lo : hi
                out.path.append(stop)
                out.clicks.append((ms: t - 1 + (stop - prev) / (pos - prev), notch: Int(stop), stop: true))
                out.end = t
                return out
            }
            let k = Int(pos.rounded())
            if k != click {
                // the click is the hilltop between notches
                if Double(k) > lo && Double(k) < hi { out.clicks.append((ms: t - 1 + (Double(min(k, click)) + 0.5 - prev) / (pos - prev), notch: k, stop: false)) }
                click = k
            }
            out.path.append(pos)
        }
        out.path[out.path.count - 1] = rest
        out.end = t
        return out
    }

    private func coast(_ spin: Spin) {
        raw = nil
        coastAt = shown
        coastTask?.cancel()
        let step = step
        ScrubberFeedback.shared.track(spin.clicks.filter { !$0.stop }.map { ($0.ms, $0.notch * step % 60 == 0) }, sound: sound)
        coastTask = Task { @MainActor in
            let t0 = Date.timeIntervalSinceReferenceDate
            var done = 0
            while !Task.isCancelled {
                let t = (Date.timeIntervalSinceReferenceDate - t0) * 1000
                while done < spin.clicks.count, spin.clicks[done].ms <= t {
                    let c = spin.clicks[done]
                    commit(c.notch * step, sound: false)       // the end stop's tick sounds as it arrives
                    if !c.stop { ScrubberFeedback.shared.tap(hour: c.notch * step % 60 == 0) }
                    done += 1
                }
                if t >= spin.end { break }
                let i = min(spin.path.count - 2, Int(t)), f = t - Double(i)
                coastAt = (spin.path[i] + (spin.path[i + 1] - spin.path[i]) * f) * Double(step)
                try? await Task.sleep(for: .milliseconds(4))
            }
            guard !Task.isCancelled else { return }
            coastAt = nil
            coastTask = nil
        }
    }

    // A finger on a coasting carriage stops it: its click track is cut off and it settles into the nearest notch.
    private func catchCarriage() {
        guard coastTask != nil else { return }
        coastTask?.cancel()
        coastTask = nil
        ScrubberFeedback.shared.cancelTrack()
        withAnimation(back) { coastAt = nil }
    }
}

/// Light and dark: a pale satin panel with the scale printed in ink, or a black anodized one printed in pale grey.
private struct ScrubberPalette {
