      ticks += `<line${m % 60 ? '' : ' class="h"'} x1="${x}" x2="${x}" y1="${31 - h}" y2="31"/>`;
      if (m % 60 === 0) nums += `<text x="${x}" y="60">${String(m / 60).padStart(2, '0')}</text>`;
    }
    return `<i class="tape"></i><i class="band"></i><svg aria-hidden="true">${ticks}${nums}</svg>`;
  };
  return {
    dir: -1,
    css: `
.t { --paper: #fbfbfd; --pin: #00000007; --well: #e3e3e8; --frame: #0000001f; --track: #00000014; --fill: var(--dial-accent, #0a7cff);
  --tick: #00000059; --tick-h: #00000099; --num: #0000008c; --name: #00000073; --mark: #1d1d1fcc; --spec: #ffffffd9; --caustic: #ffffffd9;
  --glass: linear-gradient(170deg, #ffffff59, #ffffff0f 55%, #ffffff2e);
  --glass-in: inset 0 1px 0 #ffffffe6, inset 0 -1.5px 1px #ffffff99, inset 0 0 0 .5px #ffffffb3, inset 0 -12px 20px -12px #ffffff80;
  --glass-sh: 0 0 0 .5px #0000001a, 0 1px 2px #0000001f, 0 12px 24px -10px #00000040;
  --glass-dn: 0 0 0 .5px #0000001a, 0 .5px 1px #00000029, 0 7px 16px -8px #00000040 }
.t.dark { --paper: #1f1f22; --pin: #ffffff06; --well: #0d0d0f; --frame: #ffffff1f; --track: #ffffff14; --fill: var(--dial-accent, #0a84ff);
  --tick: #ffffff40; --tick-h: #ffffff80; --num: #ffffff73; --name: #ffffff66; --mark: #f5f5f7; --spec: #ffffff52; --caustic: #ffffff2e;
  --glass: linear-gradient(170deg, #ffffff2e, #ffffff0a 55%, #ffffff17);
  --glass-in: inset 0 1px 0 #ffffff8c, inset 0 -1.5px 1px #ffffff40, inset 0 0 0 .5px #ffffff38, inset 0 -12px 20px -12px #ffffff2e;
  --glass-sh: 0 0 0 .5px #000, 0 1px 2px #000000a6, 0 12px 24px -10px #000000cc;
  --glass-dn: 0 0 0 .5px #000, 0 .5px 1px #000000bf, 0 7px 16px -8px #000000cc }
/* The window the tape runs in. Past its ends you see the well behind it. */
.k { height: 72px; border-radius: 14px; overflow: hidden; background: var(--well) }
.k::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--frame), inset 0 1px 3px #0000001f; pointer-events: none; z-index: 3 }
.run, .mag { position: absolute; top: 0; height: 72px }
.run { left: 50%; width: 400%; translate: calc(var(--x) * -1) 0 }
/* The tape: paper with fine Aqua pinstripes. */
.tape { position: absolute; inset: 0 -16px; background: repeating-linear-gradient(0deg, #0000 0 1px, var(--pin) 1px 2px), var(--paper) }
.band { position: absolute; left: 0; right: 0; top: 36px; height: 6px; border-radius: 3px; background: var(--track) }
.band.fill { background: var(--fill) }
svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none }
line { stroke: var(--tick); stroke-width: 1; stroke-linecap: round }
line.h { stroke: var(--tick-h); stroke-width: 1.3 }
text { fill: var(--num); font: 500 10px "Geist", system-ui, sans-serif; text-anchor: middle; font-variant-numeric: tabular-nums }

/* The etched hairline, the tint and the specular: all part of the glass, so they stay put. */
.lens::before { content: ""; position: absolute; z-index: 1; left: 25.5px; top: 5px; bottom: 5px; width: 1px; background: var(--mark) }
.lens::after { content: ""; position: absolute; z-index: 2; inset: 0; border-radius: inherit; background: var(--glass); box-shadow: var(--glass-in) }
.spec { position: absolute; z-index: 3; inset: 3% 18% 62%; border-radius: 50%; background: linear-gradient(var(--spec), transparent); pointer-events: none }
.cap { display: flex; justify-content: space-between; align-items: baseline; margin: 12px 6px 0 }
.name { font: 500 11px/1 "Geist", system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--name) }
.v { font: 600 15px/1 "Geist", system-ui, sans-serif; color: var(--fill); font-variant-numeric: tabular-nums }
:host(:focus-visible) .k { outline: 2px solid var(--fill); outline-offset: 3px }
`,
    html: el => `<div class="k"><div class="run f">${print(el)}</div><div class="clip"><div class="run f">${print(el, true)}</div></div><i class="caustic"></i>` +
      `<div class="lens" data-press><div class="mag f">${print(el)}</div><div class="clip"><div class="mag f">${print(el, true)}</div></div><i class="spec"></i></div></div>` +
      `<div class="cap"><span class="name">${el.getAttribute('label') || 'Local time'}</span><b class="v"></b></div>`,
    setup(root, el) { el.ls.v = root.querySelector('.v'); },
    paint(root, el) { el.ls.v.textContent = el.value; }
  };
})());
</script>

<script id="src-clock">
/* <detent-clock look="original" tone="auto" time="04:45"> — a clock you set like a real one. Drag around the face and the
   minute hand turns through the setting train: it gives a little, then a jumper spring drops it into the next minute with a
   tiny click, a firmer one every five minutes. The hour hand follows through the 12:1 gearing. Passing noon or midnight
   turns the 24-hour wheel with a firmer clack. The window at 6 o'clock shows the time. The A/P pusher in the case corner
   turns the 24-hour wheel half a turn; it latches at the bottom of its travel, so it switches on the press. Arrows move one
   minute, Page Up/Down or Shift jump to the next five-minute mark, A and P switch the day half, and the scroll wheel turns
   it once it has focus. time is "HH:MM" (24h). Fires "input" and "change". Needs Feel and at least one look.
   tone: "light" or "dark" forces one; otherwise it follows the nearest [data-tone], the page's data-theme,
   then prefers-color-scheme. Changing look keeps the time.
   The look is a separate module: DetentClock.look(name, { css, html, setup, hold, paint }).
   html(el) returns the markup. DetentClock.dial({ face, hands: { hr, min, cap, defs, shadow }, readout, over }) builds the
   standard one: a .tile (gets .snap / .back while the hands settle), an svg.face, a .read window, an svg.hands (the drag
   surface; its hand shadow filter uses a fixed region so a hand at 3, 6, 9 or 12 never vanishes), then over, then the
   button.ap pusher (gets .down while pressed). The core fills .h, .m, .ampm and .led.on if the readout has them.
   paint(root, el, { t, mins, hr12, pm, shown }): t is minutes since midnight, shown is where the minute hand sits now
   (in minutes, including the give between minutes). el.dir is the last direction the train moved (-1, 0 or 1).
   el.hEl is the hour span, el.ls is the look's own state. --s sets the size, --dial-accent the look's accent. */
(() => {
  const mod = (n, m) => ((n % m) + m) % m;
  const parse = s => { const [h, m] = String(s || '04:45').split(':').map(Number); return mod((h || 0) * 60 + (m || 0), 1440); };
  const looks = {}, waiting = new Set(), autos = new Set();
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const retone = () => autos.forEach(el => el.tone());
  mq.addEventListener ? mq.addEventListener('change', retone) : mq.addListener(retone);
  new MutationObserver(retone).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'data-tone'] });

  // Shared by every look: the layers, how the hands turn and snap, the window's place, the pusher's place and press.
  const BASE = `
:host { --s: 240px; display: inline-block; position: relative; width: var(--s); aspect-ratio: 1; vertical-align: top; outline: none; user-select: none;
  -webkit-user-select: none; -webkit-tap-highlight-color: transparent; font-family: "Geist Mono", ui-monospace, "SF Mono", monospace }
.t { display: contents }
.tile { position: absolute; inset: 0; border-radius: 26%; overflow: hidden }
svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none }
.hands { pointer-events: auto; touch-action: none; cursor: grab }
:host(:active) .hands { cursor: grabbing }
line { stroke-linecap: round }
/* The shadow sits on an unrotated parent, so it always falls straight down while the hand turns above it. Filters use a
   fixed region, not the hand's box: a hand at 3, 6, 9 or 12 o'clock is a line with no height or width, and would vanish. */
feDropShadow { flood-color: #000; flood-opacity: var(--drop, .22) }
.hand { transform-origin: 100px 100px }
.min { rotate: var(--m) } .hr { rotate: var(--h) }
/* A step from the keys: the jumper throws the train into the next minute, accelerating, then stops dead. */
.tile.snap .hand { transition: rotate .06s cubic-bezier(.55,0,1,1) }
/* Let go between minutes and the jumper pulls the hand back into the one it's in. */
.tile.back .hand { transition: rotate .08s cubic-bezier(.2,0,.3,1) }
/* The readout: a window set into the dial at 6 o'clock, under the hands. A digital one switches instantly. */
.read { position: absolute; left: 50%; translate: -50% 0; top: 63%; height: 11%; display: flex; align-items: center; justify-content: center;
  gap: .35em; padding: 0 4.5%; box-sizing: border-box; white-space: nowrap; font-size: calc(var(--s) * .068); font-variant-numeric: tabular-nums;
  pointer-events: none }
.read b { font-weight: inherit }
.led, .ampm { display: none }
/* The A/P pusher: set into the case corner, clear of the dial. It sinks a hair under a finger; nothing happens on hover. */
.ap { position: absolute; right: 7%; bottom: 7%; width: 11%; height: 11%; display: flex; align-items: center; justify-content: center;
  box-sizing: border-box; border: 0; padding: 0; border-radius: 50%; font-family: inherit; font-size: calc(var(--s) * .06); cursor: pointer;
  transition: translate .05s, scale .05s, box-shadow .05s }
.ap.down { translate: 0 .5px; scale: .994 }
:host(:focus-visible) .tile { outline: 2px solid var(--focus, currentColor); outline-offset: 4px }
@media (prefers-reduced-motion: reduce) { .tile.snap .hand, .tile.back .hand, .ap { transition: none } }
`;
  const READOUT = '<span class="h"></span><span class="m"></span><span class="ampm"></span><i class="led"></i>';

  class DetentClock extends HTMLElement {
    static observedAttributes = ['time', 'look', 'tone'];
    static look(name, def) { looks[name] = def; [...waiting].forEach(el => el.render()); }
    // The standard markup every look builds on. The hand shadow filter is userSpaceOnUse on purpose (see BASE).
    static dial({ face = '', hands: H, readout = READOUT, over = '' }) {
      const hand = (cls, inner) => H.shadow
        ? `<g filter="url(#sh)"><g class="hand ${cls}">${inner}</g></g>` : `<g class="hand ${cls}">${inner}</g>`;
      return `<div class="tile">
<svg class="face" viewBox="0 0 200 200" aria-hidden="true">${face}</svg>
<div class="read">${readout}</div>
<svg class="hands" viewBox="0 0 200 200" aria-hidden="true"><defs>
<filter id="sh" filterUnits="userSpaceOnUse" x="-20" y="-20" width="240" height="240"><feDropShadow dx="0" dy="1.6" stdDeviation="1.1"/></filter>${H.defs || ''}</defs>
${hand('hr', H.hr)}${hand('min', H.min)}${H.cap || ''}</svg>${over}
<button class="ap" type="button" tabindex="-1" aria-label="Switch AM or PM" data-press></button></div>`;
    }
    connectedCallback() {
      if (!this._wired) this.wire();
      if (!this.tile) this.render();
      this.tone();
    }
    disconnectedCallback() { autos.delete(this); }
    attributeChangedCallback(name, was, v) {
      if (!this._wired || was === v) return;
      if (name === 'tone') return this.tone();
      if (name === 'look') return this.render();
      if (v !== this.value) { this.read(v); this.raw = this.hand; this.dir = 0; this.paint(); }
    }
    wire() {
      this._wired = true;
      this.attachShadow({ mode: 'open' });
      // hand: where the minute hand points, in whole minutes. It never wraps, so the hands never spin back the long way.
      // off: 0 or 720, the half of the day the 24-hour wheel shows. The time is hand + off, around 24 hours.
      this.hand = 0; this.off = 0; this.dir = 0;
      this.read(this.getAttribute('time'));
      this.raw = this.hand;
      this.setAttribute('role', 'slider'); this.setAttribute('aria-label', 'Time');
      if (!this.hasAttribute('tabindex')) this.tabIndex = 0;
      let wheel = 0;
      Feel.wheel(this, d => { wheel += d; if (Math.abs(wheel) >= 10) { this.nudge(Math.sign(wheel)); wheel = 0; } });
      // Arrows move one minute. Page Up/Down or Shift jump to the next five-minute mark.
      Feel.keys(this, (dir, big) => {
        if (!big) return this.nudge(dir);
        this.step(dir > 0 ? Math.floor(this.hand / 5) * 5 + 5 : Math.ceil(this.hand / 5) * 5 - 5);
        this.dispatchEvent(new Event('change', { bubbles: true }));
      });
      this.addEventListener('keydown', e => {
        const k = e.key.toLowerCase();
        if ((k === 'a' && this.t >= 720) || (k === 'p' && this.t < 720)) this.flip();
      });
    }
    // Builds the look. Runs again when look changes; the time carries over.
    render() {
      const L = looks[this.getAttribute('look') || 'original'];
      if (!L) { waiting.add(this); return; }
      waiting.delete(this);
      this.L = L;
      const root = this.shadowRoot;
      root.innerHTML = `<style>${BASE}${L.css}</style><div class="t">${L.html(this)}</div>`;
      const $ = s => root.querySelector(s);
      this.wrap = $('.t'); this.tile = $('.tile');
      this.hEl = $('.h'); this.mEl = $('.m'); this.apmEl = $('.ampm'); this.led = $('.led'); this.ap = $('button.ap');
      this.ls = {}; // the look's own state
      L.setup && L.setup(root, this);
      Feel.rotary($('.hands'), {
        start: () => { this.tile.classList.remove('snap', 'back'); this.raw = this.hand; L.hold && L.hold(root, this, true); },
        turn: d => this.turn(d / 6),
        end: () => {
          if (this.raw !== this.hand) this.motion('back');
          this.raw = this.hand;
          this.paint();
          L.hold && L.hold(root, this, false);
          this.dispatchEvent(new Event('change', { bubbles: true }));
        }
      });
      // The A/P key latches at the bottom of its travel, so it switches on the press, not the release.
      const up = () => this.ap.classList.remove('down');
      this.ap.addEventListener('pointerdown', e => {
        if (e.button > 0) return;
        e.preventDefault();
        this.focus({ preventScroll: true });
        this.ap.classList.add('down');
        this.flip();
      });
      this.ap.addEventListener('pointerup', up);
      this.ap.addEventListener('pointercancel', up);
      this.ap.addEventListener('pointerleave', up);
      this.tone();
      this.paint();
    }
    tone() {
      if (!this.wrap) return;
      const t = this.getAttribute('tone');
      let dark;
      if (t === 'light' || t === 'dark') { dark = t === 'dark'; autos.delete(this); }
      else {
        autos.add(this);
        const near = this.parentElement && this.parentElement.closest('[data-tone]'), page = document.documentElement.dataset.theme;
        dark = near ? near.dataset.tone === 'dark' : page ? page === 'dark' : mq.matches;
      }
      this.wrap.classList.toggle('dark', dark);
    }
    get t() { return mod(this.hand + this.off, 1440); }
    get value() {
      const t = this._wired ? this.t : parse(this.getAttribute('time'));
      return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
    }
    set value(v) { this.setAttribute('time', v); }
    // Sets the time quietly, moving the hands to the nearest matching position.
    read(s) {
      const t = parse(s), r = t % 720;
      this.hand = r + Math.round((this.hand - r) / 720) * 720;
      this.off = mod(t - this.hand, 1440);
    }
    // A finger turns the minute hand by dm minutes. Between minutes the jumper spring holds the train, so the hand only
    // gives a little until it passes halfway, then drops into the next minute.
    turn(dm) {
      this.raw += dm;
      this.step(Math.round(this.raw), true);
      if (this.tile) this.paint(this.hand + (this.raw - this.hand) * .3);
    }
    nudge(dir) { this.step(this.hand + dir); this.dispatchEvent(new Event('change', { bubbles: true })); }
    step(n, dragging) {
      if (n === this.hand) return;
      const from = this.hand, before = this.t, dir = Math.sign(n - from);
      let five = false;
      for (let k = from + dir; k !== n + dir; k += dir) if (mod(k, 5) === 0) five = true;
      this.hand = n; this.dir = dir;
      if (!dragging) { this.raw = n; this.motion('snap'); }
      // Passing midnight or noon also turns the 24-hour wheel, so its flag drops with a firmer clack.
      if ((before < 720) !== (this.t < 720)) Feel.fire('selector');
      else if (five) Feel.fire('bezel', { pitch: .75 });
      else Feel.fire('encoder');
      this.dispatchEvent(new Event('input', { bubbles: true }));
      if (!dragging) this.paint();
    }
    flip() {
      this.off = mod(this.off + 720, 1440); this.dir = 1;
      Feel.fire('switch', { pitch: this.t < 720 ? 1.04 : .96 });
      this.paint();
      this.dispatchEvent(new Event('input', { bubbles: true }));
      this.dispatchEvent(new Event('change', { bubbles: true }));
    }
    motion(kind) {
      if (!this.tile) return;
      this.tile.classList.remove('snap', 'back');
      this.tile.classList.add(kind);
      clearTimeout(this._mt);
      this._mt = setTimeout(() => this.tile.classList.remove(kind), 100);
    }
    paint(shown = this.hand) {
      if (!this.tile) return;
      const t = this.t, mins = t % 60, hr12 = Math.floor(t / 60) % 12 || 12, pm = t >= 720;
      // The hour hand is geared to the minute hand, 12:1.
      this.style.setProperty('--m', shown * 6 + 'deg');
      this.style.setProperty('--h', shown / 2 + 'deg');
      if (this.hEl) this.hEl.textContent = String(hr12).padStart(2, '0');
      if (this.mEl) this.mEl.textContent = String(mins).padStart(2, '0');
      if (this.apmEl) this.apmEl.textContent = pm ? 'PM' : 'AM';
      if (this.led) this.led.classList.toggle('on', pm);
      this.ap.textContent = pm ? 'P' : 'A';
      this.setAttribute('aria-valuetext', `${hr12}:${String(mins).padStart(2, '0')} ${pm ? 'PM' : 'AM'}`);
      this.L.paint && this.L.paint(this.shadowRoot, this, { t, mins, hr12, pm, shown });
    }
  }
  window.DetentClock = DetentClock;
  customElements.define('detent-clock', DetentClock);
})();
</script>

<script id="src-clock-look-original">
/* Clock look "original": the approved frosted acrylic tile. Hour indices and the minute hand carry luminous paint: pale
   paint in a lit room, a soft glow in the dark tone (the paint is the light source). The window is frosted glass with
   a digital readout and an orange PM lamp. Light from above; every highlight belongs to the room, never to a moving part.
   --lume (or --dial-accent) colors the luminous paint. */
(() => {
  let face = '', glow = '';
  for (let h = 0; h < 12; h++) face += `<line class="ray" transform="rotate(${h * 30} 100 100)" x1="100" y1="100" x2="100" y2="34"/>`;
  for (let i = 0; i < 60; i++) {
    if (i % 5) { face += `<line class="mt" transform="rotate(${i * 6} 100 100)" x1="100" y1="22" x2="100" y2="29"/>`; continue; }
    face += `<g transform="rotate(${i * 6} 100 100)"><line class="hw" x1="100" y1="20" x2="100" y2="34"/><line class="hg" x1="100" y1="21.5" x2="100" y2="32.5"/></g>`;
    glow += `<line class="halo" transform="rotate(${i * 6} 100 100)" x1="100" y1="21.5" x2="100" y2="32.5"/>`;
  }
  for (let h = 1; h <= 12; h++) face += `<text transform="rotate(${h * 30} 100 100)" x="100" y="14">${h}</text>`;
  const markup = DetentClock.dial({
    face: `<defs><filter id="glow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="240" height="240"><feGaussianBlur stdDeviation="1.6"/></filter></defs>
<g filter="url(#glow)">${glow}</g>${face}`,
    hands: {
      shadow: true,
      defs: '<filter id="glow2" filterUnits="userSpaceOnUse" x="-20" y="-20" width="240" height="240"><feGaussianBlur stdDeviation="1.6"/></filter>',
      hr: '<line class="o" x1="100" y1="108" x2="100" y2="60" stroke-width="6.5"/><line class="w" x1="100" y1="108" x2="100" y2="60" stroke-width="5"/>',
      min: '<line class="o" x1="100" y1="110" x2="100" y2="38" stroke-width="7"/><line class="w" x1="100" y1="110" x2="100" y2="38" stroke-width="5.5"/><line class="halo" x1="100" y1="72" x2="100" y2="48" filter="url(#glow2)"/><line class="lume" x1="100" y1="72" x2="100" y2="48"/>',
      cap: '<circle class="cap" cx="100" cy="100" r="6"/>'
    }
  });
  DetentClock.look('original', {
    css: `
.t { --lu: var(--lume, var(--dial-accent, #8fd85c)); --led: #ff9500; --focus: var(--lu);
  --tile-top: #fcfcfd; --tile-bottom: #e2e2e7; --rim: #fff; --contact: #00000026; --cast: #0000005e; --sheen: #ffffff8c;
  --ray: #0000000c; --minute: #a5a5ab; --index: #cacacf; --num: #96969c; --hand: #fff; --hand-edge: #c2c2c7; --cap-edge: #cfcfd4;
  --drop: .22; --glow: 0; --chip: #ffffffa6; --chip-rim: #fff; --chip-sh: #0000001a; --dim: #8e8e93; --ink: #1c1c1e; --led-off: #0000001a }
.t.dark { --tile-top: #2c2c30; --tile-bottom: #19191c; --rim: #ffffff1f; --contact: #0009; --cast: #000c; --sheen: #ffffff0a;
  --ray: #ffffff0b; --minute: #5c5c63; --index: #46464c; --num: #707077; --hand: #3d3d42; --hand-edge: #141416; --cap-edge: #56565c;
  --drop: .55; --glow: .5; --chip: #3a3a3f99; --chip-rim: #ffffff1f; --chip-sh: #0006; --dim: #85858c; --ink: #f2f2f6; --led-off: #ffffff14 }
/* Frosted acrylic, lit from above: a bright top rim, a soft sheen at the top, a contact shadow and a cast shadow below. It never lifts. */
.tile { background: radial-gradient(120% 70% at 50% -8%, var(--sheen), #fff0 62%), linear-gradient(var(--tile-top), var(--tile-bottom));
  box-shadow: inset 0 1px 1px var(--rim), inset 0 -2px 6px #0000000d, 0 1px 2px var(--contact), 0 30px 50px -28px var(--cast) }
.ray { stroke: var(--ray); stroke-width: .6 }
.mt { stroke: var(--minute); stroke-width: 1.5 }
/* Hour indices: an applied metal frame filled with luminous paint. The paint only glows once the room is dark. */
.hw { stroke: var(--index); stroke-width: 5 }
.hg, .lume { stroke: var(--lu); stroke-width: 2 }
.halo { stroke: var(--lu); stroke-width: 4; opacity: var(--glow) }
text { fill: var(--num); font: 400 10px "Geist Mono", ui-monospace, monospace; text-anchor: middle }
.hand .o { stroke: var(--hand-edge) }
.hand .w { stroke: var(--hand) }
.cap { fill: var(--hand); stroke: var(--cap-edge) }
/* The window: frosted glass set into the dial, its edge shaded from the top light. */
.read, .ap { background: var(--chip); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px) }
.read { border-radius: 999px; box-shadow: inset 0 1px 2px var(--chip-sh), inset 0 -1px 0 var(--chip-rim) }
.h { color: var(--dim) } .m { color: var(--ink); font-weight: 600 }
/* The PM lamp: a small LED, so it is the only thing here that gives light of its own. */
.led { display: block; width: .3em; height: .3em; margin-left: .2em; border-radius: 50%; background: var(--led-off); box-shadow: inset 0 .5px 1px #0003 }
.led.on { background: var(--led); box-shadow: 0 0 .25em color-mix(in srgb, var(--led), #0000 40%) }
.ap { color: var(--ink); box-shadow: inset 0 1px 1px var(--chip-rim), 0 2px 8px var(--chip-sh) }
.ap.down { box-shadow: inset 0 1px 1px var(--chip-rim), 0 1px 3px var(--chip-sh) }
`,
    html: () => markup
  });
})();
</script>

<script id="src-clock-look-braun">
/* Clock look "braun": after the Braun wall and alarm clocks. A face-turned aluminium case (lathe rings and a chamfered rim,
   like the encoder's cap) around a recessed matte white face. Black baton hands, rectangular printed indices, upright
   numerals, a hub in --dial-accent. The window is a reflective LCD. The A/P pusher is a slightly concave aluminium button.
   Dark tone: black anodized case and face, white print and hands, and a backlit negative LCD (its light is the backlight). */
(() => {
  const at = (deg, r) => [100 + r * Math.sin(deg * Math.PI / 180), 100 - r * Math.cos(deg * Math.PI / 180)];
  let face = `<defs><linearGradient id="rec" x1="0" y1="0" x2="0" y2="1"><stop class="ra" offset="0"/><stop class="rb" offset="1"/></linearGradient></defs>
<circle class="dial" cx="100" cy="100" r="85"/><circle cx="100" cy="100" r="85" fill="none" stroke="url(#rec)" stroke-width="2.2"/>`;
  for (let i = 0; i < 60; i++) face += `<line class="${i % 5 ? 'mt' : 'ht'}" transform="rotate(${i * 6} 100 100)" x1="100" y1="${i % 5 ? 21 : 19}" x2="100" y2="${i % 5 ? 26 : 30}"/>`;
  for (let h = 1; h <= 12; h++) {
    if (h === 6) continue; // the window sits there
    const [x, y] = at(h * 30, 60);
    face += `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}">${h}</text>`;
  }
  const markup = DetentClock.dial({
    face,
    hands: {
      shadow: true,
      hr: '<line class="bar" x1="100" y1="110" x2="100" y2="50" stroke-width="5"/>',
      min: '<line class="bar" x1="100" y1="112" x2="100" y2="20" stroke-width="3.2"/>',
      cap: '<circle class="hub" cx="100" cy="100" r="4.2"/><circle class="pin" cx="100" cy="100" r="1.2"/>'
    }
  });
  DetentClock.look('braun', {
    css: `
.t { --acc: var(--dial-accent, #f2641e); --focus: var(--acc); --drop: .25;
  --face: radial-gradient(circle at 46% 32%, #fbfbfb, #ececeb 55%, #dededd); --lathe: #00000006; --sheen: #ffffff59; --sheen-2: #ffffff47;
  --case-sh: inset 0 1px 0 #fff, inset 0 -1px 1px #0002, 0 0 0 .5px #00000040, 0 1px 1.5px #00000059, 0 3px 5px -1px #00000033, 0 28px 44px -26px #0007;

<script id="src-clock-look-pedal">
/* Clock look "pedal": matte grey plastic, after the Pointer Knob. Printed white indices, grey plastic hands with printed
   pointer lines (the minute line in --dial-accent). The window is a mechanical drum counter geared to the train, so its
   printed digits roll, blurred along the motion like the pedal encoder's readout: forward when the time goes forward, back
   when it goes back, and they stop dead in each position. The A/P pusher is a grey plastic button in a fixed recessed seat.
   Dark tone: the same plastic on a black panel, with a deeper seat and shadows. */
(() => {
  const at = (deg, r) => [100 + r * Math.sin(deg * Math.PI / 180), 100 - r * Math.cos(deg * Math.PI / 180)];
  let face = '';
  for (let i = 0; i < 60; i++) {
    if (i % 5 === 0) { face += `<line class="pb" transform="rotate(${i * 6} 100 100)" x1="100" y1="17" x2="100" y2="28"/>`; continue; }
    const [x, y] = at(i * 6, 81);
    face += `<circle class="pd" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r=".9"/>`;
  }
  // Each drum wheel carries its symbols three times round, so it can roll past either end, then quietly re-centres.
  // The AM/PM wheel is "w-day", so it never collides with the core's .ap pusher.
  const WHEELS = [['hr', ['12', '01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11']], ['mt', '012345'.split('')],
    ['mu', '0123456789'.split('')], ['day', ['AM', 'PM']]];
  const reel = (k, items) => `<b class="col w-${k}" data-k="${k}"><span class="reel">${items.concat(items, items).map(s => `<i>${s}</i>`).join('')}</span></b>`;
  const readout = reel(...WHEELS[0]) + '<span class="sep">:</span>' + reel(...WHEELS[1]) + reel(...WHEELS[2]) + reel(...WHEELS[3]);
  function place(col, pos, animate) {
    const n = col._n;
    col._pos = pos;
    col._reel.style.transition = animate ? '' : 'none';
    col._reel.style.transform = `translateY(${-pos * 1.25}em)`;
    if (!animate) return;
    col.classList.add('moving');
    clearTimeout(col._t);
    col._t = setTimeout(() => {
      col.classList.remove('moving');
      if (col._pos < n || col._pos >= 2 * n) place(col, n + ((col._pos % n) + n) % n, false);
    }, 150);
  }
  const markup = DetentClock.dial({
    face,
    readout,
    over: '<i class="seat"></i>',
    hands: {
      shadow: true,
      hr: '<line class="ph" x1="100" y1="106" x2="100" y2="56" stroke-width="6"/><line class="pl" x1="100" y1="96" x2="100" y2="62" stroke-width="1.5"/>',
      min: '<line class="ph" x1="100" y1="108" x2="100" y2="26" stroke-width="4.6"/><line class="pl m" x1="100" y1="98" x2="100" y2="32" stroke-width="1.5"/>',
      cap: '<circle class="pcap" cx="100" cy="100" r="5.5"/>'
    }
  });
  DetentClock.look('pedal', {
    css: `
.t { --acc: var(--dial-accent, #ffffff); --knob: #4a4a4a; --print: #f2f2ee; --trail: #f2f2ee38; --focus: #4a4a4a; --drop: .35;
  --seat-sh: inset 0 1px 2px #00000066, 0 1px 0 #ffffff1f;
  --body-sh: inset 0 1px 0 #ffffff1f, inset 0 -1px 1px #00000066, 0 0 0 .5px #0000004d, 0 1px 1.5px #00000047, 0 3px 6px -2px #00000033, 0 22px 34px -18px #00000070;
  --key-sh: inset 0 1px 0 #ffffff1f, inset 0 -1px 1px #00000066, 0 0 0 .5px #0000004d, 0 1px 1.5px #00000047, 0 2px 4px -2px #00000033;
  --key-dn: inset 0 1px 0 #ffffff1f, inset 0 -1px 1px #00000066, 0 0 0 .5px #0000004d, 0 .5px 1px #00000052, 0 1px 2px -1px #00000033 }
.t.dark { --knob: #4e4e50; --focus: #d4d4d0; --drop: .6;
  --seat-sh: inset 0 1px 2px #000000d9, 0 1px 0 #ffffff14;
  --body-sh: inset 0 1px 0 #ffffff2b, inset 0 -1px 1px #00000099, 0 0 0 .5px #000000b3, 0 1px 1.5px #000000a6, 0 3px 6px -2px #00000080, 0 22px 34px -18px #000000cc;
  --key-sh: inset 0 1px 0 #ffffff2b, inset 0 -1px 1px #00000099, 0 0 0 .5px #000000b3, 0 1px 1.5px #000000a6, 0 2px 4px -2px #00000080;
  --key-dn: inset 0 1px 0 #ffffff2b, inset 0 -1px 1px #00000099, 0 0 0 .5px #000000b3, 0 .5px 1px #000000bf, 0 1px 2px -1px #00000080 }
/* Matte plastic, lit from above, with a contact shadow. Same plastic as the pedal encoder's cap. */
.tile { background: radial-gradient(circle at 50% 28%, color-mix(in srgb, var(--knob), #fff 9%), var(--knob) 58%, color-mix(in srgb, var(--knob), #000 18%));
  box-shadow: var(--body-sh) }
.pb { stroke: var(--print); stroke-width: 2.6 } .pd { fill: var(--print); opacity: .55 }
.ph { stroke: color-mix(in srgb, var(--knob), #fff 12%); stroke-linecap: butt } .pl { stroke: var(--print) } .pl.m { stroke: var(--acc) }
.pcap { fill: color-mix(in srgb, var(--knob), #fff 12%) }
/* The drum counter: printed wheels behind a recessed window. Mechanical, so it rolls, and stops dead in each position. */
.read { gap: 0; padding: 0 3.5%; border-radius: 3px; background: #151515; box-shadow: inset 0 1.5px 2px #000c, 0 1px 0 #ffffff1a; color: var(--print); font-weight: 500 }
.col { display: block; height: 1.25em; overflow: hidden; line-height: 1.25em; font-weight: inherit }
.col.w-day { font: 500 .6em/1.25em "Geist", system-ui, sans-serif; margin-left: .45em }
.reel { display: block; transition: transform .12s cubic-bezier(.55,0,1,1) }
.reel i { display: block; font-style: normal; text-align: center }
/* While a wheel rolls, its print blurs along the motion. */
.col.moving i { filter: blur(.5px); text-shadow: 0 .32em .16em var(--trail), 0 -.32em .16em var(--trail) }
.sep { padding: 0 .08em }
/* The seat: a shallow recess in the case the pusher sits in. It never moves; the pusher sinks into it. */
.seat { position: absolute; right: 6%; bottom: 6%; width: 13%; height: 13%; border-radius: 50%; background: #00000033; box-shadow: var(--seat-sh) }
.ap { background: radial-gradient(circle at 50% 28%, color-mix(in srgb, var(--knob), #fff 14%), var(--knob) 60%, color-mix(in srgb, var(--knob), #000 15%));
  box-shadow: var(--key-sh); color: var(--print); font: 600 calc(var(--s) * .055) "Geist", system-ui, sans-serif }
.ap.down { box-shadow: var(--key-dn) }
@media (prefers-reduced-motion: reduce) { .reel { transition: none } .col.moving i { filter: none; text-shadow: none } }
`,
    html: () => markup,
    setup(root, el) {
      el.ls.cols = [...root.querySelectorAll('.col')].map(col => {
        col._reel = col.firstElementChild;
        col._n = WHEELS.find(w => w[0] === col.dataset.k)[1].length;
        return col;
      });
    },
    paint(root, el, { mins, hr12, pm }) {
      const want = { hr: hr12 % 12, mt: Math.floor(mins / 10), mu: mins % 10, day: +pm };
      for (const col of el.ls.cols) {
        const n = col._n, v = want[col.dataset.k];
        if (col._pos === undefined) { place(col, n + v, false); continue; }
        let step = ((v - col._pos) % n + n) % n;
        if (!step) continue;
        if (el.dir < 0) step -= n;
        place(col, col._pos + step, !Feel.reduced());
      }
    }
  });
})();
</script>

<script id="src-clock-look-nothing">

   minute with one red dot at the minute itself (the only accent, and only for the live state), flat hands, and dot-matrix
   digits whose unused leading hour digit stays unlit. No shadow, gradient, dome, texture or glow. Dots and digits switch
   instantly. Light tone: a white tile with black dots. Dark tone: a black tile with white dots. --dial-accent is the dot. */
(() => {
  const at = (deg, r) => [100 + r * Math.sin(deg * Math.PI / 180), 100 - r * Math.cos(deg * Math.PI / 180)];
  let face = '';
  for (let i = 0; i < 60; i++) { const [x, y] = at(i * 6, 84); face += `<circle class="d${i % 5 ? '' : ' big'}" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${i % 5 ? 1.3 : 2.3}"/>`; }
  const markup = DetentClock.dial({
    face,
    readout: '<span class="h"></span><span class="c">:</span><span class="m"></span><span class="ampm"></span>',
    hands: {
      shadow: false,
      hr: '<line class="nh" x1="100" y1="104" x2="100" y2="58" stroke-width="4.5"/>',
      min: '<line class="nh" x1="100" y1="106" x2="100" y2="30" stroke-width="2.6"/>',
      cap: '<circle class="nhub" cx="100" cy="100" r="3.4"/>'
    }
  });
  DetentClock.look('nothing', {
    css: `
.t { --acc: var(--dial-accent, #d71921); --focus: var(--acc); --tile: #ecebe6; --edge: #00000014; --off: #d0cfc9; --on: #1b1b1b; --unlit: #d9d8d2; --label: #8a8a85 }
.t.dark { --tile: #0b0b0b; --edge: #ffffff14; --off: #2a2a2a; --on: #f2f2f2; --unlit: #2e2e2e; --label: #7c7c7c }
/* Flat: one colour and a hairline edge. */
.tile { background: var(--tile); box-shadow: inset 0 0 0 1px var(--edge) }
.d { fill: var(--off) } .d.on { fill: var(--on) } .d.head { fill: var(--acc) }
.nh { stroke: var(--on) } .nhub { fill: var(--on) }
.read { top: 60%; height: 14%; gap: 0; color: var(--on); font: 800 calc(var(--s) * .1) "Doto", "Geist Mono", ui-monospace, monospace; letter-spacing: -.02em }
.u { color: var(--unlit) }
.ampm { display: block; align-self: center; margin-left: .7em; font: 400 calc(var(--s) * .042) "Geist Mono", ui-monospace, monospace; letter-spacing: .14em; color: var(--label) }
/* The pusher: a flat ring printed on the tile, no shadow. */
.ap { background: none; box-shadow: inset 0 0 0 1px var(--edge); color: var(--on); font: 400 calc(var(--s) * .045) "Geist Mono", ui-monospace, monospace; letter-spacing: .06em }
`,
    html: () => markup,
    setup(root, el) { el.ls.dots = [...root.querySelectorAll('.d')]; },
    paint(root, el, { mins, hr12 }) {
      el.ls.dots.forEach((d, i) => { d.classList.toggle('on', i < mins); d.classList.toggle('head', i === mins); });
      const h = String(hr12).padStart(2, '0');
      el.hEl.innerHTML = h[0] === '0' ? `<b class="u">0</b>${h[1]}` : h; // an unused leading digit stays as unlit dots
    }
  });
})();
</script>

<script id="src-clock-look-aqua">

  DetentClock.look('aqua', {

  --glass: linear-gradient(170deg, #ffffff40, #ffffff08 55%, #ffffff1f); --spec: #ffffffd9; --caustic: #ffffffb3;

  --gel-sh: inset 0 -2px 3px #ffffff59, 0 0 0 .5px color-mix(in srgb, var(--acc), #000 40%), 0 1px 2px #0004, 0 3px 6px -2px #0003;

  --glass: linear-gradient(170deg, #ffffff26, #ffffff05 55%, #ffffff12); --spec: #ffffff52; --caustic: #ffffff2e;
  --glass-sh: inset 0 1px 0 #ffffff8c, inset 0 -1.5px 1px #ffffff40, inset 0 0 0 .5px #ffffff26, inset 0 -14px 24px -14px #ffffff2e, inset 0 3px 8px #0006;
  --gel-sh: inset 0 -2px 3px #ffffff40, 0 0 0 .5px #000, 0 1px 2px #000a, 0 3px 6px -2px #0008;
  --gel-dn: inset 0 -2px 3px #ffffff40, 0 0 0 .5px #000, 0 .5px 1px #000b, 0 1px 3px -1px #0008 }
.tile { background: repeating-linear-gradient(var(--stripe-a) 0 2px, var(--stripe-b) 2px 4px); box-shadow: var(--case-sh) }

<script type="text/plain" id="swift-machined-dial">
// MachinedDial.swift — Detent
// A turned-aluminum knob sitting in a recessed, brushed bowl. It turns like a detented rotary
// encoder: pulled into each notch with a tiny click, and stopped dead at both ends.
// detents: 0 makes it a smooth, silent potentiometer. Haptics and sound are built in. iOS / iPadOS 17+.
//
// Usage:
//   @State private var level = 40.0
//   MachinedDial(value: $level)
//   MachinedDial(value: $level, size: 280, accent: .red, detents: 24)

import SwiftUI
import UIKit
import AVFoundation

public struct MachinedDial: View {
    @Binding private var value: Double          // 0...100
    private let size: CGFloat
    private let accent: Color
    private let detents: Int
    private let sound: Bool
    private let label: String

    public init(value: Binding<Double>,
                size: CGFloat = 240,
                accent: Color = Color(red: 0.95, green: 0.39, blue: 0.12),
                detents: Int = 60,
                sound: Bool = true,
                label: String = "Level") {
        _value = value
        self.size = size
        self.accent = accent
        self.detents = max(0, detents)
        self.sound = sound
        self.label = label
    }

    @State private var raw: Double?             // unsnapped position while a finger turns it
    @State private var lastAngle: Double?
    @State private var pressed = false
    @State private var atEdge = 0               // -1 / 1 while resting on an end stop, so it ticks only once
    @FocusState private var focused: Bool
    @Environment(\.accessibilityReduceMotion) private var reduceMotion

    private var step: Double { detents > 0 ? 100 / Double(detents) : 0 }
    private var marks: Int { detents > 0 ? detents : 60 }
    // Between notches the detent spring holds the knob, so it only gives a little until it clicks over.
    private var shown: Double {
        guard let raw, step > 0 else { return value }
        return value + (raw - value) * 0.3
    }
    private var angle: Angle { .degrees(-135 + shown * 2.7) }
    private var capD: CGFloat { size * 0.56 }

    public var body: some View {
        ZStack {
            Scale(marks: marks, lit: value, accent: accent)
            bowl.padding(size * 0.11)
            cap
        }
        .frame(width: size, height: size)
        .contentShape(Circle())
        .gesture(turnGesture)
        .focusable()
        .focused($focused)
        .onKeyPress(keys: [.upArrow, .rightArrow, .downArrow, .leftArrow]) { press in
            nudge(press.key == .upArrow || press.key == .rightArrow ? 1 : -1)
            return .handled
        }
        .accessibilityElement()
        .accessibilityLabel(label)
        .accessibilityValue("\(Int(value.rounded())) percent")
        .accessibilityAdjustableAction { direction in
            switch direction {
            case .increment: nudge(1)
            case .decrement: nudge(-1)
            @unknown default: break
            }
        }
    }

    // The bowl is a recess cut into the panel, brushed in a circle. Light comes from above, so the upper
    // inner wall sits in shadow. Its highlights belong to the room, so they never turn.
    private var bowl: some View {
        let metal: [Color] = [w(0.98), w(0.6), w(0.91), w(0.36), w(0.85), w(0.98), w(0.54), w(0.95), w(0.98)]
        return Circle()
            .fill(AngularGradient(colors: metal, center: .center, angle: .degrees(210)))
            .overlay(Circle().strokeBorder(.black.opacity(0.35), lineWidth: 6).blur(radius: 4).offset(y: 3).mask(Circle()))
            .overlay(Circle().strokeBorder(.black.opacity(0.14), lineWidth: 1))
    }

    // The cap: a short cylinder. Its chamfered rim catches the top light; the flat face is lathe-turned.
    private var cap: some View {
        let face = capD * 0.948
        return ZStack {
            Circle().fill(LinearGradient(colors: [w(0.985), w(0.85), w(0.725)], startPoint: .top, endPoint: .bottom))
            ZStack {
                Circle().fill(RadialGradient(colors: [w(0.985), w(0.925), w(0.87)], center: UnitPoint(x: 0.46, y: 0.32),
                                             startRadius: 0, endRadius: face * 0.7))
                // Lathe rings, faded out toward the center, and the fan-shaped sheen of a turned face.
                LatheRings()
                    .mask(RadialGradient(colors: [.clear, .black], center: .center, startRadius: face * 0.09, endRadius: face * 0.3))
                Circle().fill(AngularGradient(colors: [.clear, .white.opacity(0.35), .clear, .clear, .clear,
                                                       .clear, .white.opacity(0.28), .clear, .clear, .clear],
                                              center: .center, angle: .degrees(120)))
            }
            .frame(width: face, height: face)
            .clipShape(Circle())
            // The indicator: a short groove cut into the face and filled with paint, flush with the surface.
            Capsule()
                .fill(accent)
                .overlay(Capsule().strokeBorder(.black.opacity(0.22), lineWidth: 0.8).offset(y: 0.5).mask(Capsule()))
                .frame(width: capD * 0.036, height: capD * 0.17)
                .offset(y: -capD * 0.325)
                .rotationEffect(angle)
        }
        .frame(width: capD, height: capD)
        // A contact shadow where it meets the bowl, then a soft cast shadow below. It never lifts.
        .shadow(color: .black.opacity(0.35), radius: pressed ? 0.6 : 0.9, y: pressed ? 0.5 : 1)
        .shadow(color: .black.opacity(0.2), radius: pressed ? 1.5 : 2.5, y: pressed ? 1.5 : 3)
        .shadow(color: .black.opacity(0.25), radius: pressed ? 4 : 7, y: pressed ? 5 : 8)
        .scaleEffect(pressed ? 0.994 : 1)
        .offset(y: pressed ? 0.5 : 0)
    }

    private var turnGesture: some Gesture {
        DragGesture(minimumDistance: 0)
            .onChanged { g in
                let dx = g.location.x - size / 2, dy = g.location.y - size / 2
                guard hypot(dx, dy) > 8 else { return }          // too close to the axis to read an angle
                let a = atan2(dy, dx) * 180 / .pi
                if raw == nil {
                    raw = value
                    withAnimation(.easeOut(duration: 0.05)) { pressed = true }
                    Feedback.shared.prepare()
                }
                if let last = lastAngle {
                    var d = a - last
                    if d > 180 { d -= 360 } else if d < -180 { d += 360 }
                    turn(by: d * 100 / 270)
                }
                lastAngle = a
            }
            .onEnded { _ in
                lastAngle = nil
                // Let go between notches and it drops into the nearest one. Nothing keeps spinning.
                withAnimation(reduceMotion ? nil : .easeOut(duration: 0.06)) { raw = nil; pressed = false }
            }
    }

    private func turn(by dv: Double) {
        // The end stops are hard: past them the knob simply doesn't turn, and the finger slips.
        let r = min(100, max(0, (raw ?? value) + dv))
        raw = r
        commit(snap(r))
    }

    private func nudge(_ n: Int) {
        let v = snap(value + Double(n) * (step > 0 ? step : 1))
        withAnimation(reduceMotion ? nil : .easeOut(duration: 0.06)) { commit(v) }
    }

    private func snap(_ v: Double) -> Double {
        let c = min(100, max(0, v))
        return step > 0 ? (c / step).rounded() * step : c
    }

    private func commit(_ v: Double) {
        guard v != value else { return }
        value = v
        if atEdge == 0, v <= 0 || v >= 100 {
            atEdge = v <= 0 ? -1 : 1
            Feedback.shared.stop(sound: sound)
        } else if (atEdge < 0 && v > 3) || (atEdge > 0 && v < 97) {
            atEdge = 0
        }
        if step > 0, v > 0, v < 100 { Feedback.shared.detent(sound: sound) }
    }

    private func w(_ white: Double) -> Color { Color(white: white) }
}

/// The engraved scale around the bowl, backlit up to the value in the indicator color.
private struct Scale: View {
    let marks: Int
    let lit: Double
    let accent: Color
    var body: some View {
        Canvas { ctx, size in
            let r = min(size.width, size.height) / 2
            let c = CGPoint(x: size.width / 2, y: size.height / 2)
            let long = max(1, Int((Double(marks) / 12).rounded()))
            let litUpTo = Int((lit / 100 * Double(marks)).rounded())
            for i in 0...marks {
                let a = (-135 + Double(i) * 270 / Double(marks) - 90) * .pi / 180
                let isLong = i % long == 0
                let outer = r * 0.96, inner = r * (isLong ? 0.84 : 0.88)
                var p = Path()
                p.move(to: CGPoint(x: c.x + cos(a) * inner, y: c.y + sin(a) * inner))
                p.addLine(to: CGPoint(x: c.x + cos(a) * outer, y: c.y + sin(a) * outer))
                let on = lit > 0 && i <= litUpTo
                ctx.stroke(p, with: .color(on ? accent : Color(white: isLong ? 0.41 : 0.5)),
                           style: StrokeStyle(lineWidth: isLong ? 1.4 : 1.2, lineCap: .round))
            }
        }
    }
}

/// Fine concentric rings left by the lathe.
private struct LatheRings: View {
    var body: some View {
        Canvas { ctx, size in
            let c = CGPoint(x: size.width / 2, y: size.height / 2)
            var r: CGFloat = 1.6
            while r < size.width / 2 {
                ctx.stroke(Path(ellipseIn: CGRect(x: c.x - r, y: c.y - r, width: r * 2, height: r * 2)),
                           with: .color(.black.opacity(0.025)), lineWidth: 0.6)
                r += 2.2
            }
        }
        .clipShape(Circle())
    }
}

/// A light, crisp haptic per notch and a firmer one at an end stop. Nothing on touch-down.
@MainActor private final class Feedback {
    static let shared = Feedback()
    private let rigid = UIImpactFeedbackGenerator(style: .rigid)
    private let synth = ClickSynth()

    func prepare() { rigid.prepare() }
    func detent(sound: Bool) {
        rigid.impactOccurred(intensity: 0.45)
        rigid.prepare()
        if sound { synth.play(.detent) }
    }
    func stop(sound: Bool) {
        rigid.impactOccurred(intensity: 0.7)
        if sound { synth.play(.stop) }
    }
}

/// Small hard parts can't make a pitched thump: they ring for a millisecond or two at a few high body modes.
private final class ClickSynth {
    enum Voice: CaseIterable { case detent, stop }
    private let engine = AVAudioEngine()
    private let player = AVAudioPlayerNode()
    private var buffers: [Voice: AVAudioPCMBuffer] = [:]
    private var ready = false

    init() {
        guard let format = AVAudioFormat(standardFormatWithSampleRate: 44_100, channels: 1) else { return }
        engine.attach(player)
        engine.connect(player, to: engine.mainMixerNode, format: format)
        for voice in Voice.allCases { buffers[voice] = Self.render(voice, format: format) }
        // Ambient: respects the silent switch and mixes with the user's music.
        try? AVAudioSession.sharedInstance().setCategory(.ambient, options: [.mixWithOthers])
        ready = (try? engine.start()) != nil
    }

    func play(_ voice: Voice) {
        guard ready, let buffer = buffers[voice] else { return }
        player.scheduleBuffer(buffer, at: nil, options: .interrupts)
        if !player.isPlaying { player.play() }
    }

    // Body modes of a small plastic/metal part: (Hz, decay seconds, gain)
    private static let modes: [(Float, Float, Float)] = [(1900, 0.0024, 1), (3400, 0.0015, 0.55), (6100, 0.0008, 0.3)]

    private static func render(_ voice: Voice, format: AVAudioFormat) -> AVAudioPCMBuffer? {
        // The encoder notch is brighter and quieter; the end stop is a little duller.
        let (level, tune): (Float, Float) = voice == .detent ? (0.05, 1.35) : (0.09, 0.85)
        let rate = Float(format.sampleRate)
        let frames = AVAudioFrameCount(rate * 0.02)
        guard let buffer = AVAudioPCMBuffer(pcmFormat: format, frameCapacity: frames),
              let out = buffer.floatChannelData?[0] else { return nil }
        buffer.frameLength = frames
        for i in 0..<Int(frames) {
            let t = Float(i) / rate
            var tick: Float = 0
            for (hz, decay, gain) in modes { tick += gain * sinf(2 * .pi * hz * tune * t) * expf(-t / decay) }
            tick += Float.random(in: -1...1) * 0.5 * expf(-t / 0.0003)   // the contact itself
            out[i] = tick * level * 2.2
        }
        return buffer
    }
}

    struct Demo: View {

<script type="text/plain" id="swift-knurl-switch">
// KnurlSwitch.swift — Detent
// A slide switch with a machined thumb that behaves like the hardware: the thumb holds against
// its detent, then snaps over center into a hard stop with a small, dry two-part tick.
// Tap it or push the thumb. Haptics and the click sound are built in. iOS / iPadOS 17+.
//
// Usage:
//   @State private var isOn = true
//   KnurlSwitch(isOn: $isOn)
//   KnurlSwitch(isOn: $isOn, tint: .blue, width: 190)

import SwiftUI
import UIKit
import AVFoundation

public struct KnurlSwitch: View {
    @Binding private var isOn: Bool
    private let tint: Color
    private let width: CGFloat
    private let sound: Bool
    private let label: String

    public init(isOn: Binding<Bool>,
                tint: Color = Color(red: 0.96, green: 0.49, blue: 0),
                width: CGFloat = 150,
                sound: Bool = true,
                label: String = "Switch") {
        _isOn = isOn
        self.tint = tint
        self.width = width
        self.sound = sound
        self.label = label
    }

    @State private var give: CGFloat = 0       // how far the thumb yields against its detent (0...1 of travel)
    @State private var anchor: CGFloat = 0     // finger x where the current push started
    @State private var pressed = false
    @State private var moved = false
    @Environment(\.accessibilityReduceMotion) private var reduceMotion
    @Environment(\.isEnabled) private var isEnabled

    // Geometry, all derived from the width so the switch scales as one piece.
    private var pad: CGFloat { width * 0.035 }
    private var wellW: CGFloat { width - pad * 2 }
    private var wellH: CGFloat { width * 0.47 }
    private var inset: CGFloat { wellH * 0.04 }
    private var thumbD: CGFloat { wellH * 0.92 }
    private var span: CGFloat { wellW - thumbD - inset * 2 }
    private var progress: CGFloat { (isOn ? 1 : 0) + (isOn ? -give : give) }
    private let hold: CGFloat = 0.3             // push this far against the detent and it snaps over center
    // Over center, the detent spring throws the slider: it accelerates and stops dead. No overshoot.
    private var snap: Animation? { reduceMotion ? nil : .timingCurve(0.55, 0, 1, 1, duration: 0.11) }

    public var body: some View {
        ZStack {
            Capsule()
                .fill(LinearGradient(colors: [Color(white: 0.7), Color(white: 0.92), Color(white: 0.98), .white],
                                     startPoint: .top, endPoint: .bottom))
                .overlay(Capsule().strokeBorder(.white.opacity(0.9), lineWidth: 1).blendMode(.overlay))
                .shadow(color: .black.opacity(0.28), radius: 14, y: 12)
                .shadow(color: .black.opacity(0.12), radius: 2, y: 1)
            well
                .frame(width: wellW, height: wellH)
        }
        .frame(width: width, height: wellH + pad * 2)
        .contentShape(Capsule())
        .gesture(dragGesture)
        .opacity(isEnabled ? 1 : 0.5)
        .accessibilityElement()
        .accessibilityLabel(label)
        .accessibilityValue(isOn ? "On" : "Off")
        .accessibilityAddTraits(.isToggle)
        .accessibilityAction { set(!isOn) }
    }

    private var well: some View {
        ZStack(alignment: .leading) {
            // Off: a dark recess with an embossed ring on the right.
            Capsule()
                .fill(LinearGradient(colors: [Color(white: 0.36), Color(white: 0.46)], startPoint: .top, endPoint: .bottom))
            Circle()
                .strokeBorder(Color(white: 0.3), lineWidth: 2)
                .frame(width: wellW * 0.17, height: wellW * 0.17)
                .offset(x: wellW * (1 - 0.12 - 0.17))

            // On: the tint is revealed up to the thumb's center, so it follows your finger.
            Capsule()
                .fill(LinearGradient(colors: [tint, tint.opacity(0.88)], startPoint: .top, endPoint: .bottom))
                .overlay(alignment: .leading) {
                    RoundedRectangle(cornerRadius: 2)
                        .fill(.white.opacity(0.55))
                        .frame(width: wellW * 0.035, height: wellH * 0.24)
                        .shadow(color: .white.opacity(isOn ? 0.8 : 0), radius: 4)
                        .offset(x: wellW * 0.13)
                }
                .mask(alignment: .leading) {
                    Rectangle().frame(width: max(0, inset + progress * span + thumbD / 2 + progress * (thumbD / 2 + inset)))
                }

            // The recess shadow sits above both fills.
            Capsule()
                .strokeBorder(.black.opacity(0.55), lineWidth: 7)
                .blur(radius: 5)
                .offset(y: 3)
                .mask(Capsule())
                .allowsHitTesting(false)
            Capsule().strokeBorder(.black.opacity(0.3), lineWidth: 1)

            thumb
                .frame(width: thumbD, height: thumbD)
                .scaleEffect(pressed ? 0.985 : 1)              // a finger presses it in a hair; it never lifts
                .shadow(color: .black.opacity(0.45), radius: pressed ? 4 : 7, y: pressed ? 4 : 6)
                .offset(x: inset + progress * span, y: pressed ? 0.6 : 0)
        }
        .clipShape(Capsule())
    }

    private var thumb: some View {
        let face = thumbD * 0.82
        // A polished bezel: the light stays put while the metal turns, like the web version.
        return ZStack {
            Circle().fill(AngularGradient(colors: [Color(white: 0.99), Color(white: 0.8), Color(white: 0.96), Color(white: 0.73),
                                                   Color(white: 0.98), Color(white: 0.83), Color(white: 0.99)],
                                          center: .center, angle: .degrees(200)))
            KnurlFace()
                .frame(width: face, height: face)
                .clipShape(Circle())
                .overlay(Circle().fill(RadialGradient(colors: [.white.opacity(0.38), .clear, .black.opacity(0.18)],
                                                      center: UnitPoint(x: 0.5, y: 0.28), startRadius: 0, endRadius: face * 0.6)))
                .overlay(Circle().strokeBorder(.black.opacity(0.18), lineWidth: 1.5).blur(radius: 1).offset(y: 1).mask(Circle()))
        }
        .compositingGroup()
    }

    private var dragGesture: some Gesture {
        DragGesture(minimumDistance: 0)
            .onChanged { g in
                if !pressed {
                    withAnimation(.easeOut(duration: 0.05)) { pressed = true }
                    anchor = g.startLocation.x
                    Feedback.shared.prepare()
                }
                let dx = g.location.x - anchor
                if !moved && abs(dx) < 3 { return }
                moved = true
                let push = (isOn ? -dx : dx) / span       // > 0 means toward the other end
                if push >= hold {
                    anchor = g.location.x                  // re-anchor so it can be pushed back
                    set(!isOn)
                } else {
                    give = max(0, push) * 0.22             // the thumb only yields a little against the detent
                }
            }
            .onEnded { _ in
                let tap = !moved
                withAnimation(.easeOut(duration: 0.09)) { pressed = false; give = 0 }   // detent spring pushes it home
                moved = false
                if tap { set(!isOn) }
            }
    }

    private func set(_ value: Bool) {
        guard isEnabled, value != isOn else { return }
        withAnimation(snap) { isOn = value; give = 0 }
        Feedback.shared.snap(sound: sound, on: value)
    }
}

/// The diamond knurl: rows of tiny four-sided pyramids, each face lit differently.
private struct KnurlFace: View {
    var body: some View {
        Canvas { ctx, size in
            let cell: CGFloat = 5
            let shades: [Color] = [Color(white: 0.99), Color(white: 0.8), Color(white: 0.69), Color(white: 0.9)] // top, right, bottom, left
            var y: CGFloat = 0
            while y < size.height {
                var x: CGFloat = 0
                while x < size.width {
                    let c = CGPoint(x: x + cell / 2, y: y + cell / 2)
                    let corners = [CGPoint(x: x, y: y), CGPoint(x: x + cell, y: y),
                                   CGPoint(x: x + cell, y: y + cell), CGPoint(x: x, y: y + cell)]
                    for i in 0..<4 {
                        var tri = Path()
                        tri.move(to: corners[i]); tri.addLine(to: corners[(i + 1) % 4]); tri.addLine(to: c); tri.closeSubpath()
                        ctx.fill(tri, with: .color(shades[i]))
                    }
                    x += cell
                }
                y += cell
            }
        }
    }
}

/// One firm, short haptic at the snap, plus the click. Nothing on touch-down: a real switch is silent until it moves.
@MainActor private final class Feedback {
    static let shared = Feedback()
    private let rigid = UIImpactFeedbackGenerator(style: .rigid)
    private let synth = ClickSynth()

    func prepare() { rigid.prepare() }
    func snap(sound: Bool, on: Bool) {
        rigid.impactOccurred(intensity: 0.75)
        if sound { synth.play(on ? .on : .off) }
    }
}

/// Small hard parts can't make a pitched thump: they ring for a millisecond or two at a few high body modes.
/// A slide switch makes two of those: the slider leaving its detent (quiet), then landing on the stop.
private final class ClickSynth {
    enum Voice: CaseIterable { case on, off }
    private let engine = AVAudioEngine()
    private let player = AVAudioPlayerNode()
    private var buffers: [Voice: AVAudioPCMBuffer] = [:]
    private var ready = false

    init() {
        guard let format = AVAudioFormat(standardFormatWithSampleRate: 44_100, channels: 1) else { return }
        engine.attach(player)
        engine.connect(player, to: engine.mainMixerNode, format: format)
        for voice in Voice.allCases { buffers[voice] = Self.render(voice, format: format) }
        // Ambient: respects the silent switch and mixes with the user's music.
        try? AVAudioSession.sharedInstance().setCategory(.ambient, options: [.mixWithOthers])
        ready = (try? engine.start()) != nil
    }

    func play(_ voice: Voice) {
        guard ready, let buffer = buffers[voice] else { return }
        player.scheduleBuffer(buffer, at: nil, options: .interrupts)
        if !player.isPlaying { player.play() }
    }

    // Body modes of a small ABS slider and its contact leaf: (Hz, decay seconds, gain)
    private static let modes: [(Float, Float, Float)] = [(1900, 0.0024, 1), (3400, 0.0015, 0.55), (6100, 0.0008, 0.3)]

    private static func render(_ voice: Voice, format: AVAudioFormat) -> AVAudioPCMBuffer? {
        let pitch: Float = voice == .on ? 1.04 : 0.96
        let rate = Float(format.sampleRate)
        let frames = AVAudioFrameCount(rate * 0.04)
        guard let buffer = AVAudioPCMBuffer(pcmFormat: format, frameCapacity: frames),
              let out = buffer.floatChannelData?[0] else { return nil }
        buffer.frameLength = frames
        // (start time, level, tuning) for the release tick and the landing tick
        let ticks: [(Float, Float, Float)] = [(0, 0.07, 1.08 * pitch), (0.009, 0.16, pitch)]
        for i in 0..<Int(frames) {
            let t = Float(i) / rate
            var sample: Float = 0
            for (start, level, tune) in ticks where t >= start {
                let local = t - start
                var tick: Float = 0
                for (hz, decay, gain) in modes {
                    tick += gain * sinf(2 * .pi * hz * tune * local) * expf(-local / decay)
                }
                tick += Float.random(in: -1...1) * 0.5 * expf(-local / 0.0003)   // the contact itself
                sample += tick * level
            }
            out[i] = sample * 2.2
        }
        return buffer
    }
}

<script type="text/plain" id="swift-index-knob">
// IndexKnob.swift — Detent
// A rotary selector switch: a matte black knob with an inlaid pointer line and a dark finger cup.
// Each position has a spring detent: the knob gives a little, snaps over center into the next
// position with a click, and stops hard at both ends. Haptics and sound are built in. iOS / iPadOS 17+.
//
// Usage:
//   @State private var power = 4
//   IndexKnob(value: $power, steps: 5, label: "PWR")
//   IndexKnob(value: $mode, steps: 3, label: "TCS", size: 140, line: .orange)

import SwiftUI
import UIKit
import AVFoundation

public struct IndexKnob: View {
    @Binding private var value: Int             // 1...steps
    private let steps: Int
    private let label: String
    private let size: CGFloat
    private let line: Color
    private let sound: Bool

    public init(value: Binding<Int>,
                steps: Int = 5,
                label: String = "PWR",
                size: CGFloat = 170,
                line: Color = Color(red: 0.83, green: 0.87, blue: 0.23),
                sound: Bool = true) {
        _value = value
        self.steps = max(2, steps)
        self.label = label
        self.size = size
        self.line = line
        self.sound = sound
    }

    @State private var acc: Double = 0          // degrees pushed past the current position
    @State private var pushDir: Double = 0
    @State private var lastAngle: Double?
    @State private var pressed = false
    @State private var atEdge = 0
    @FocusState private var focused: Bool
    @Environment(\.accessibilityReduceMotion) private var reduceMotion

    private var gap: Double { 270 / Double(steps - 1) }
    private func angleOf(_ i: Int) -> Double { -135 + Double(i - 1) * gap }
    // After a snap the knob is ahead of the finger, so it only shows give while it's actually being pushed.
    private var give: Double { acc.sign == pushDir.sign && pushDir != 0 ? acc * 0.25 : 0 }
    private var discD: CGFloat { size * 0.82 }
    // Over center, the detent spring throws the knob: it accelerates and stops dead. No overshoot.
    private var snap: Animation? { reduceMotion ? nil : .timingCurve(0.55, 0, 1, 1, duration: 0.07) }

    public var body: some View {
        VStack(spacing: 14) {
            ZStack {
                marks
                disc
            }
            .frame(width: size, height: size)
            .contentShape(Circle())
            .gesture(turnGesture)
            Text("\(label):\(value)")
                .font(.system(size: 13, weight: .medium, design: .monospaced))
                .tracking(1)
                .textCase(.uppercase)
                .foregroundStyle(Color(white: 0.6))
                .monospacedDigit()
        }
        .focusable()
        .focused($focused)
        .onKeyPress(keys: [.upArrow, .rightArrow, .downArrow, .leftArrow]) { press in
            nudge(press.key == .upArrow || press.key == .rightArrow ? 1 : -1)
            return .handled
        }
        .accessibilityElement()
        .accessibilityLabel(label)
        .accessibilityValue("\(value) of \(steps)")
        .accessibilityAdjustableAction { direction in
            switch direction {
            case .increment: nudge(1)
            case .decrement: nudge(-1)
            @unknown default: break
            }
        }
    }

    // Printed position marks: they belong to the panel, so they never change.
    private var marks: some View {
        ForEach(1...steps, id: \.self) { i in
            Circle()
                .fill(Color(white: 0.66))
                .frame(width: 4, height: 4)
                .offset(y: -size * 0.48)
                .rotationEffect(.degrees(angleOf(i)))
        }
    }

    // Matte soft-touch black, lit from above, sitting on the panel with a contact shadow.
    private var disc: some View {
        let body = RadialGradient(colors: [Color(white: 0.14), Color(white: 0.086), Color(white: 0.063)],
                                  center: UnitPoint(x: 0.5, y: 0.28), startRadius: 0, endRadius: discD * 0.7)
        return ZStack {
            Circle().fill(body)
            Circle().strokeBorder(.white.opacity(0.1), lineWidth: 1).mask(LinearGradient(colors: [.white, .clear], startPoint: .top, endPoint: .center))
            ZStack {
                // The pointer: a thin inlaid stripe.
                Capsule()
                    .fill(line)
                    .frame(width: discD * 0.02, height: discD * 0.4)
                    .offset(y: -discD * 0.22)
                // The finger cup: a dimple pressed into the same black, on the opposite side. It shows only by
                // its shaded upper wall and the light catching its lower edge.
                Circle()
                    .fill(RadialGradient(colors: [Color(white: 0.11), Color(white: 0.07), Color(white: 0.047)],
                                         center: UnitPoint(x: 0.5, y: 0.65), startRadius: 0, endRadius: discD * 0.07))
                    .overlay(Circle().strokeBorder(.black.opacity(0.85), lineWidth: 2).blur(radius: 1).offset(y: 1.2).mask(Circle()))
                    .overlay(Circle().strokeBorder(.white.opacity(0.1), lineWidth: 0.8).offset(y: 0.6)
                        .mask(LinearGradient(colors: [.clear, .white], startPoint: .center, endPoint: .bottom)))
                    .frame(width: discD * 0.128, height: discD * 0.128)
                    .offset(y: discD * 0.36)
            }
            .rotationEffect(.degrees(angleOf(value) + give))
        }
        .frame(width: discD, height: discD)
        .shadow(color: .black.opacity(0.45), radius: pressed ? 0.6 : 0.9, y: pressed ? 0.5 : 1)
        .shadow(color: .black.opacity(0.25), radius: pressed ? 2.5 : 4, y: pressed ? 2 : 4)
        .shadow(color: .black.opacity(0.35), radius: pressed ? 7 : 11, y: pressed ? 7 : 12)
        .scaleEffect(pressed ? 0.994 : 1)                 // a finger presses it in a hair; it never lifts
        .offset(y: pressed ? 0.5 : 0)
    }

    private var turnGesture: some Gesture {
        DragGesture(minimumDistance: 0)
            .onChanged { g in
                let dx = g.location.x - size / 2, dy = g.location.y - size / 2
                guard hypot(dx, dy) > 8 else { return }
                let a = atan2(dy, dx) * 180 / .pi
                if !pressed {
                    withAnimation(.easeOut(duration: 0.05)) { pressed = true }
                    acc = 0
                    Feedback.shared.prepare()
                }
                if let last = lastAngle {
                    var d = a - last
                    if d > 180 { d -= 360 } else if d < -180 { d += 360 }
                    push(d)
                }
                lastAngle = a
            }
            .onEnded { _ in
                lastAngle = nil
                // Let go between positions and the detent pulls the knob back into place.
                withAnimation(reduceMotion ? nil : .timingCurve(0.2, 0, 0.3, 1, duration: 0.08)) { pressed = false; acc = 0; pushDir = 0 }
            }
    }

    // It only gives a little until it passes halfway to the next position, then the detent throws it over.
    private func push(_ d: Double) {
        pushDir = d < 0 ? -1 : 1
        acc += d
        while abs(acc) > gap / 2 {
            let dir = acc < 0 ? -1 : 1
            let n = value + dir
            if n < 1 || n > steps {                     // hard end stop: no give at all
                acc = 0
                hitStop(n)
                break
            }
            acc -= Double(dir) * gap
            set(n)
        }
    }

    private func nudge(_ dir: Int) {
        let n = value + dir
        if n < 1 || n > steps { hitStop(n); return }
        set(n)
    }

    private func set(_ n: Int) {
        guard n != value else { return }
        withAnimation(snap) { value = n }
        Feedback.shared.click(sound: sound)
        if (atEdge < 0 && n > 1) || (atEdge > 0 && n < steps) { atEdge = 0 }
    }

    // End stops sound once on arrival and stay silent while you keep pushing.
    private func hitStop(_ n: Int) {
        let side = n < 1 ? -1 : 1
        guard atEdge != side else { return }
        atEdge = side
        Feedback.shared.stop(sound: sound)
    }
}

/// A firm haptic per position, like a ball dropping into a notch. Nothing on touch-down.
@MainActor private final class Feedback {
    static let shared = Feedback()
    private let rigid = UIImpactFeedbackGenerator(style: .rigid)
    private let synth = ClickSynth()

    func prepare() { rigid.prepare() }
    func click(sound: Bool) {
        rigid.impactOccurred(intensity: 0.85)
        rigid.prepare()
        if sound { synth.play(.click) }
    }
    func stop(sound: Bool) {
        rigid.impactOccurred(intensity: 0.6)
        if sound { synth.play(.stop) }
    }
}

/// Small hard parts can't make a pitched thump: they ring for a millisecond or two at a few high body modes.
/// A selector makes two: the spring-loaded ball dropping into the notch, then the wiper settling.
private final class ClickSynth {
    enum Voice: CaseIterable { case click, stop }
    private let engine = AVAudioEngine()
    private let player = AVAudioPlayerNode()
    private var buffers: [Voice: AVAudioPCMBuffer] = [:]
    private var ready = false

    init() {
        guard let format = AVAudioFormat(standardFormatWithSampleRate: 44_100, channels: 1) else { return }
        engine.attach(player)
        engine.connect(player, to: engine.mainMixerNode, format: format)
        for voice in Voice.allCases { buffers[voice] = Self.render(voice, format: format) }
        // Ambient: respects the silent switch and mixes with the user's music.
        try? AVAudioSession.sharedInstance().setCategory(.ambient, options: [.mixWithOthers])
        ready = (try? engine.start()) != nil
    }

    func play(_ voice: Voice) {
        guard ready, let buffer = buffers[voice] else { return }
        player.scheduleBuffer(buffer, at: nil, options: .interrupts)
        if !player.isPlaying { player.play() }
    }

    private static let modes: [(Float, Float, Float)] = [(1900, 0.0024, 1), (3400, 0.0015, 0.55), (6100, 0.0008, 0.3)]

    private static func render(_ voice: Voice, format: AVAudioFormat) -> AVAudioPCMBuffer? {
        // (start time, level, tuning) for each tick
        let ticks: [(Float, Float, Float)] = voice == .click
            ? [(0, 0.12, 0.95), (0.006, 0.035, 1.25)]
            : [(0, 0.09, 0.85)]
        let rate = Float(format.sampleRate)
        let frames = AVAudioFrameCount(rate * 0.03)
        guard let buffer = AVAudioPCMBuffer(pcmFormat: format, frameCapacity: frames),
              let out = buffer.floatChannelData?[0] else { return nil }
        buffer.frameLength = frames
        for i in 0..<Int(frames) {
            let t = Float(i) / rate
            var sample: Float = 0
            for (start, level, tune) in ticks where t >= start {
                let local = t - start
                var tick: Float = 0
                for (hz, decay, gain) in modes { tick += gain * sinf(2 * .pi * hz * tune * local) * expf(-local / decay) }
                tick += Float.random(in: -1...1) * 0.5 * expf(-local / 0.0003)
                sample += tick * level
            }
            out[i] = sample * 2.2
        }
        return buffer
    }
}

#Preview {
    struct Demo: View {
        @State private var power = 4
        @State private var tcs = 1
        var body: some View {
            HStack(spacing: 32) {
                IndexKnob(value: $power, steps: 5, label: "PWR")
                IndexKnob(value: $tcs, steps: 3, label: "TCS")
            }
            .padding(40)
            .frame(maxWidth: .infinity, maxHeight: .infinity)
            .background(Color(red: 0.94, green: 0.94, blue: 0.93))
        }
    }
    return Demo()
}
