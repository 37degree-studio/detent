<style>
/* Layout: a quiet catalogue. Plates are soft porcelain (or obsidian) surfaces the controls sit on; a component page reads
   top to bottom: title, live preview, make-it-your-own panel, looks, install, details. */
:root {
  --bg: #f6f6f5; --plate: #efefee; --raised: #fbfbfa; --ink: #1d1d1f; --muted: #75757a; --faint: #a6a6aa; --line: #e3e3e1;
  --shadow: 0 1px 0 #ffffff, 0 18px 40px -28px #00000033;
  --display: "Funnel Display", system-ui, sans-serif;
  --sans: "Funnel Sans", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0b0b0c; --plate: #121213; --raised: #19191b; --ink: #ededee; --muted: #8b8b90; --faint: #55555a; --line: #222225; --shadow: inset 0 1px 0 #ffffff0a, 0 18px 40px -28px #000; color-scheme: dark }
}
:root[data-theme="dark"] { --bg: #0b0b0c; --plate: #121213; --raised: #19191b; --ink: #ededee; --muted: #8b8b90; --faint: #55555a; --line: #222225; --shadow: inset 0 1px 0 #ffffff0a, 0 18px 40px -28px #000; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased }
.page { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 80px }
a { color: inherit }
:where(button, a, [tabindex]):focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px }
.small { font: 500 13px/1.2 var(--sans); color: var(--muted) }

/* ── Bar ── */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0;
  background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.mark { display: flex; align-items: center; gap: 10px; font: 500 16px/1 var(--sans); letter-spacing: -.01em; text-decoration: none }
.mark i { width: 24px; height: 24px; border-radius: 7px; background: radial-gradient(circle at 50% 30%, var(--raised), var(--plate)); box-shadow: inset 0 0 0 1px var(--line), 0 2px 3px -1px #00000026; position: relative }
.mark i::after { content: ""; position: absolute; left: 50%; top: 4px; width: 2px; height: 7px; translate: -50% 0; border-radius: 1px; background: var(--ink) }
.nav { display: flex; gap: 18px } .nav a { text-decoration: none; color: var(--muted); font-size: 14px } .nav a:hover { color: var(--ink) }
.keys { display: flex; flex-wrap: wrap; gap: 6px }
.key { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 999px; border: 0; background: var(--plate); color: var(--ink); font: 500 13px/1 var(--sans);
  box-shadow: inset 0 0 0 1px var(--line); cursor: pointer }
.key.star { text-decoration: none; background: var(--ink); color: var(--bg); box-shadow: none }
.key.star .sep { width: 1px; height: 14px; background: color-mix(in srgb, var(--bg) 30%, transparent) }
.key .pip { width: 6px; height: 6px; border-radius: 50%; background: var(--faint) }
.key[aria-pressed="true"] .pip { background: var(--ink) }
.key:active, .btn:active, .seg button:active { translate: 0 .5px }
.seg { display: inline-flex; flex-wrap: wrap; padding: 3px; gap: 2px; border-radius: 999px; background: var(--plate); box-shadow: inset 0 0 0 1px var(--line) }
.seg button { height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font: 500 12.5px/1 var(--sans); cursor: pointer; white-space: nowrap }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); box-shadow: 0 1px 2px #0000001f, inset 0 0 0 1px var(--line) }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--raised); color: var(--ink); font: 500 14px/1 var(--sans);
  text-decoration: none; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line), 0 1px 2px #0000000f }
.btn.sm { height: 30px; padding: 0 12px; font-size: 12.5px }
.btn.dark { background: var(--ink); color: var(--bg); box-shadow: none }

/* ── Home ── */
.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 32px clamp(32px, 6vw, 96px); align-items: end; padding-block: clamp(72px, 12vw, 152px) 0 }
.hero .lead { display: grid; gap: 28px; align-content: end }
.hero .side { display: grid; gap: 26px; padding-bottom: 6px; max-width: 420px }
.hero .stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: clamp(56px, 8vw, 96px); border-block: 1px solid var(--line) }
.hero .stats div { display: grid; gap: 6px; padding: 18px 0 18px 18px; border-left: 1px solid var(--line) } .hero .stats div:first-child { border-left: 0; padding-left: 0 }
.hero .stats b { font: 300 26px/1 var(--display); letter-spacing: -.03em } .hero .stats span { font-size: 13px; color: var(--muted) }
.homegap { height: 96px }
.hero h1 { margin: 0; font: 300 clamp(42px, 5.6vw, 76px)/1 var(--display); letter-spacing: -.04em }
.hero h1 span { color: var(--faint) }
.hero p { margin: 0; max-width: 44ch; color: var(--muted); font-size: 16.5px; text-wrap: pretty }
.hero .row { display: flex; flex-wrap: wrap; gap: 10px }
.facts { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; font-size: 12.5px; color: var(--muted) }
.facts span + span::before { content: "·"; margin-right: 18px; color: var(--faint) }
.sechead { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 22px }
.sechead h2 { margin: 6px 0 0; font: 400 clamp(26px, 3vw, 34px)/1.1 var(--display); letter-spacing: -.03em }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 40px 22px }
.plate { display: grid; grid-template-rows: 1fr auto; gap: 14px; min-width: 0 }
.plate .cap { text-decoration: none; border-radius: 10px }
.stage { position: relative; min-height: 320px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 22px; padding: 52px 18px 40px; border-radius: 28px;
  background: var(--plate); box-shadow: var(--shadow), inset 0 0 0 1px var(--line); overflow: hidden }
.stage .tag { position: absolute; top: 16px; font: 500 12px/1 var(--sans); color: var(--muted) }
.stage .no { left: 18px }
.stage .tag { right: 16px; padding: 5px 9px; border-radius: 999px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line) }
.plate .cap { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px }
.plate h3 { margin: 0; font: 500 17px/1.2 var(--sans); letter-spacing: -.01em }
.plate p { grid-column: 1; margin: 0; color: var(--muted); font-size: 14px; text-wrap: pretty }
.plate .go { grid-row: 1 / span 2; grid-column: 2; align-self: start; font-size: 18px; color: var(--muted) }
.plate .cap:hover .go, .plate .cap:hover h3 { color: var(--ink) }
.plate .cap:hover h3 { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px }

/* ── Component page ── */
.crumbs { display: flex; gap: 10px; align-items: center; padding-block: 28px 30px; font-size: 13.5px; color: var(--muted) }
.crumbs a { text-decoration: none } .crumbs a:hover { color: var(--ink) }
.dhead { display: grid; gap: 14px; margin-bottom: 34px }
.dhead h1 { margin: 0; font: 400 clamp(40px, 6vw, 64px)/1 var(--display); letter-spacing: -.045em; outline: none }
.dhead p { margin: 0; max-width: 62ch; color: var(--muted); font-size: 17px; text-wrap: pretty }
.dhead .was { font: 500 12px/1 var(--mono); color: var(--faint) }
.tabs { display: flex; gap: 6px; margin-bottom: 14px }
.tabs button { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); font: 500 14px/1 var(--sans); cursor: pointer }
.tabs button[aria-selected="true"] { background: var(--raised); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line), 0 1px 2px #0000000f }
.preview { position: relative; min-height: 460px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 32px; padding: 56px 18px 64px; border-radius: 30px;
  background: var(--plate); box-shadow: var(--shadow), inset 0 0 0 1px var(--line) }
.preview .tl { position: absolute; left: 20px; top: 18px }
.preview .try { position: absolute; left: 0; right: 0; bottom: 20px; text-align: center; font-size: 13px; color: var(--faint) }
.codebox { border-radius: 22px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; min-width: 0 }
.codebox header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--line) }
.codebox header .small { flex: 1; min-width: 0 }
.codebox pre { margin: 0; padding: 16px; max-height: 520px; overflow: auto; font: 400 12.5px/1.65 var(--mono); tab-size: 2 }
.panel { margin-top: 18px; padding: 22px; border-radius: 26px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line), var(--shadow); display: grid; gap: 18px }
.panel .ph { display: flex; justify-content: space-between; align-items: start; gap: 12px }
.panel h2 { margin: 0; font: 500 17px/1.2 var(--sans) } .panel .ph p { margin: 4px 0 0; color: var(--muted); font-size: 14px }
.ctls { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px 28px }
.ctl { display: grid; gap: 8px; align-content: start; justify-items: start } .ctl .lab { font-size: 13.5px; color: var(--muted) }
.ctls { align-items: start }
.filters { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; margin: -6px 0 26px }
.filters .f { display: flex; align-items: center; gap: 10px } .filters .f > span { font-size: 13px; color: var(--muted) }
.panel .foot { display: flex; align-items: center; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted) }
.panel .foot i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink) }
.log { margin: 0; padding: 0; list-style: none; font: 400 13px/1.7 var(--sans); font-variant-numeric: tabular-nums; color: var(--muted); min-height: 5.2em }
.log li:first-child { color: var(--ink) }
.sec { margin-top: 64px }
.sec > .sh { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px }
.sec > .sh .n { font: 500 13px/1 var(--mono); color: var(--faint) }
.sec > .sh h2 { margin: 0; font: 400 clamp(22px, 2.6vw, 28px)/1.15 var(--display); letter-spacing: -.025em }
.sec > p { margin: -8px 0 18px; max-width: 60ch; color: var(--muted) }
.looks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 16px }
.look { all: unset; display: grid; gap: 14px; padding: 26px 16px 18px; border-radius: 24px; background: var(--plate); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; text-align: center; justify-items: center; min-width: 0 }
.look[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px var(--ink) }
.look:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px }
.look .shot { min-height: 190px; display: grid; place-items: center; pointer-events: none }
.look b { font-weight: 500 } .look span { color: var(--muted); font-size: 13px }
.table { width: 100%; border-collapse: collapse; font-size: 14px }
.tablewrap { overflow-x: auto; border-radius: 18px; box-shadow: inset 0 0 0 1px var(--line) }
.table th, .table td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: top }
.table tr:last-child td { border-bottom: 0 }
.table th { font: 500 12.5px/1 var(--sans); color: var(--muted); background: var(--plate) }
.table code { font: 400 12.5px/1.4 var(--mono) }
.behave { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 20px 32px; margin: 0 }
.behave dt { font-weight: 500 } .behave dd { margin: 4px 0 0; color: var(--muted); font-size: 14px }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 72px; padding-top: 20px; border-top: 1px solid var(--line) }
.pager a { display: grid; gap: 4px; text-decoration: none } .pager a:last-child { text-align: right; justify-items: end }
.pager b { font: 400 22px/1.1 var(--display); letter-spacing: -.02em } .pager a:hover b { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px }
.faq { display: grid; gap: 0; max-width: 760px }
.faq details { padding: 18px 0 }
.faq summary { cursor: pointer; font-weight: 500; list-style: none } .faq summary::-webkit-details-marker { display: none }
.faq summary::after { content: "+"; float: right; color: var(--muted) } .faq details[open] summary::after { content: "−" }
.faq p { margin: 10px 0 0; color: var(--muted); max-width: 62ch }
footer.end a { color: var(--ink); text-decoration: none } footer.end a:hover { text-decoration: underline }
footer.end { margin-top: 80px; padding-top: 24px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted) }
@media (max-width: 720px) { .nav { display: none } .hero { grid-template-columns: 1fr; padding-block: 56px 0 } .hero .stats { grid-template-columns: repeat(2, minmax(0, 1fr)) } .hero .stats div:nth-child(3) { border-left: 0; padding-left: 0 } .hero .stats b { font-size: 26px } .homegap { height: 48px } .preview { min-height: 360px } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important } }

/* Breathing room: sections are separated by space, never by hairlines. */
.hero .stats { border: 0; gap: 32px; margin-top: clamp(72px, 10vw, 128px) }
.hero .stats div, .hero .stats div:first-child { border: 0 !important; padding: 0 }
.homegap { height: clamp(96px, 12vw, 160px) }
.sechead { margin-bottom: 32px }
.filters { margin: 0 0 40px }
.grid { gap: 64px 28px }
.sec { margin-top: clamp(96px, 12vw, 160px) }
.sec > .sh { margin-bottom: 28px }
.panel .foot { border-top: 0; padding-top: 4px }
.pager { border-top: 0; padding-top: 0; margin-top: clamp(96px, 12vw, 160px) }
footer.end { border-top: 0; padding-top: 0; margin-top: clamp(96px, 12vw, 160px) }
.codebox header { border-bottom: 0 }
.table th, .table td { border-bottom: 0 }
.table tbody tr:nth-child(odd) td { background: color-mix(in srgb, var(--plate) 60%, transparent) }
.faq details { padding: 14px 0 }
@media (max-width: 720px) { .hero .stats { gap: 28px 20px } }

/* A plate takes the material of the control on it, so a porcelain control sits on porcelain even on a dark page. */
[data-tone="light"] { --plate: #efefee; --raised: #fbfbfa; --ink: #1d1d1f; --muted: #75757a; --faint: #a6a6aa; --line: #e3e3e1; --shadow: 0 1px 0 #ffffff, 0 18px 40px -28px #00000033; color: var(--ink); color-scheme: light }
[data-tone="dark"] { --plate: #121213; --raised: #19191b; --ink: #ededee; --muted: #8b8b90; --faint: #55555a; --line: #222225; --shadow: inset 0 1px 0 #ffffff0a, 0 18px 40px -28px #000; color: var(--ink); color-scheme: dark }

/* The dock floats at the bottom: the catalogue filters (home only, while the catalogue is on screen), then sound and haptics. */
.left { display: flex; align-items: center; gap: 32px }
.dock { position: fixed; z-index: 6; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); translate: -50% 0; display: flex; align-items: center; gap: 4px;
  padding: 6px; border-radius: 999px; max-width: calc(100vw - 32px);
  background: color-mix(in srgb, var(--raised) 82%, transparent); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
  box-shadow: inset 0 0 0 1px var(--line), 0 16px 40px -14px #0000004d }
.dockf { display: flex; min-width: 0; overflow-x: auto; scrollbar-width: none; margin-right: 6px; padding-right: 10px; box-shadow: 1px 0 0 var(--line) }
.dockf::-webkit-scrollbar { display: none }
.filters { display: flex; flex-wrap: nowrap; align-items: center; gap: 6px 18px; margin: 0 !important; padding-left: 12px }
.filters .seg { flex-wrap: nowrap; background: transparent; box-shadow: none; padding: 0 }
.filters .f { flex: none }
.ico { display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer }
.ico[aria-pressed="true"] { background: var(--plate); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line) }
#thm .sun { display: none } #thm[data-mode="dark"] .sun { display: block } #thm[data-mode="dark"] .moon { display: none }
.ico .off { display: none } .ico[aria-pressed="false"] .on { display: none } .ico[aria-pressed="false"] .off { display: inline }
.ico:active { translate: 0 .5px }
#home, #detail { padding-bottom: 72px }
@media (max-width: 720px) { .dock { left: 16px; right: 16px; translate: none; max-width: none } .dockf { flex: 1 } .left { gap: 0 } }

/* Review fixes */
.hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; padding-block: clamp(56px, 8vw, 104px) 0 }
.hero .lead { gap: 24px; align-content: center }

<script id="src-feel">
/* Feel — tiny sound + haptics engine shared by every Detent control. Include once per page. */
window.Feel = window.Feel || (() => {
  const state = { sound: true, haptics: true };
  let ctx, noise, sw, lastTick = 0, capture = null;
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

  function audio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!ctx) {
      ctx = new AC();
      noise = ctx.createBuffer(1, ctx.sampleRate * 0.08, ctx.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  // Each voice: [click band Hz, body tone Hz, decay s, level]
  const VOICES = {
    tick:   [5200,   0, 0.010, 0.22],
    detent: [2600, 170, 0.025, 0.40],
    limit:  [ 900,  80, 0.060, 0.55],
    toggle: [3000, 135, 0.035, 0.50],
    press:  [1700,  95, 0.016, 0.20],
  };
  function hit(c, band, tone, decay, level, t) {
    const out = c.createGain();
    out.gain.setValueAtTime(level, t);
    out.gain.exponentialRampToValueAtTime(0.0001, t + decay * 3);
    out.connect(c.destination);
    const src = c.createBufferSource(), bp = c.createBiquadFilter();
    src.buffer = noise; bp.type = 'bandpass'; bp.frequency.value = band; bp.Q.value = 3;
    src.connect(bp).connect(out); src.start(t); src.stop(t + decay * 3);
    if (tone) {
      const o = c.createOscillator(), g = c.createGain();
      o.frequency.setValueAtTime(tone * 1.8, t);
      o.frequency.exponentialRampToValueAtTime(tone, t + decay);
      g.gain.setValueAtTime(0.6, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + decay * 2.5);
      o.connect(g).connect(out); o.start(t); o.stop(t + decay * 3);
    }
  }
  // Small hard parts (a plastic slider, a metal contact leaf) can't make a pitched thump. They ring for a
  // millisecond or two at a few high body modes. Each mode: [Hz, decay ms, gain].
  const PLASTIC = [[1900, 2.4, 1], [3400, 1.5, .55], [6100, .8, .3]];
  function tickAt(c, t, level, tune) {
    const out = c.createGain();
    out.gain.value = level;
    out.connect(c.destination);
    for (const [f, ms, g] of PLASTIC) {
      const o = c.createOscillator(), e = c.createGain(), tau = ms / 1000;
      o.frequency.value = f * tune;
      e.gain.setValueAtTime(g, t);
      e.gain.exponentialRampToValueAtTime(0.0001, t + tau * 7);
      o.connect(e).connect(out); o.start(t); o.stop(t + tau * 7 + .005);
      if (capture) capture.push(o);
    }
    // the contact itself: half a millisecond of bright noise
    const n = c.createBufferSource(), hp = c.createBiquadFilter(), ng = c.createGain();
    n.buffer = noise; hp.type = 'highpass'; hp.frequency.value = 4000;
    ng.gain.setValueAtTime(.5, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + .0012);
    n.connect(hp).connect(ng).connect(out); n.start(t); n.stop(t + .003);
    if (capture) capture.push(n);
  }
  // A slide switch: the slider leaves its detent (quiet), then lands against the stop (the tick you hear).
  function slideSwitch(c, t, pitch) {
    tickAt(c, t, .07, 1.08 * pitch);
    tickAt(c, t + .009, .16, pitch);
  }

  function sound(kind, pitch = 1, at) {
    const c = audio(); if (!c) return;
    const t0 = at ?? c.currentTime + 0.002;
    if (kind === 'switch') return slideSwitch(c, t0, pitch);
    // An end stop is just the part touching its stop once: a small dry tick, slightly duller. No thud.
    if (kind === 'limit') return tickAt(c, t0, .09, .85 * pitch);
    // A rotary encoder notch: one tiny, bright tick. Same pitch at every position, like the real part.
    if (kind === 'encoder') return tickAt(c, t0, .05, 1.35 * pitch);
    // A bezel ratchet: one dry, metallic click. Same at every position, like the real part.
    if (kind === 'bezel') return tickAt(c, t0, .07, 1.6 * pitch);
    // A rotary selector: a spring-loaded ball drops into the next notch (a firmer clack), then the wiper settles.
    if (kind === 'selector') {
      const t = c.currentTime + 0.002;
      tickAt(c, t, .12, .95 * pitch);
      return tickAt(c, t + .006, .035, 1.25 * pitch);
    }
    const [band, tone, decay, level] = VOICES[kind] || VOICES.tick;
    const t = c.currentTime + 0.002;
    hit(c, band * pitch, tone * pitch, decay, level, t);
    // A switch snaps in two stages: the lever lets go, then the contact lands.
    if (kind === 'toggle') hit(c, band * pitch * 1.7, 0, 0.007, level * 0.45, t + 0.018);
  }

  const BUZZ = { tick: 4, detent: 9, limit: [12, 50, 12], toggle: 14, press: 3, switch: 8, encoder: 3, selector: 10, bezel: 5 };
  function haptic(kind, native) {
    // Browsers refuse haptics until the page has had a real tap or click.
    if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
    if ('vibrate' in navigator) return navigator.vibrate(BUZZ[kind] || 6);
    if (native) return; // a native <input switch> already played the iPhone haptic
    // iOS Safari has no vibrate(), but since iOS 18 flipping a native <input switch> plays the system tap.
    if (!sw) {
      sw = document.createElement('label');
      sw.setAttribute('aria-hidden', 'true');
      sw.style.cssText = 'position:fixed;top:0;left:-100px;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none';
      sw.innerHTML = '<input type="checkbox" switch tabindex="-1">';
      document.body.append(sw);
    }
    const focused = document.activeElement;
    sw.click();
    if (focused && focused !== document.activeElement) focused.focus({ preventScroll: true });
  }

  // kind: 'tick' (fine step), 'detent' (notch), 'limit' (end stop), 'toggle', 'press' (finger down),
  //       'switch' (a small slide switch snapping over center), 'encoder' (one notch of a rotary encoder),
  //       'selector' (a rotary selector switch dropping into a position), 'bezel' (a ratcheting bezel click)
  // haptic: false plays sound only. native: true when a native switch already gave the iPhone haptic.
  function fire(kind = 'tick', { pitch = 1, haptic: buzz = true, native = false } = {}) {
    if (kind === 'tick' || kind === 'encoder') {
      const now = performance.now();
      if (now - lastTick < 22) return;
      lastTick = now;
    }
    if (state.sound) sound(kind, pitch);
    if (state.haptics && buzz) haptic(kind, native);
  }

  // Plays a sound at an exact moment on the audio clock (not the next screen frame), with its haptic alongside.
  // `at` is an audio-clock time from Feel.clock(); a run of sounds sharing one base stays exactly spaced.
  // Returns a cancel function, for a spinning part that gets caught.
  function schedule(kind, at, { pitch = 1 } = {}) {
    const nodes = [], c = state.sound ? audio() : null;
    const now = c ? c.currentTime : performance.now() / 1000;
    if (c) { capture = nodes; sound(kind, pitch, Math.max(at, now + 0.002)); capture = null; }
    const h = state.haptics ? setTimeout(() => haptic(kind), Math.max(0, at - now) * 1000) : 0;
    return () => { clearTimeout(h); nodes.forEach(n => { try { n.stop(); } catch {} }); };
  }

  // End stops sound once on arrival and stay silent while you keep pushing. They re-arm only after the
  // value moves clearly away (3% of the range), so jitter at the edge never repeats the tick.
  const edges = new WeakMap();
  function stop(host, v, min, max) {
    const at = edges.get(host) || 0, margin = (max - min) * .03;
    if (at === 0) {
      if (v <= min || v >= max) { edges.set(host, v <= min ? -1 : 1); fire('limit'); }
    } else if ((at < 0 && v > min + margin) || (at > 0 && v < max - margin)) edges.set(host, 0);
  }

  // Turns a pointer drag on `el` into rotation (degrees, clockwise +) around its center.
  function rotary(el, { turn, start, end }) {
    let last = null, cx = 0, cy = 0;
    const angle = e => Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI;
    el.addEventListener('pointerdown', e => {
      if (e.button > 0) return;
      const r = el.getBoundingClientRect();
      cx = r.left + r.width / 2; cy = r.top + r.height / 2;
      last = angle(e);
      try { el.setPointerCapture(e.pointerId); } catch {}
      audio();
      start && start(e);
    });
    el.addEventListener('pointermove', e => {
      if (last === null) return;
      if (Math.hypot(e.clientX - cx, e.clientY - cy) < 8) return;
      const a = angle(e);
      let d = a - last;
      if (d > 180) d -= 360; else if (d < -180) d += 360;
      last = a;
      if (d) turn(d, e);
    });
    const stop = e => { if (last === null) return; last = null; end && end(e); };
    el.addEventListener('pointerup', stop);
    el.addEventListener('pointercancel', stop);
  }

  // Scroll wheel / trackpad turns the control, but only once it has focus, so page scrolling still works.
  function wheel(host, fn) {
    host.addEventListener('wheel', e => {
      if (!host.matches(':focus')) return;
      e.preventDefault();
      fn(-(e.deltaY || e.deltaX) * 0.25);
    }, { passive: false });
  }

  // Arrow keys, Page Up/Down (or Shift) for big steps, Home/End for the limits.
  function keys(host, nudge, jump) {
    host.addEventListener('keydown', e => {
      const k = e.key, big = e.shiftKey || k.startsWith('Page');
      const dir = { ArrowUp: 1, ArrowRight: 1, PageUp: 1, ArrowDown: -1, ArrowLeft: -1, PageDown: -1 }[k];
      if (dir) nudge(dir, big);
      else if (k === 'Home' && jump) jump(-1);
      else if (k === 'End' && jump) jump(1);
      else return;
      e.preventDefault();
    });
  }

  // The audio clock, in seconds. Falls back to the page clock where there is no audio.
  function clock() { const c = audio(); return c ? c.currentTime : performance.now() / 1000; }

  return { state, fire, schedule, clock, stop, rotary, wheel, keys, reduced, audio };
})();
</script>

<script id="src-encoder">
/* <detent-encoder look="braun" tone="auto" value="40" detents="60"> — a detented rotary encoder.
   0–100 over a 270° sweep. It's pulled into each notch with a tiny click and stops dead at both ends.
   detents="0" makes it a smooth, silent pot. Fires "input" and "change". Needs Feel and at least one look.
   tone: "light" or "dark" forces one; otherwise it follows the nearest [data-tone], the page's data-theme,
   then prefers-color-scheme. The look is a separate module: DetentEncoder.look(name, { css, html, setup, hold, paint }). */
(() => {
  const looks = {}, waiting = new Set(), autos = new Set();
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const retone = () => autos.forEach(el => el.tone());
  mq.addEventListener ? mq.addEventListener('change', retone) : mq.addListener(retone);
  new MutationObserver(retone).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'data-tone'] });

  // Shared by every look: the square the finger turns, the layer that rotates, and how a part sinks and settles.
  const BASE = `:host { --s: 200px; display: inline-flex; flex-direction: column; align-items: center; gap: 12px; vertical-align: top; outline: none;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent }
.t { display: contents }
.k { position: relative; width: var(--s); max-width: 100%; aspect-ratio: 1; touch-action: none; cursor: grab }
.k:active { cursor: grabbing }
.rot { position: absolute; inset: 0; rotate: var(--a) }
.k.settle .rot { transition: rotate .06s ease-out }
[data-press] { transition: translate .05s, scale .05s, box-shadow .05s }
[data-press].down { translate: 0 .5px; scale: .994 }
@media (prefers-reduced-motion: reduce) { .k.settle .rot, [data-press] { transition: none } }
`;

  class DetentEncoder extends HTMLElement {
    static observedAttributes = ['look', 'tone', 'detents'];
    static look(name, def) { looks[name] = def; [...waiting].forEach(el => el.render()); }
    connectedCallback() {
      if (!this._wired) this.wire();
      if (!this.k) this.render();
      this.tone();
    }
    disconnectedCallback() { autos.delete(this); }
    attributeChangedCallback(name, was, now) {
      if (!this._wired || was === now) return;
      if (name === 'tone') this.tone(); else this.render();
    }
    wire() {
      this._wired = true;
      this.attachShadow({ mode: 'open' });
      this.setAttribute('role', 'slider');
      this.setAttribute('aria-valuemin', 0); this.setAttribute('aria-valuemax', 100);
      if (!this.hasAttribute('aria-label')) this.setAttribute('aria-label', 'Level');
      if (!this.hasAttribute('tabindex')) this.tabIndex = 0;
      let acc = 0;
      Feel.wheel(this, d => {
        acc += d;
        if (Math.abs(acc) < 10) return;
        this.nudge(Math.sign(acc)); acc = 0;
      });
      Feel.keys(this, (dir, big) => this.nudge(dir * (big ? 10 : 1)), dir => this.set(dir < 0 ? 0 : 100));
    }
    // Builds the look. Runs again when look or detents change; the value carries over.
    render() {
      const look = looks[this.getAttribute('look') || 'braun'];
      if (!look) { waiting.add(this); return; }
      waiting.delete(this);
      this.look = look;
      this.detents = Math.max(0, Math.round(+(this.getAttribute('detents') ?? 60)));
      this.step = this.detents ? 100 / this.detents : 0;
      this.marks = this.detents || 60;
      this.v = this.snap(this.v ?? +(this.getAttribute('value') ?? 40));
      this.raw = this.v;
      const root = this.shadowRoot;
      root.innerHTML = `<style>${BASE}${look.css}</style><div class="t">${look.html(this)}</div>`;
      this.t = root.querySelector('.t'); this.k = root.querySelector('.k');
      const press = root.querySelector('[data-press]') || this.k;
      this.ls = {}; // the look's own state
      look.setup && look.setup(root, this);
      Feel.rotary(this.k, {
        start: () => { press.classList.add('down'); this.k.classList.remove('settle'); this.raw = this.v; look.hold && look.hold(root, this, true); },
        turn: d => this.turn(d * 100 / 270),
        end: () => {
          press.classList.remove('down');
          this.k.classList.add('settle'); // let go between notches and it drops into the nearest one
          this.raw = this.v;
          this.paint(this.v);
          look.hold && look.hold(root, this, false);
          this.dispatchEvent(new Event('change', { bubbles: true }));
        }
      });
      this.setAttribute('aria-valuenow', Math.round(this.v));
      this.tone();
      this.paint(this.v);
    }
    tone() {
      if (!this.t) return;
      const t = this.getAttribute('tone');
      let dark;
      if (t === 'light' || t === 'dark') { dark = t === 'dark'; autos.delete(this); }
      else {
        autos.add(this);
        const near = this.parentElement && this.parentElement.closest('[data-tone]'), page = document.documentElement.dataset.theme;
        dark = near ? near.dataset.tone === 'dark' : page ? page === 'dark' : mq.matches;
      }
      this.t.classList.toggle('dark', dark);
    }
    get value() { return Math.round((this.v ?? +(this.getAttribute('value') ?? 40)) * 10) / 10; }
    set value(v) { if (this.k) this.set(+v, true); else this.setAttribute('value', v); }
    snap(v) {
      v = Math.min(100, Math.max(0, v));
      return this.step ? Math.round(v / this.step) * this.step : v;
    }
    turn(dv) {
      // The end stops are hard: past them the knob simply doesn't turn, and the finger slips.
      this.raw = Math.min(100, Math.max(0, this.raw + dv));
      const v = this.snap(this.raw);
      this.commit(v);
      // Between notches the detent spring holds the knob, so it only gives a little until it clicks over.
      this.paint(this.step ? v + (this.raw - v) * .3 : v);
    }
    nudge(n) { if (this.k) this.set(this.v + n * (this.step || 1)); }
    set(v, quiet) {
      if (!this.k) return;
      v = this.snap(v);
      this.raw = v;
      this.k.classList.add('settle');
      this.commit(v, quiet);
      this.paint(v);
    }
    commit(v, quiet) {
      if (v === this.v) return;
      this.v = v;
      this.setAttribute('aria-valuenow', Math.round(v));
      if (quiet) return;
      Feel.stop(this, v, 0, 100);
      if (this.step && v > 0 && v < 100) Feel.fire('encoder');
      this.dispatchEvent(new Event('input', { bubbles: true }));
    }
    // shown: where the knob sits right now, including the give between notches. this.v is the committed value.
    paint(shown) {
      this.style.setProperty('--a', (-135 + shown * 2.7) + 'deg');
      this.look.paint && this.look.paint(this.shadowRoot, this, shown);
    }
  }
  window.DetentEncoder = DetentEncoder;
  customElements.define('detent-encoder', DetentEncoder);
})();
</script>

<script id="src-encoder-look-braun">
/* Encoder look "braun": a turned-aluminum cap in a recessed, brushed bowl, with an engraved scale backlit up to the
   value in --dial-accent. Dark tone: the same parts in black anodized aluminum on a black panel. */
DetentEncoder.look('braun', {
  css: `
.t { --tick: #7f7d7a; --tick-long: #6a6865;
  --bowl: conic-gradient(from 210deg, #fbfbfb, #9a9a9a 12%, #e9e9e9 24%, #5d5d5d 40%, #d8d8d8 55%, #fafafa 66%, #8a8a8a 80%, #f2f2f2);
  --bowl-sh: inset 0 0 0 1px #00000024, inset 0 6px 10px -3px #00000059, inset 0 -1px 2px #ffffff4d;
  --rim: linear-gradient(#fbfbfb, #d9d9d8 55%, #b9b9b8);
  --face: radial-gradient(circle at 46% 32%, #fbfbfb, #ececeb 55%, #dededd);
  --lathe: #00000006; --sheen: #ffffff59; --sheen-2: #ffffff47;
  --cap-sh: 0 0 0 .5px #00000040, 0 1px 1.5px #00000059, 0 3px 5px -1px #00000033, 0 10px 16px -6px #00000040;
  --cap-dn: 0 0 0 .5px #00000040, 0 .5px 1px #00000066, 0 2px 3px -1px #00000033, 0 6px 10px -6px #00000040;
  --lip: #ffffff99 }
.t.dark { --tick: #4c4c4f; --tick-long: #6e6e72;
  --bowl: conic-gradient(from 210deg, #5c5c5f, #222224 12%, #4a4a4d 24%, #131315 40%, #3e3e41 55%, #636366 66%, #1e1e20 80%, #545457);
  --bowl-sh: inset 0 0 0 1px #000000b3, inset 0 6px 10px -3px #000000cc, inset 0 -1px 2px #ffffff1f;
  --rim: linear-gradient(#6c6c6f, #2d2d2f 55%, #1a1a1c);
  --face: radial-gradient(circle at 46% 32%, #3c3c3f, #2d2d30 55%, #242426);
  --lathe: #ffffff05; --sheen: #ffffff21; --sheen-2: #ffffff18;
  --cap-sh: 0 0 0 .5px #000, 0 1px 1.5px #000000cc, 0 3px 5px -1px #00000099, 0 10px 16px -6px #000000b3;
  --cap-dn: 0 0 0 .5px #000, 0 .5px 1px #000000d9, 0 2px 3px -1px #00000099, 0 6px 10px -6px #000000b3;
  --lip: #ffffff2e }
svg { position: absolute; inset: 0; width: 100%; height: 100% }
/* Engraved scale, backlit up to the current value in the indicator color. */
line { stroke: var(--tick); stroke-width: 1.1; stroke-linecap: round }
line.long { stroke: var(--tick-long); stroke-width: 1.3 }
line.lit { stroke: var(--dial-accent, #f2641e) }
/* The bowl is a recess cut into the panel, brushed in a circle. Light comes from above, so the upper inner wall
   sits in shadow. Its highlights belong to the room, so they never turn. */
.bowl { position: absolute; inset: 11%; border-radius: 50%; background: var(--bowl); box-shadow: var(--bowl-sh) }
/* The cap: a short cylinder. Its chamfered rim catches the top light; the flat face is lathe-turned. */
.cap { position: absolute; inset: 22%; border-radius: 50%; background: var(--rim); box-shadow: var(--cap-sh) }
.cap.down { box-shadow: var(--cap-dn) }
.face { position: absolute; inset: 2.6%; border-radius: 50%; overflow: hidden; background: var(--face) }
.face::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: repeating-radial-gradient(circle, #0000 0 1.1px, var(--lathe) 1.1px 2.2px);
  -webkit-mask: radial-gradient(circle, transparent 18%, #000 60%); mask: radial-gradient(circle, transparent 18%, #000 60%) }
.face::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 120deg, #fff0, var(--sheen) 7%, #fff0 18%, #fff0 50%, var(--sheen-2) 57%, #fff0 68%) }
.rot { z-index: 1 }
/* The indicator: a short groove cut into the face and filled with paint, flush with the surface. */
.mark { position: absolute; left: 50%; top: 9%; width: 3.6%; height: 17%; translate: -50% 0; border-radius: 9px; background: var(--dial-accent, #f2641e);
  box-shadow: inset 0 1px 1px #00000040, 0 .5px 0 var(--lip) }
:host(:focus-visible) .bowl { outline: 2px solid var(--dial-accent, #f2641e); outline-offset: 4px }
`,
  html(el) {
    const long = Math.max(1, Math.round(el.marks / 12));
    const ticks = Array.from({ length: el.marks + 1 }, (_, i) =>
      `<line transform="rotate(${-135 + i * 270 / el.marks} 100 100)" x1="100" y1="${i % long ? 9 : 4}" x2="100" y2="16"${i % long ? '' : ' class="long"'}/>`).join('');
    return `<div class="k"><svg viewBox="0 0 200 200" aria-hidden="true">${ticks}</svg><div class="bowl"></div><div class="cap" data-press><div class="face"></div><div class="rot"><i class="mark"></i></div></div></div>`;
  },
  setup(root, el) { el.ls.lines = [...root.querySelectorAll('line')]; },
  paint(root, el) {
    const lit = Math.round(el.v / 100 * el.marks);

</script>

<script id="src-encoder-look-index">
/* Encoder look "index": a matte soft-touch black disc with a thin inlaid pointer stripe in --dial-accent and a finger cup
   opposite it, over printed dots on the panel. The printed label switches instantly. Dark tone: the same black
   disc on a black panel, told apart by the top light on its chamfer. */
DetentEncoder.look('index', {
  css: `
.t { --dot: #a9a9a5; --label: #8a8a86; --focus: #161616;
  --disc: radial-gradient(circle at 50% 28%, #242424, #161616 58%, #101010);
  --disc-sh: inset 0 1px 0 #ffffff1c, inset 0 -1px 1px #00000099, 0 0 0 .5px #00000073, 0 1px 1.5px #00000059, 0 4px 8px -2px #00000040, 0 14px 22px -10px #00000059;
  --disc-dn: inset 0 1px 0 #ffffff1c, inset 0 -1px 1px #00000099, 0 0 0 .5px #00000073, 0 .5px 1px #00000066, 0 2px 5px -2px #00000040, 0 8px 14px -8px #00000059 }
.t.dark { --dot: #57575a; --label: #7c7c7a; --focus: #d4df3a;
  --disc: radial-gradient(circle at 50% 28%, #2c2c2c, #1b1b1b 58%, #141414);
  --disc-sh: inset 0 1px 0 #ffffff33, inset 0 -1px 1px #000000b3, 0 0 0 .5px #000, 0 1px 1.5px #000000b3, 0 4px 8px -2px #00000099, 0 14px 22px -10px #000000cc;
  --disc-dn: inset 0 1px 0 #ffffff33, inset 0 -1px 1px #000000b3, 0 0 0 .5px #000, 0 .5px 1px #000000cc, 0 2px 5px -2px #00000099, 0 8px 14px -8px #000000cc }
/* Printed position marks: they belong to the panel, so they never change. */
.marks i { position: absolute; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: var(--dot) }
/* Matte soft-touch black, lit from above, sitting on the panel with a contact shadow. */
.disc { position: absolute; inset: 9%; border-radius: 50%; background: var(--disc); box-shadow: var(--disc-sh) }
.disc.down { box-shadow: var(--disc-dn) }
/* The pointer: a thin inlaid stripe. The finger cup: a dimple pressed into the same black, opposite it.
   It shows only by its shaded upper wall and the light catching its lower edge. Both are part of the knob. */
.pointer { position: absolute; left: 50%; top: 13%; width: 1.6%; height: 33%; translate: -50% 0; border-radius: 2px; background: var(--dial-accent, #d4df3a);
  box-shadow: inset 0 .5px 0 #0006 }
.cup { position: absolute; left: 50%; bottom: 12%; width: 10.5%; aspect-ratio: 1; translate: -50% 0; border-radius: 50%;
  background: radial-gradient(circle at 50% 65%, #1c1c1c, #121212 60%, #0c0c0c);
  box-shadow: inset 0 1.5px 2.5px #000000d9, inset 0 -1px 0 #ffffff14, 0 .5px 0 #ffffff1f }
.label { font: 500 13px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .08em; color: var(--label); text-transform: uppercase; font-variant-numeric: tabular-nums }
:host(:focus-visible) .disc { outline: 2px solid var(--focus); outline-offset: 5px }
`,
  html(el) {
    // A dot per notch when there are few, otherwise one every 22.5°.
    const n = el.detents && el.detents <= 24 ? el.detents : 12;
    const marks = Array.from({ length: n + 1 }, (_, i) => {
      const a = (-135 + i * 270 / n - 90) * Math.PI / 180;
      return `<i style="left:${50 + 48 * Math.cos(a)}%;top:${50 + 48 * Math.sin(a)}%"></i>`;
    }).join('');
    return `<div class="k"><div class="marks">${marks}</div><div class="disc" data-press><div class="rot"><i class="pointer"></i><i class="cup"></i></div></div></div><span class="label"></span>`;
  },
  setup(root, el) { el.ls.label = root.querySelector('.label'); },
  paint(root, el) { el.ls.label.textContent = `LVL:${Math.round(el.v)}`; }
});
</script>

<script id="src-encoder-look-pedal">
/* Encoder look "pedal": a matte grey plastic cap with a printed pointer line, sitting in a fixed recessed seat.
   Hover or turn to read the value; the printed readout rolls like an odometer. Dark tone: the same cap on a black
   panel, with a deeper seat. --dial-accent colors the pointer line. */
DetentEncoder.look('pedal', (() => {
  // Each digit column holds 0-9 three times over, so it can roll past 9 or 0 either way, then quietly re-centers.
  function place(col, pos, animate) {
    col._pos = pos;
    col.style.transition = animate ? '' : 'none';
    col.style.transform = `translateY(${8 - pos * 16}px)`;
    if (!animate) return;
    col.classList.add('moving');
    clearTimeout(col._t);
    col._t = setTimeout(() => {
      col.classList.remove('moving');
      if (col._pos >= 10 && col._pos < 20) return;
      place(col, 10 + ((col._pos % 10) + 10) % 10, false);
    }, 190);
  }
  // Digits roll up when the value rises and down when it falls. Leading zeros are there but hidden.
  function roll(ls, text, dir) {
    const el = ls.val, lead = text.search(/[1-9]|\d$/);
    if (ls.shape !== text.length) {
      ls.shape = text.length;
      el.innerHTML = [...text].map(() => `<b class="col"><i>${'0123456789'.repeat(3).split('').join('</i><i>')}</i></b>`).join('');
      [...el.children].forEach((col, i) => { col.classList.toggle('lead', i < lead); place(col, 10 + +text[i], false); });
      return;
    }
    [...el.children].forEach((col, i) => {
      col.classList.toggle('lead', i < lead);
      const cur = ((col._pos % 10) + 10) % 10;
      let step = ((+text[i] - cur) % 10 + 10) % 10; // forward distance on the wheel
      if (!step) return;
      if (dir < 0) step -= 10;
      place(col, col._pos + step, true);
    });
  }
  return {
    css: `
.t { --knob: #4a4a4a; --ink: #2b2b2b; --trail: #2b2b2b38; --seat: #0000000f; --seat-sh: inset 0 1px 2px #00000029, 0 1px 0 #ffffffb3;
  --cap-sh: inset 0 1px 0 #ffffff1f, inset 0 -1px 1px #00000066, 0 0 0 .5px #0000004d, 0 1px 1.5px #00000047, 0 3px 6px -2px #00000033, 0 10px 16px -8px #00000047;
  --cap-dn: inset 0 1px 0 #ffffff1f, inset 0 -1px 1px #00000066, 0 0 0 .5px #0000004d, 0 .5px 1px #00000052, 0 2px 4px -2px #00000033, 0 6px 10px -6px #00000047 }
.t.dark { --knob: #4e4e50; --ink: #d4d4d0; --trail: #d4d4d038; --seat: #00000066; --seat-sh: inset 0 1px 2px #000000d9, 0 1px 0 #ffffff14;
  --cap-sh: inset 0 1px 0 #ffffff2b, inset 0 -1px 1px #00000099, 0 0 0 .5px #000000b3, 0 1px 1.5px #000000a6, 0 3px 6px -2px #00000080, 0 10px 16px -8px #000000b3;
  --cap-dn: inset 0 1px 0 #ffffff2b, inset 0 -1px 1px #00000099, 0 0 0 .5px #000000b3, 0 .5px 1px #000000bf, 0 2px 4px -2px #00000080, 0 6px 10px -6px #000000b3 }
/* The seat: a shallow recess in the panel the knob sits in. Always there; the knob sinks into it, the seat never moves. */
.seat { position: absolute; inset: 8%; border-radius: 50%; background: var(--seat); box-shadow: var(--seat-sh) }
/* Matte plastic cap, lit from above, sitting in the seat with a contact shadow. */
.cap { position: absolute; inset: 4.5%; border-radius: 50%;
  background: radial-gradient(circle at 50% 28%, color-mix(in srgb, var(--knob), #fff 9%), var(--knob) 58%, color-mix(in srgb, var(--knob), #000 18%));
  box-shadow: var(--cap-sh) }
.cap.down { box-shadow: var(--cap-dn) }
/* A printed pointer line on the top face. */
.rot::after { content: ""; position: absolute; left: 50%; top: 7%; width: 1.6%; min-width: 2px; height: 17%; translate: -50% 0; border-radius: 2px; background: var(--dial-accent, #fff) }
:host(:focus-visible) .seat { outline: 2px solid var(--knob); outline-offset: 3px }
.l { position: relative; height: 16px; min-width: 8ch; font: 500 13px/16px "Geist", system-ui, sans-serif; color: var(--ink); text-align: center }
.l span { position: absolute; inset: 0; transition: opacity .15s }
.val { opacity: 0; display: flex; justify-content: center; overflow: hidden; inset: -8px -6px !important; padding: 0 6px;
  /* Fully hides the neighbouring digits at rest, but lets the blur trail fade out instead of being cut. */
  -webkit-mask: linear-gradient(transparent 6px, #000 10px, #000 calc(100% - 10px), transparent calc(100% - 6px));
  mask: linear-gradient(transparent 6px, #000 10px, #000 calc(100% - 10px), transparent calc(100% - 6px));
  font-family: "Geist Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums }
/* Rolling digits: each digit is a column of 0-9 that slides to its value, blurred along the motion while it moves. */
.val b { display: block; font-weight: inherit }
.val .col { transition: transform .18s cubic-bezier(.2,.7,.3,1) }
.val .col i { display: block; height: 16px; font-style: normal }
.val .col.lead { opacity: 0; width: 0; transition: transform .18s cubic-bezier(.2,.7,.3,1), opacity .18s }
.val .col.moving i { filter: blur(.5px); text-shadow: 0 5px 2.5px var(--trail), 0 -5px 2.5px var(--trail) }
:host(:hover) .name, :host(:focus-visible) .name, .l.show .name { opacity: 0 }
:host(:hover) .val, :host(:focus-visible) .val, .l.show .val { opacity: 1 }
@media (prefers-reduced-motion: reduce) { .l span, .val .col { transition: none } .val .col.moving i { filter: none; text-shadow: none } }
`,
    html: el => `<div class="k"><div class="seat"><div class="cap" data-press><div class="rot"></div></div></div></div><div class="l"><span class="name">${el.getAttribute('label') || 'Level'}</span><span class="val"></span></div>`,
    setup(root, el) { el.ls.val = root.querySelector('.val'); el.ls.l = root.querySelector('.l'); },
    hold(root, el, on) { el.ls.l.classList.toggle('show', on); },
    paint(root, el) {
      const n = Math.round(el.v);
      roll(el.ls, String(n).padStart(3, '0'), Math.sign(n - (el.ls.shown ?? n)));
      el.ls.shown = n;
    }
  };
})());
</script>

<script id="src-encoder-look-nothing">
/* Encoder look "nothing": Nothing's flat widget language, after the catalogue's dot-dial. A flat round tile, a 270°
   ring of dots that fill up to the value, one red dot at the current position (the only accent, and only for the
   live state), a dot-matrix number with its unused leading digits left unlit, and a small Geist Mono label.
   No dome, texture, shadow or recessed window; nothing glows. Dots and digits switch instantly. Light tone: a white
   tile with black dots. Dark tone: a black tile with white dots. --dial-accent is the position dot. */
DetentEncoder.look('nothing', {
  css: `
.t { --tile: #ecebe6; --edge: #00000014; --off: #d6d5cf; --on: #1b1b1b; --digits: #1b1b1b; --unlit: #d9d8d2; --label: #8a8a85 }
.t.dark { --tile: #0b0b0b; --edge: #ffffff14; --off: #262626; --on: #f2f2f2; --digits: #f2f2f2; --unlit: #2e2e2e; --label: #7c7c7c }
.tile { position: absolute; inset: 0; border-radius: 50%; background: var(--tile); box-shadow: inset 0 0 0 1px var(--edge) }
.dots i { position: absolute; width: 3.4%; aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; background: var(--off) }
.dots i.on { background: var(--on) }
.dots i.head { background: var(--dial-accent, #d71921) }
.read { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; pointer-events: none }
.n { font: 800 calc(var(--s) * .22)/1 "Doto", "Geist Mono", monospace; color: var(--digits); letter-spacing: -.02em; font-variant-numeric: tabular-nums }
.n b { color: var(--unlit); font-weight: inherit }
.lab { margin-top: 8px; font: 400 calc(var(--s) * .05)/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .16em; color: var(--label); text-transform: uppercase }
:host(:focus-visible) .tile { outline: 2px solid var(--dial-accent, #d71921); outline-offset: 3px }
`,
  html(el) {
    // A dot per notch where they fit; past 30 notches, one dot per few notches, so the ring stays legible.
    const n = el.detents && el.detents <= 30 ? el.detents : 30;
    const dots = Array.from({ length: n + 1 }, (_, i) => {
      const a = (-135 + i * 270 / n - 90) * Math.PI / 180;
      return `<i style="left:${50 + 41 * Math.cos(a)}%;top:${50 + 41 * Math.sin(a)}%"></i>`;
    }).join('');
    return `<div class="k"><div class="tile" data-press></div><div class="dots">${dots}</div><div class="read"><div class="n"></div><div class="lab">${el.getAttribute('label') || 'Level'}</div></div></div>`;
  },
  setup(root, el) { el.ls.dots = [...root.querySelectorAll('.dots i')]; el.ls.n = root.querySelector('.n'); },
  paint(root, el) {
    const dots = el.ls.dots, head = Math.round(el.v / 100 * (dots.length - 1));
    dots.forEach((d, i) => { d.className = i < head ? 'on' : i === head ? 'head' : ''; });
    const s = String(Math.round(el.v)).padStart(3, '0'), lead = s.match(/^0*(?=\d)/)[0];
    el.ls.n.innerHTML = `<b>${lead}</b>${s.slice(lead.length)}`; // unused leading digits stay as unlit segments
  }
});
</script>

<script id="src-encoder-look-aqua">
/* Encoder look "aqua": a candy-glass knob, like early Mac OS X, over a printed track. The glass blurs and tints what is under it.
   Its specular highlight and the caustic it throws on the panel come from the room light above, so neither turns;
   only the etched mark inside the glass turns. --dial-accent colors the printed value track. */
DetentEncoder.look('aqua', {
  css: `
.t { --track: #00000014; --fill: var(--dial-accent, #0a7cff); --tick: #00000059; --mark: #1d1d1fcc; --spec: #ffffffd9; --caustic: #ffffffb3;
  --glass: linear-gradient(170deg, #ffffff59, #ffffff0f 55%, #ffffff2e);
  --glass-sh: inset 0 1px 0 #ffffffe6, inset 0 -1.5px 1px #ffffff99, inset 0 0 0 .5px #ffffffb3, inset 0 -12px 20px -12px #ffffff80, 0 0 0 .5px #0000001a, 0 1px 2px #0000001f, 0 12px 24px -10px #00000040;
  --glass-dn: inset 0 1px 0 #ffffffe6, inset 0 -1.5px 1px #ffffff99, inset 0 0 0 .5px #ffffffb3, inset 0 -12px 20px -12px #ffffff80, 0 0 0 .5px #0000001a, 0 .5px 1px #00000029, 0 7px 16px -8px #00000040 }
.t.dark { --track: #ffffff14; --fill: var(--dial-accent, #0a84ff); --tick: #ffffff40; --mark: #f5f5f7; --spec: #ffffff52; --caustic: #ffffff2e;
  --glass: linear-gradient(170deg, #ffffff2e, #ffffff0a 55%, #ffffff17);
  --glass-sh: inset 0 1px 0 #ffffff8c, inset 0 -1.5px 1px #ffffff40, inset 0 0 0 .5px #ffffff38, inset 0 -12px 20px -12px #ffffff2e, 0 0 0 .5px #000, 0 1px 2px #000000a6, 0 12px 24px -10px #000000cc;
  --glass-dn: inset 0 1px 0 #ffffff8c, inset 0 -1.5px 1px #ffffff40, inset 0 0 0 .5px #ffffff38, inset 0 -12px 20px -12px #ffffff2e, 0 0 0 .5px #000, 0 .5px 1px #000000bf, 0 7px 16px -8px #000000cc }
svg { position: absolute; inset: 0; width: 100%; height: 100% }
circle { fill: none; stroke-linecap: round }
.track { stroke: var(--track); stroke-width: 8 }
.fill { stroke: var(--fill); stroke-width: 8 }
line { stroke: var(--tick); stroke-width: 1.2; stroke-linecap: round }
/* Light from above passes through the lens and lands as a soft bright crescent on the panel below it. */
.caustic { position: absolute; left: 28%; right: 28%; top: 80%; height: 10%; border-radius: 50%;
  background: radial-gradient(closest-side, var(--caustic), transparent); pointer-events: none }
.glass { position: absolute; inset: 13%; border-radius: 50%; background: var(--glass); box-shadow: var(--glass-sh);
  -webkit-backdrop-filter: blur(1.5px) saturate(1.8); backdrop-filter: blur(1.5px) saturate(1.8) }
.glass.down { translate: none; scale: none; box-shadow: var(--glass-dn) } /* glass doesn't sink; its shadow tightens */
/* The specular: the room light reflected in the top of the dome. */
.glass::before { content: ""; position: absolute; inset: 3% 16% 60%; border-radius: 50%; background: linear-gradient(var(--spec), transparent); z-index: 1; pointer-events: none }
/* The mark: etched into the glass, so it turns. */
.mark { position: absolute; left: 50%; top: 8%; width: 3.2%; height: 12%; translate: -50% 0; border-radius: 9px; background: var(--mark) }
:host(:focus-visible) .glass { outline: 2px solid var(--fill); outline-offset: 4px }
`,
  html(el) {
    const n = el.detents && el.detents <= 24 ? el.detents : 12;
    const ticks = Array.from({ length: n + 1 }, (_, i) =>
      `<line transform="rotate(${-135 + i * 270 / n} 100 100)" x1="100" y1="44" x2="100" y2="50"/>`).join('');
    // A 270° arc from 7:30 to 4:30. pathLength 360 makes the dash lengths read in degrees.
    return `<div class="k"><svg viewBox="0 0 200 200" aria-hidden="true"><g transform="rotate(135 100 100)">` +
      `<circle class="track" cx="100" cy="100" r="80" pathLength="360" stroke-dasharray="270 360"/>` +
      `<circle class="fill" cx="100" cy="100" r="80" pathLength="360" stroke-dasharray="0 360"/></g>${ticks}</svg>` +
      `<i class="caustic"></i><div class="glass" data-press><div class="rot"><i class="mark"></i></div></div></div>`;
  },
  setup(root, el) { el.ls.fill = root.querySelector('.fill'); },
  paint(root, el) { el.ls.fill.setAttribute('stroke-dasharray', `${el.v * 2.7} 360`); }
});
</script>

<script id="src-pot">
/* <detent-pot look="pedal" tone="auto" label="Gain" value="5" min="0" max="10" detent="center"> — a guitar-pedal
   potentiometer. min to max over a 300° sweep. It turns smoothly with your finger, with a fine tick every twentieth of
   the sweep, and stops hard at both ends. detent="center" adds the bump at 12 o'clock that pedal EQ knobs have: it
   holds the knob there until you push a little past. Double-click turns it back to where it started. Fires "input"
   and "change". Needs Feel and at least one look.
   tone: "light" or "dark" forces one; otherwise it follows the nearest [data-tone], the page's data-theme,
   then prefers-color-scheme. The look is a separate module: DetentPot.look(name, { css, html, setup, hold, paint }).
   Look contract: html(el) must contain a .k (the square the finger turns and double-clicks), may contain a .rot (the
   layer that turns with --a) and one [data-press] part (it sinks a hair while held). setup(root, el) runs once per
   build. hold(root, el, on) runs when a finger grabs and lets go (use it to show the value while turning).
   paint(root, el, f) runs on every change: f is the position 0–1; el.v is the value, el.text the formatted readout
   (one decimal, padded with leading zeros to the widest value), el.name the label, el.min, el.max, el.mid, el.center. */
(() => {
  const looks = {}, waiting = new Set(), autos = new Set();
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const retone = () => autos.forEach(el => el.tone());
  mq.addEventListener ? mq.addEventListener('change', retone) : mq.addListener(retone);
  new MutationObserver(retone).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'data-tone'] });

  // Shared by every look: the square the finger turns, the layer that rotates, and how a part sinks and settles.
  const BASE = `:host { --s: 110px; display: inline-flex; flex-direction: column; align-items: center; gap: 12px; vertical-align: top; outline: none;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent }
.t { display: contents }
.k { position: relative; width: var(--s); max-width: 100%; aspect-ratio: 1; touch-action: none; cursor: grab }
.k:active { cursor: grabbing }
.rot { position: absolute; inset: 0; rotate: var(--a) }
/* Double-click: someone turns it back by hand. Quick, no bounce. */
.k.reset .rot { transition: rotate .22s cubic-bezier(.4,0,.2,1) }
[data-press] { transition: translate .05s, scale .05s, box-shadow .05s }
[data-press].down { translate: 0 .5px; scale: .994 }
@media (prefers-reduced-motion: reduce) { .k.reset .rot, [data-press] { transition: none } }
`;

  class DetentPot extends HTMLElement {
    static observedAttributes = ['look', 'tone', 'label', 'min', 'max', 'detent'];
    static look(name, def) { looks[name] = def; [...waiting].forEach(el => el.render()); }
    connectedCallback() {
      if (!this._wired) this.wire();
      if (!this.k) this.render();
      this.tone();
    }
    disconnectedCallback() { autos.delete(this); }
    attributeChangedCallback(name, was, now) {
      if (!this._wired || was === now) return;
      if (name === 'tone') this.tone(); else this.render();
    }
    wire() {
      this._wired = true;
      this.attachShadow({ mode: 'open' });
      this.setAttribute('role', 'slider');
      if (!this.hasAttribute('tabindex')) this.tabIndex = 0;
      Feel.wheel(this, d => { if (!this.k) return; this.raw = this.v; this.turn(d / 300 * (this.max - this.min)); });
      Feel.keys(this, (dir, big) => { if (!this.k) return; this.raw = this.v; this.turn(dir * (this.max - this.min) * (big ? .1 : .01)); },
        dir => { if (!this.k) return; this.raw = dir < 0 ? this.min : this.max; this.commit(this.raw); });
    }
    // Builds the look. Runs again when look, label, min, max or detent change; the value carries over.
    render() {
      const look = looks[this.getAttribute('look') || 'pedal'];
      if (!look) { waiting.add(this); return; }
      waiting.delete(this);
      this.look = look;
      this.min = +(this.getAttribute('min') ?? 0);
      this.max = +(this.getAttribute('max') ?? 10);
      this.mid = (this.min + this.max) / 2;
      this.center = this.getAttribute('detent') === 'center';
      this.def = this.clamp(+(this.getAttribute('value') ?? this.mid));
      this.v = this.clamp(this.v ?? this.def);
      this.raw = this.v;
      this.notch = Math.round((this.v - this.min) / (this.max - this.min) * 20);
      this.name = this.getAttribute('label') || 'Value';
      this.setAttribute('aria-label', this.name);
      this.setAttribute('aria-valuemin', this.min); this.setAttribute('aria-valuemax', this.max);
      const root = this.shadowRoot;
      root.innerHTML = `<style>${BASE}${look.css}</style><div class="t">${look.html(this)}</div>`;
      this.t = root.querySelector('.t'); this.k = root.querySelector('.k');
      const press = root.querySelector('[data-press]') || this.k;
      this.ls = {}; // the look's own state
      look.setup && look.setup(root, this);
      Feel.rotary(this.k, {
        start: () => { press.classList.add('down'); look.hold && look.hold(root, this, true); this.raw = this.v; },
        turn: d => this.turn(d / 300 * (this.max - this.min)),
        end: () => {
          press.classList.remove('down'); look.hold && look.hold(root, this, false);
          this.raw = this.v;
          this.dispatchEvent(new Event('change', { bubbles: true }));
        }
      });
      const k = this.k;
      k.addEventListener('dblclick', () => {
        k.classList.add('reset');
        this.raw = this.def; this.commit(this.def, true);
        setTimeout(() => k.classList.remove('reset'), 240);
        this.dispatchEvent(new Event('change', { bubbles: true }));
      });
      this.tone();
      this.paint();
    }
    tone() {
      if (!this.t) return;
      const t = this.getAttribute('tone');
      let dark;
      if (t === 'light' || t === 'dark') { dark = t === 'dark'; autos.delete(this); }
      else {
        autos.add(this);
        const near = this.parentElement && this.parentElement.closest('[data-tone]'), page = document.documentElement.dataset.theme;
        dark = near ? near.dataset.tone === 'dark' : page ? page === 'dark' : mq.matches;
      }
      this.t.classList.toggle('dark', dark);
    }
    get value() { return +(this.v ?? +(this.getAttribute('value') ?? 5)).toFixed(1); }
    set value(v) { if (this.k) { this.raw = this.clamp(+v); this.commit(this.raw, true); } else this.setAttribute('value', v); }
    clamp(v) { return Math.min(this.max, Math.max(this.min, v)); }
    turn(dv) {
      // Hard end stops: past them the knob simply doesn't turn.
      this.raw = this.clamp(this.raw + dv);
      let v = this.raw;
      if (this.center) {
        // The center detent holds the knob at 12 o'clock until you push a little past it.
        const hold = (this.max - this.min) * .03, inside = Math.abs(this.raw - this.mid) < hold;
        if (inside) v = this.mid;
        if (inside && !this.held) Feel.fire('encoder', { pitch: .9 });
        this.held = inside;
      }
      this.commit(v);
    }
    commit(v, quiet) {
      if (v === this.v) return;
      this.v = v;
      this.paint();
      if (quiet) return;
      // A fine tick every twentieth of the sweep, a dull one at the end stops.
      const notch = Math.round((v - this.min) / (this.max - this.min) * 20);
      if (v > this.min && v < this.max && notch !== this.notch && !(this.center && v === this.mid)) Feel.fire('tick');
      this.notch = notch;
      Feel.stop(this, v, this.min, this.max);
      this.dispatchEvent(new Event('input', { bubbles: true }));
    }
    paint() {
      if (!this.look) return;
      const f = (this.v - this.min) / (this.max - this.min);
      this.style.setProperty('--a', (-150 + f * 300) + 'deg');
      const width = Math.max(this.max.toFixed(1).length, this.min.toFixed(1).replace('-', '').length);
      this.text = this.v.toFixed(1).padStart(width, '0');
      this.setAttribute('aria-valuenow', this.v.toFixed(1));
      this.look.paint && this.look.paint(this.shadowRoot, this, f);
    }
  }
  window.DetentPot = DetentPot;
  customElements.define('detent-pot', DetentPot);
})();
</script>

<script id="src-pot-look-braun">
/* Pot look "braun": a turned-aluminum cap in a recessed, brushed bowl, with an engraved scale of 21 marks backlit up to
   the value in --dial-accent. The label below is printed in small Geist Mono; hover or turn and it reads the value
   instead (an instant swap). Dark tone: the same parts in black anodized aluminum on a black panel. */
DetentPot.look('braun', {
  css: `
.t { --tick: #7f7d7a; --tick-long: #6a6865; --label: #6a6865;
  --bowl: conic-gradient(from 210deg, #fbfbfb, #9a9a9a 12%, #e9e9e9 24%, #5d5d5d 40%, #d8d8d8 55%, #fafafa 66%, #8a8a8a 80%, #f2f2f2);
  --bowl-sh: inset 0 0 0 1px #00000024, inset 0 6px 10px -3px #00000059, inset 0 -1px 2px #ffffff4d;
  --rim: linear-gradient(#fbfbfb, #d9d9d8 55%, #b9b9b8);
  --face: radial-gradient(circle at 46% 32%, #fbfbfb, #ececeb 55%, #dededd);
  --lathe: #00000006; --sheen: #ffffff59; --sheen-2: #ffffff47;
  --cap-sh: 0 0 0 .5px #00000040, 0 1px 1.5px #00000059, 0 3px 5px -1px #00000033, 0 10px 16px -6px #00000040;
  --cap-dn: 0 0 0 .5px #00000040, 0 .5px 1px #00000066, 0 2px 3px -1px #00000033, 0 6px 10px -6px #00000040;
  --lip: #ffffff99 }
.t.dark { --tick: #4c4c4f; --tick-long: #6e6e72; --label: #8a8a8d;
  --bowl: conic-gradient(from 210deg, #5c5c5f, #222224 12%, #4a4a4d 24%, #131315 40%, #3e3e41 55%, #636366 66%, #1e1e20 80%, #545457);
  --bowl-sh: inset 0 0 0 1px #000000b3, inset 0 6px 10px -3px #000000cc, inset 0 -1px 2px #ffffff1f;
  --rim: linear-gradient(#6c6c6f, #2d2d2f 55%, #1a1a1c);
  --face: radial-gradient(circle at 46% 32%, #3c3c3f, #2d2d30 55%, #242426);
  --lathe: #ffffff05; --sheen: #ffffff21; --sheen-2: #ffffff18;
  --cap-sh: 0 0 0 .5px #000, 0 1px 1.5px #000000cc, 0 3px 5px -1px #00000099, 0 10px 16px -6px #000000b3;
  --cap-dn: 0 0 0 .5px #000, 0 .5px 1px #000000d9, 0 2px 3px -1px #00000099, 0 6px 10px -6px #000000b3;
  --lip: #ffffff2e }
svg { position: absolute; inset: 0; width: 100%; height: 100% }
/* Engraved scale, backlit up to the current value in the indicator color. */
line { stroke: var(--tick); stroke-width: 2; stroke-linecap: round }
line.long { stroke: var(--tick-long); stroke-width: 2.4 }
line.lit { stroke: var(--dial-accent, #f2641e) }
/* The bowl is a recess cut into the panel, brushed in a circle. Light comes from above, so the upper inner wall
   sits in shadow. Its highlights belong to the room, so they never turn. */
.bowl { position: absolute; inset: 13%; border-radius: 50%; background: var(--bowl); box-shadow: var(--bowl-sh) }
/* The cap: a short cylinder. Its chamfered rim catches the top light; the flat face is lathe-turned. */
.cap { position: absolute; inset: 22%; border-radius: 50%; background: var(--rim); box-shadow: var(--cap-sh) }
.cap.down { box-shadow: var(--cap-dn) }
.face { position: absolute; inset: 2.6%; border-radius: 50%; overflow: hidden; background: var(--face) }
.face::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: repeating-radial-gradient(circle, #0000 0 1.1px, var(--lathe) 1.1px 2.2px);
  -webkit-mask: radial-gradient(circle, transparent 18%, #000 60%); mask: radial-gradient(circle, transparent 18%, #000 60%) }
.face::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 120deg, #fff0, var(--sheen) 7%, #fff0 18%, #fff0 50%, var(--sheen-2) 57%, #fff0 68%) }
.rot { z-index: 1 }
/* The indicator: a short groove cut into the face and filled with paint, flush with the surface. */
.mark { position: absolute; left: 50%; top: 9%; width: 4.4%; min-width: 2px; height: 19%; translate: -50% 0; border-radius: 9px; background: var(--dial-accent, #f2641e);
  box-shadow: inset 0 1px 1px #00000040, 0 .5px 0 var(--lip) }
:host(:focus-visible) .bowl { outline: 2px solid var(--dial-accent, #f2641e); outline-offset: 4px }
/* Printed label. Hover or turn and it reads the value instead: a plain swap, nothing moves. */
.l { display: grid; font: 500 10px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--label); font-variant-numeric: tabular-nums }
.l span { grid-area: 1 / 1; text-align: center }
.val { visibility: hidden }
:host(:hover) .name, :host(:focus-visible) .name, .l.show .name { visibility: hidden }
:host(:hover) .val, :host(:focus-visible) .val, .l.show .val { visibility: visible }
`,
  html() {
    const ticks = Array.from({ length: 21 }, (_, i) =>
      `<line transform="rotate(${-150 + i * 15} 100 100)" x1="100" y1="${i % 5 ? 10 : 4}" x2="100" y2="18"${i % 5 ? '' : ' class="long"'}/>`).join('');
    return `<div class="k"><svg viewBox="0 0 200 200" aria-hidden="true">${ticks}</svg><div class="bowl"></div><div class="cap" data-press><div class="face"></div><div class="rot"><i class="mark"></i></div></div></div><div class="l"><span class="name"></span><span class="val"></span></div>`;
  },
  setup(root, el) {
    el.ls.lines = [...root.querySelectorAll('line')];
    el.ls.val = root.querySelector('.val'); el.ls.l = root.querySelector('.l');
    root.querySelector('.name').textContent = el.name;
  },
  hold(root, el, on) { el.ls.l.classList.toggle('show', on); },
  paint(root, el, f) {
    const lit = Math.round(f * 20);
    el.ls.lines.forEach((l, i) => l.classList.toggle('lit', el.v > el.min && i <= lit));
    el.ls.val.textContent = el.v.toFixed(1);
  }
});
</script>

<script id="src-pot-look-index">
/* Pot look "index": a matte soft-touch black disc with a thin inlaid pointer stripe in --dial-accent and a finger cup
   opposite it, over printed dots on the panel (one per two ticks). The printed label always shows the value and
   switches instantly. Dark tone: the same black disc on a black panel, told apart by the top light on its chamfer. */
DetentPot.look('index', {
  css: `
.t { --dot: #a9a9a5; --label: #8a8a86; --focus: #161616;
  --disc: radial-gradient(circle at 50% 28%, #242424, #161616 58%, #101010);
  --disc-sh: inset 0 1px 0 #ffffff1c, inset 0 -1px 1px #00000099, 0 0 0 .5px #00000073, 0 1px 1.5px #00000059, 0 4px 8px -2px #00000040, 0 14px 22px -10px #00000059;
  --disc-dn: inset 0 1px 0 #ffffff1c, inset 0 -1px 1px #00000099, 0 0 0 .5px #00000073, 0 .5px 1px #00000066, 0 2px 5px -2px #00000040, 0 8px 14px -8px #00000059 }
.t.dark { --dot: #57575a; --label: #7c7c7a; --focus: #d4df3a;
  --disc: radial-gradient(circle at 50% 28%, #2c2c2c, #1b1b1b 58%, #141414);
  --disc-sh: inset 0 1px 0 #ffffff33, inset 0 -1px 1px #000000b3, 0 0 0 .5px #000, 0 1px 1.5px #000000b3, 0 4px 8px -2px #00000099, 0 14px 22px -10px #000000cc;
  --disc-dn: inset 0 1px 0 #ffffff33, inset 0 -1px 1px #000000b3, 0 0 0 .5px #000, 0 .5px 1px #000000cc, 0 2px 5px -2px #00000099, 0 8px 14px -8px #000000cc }
/* Printed position marks: they belong to the panel, so they never change. */
.marks i { position: absolute; width: 3px; height: 3px; margin: -1.5px; border-radius: 50%; background: var(--dot) }
/* Matte soft-touch black, lit from above, sitting on the panel with a contact shadow. */
.disc { position: absolute; inset: 10%; border-radius: 50%; background: var(--disc); box-shadow: var(--disc-sh) }
.disc.down { box-shadow: var(--disc-dn) }
/* The pointer: a thin inlaid stripe. The finger cup: a dimple pressed into the same black, opposite it.
   It shows only by its shaded upper wall and the light catching its lower edge. Both are part of the knob. */
.pointer { position: absolute; left: 50%; top: 13%; width: 2.2%; min-width: 1.5px; height: 33%; translate: -50% 0; border-radius: 2px; background: var(--dial-accent, #d4df3a);
  box-shadow: inset 0 .5px 0 #0006 }
.cup { position: absolute; left: 50%; bottom: 12%; width: 12%; aspect-ratio: 1; translate: -50% 0; border-radius: 50%;
  background: radial-gradient(circle at 50% 65%, #1c1c1c, #121212 60%, #0c0c0c);
  box-shadow: inset 0 1.5px 2.5px #000000d9, inset 0 -1px 0 #ffffff14, 0 .5px 0 #ffffff1f }
.label { font: 500 12px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .08em; color: var(--label); text-transform: uppercase; font-variant-numeric: tabular-nums; white-space: nowrap }
:host(:focus-visible) .disc { outline: 2px solid var(--focus); outline-offset: 5px }
`,
  html() {
    // A dot every other tick: 11 over the 300° sweep, so 12 o'clock always has one.
    const marks = Array.from({ length: 11 }, (_, i) => {
      const a = (-150 + i * 30 - 90) * Math.PI / 180;
      return `<i style="left:${50 + 48 * Math.cos(a)}%;top:${50 + 48 * Math.sin(a)}%"></i>`;
    }).join('');
    return `<div class="k"><div class="marks">${marks}</div><div class="disc" data-press><div class="rot"><i class="pointer"></i><i class="cup"></i></div></div></div><span class="label"></span>`;
  },
  setup(root, el) { el.ls.label = root.querySelector('.label'); },
  paint(root, el) { el.ls.label.textContent = `${el.name}:${el.v.toFixed(1)}`; }
});
</script>

<script id="src-pot-look-pedal">
/* Pot look "pedal" (the native look, after the catalogue's pointer-knob): a matte grey plastic cap with a printed
   pointer line, sitting in a fixed recessed seat. Hover or turn to read the value; the printed readout rolls like an
   odometer. Dark tone: the same cap on a black panel, with a deeper seat and light ink. --dial-accent colors the
   pointer line. */
DetentPot.look('pedal', (() => {
  // Each digit column holds 0-9 three times over, so it can roll past 9 or 0 either way, then quietly re-centers.
  function place(col, pos, animate) {
    col._pos = pos;
    col.style.transition = animate ? '' : 'none';
    col.style.transform = `translateY(${8 - pos * 16}px)`;
    if (!animate) return;
    col.classList.add('moving');
    clearTimeout(col._t);
    col._t = setTimeout(() => {
      col.classList.remove('moving');
      if (col._pos >= 10 && col._pos < 20) return;
      place(col, 10 + ((col._pos % 10) + 10) % 10, false);
    }, 190);
  }
  // Digits roll up when the value rises and down when it falls. Leading zeros are there but hidden, so 9.9 -> 10.0 rolls too.
  function roll(ls, text, dir) {
    const el = ls.val, shape = text.replace(/\d/g, '0');
    if (ls.shape !== shape) {
      ls.shape = shape;
      el.innerHTML = [...text].map(ch => /\d/.test(ch)
        ? `<b class="col"><i>${'0123456789'.repeat(3).split('').join('</i><i>')}</i></b>` : `<b>${ch}</b>`).join('');
      const lead = text.search(/[1-9]|\d(?=\.)|\d$/);
      [...el.children].forEach((col, i) => {
        if (!col.classList.contains('col')) return;
        col.classList.toggle('lead', i < lead);
        place(col, 10 + +text[i], false);
      });
      return;
    }
    const lead = text.search(/[1-9]|\d(?=\.)|\d$/);
    [...el.children].forEach((col, i) => {
      if (!col.classList.contains('col')) return;
      col.classList.toggle('lead', i < lead);
      const cur = ((col._pos % 10) + 10) % 10;
      let step = ((+text[i] - cur) % 10 + 10) % 10; // forward distance on the wheel
      if (!step) return;
      if (dir < 0) step -= 10;
      place(col, col._pos + step, true);
    });
  }
  return {
    css: `
.t { --knob: #4a4a4a; --ink: #2b2b2b; --trail: #2b2b2b38; --seat: #0000000f; --seat-sh: inset 0 1px 2px #00000029, 0 1px 0 #ffffffb3;
  --cap-sh: inset 0 1px 0 #ffffff1f, inset 0 -1px 1px #00000066, 0 0 0 .5px #0000004d, 0 1px 1.5px #00000047, 0 3px 6px -2px #00000033, 0 10px 16px -8px #00000047;
  --cap-dn: inset 0 1px 0 #ffffff1f, inset 0 -1px 1px #00000066, 0 0 0 .5px #0000004d, 0 .5px 1px #00000052, 0 2px 4px -2px #00000033, 0 6px 10px -6px #00000047 }
.t.dark { --knob: #4e4e50; --ink: #d4d4d0; --trail: #d4d4d038; --seat: #00000066; --seat-sh: inset 0 1px 2px #000000d9, 0 1px 0 #ffffff14;
  --cap-sh: inset 0 1px 0 #ffffff2b, inset 0 -1px 1px #00000099, 0 0 0 .5px #000000b3, 0 1px 1.5px #000000a6, 0 3px 6px -2px #00000080, 0 10px 16px -8px #000000b3;
  --cap-dn: inset 0 1px 0 #ffffff2b, inset 0 -1px 1px #00000099, 0 0 0 .5px #000000b3, 0 .5px 1px #000000bf, 0 2px 4px -2px #00000080, 0 6px 10px -6px #000000b3 }
/* The cap is --s across; its seat is 6px wider all round, as on the original. */
.k { width: calc(var(--s) + 12px) }
/* The seat: a shallow recess in the panel the knob sits in. Always there; the knob sinks into it, the seat never moves. */
.seat { position: absolute; inset: 0; border-radius: 50%; background: var(--seat); box-shadow: var(--seat-sh) }
/* Matte plastic cap, lit from above, sitting in the seat with a contact shadow. */
.cap { position: absolute; inset: 6px; border-radius: 50%;
  background: radial-gradient(circle at 50% 28%, color-mix(in srgb, var(--knob), #fff 9%), var(--knob) 58%, color-mix(in srgb, var(--knob), #000 18%));
  box-shadow: var(--cap-sh) }
.cap.down { box-shadow: var(--cap-dn) }
/* A printed pointer line on the top face. */
.rot::after { content: ""; position: absolute; left: 50%; top: 8%; width: 2px; height: 16%; translate: -50% 0; border-radius: 2px; background: var(--dial-accent, #fff) }
:host(:focus-visible) .seat { outline: 2px solid var(--knob); outline-offset: 3px }
.l { position: relative; height: 16px; min-width: 8ch; font: 500 13px/16px "Geist", system-ui, sans-serif; color: var(--ink); text-align: center }
.l span { position: absolute; inset: 0; transition: opacity .15s }
.val { opacity: 0; display: flex; justify-content: center; overflow: hidden; inset: -8px -6px !important; padding: 0 6px;
  /* Fully hides the neighbouring digits at rest, but lets the blur trail fade out instead of being cut. */
  -webkit-mask: linear-gradient(transparent 6px, #000 10px, #000 calc(100% - 10px), transparent calc(100% - 6px));
  mask: linear-gradient(transparent 6px, #000 10px, #000 calc(100% - 10px), transparent calc(100% - 6px));
  font-family: "Geist Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums }
/* Rolling digits: each digit is a column of 0-9 that slides to its value, blurred along the motion while it moves. */
.val b { display: block; font-weight: inherit }
.val > b:not(.col) { margin-top: 8px; height: 16px }
.val .col { transition: transform .18s cubic-bezier(.2,.7,.3,1) }
.val .col i { display: block; height: 16px; font-style: normal }
.val .col.lead { opacity: 0; transition: transform .18s cubic-bezier(.2,.7,.3,1), opacity .18s }
.val .col.moving i { filter: blur(.5px); text-shadow: 0 5px 2.5px var(--trail), 0 -5px 2.5px var(--trail) }
:host(:hover) .name, :host(:focus-visible) .name, .l.show .name { opacity: 0 }
:host(:hover) .val, :host(:focus-visible) .val, .l.show .val { opacity: 1 }
@media (prefers-reduced-motion: reduce) { .l span, .val .col { transition: none } .val .col.moving i { filter: none; text-shadow: none } }
`,
    html: () => `<div class="k"><div class="seat"></div><div class="cap" data-press><div class="rot"></div></div></div><div class="l"><span class="name"></span><span class="val"></span></div>`,
    setup(root, el) {
      el.ls.val = root.querySelector('.val'); el.ls.l = root.querySelector('.l');
